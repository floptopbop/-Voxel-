const SAVE_KEY = 'ODM_WORLD_settings_v1';
let _settingsReady = false, _saveT = 0;
function collectSettings(){
    return { v:1, worldScale:WORLD.scale, M, C, ATMO, VCFG, TCFG, WG, JOY, mk2:MK, monkeyOn:MKE.on, em:EM, emV:1, moodV:1, forestV:1, ft:FT_CFG, gl:GL, glx:glLexSave(),
        titanType:T.type, titanAI:T.ai, renderScale,
        deckTab: UIX.tab, forgeTab: UIX.ftab };
}
function saveSettingsNow(){
    clearTimeout(_saveT);
    if(!_settingsReady) return;                       // never overwrite the save before it was restored
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(collectSettings())); }catch(err){}
}
function saveSettingsSoon(){ clearTimeout(_saveT); _saveT = setTimeout(saveSettingsNow, 400); }
addEventListener('pagehide', saveSettingsNow);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveSettingsNow(); });
function restoreSettings(){
    let st = null;
    try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) st = JSON.parse(raw); }catch(err){ st = null; }
    if(!st || typeof st !== 'object') return false;
    if(typeof st.worldScale === 'number' && Number.isFinite(st.worldScale)) WORLD.scale = THREE.MathUtils.clamp(st.worldScale, 0.4, 3);
    applyKnownSettings(M, st.M); applyKnownSettings(C, st.C); applyKnownSettings(ATMO, st.ATMO);
    applyKnownSettings(VCFG, st.VCFG); applyKnownSettings(TCFG, st.TCFG); applyKnownSettings(WG, st.WG); applyKnownSettings(JOY, st.JOY); applyKnownSettings(MK, st.mk2); if(typeof st.monkeyOn === 'boolean') MKE.on = st.monkeyOn; applyKnownSettings(EM, st.em); applyKnownSettings(GL, st.gl); glLexLoad(st.glx);
    if(!st.emV){ C.titanSize = Math.max(C.titanSize, 520); }
    applyKnownSettings(FT_CFG, st.ft);
    if(!st.forestV && st.WG && typeof st.WG.reach !== 'number') WG.targetTrees = Math.min(15000, Math.round(WG.targetTrees*Math.pow(WG.reach/0.96, 2)));   // same density, wider forest
    if(!st.moodV){ Object.assign(MK, MK_MOOD_V2); Object.assign(EM, EM_EGG_V2); }     // the calmer-mood / slower-egg defaults replace older saves once
    if(TYPES.includes(st.titanType)) T.type = st.titanType;
    if(typeof st.titanAI === 'boolean') T.ai = st.titanAI;
    if(typeof st.renderScale === 'number' && Number.isFinite(st.renderScale)) renderScale = THREE.MathUtils.clamp(st.renderScale, 0.5, 3);
    // re-sync everything that was derived from the defaults at definition time
    _builtWorldScale = WORLD.scale;
    setJoyLayout();
    currentHFov = M.hFov;
    renderer.setPixelRatio(renderScale);

function monkeySmoke(dt, wasG, pvy){

    let rate = 0;

// ── mood: he's your ally. Agitation fills from neglect (no high five for a while), stress (crashes, yours and his,
//    rope tangles) and excitement (bites, blasts). Full → a short feral FLARE (ride your back, bombs at you), then he settles.
//    High fives drain it and cut a flare short; flying together builds a BOND that makes him steadier and stronger. ──
function mkStress(x){ MKE.agitIn = Math.min(1.5, MKE.agitIn + x*(0.65 + MKT.timid)); }     // timid: everything rattles him more; it soaks in over MK.moodEase
// hysteresis: past at+band to switch on, back under at-band to switch off
function mkAbove(key, v, at){ const b = MK.moodBand, on = !!MKE.sw[key]; const r = on ? v > at - b : v >= at + b; MKE.sw[key] = r; return r; }

        MKE.flares++; MKE.flareEmu = mkHash(MKE.flares, 91) < (MKT.playful + MKT.curious)*0.4;     // some flares go after you, some after an emu
        if(MKE.mount && MKE.mount.ride && MKE.mount.ride.mode === 'STEADY') emRideWild(MKE.mount);  // his mood spooks his ride
    }

}
function monkeyMood(dt){
    if(!MK.buddy){ MKE.flare = 0; return; }
    const S = WORLD.scale, pd = Math.hypot(player.pos.x - MKE.pos.x, player.pos.z - MKE.pos.z);
    MKE.flareCDt -= dt;
    if(pd < 400*S) MKE.bond = Math.min(1, MKE.bond + MK.bondNear*dt);
    else if(pd > 1500*S) MKE.bond = Math.max(0, MKE.bond - MK.bondFar*dt);
    const pt = player.tumble > 0;                                             // you crashing worries him
    if(pt && !MKE.pTum && pd < 600*S) mkStress(MK.stressGain*0.5);
    MKE.pTum = pt;
    // stress soaks in instead of landing all at once
    if(MKE.agitIn > 0){ const take = MKE.agitIn*(1 - Math.exp(-dt/Math.max(0.2, MK.moodEase*0.5))); MKE.agitIn -= take; MKE.agit = Math.min(1, MKE.agit + take); }
    if(MKE.flare > 0){
        MKE.agitIn = 0; MKE.flare -= dt; MKE.agit = 1;
        if(MKE.flare <= 0) monkeyFlare(false);
        return;
    }
    if(MKE.time - MKE.lastHi > MK.neglectAfter*(1 + MKE.bond)) MKE.agit += MK.neglectRate*dt;
    if(MKE.mount && MKE.mount.ride && MKE.mount.ride.mode === 'STEADY') MKE.agit -= 0.02*(0.5 + MKT.playful)*dt;   // a good ride settles him
    MKE.agit = THREE.MathUtils.clamp(MKE.agit - MK.agitCalm*dt, 0, 1);
    if(MKE.flareCDt <= 0 && MKE.state !== 'SPIRAL' && MKE.agit >= Math.min(0.99, MK.flareAt + MK.bondFlare*MKE.bond)) monkeyFlare(true);

function monkeyBiteMul(){ return (MK.buddy && MKE.flare <= 0) ? (1 + MKE.bond*MK.bondBite)*MK.assistBite : 1; }

// ── same crash rule as yours: hit something faster than M.tumbleThresh and he spins out, no steering until it passes ──

// the structure is solid for him too (same voxel bubble you collide with)

// ── rope tangle: fly past him and your line catches. No aiming, no button — it just happens.

    const a = player.pos, b = grapple.anchor; _mkF.subVectors(b, a); const l2 = _mkF.lengthSq(); if(l2 < 1) return;

// ── bombnanas ──

function throwBanana(target, tvel){
    let b = MKE.bananas.find(x => !x.live);

    const n = ++MKE.thrown;
    b.vel.x += (mkHash(n, 11)*2 - 1)*sc; b.vel.y += (mkHash(n, 12)*2 - 1)*sc*0.5; b.vel.z += (mkHash(n, 13)*2 - 1)*sc;

    b.fuse = MK.fuse; b.age = 0; b.live = true; b.mesh.visible = true; b.mesh.scale.setScalar(MK.bananaSize);

}
function bananaBoom(b){
    b.live = false; b.mesh.visible = false;

    ftBlast(b.pos);                                                      // close trees snap, farther ones may catch
    if(b.carrier){ b.carrier.carry = null; b.carrier = null; }
    const p = b.pos;
    emuBlast(p);

function updateBananas(dt){
    const gS = M.gravity*MK.gravScale, drag = Math.exp(-M.airDrag*dt);
    for(const b of MKE.bananas){
        if(!b.live) continue;
        b.age += dt; b.fuse -= dt;
        if(b.carrier){                                                    // an emu has it in its beak
            if(!EMS.list.includes(b.carrier)){ b.carrier = null; }
            else { emHead(b.carrier, b.pos); b.vel.copy(b.carrier.vel); b.mesh.position.copy(b.pos); b.mesh.rotation.y = b.carrier.yaw + Math.PI/2; if(b.fuse <= 0) bananaBoom(b); continue; }
        }
        if(b.rest){ b.mesh.position.copy(b.pos); if(b.fuse <= 0) bananaBoom(b); continue; }
        b.vel.y += gS*dt; b.vel.x *= drag; b.vel.z *= drag;
        b.pos.addScaledVector(b.vel, dt);
        b.mesh.position.copy(b.pos); b.mesh.rotation.z += dt*9; b.mesh.rotation.y += dt*5;
        b.bfl = (b.bfl || 0) + dt*(4 + 14/Math.max(0.2, b.fuse));
        let hit = b.fuse <= 0;
        if(!hit && b.age > 0.12){
            if(b.pos.y <= floorY(b.pos.x, b.pos.z) + MK.bananaSize*0.5){
                if(b.bait){ b.pos.y = floorY(b.pos.x, b.pos.z) + MK.bananaSize*0.5; b.vel.set(0, 0, 0); b.rest = true; continue; }   // bait sits there, fizzing
                hit = true;
            }
            if(!hit) for(const s of staticsNear(b.pos.x, b.pos.z, 10)){
                if(b.pos.y < s.baseY || b.pos.y > s.topY) continue;
                if(Math.abs(b.pos.x - s.x) < s.hw && Math.abs(b.pos.z - s.z) < s.hd){ hit = true; break; }
            }
            if(!hit) for(const t of titans){
                if(t.state === 'DEAD') continue;
                if(b.pos.y > t.base.y && b.pos.y < t.base.y + t.H && Math.hypot(b.pos.x - t.base.x, b.pos.z - t.base.z) < t.r){ hit = true; break; }
            }
            if(!hit && MK.hurtPlayer && b.foe && b.pos.distanceTo(player.pos) < M.radius + MK.bananaSize + 4) hit = true;
        }
        if(hit) bananaBoom(b);

}

// ── drift: deterministic harmonics (no randomness) ──
function mkDrift(dt){
    const t = MKE.time;
    const ch = MK.chaosMid + MK.chaosAmp*(Math.sin(t*MK.chaosRate) + 0.5*Math.sin(t*MK.chaosRate*2.618 + 1.3))/1.5 - MKE.calm;
    const lg = MK.logicMid + MK.logicAmp*(Math.cos(t*MK.logicRate) + 0.5*Math.sin(t*MK.logicRate*1.618 + 0.7))/1.5 + MKE.logicBias;
    MKE.chaosRaw = ch;
    MKE.chaos = Math.max(MK.chaosFloor, ch);
    MKE.logic = THREE.MathUtils.clamp(lg, 0, 1.5);
    const driftWild = THREE.MathUtils.clamp((MKE.chaos - MK.chaosFloor)/Math.max(0.05, MK.wildTop - MK.chaosFloor), 0, 1);
    const tw = !MK.buddy ? driftWild : MKE.flare > 0 ? 1 : THREE.MathUtils.clamp(driftWild*MK.driftShare + MKE.agit, 0, 1);
    const tau = MKE.flare > 0 ? 0.6 : Math.max(0.1, MK.moodEase);              // a flare comes on quick; everything else eases
    MKE.wild += (tw - MKE.wild)*(1 - Math.exp(-(dt || 0)/tau));
}

// ── world-physics step: gravity, rope pull, drag, max speed, statics, titans, ground ──
const _mkPrev = new THREE.Vector3();
function monkeyPhysics(dt){
    const p = MKE.pos, v = MKE.vel, r = MK.size*0.3, hh = MKE.halfH, W = MKE.wall, thr = M.tumbleThresh;
    v.y += M.gravity*MK.gravScale*dt*(W.on ? M.wallRunGravity : 1);
    const R = MKE.rope;
    if(R.active){
        _mkW.subVectors(R.anchor, p); const d = Math.max(1, _mkW.length()); _mkW.multiplyScalar(1/d);
        v.addScaledVector(_mkW, M.hookPull*MK.pullScale*(d/M.ropeNorm)*dt);
    }
    v.x *= Math.exp(-M.airDrag*dt); v.z *= Math.exp(-M.airDrag*dt); v.y *= Math.exp(-M.airDrag*0.12*dt);
    const spd = v.length(), cap = M.maxSpeed*MK.speedCap;
    if(spd > cap) v.multiplyScalar(cap/spd);
    _mkPrev.copy(p);
    p.addScaledVector(v, dt);
    let onTop = false; MKE.voxGround = false;
    for(const s of staticsNear(p.x, p.z, r + 2)){
        const bottom = p.y - hh, top = p.y + hh;
        if(top < s.baseY || bottom > s.topY) continue;
        const dx = p.x - s.x, dz = p.z - s.z, hw = s.hw + r, hd = s.hd + r;
        if(Math.abs(dx) > hw || Math.abs(dz) > hd) continue;
        if(s.tree && bottom < s.topY - 4 && ftPlow(s, v, 1.2, p.y)){ showToast('he snapped a tree'); continue; }    // fast enough: through it
        const ox = hw - Math.abs(dx), oz = hd - Math.abs(dz), oy = s.topY - bottom;
        if(v.y <= 0 && oy < ox && oy < oz){ const vi = -v.y; p.y = s.topY + hh; v.y = 0; onTop = true; if(vi > thr) mkTumble(vi); }
        else if(ox < oz){ const vi = Math.abs(v.x); p.x += dx < 0 ? -ox : ox; if(vi > thr){ mkTumble(vi); v.x = -v.x*0.3; } else v.x = 0; }
        else { const vi = Math.abs(v.z); p.z += dz < 0 ? -oz : oz; if(vi > thr){ mkTumble(vi); v.z = -v.z*0.3; } else v.z = 0; }
    }
    if(MKE.state !== 'LATCH') for(const t of titans){
        if(t.state === 'DEAD') continue;
        if(p.y - hh > t.base.y + t.H || p.y + hh < t.base.y) continue;
        const dx = p.x - t.base.x, dz = p.z - t.base.z, d = Math.hypot(dx, dz) || 1, rr = t.r*0.9 + r;
        if(d < rr){ p.x = t.base.x + dx/d*rr; p.z = t.base.z + dz/d*rr; const vo = v.x*dx/d + v.z*dz/d; if(vo < 0){ v.x -= dx/d*vo; v.z -= dz/d*vo; } }
    }
    // the structure: axis-by-axis so he slides along it; if he somehow starts inside, let him out
    if(MK.structOn && nearStructure(p, MK.size*3)){
      if(mkBlocked(_mkPrev, r*0.8, hh*0.8)){ p.y = _mkPrev.y + 600*dt; v.y = Math.max(v.y, 60); }      // somehow inside it: pop out the top
      else {
        const nx = p.x, ny = p.y, nz = p.z;
        p.set(nx, _mkPrev.y, _mkPrev.z);
        if(mkBlocked(p, r, hh)){ const vi = Math.abs(v.x); p.x = _mkPrev.x; if(vi > thr){ mkTumble(vi); v.x = -v.x*0.3; } else v.x = 0; }
        p.z = nz;
        if(mkBlocked(p, r, hh)){ const vi = Math.abs(v.z); p.z = _mkPrev.z; if(vi > thr){ mkTumble(vi); v.z = -v.z*0.3; } else v.z = 0; }
        p.y = ny;
        if(mkBlocked(p, r, hh)){ const vi = Math.abs(v.y); p.y = _mkPrev.y; if(v.y < 0){ MKE.voxGround = true; if(vi > thr) mkTumble(vi); } v.y = 0; }
      }
    }
    { const hd = Math.hypot(p.x, p.z), lim = WORLD.edge || WORLD.half;
      if(hd > lim){ const nx = p.x/hd, nz = p.z/hd; p.x = nx*lim; p.z = nz*lim; const vo = v.x*nx + v.z*nz; if(vo > 0){ v.x -= nx*vo; v.z -= nz*vo; } } }
    const gY = floorY(p.x, p.z) + hh;
    if(p.y <= gY){
        const vi = -v.y; p.y = gY; if(v.y < 0) v.y = 0;

    }
    MKE.grounded = p.y <= gY + 0.5 || onTop || MKE.voxGround;

    // wall run (waaa_5 rules, same constants as yours): airborne + brushing a wall + moving along it fast enough = he catches it,
    // gravity eases, he hugs it; when the run runs out he kicks off like a wall jump
    if(W.cool > 0) W.cool -= dt;
    if(MKE.grounded) W.t = 0;
    if(MK.wallOn && MKE.tumble <= 0){
        const px = p.x, py = p.y, pz = p.z, reach = r + 12;
        const hit = (dx, dz) => { for(let k = r + 0.9; k <= reach + 1e-6; k += 1.5) if(solidAt(px + dx*k, py, pz + dz*k)) return true; return false; };
        let bx = 0, bz = 0;
        if(hit(1, 0)) bx = -1; else if(hit(-1, 0)) bx = 1;
        if(hit(0, 1)) bz = -1; else if(hit(0, -1)) bz = 1;
        let wnx = 0, wnz = 0, along = 0;
        if(bx && Math.abs(v.z) > along){ wnx = bx; wnz = 0; along = Math.abs(v.z); }
        if(bz && Math.abs(v.x) > along){ wnx = 0; wnz = bz; along = Math.abs(v.x); }
        const canRun = !MKE.grounded && (wnx || wnz) && along > M.wallRunMinSpeed && W.cool <= 0 && W.t < M.wallRunTime;
        if(canRun){
            if(!W.on) v.y = Math.max(v.y*0.3, 0);
            if(W.nx !== wnx || W.nz !== wnz) W.t = 0;
            W.on = true; W.nx = wnx; W.nz = wnz; W.t += dt;
            const into = v.x*wnx + v.z*wnz; if(into < 0){ v.x -= into*wnx; v.z -= into*wnz; }
            v.x -= wnx*M.wallStick*dt; v.z -= wnz*M.wallStick*dt;
        } else if(W.on){
            W.on = false;
            if(W.t >= M.wallRunTime){ v.x += W.nx*M.wallJumpOut; v.z += W.nz*M.wallJumpOut; v.y += M.wallJumpUp; W.cool = 0.25; W.t = 0; MKE.wallJumps++; }
        }
    } else W.on = false;

    if(MKE.ropeLine && R.active){
        const a = MKE.ropeLine.geometry.attributes.position.array;
        a[0] = p.x; a[1] = p.y; a[2] = p.z; a[3] = R.anchor.x; a[4] = R.anchor.y; a[5] = R.anchor.z;
        MKE.ropeLine.geometry.attributes.position.needsUpdate = true;
    }
}

// ── what it wants to be doing (re-picked every MK.think seconds) ──
function monkeyNearestTitan(maxD){
    let best = null, bd = maxD;
    for(const t of titans){ if(t.state === 'DEAD') continue; const d = Math.hypot(t.base.x - MKE.pos.x, t.base.z - MKE.pos.z); if(d < bd){ bd = d; best = t; } }
    return best;
}
function monkeyThink(){
    const S = WORLD.scale, w = MKE.wild;
    const pd = Math.hypot(player.pos.x - MKE.pos.x, player.pos.z - MKE.pos.z);
    let intent = 'ROAM', target = null;
    if(!MK.buddy){                                                       // the old always-chaotic monkey
        const ti = monkeyNearestTitan(MK.titanRange*S);
        const hunt = mkAbove('hunt', w, MK.huntAt), tit = mkAbove('titan', w, MK.titanAt);
        if(hunt && MKE.rideCDt <= 0 && pd < MK.huntRange*S && player.tumble <= 0){ intent = 'HUNT'; }
        else if(tit && ti && MKE.logic > 0.1){ intent = 'TITAN'; target = ti; }
        else if(!tit && pd < MK.notice*S && MKE.logic > 0.35){ intent = 'FRIEND'; }
    } else if(MKE.flare > 0){                                            // flare: feral for a few seconds
        const ti = monkeyNearestTitan(MK.titanRange*S);
        if(MKE.state === 'MOUNT' || (MKE.flareEmu && mkEmuWant(true))){ intent = 'EMU'; target = MKE.mount || MKE.emuTgt; }
        else if(MKE.rideCDt <= 0 && pd < MK.huntRange*S && player.tumble <= 0) intent = 'HUNT';
        else if(ti && MKE.logic > 0.1){ intent = 'TITAN'; target = ti; }
        else intent = 'BUDDY';
    } else {                                                             // ally: stay beside you, flank any titan that's close to YOU
        let ti = null, bd = MK.assistRange*S*(1 + 0.5*MKE.bond);
        for(const t of titans){ if(t.state === 'DEAD') continue; const d = Math.hypot(t.base.x - player.pos.x, t.base.z - player.pos.z); if(d < bd){ bd = d; ti = t; } }
        const nerve = 1 - 0.7*MKT.timid + 0.3*MKT.bold;                  // timid: hangs back unless the titan is right on you
        if(ti && MKE.logic > 0.1 && (bd < 500*S || mkHash(Math.floor(MKE.time/5), 81) < nerve)){ intent = 'TITAN'; target = ti; }
        else if(mkEmuWant(false)){ intent = 'EMU'; target = MKE.mount || MKE.emuTgt; }
        else intent = 'BUDDY';
        if(MKE.state === 'MOUNT' && intent === 'TITAN') monkeyDismount('hop');      // off the bird, onto the titan
    }
    if(MKE.cmd){                                                         // something you drew with the blade (and he chose to listen)
        const c = MKE.cmd;
        if(c.type === 'COME') intent = 'COME';
        else if(c.type === 'STAY') intent = 'STAY';
        else if(c.type === 'TITAN' && titans.includes(c.target) && c.target.state !== 'DEAD'){ intent = 'TITAN'; target = c.target; }
        else if(c.type === 'EMU' && (MKE.emuTgt || MKE.mount)){ intent = 'EMU'; target = MKE.mount || MKE.emuTgt; }
        else if(c.type === 'GOTO' && bAlive(c.o)){ intent = 'GOTO'; target = c.o; }

}

// ── latch on a titan and bite ──

// ── hunt you down and ride your back ──

// ── emus: curiosity sends him over; whether he gets a ride (and what kind) is down to both their moods ──

// ── ground / air travel toward the goal ──

    }
    if(!tumbling && MKE.state === 'GO' && intent === 'EMU' && MKE.emuTgt){
        const e = MKE.emuTgt, h = emH(e), d2 = Math.hypot(p.x - e.pos.x, p.z - e.pos.z);

// ── throw bombnanas: at you while hunting, at titans otherwise ──
function monkeyMaybeThrow(dt){
    MKE.throwCDt -= dt;

    const ally = MK.buddy && MKE.flare <= 0;

    if(ally && MKT.playful > 0 && EM.on && MKE.baitT <= 0 && MKE.intent !== 'TITAN' && MKE.state !== 'MOUNT'){   // playful: lob a dud-fused bombnana for the emus to find

        for(const e of EMS.list){ if(e.age < 1 || e.ride || e.tr.bold < 0.3) continue; const d = MKE.pos.distanceTo(e.pos); if(d < bd && d > MK.throwMin*2){ bd = d; be = e; } }

    else if(MKE.intent === 'EMU' && MKE.emuTgt && MKE.state !== 'MOUNT'){ tp = MKE.emuTgt.pos; tv = MKE.emuTgt.vel; }     // mid-flare he'll bomb his own ride

// ── pose: one set of joint angles drives both the box monkey and a loaded model's rig ──
const _mkP = { hy:0, hp:0, aL:0, aR:0, lL:0, lR:0 };

function updateMonkey(dt){

    }

    const wasG = MKE.grounded, pvy = MKE.vel.y;

        MKE.hopCD -= dt;
        if(MKE.grounded && MKE.hopCD <= 0){ MKE.vel.y = Math.sqrt(2*Math.abs(M.gravity)*MK.gravScale*MK.hopHeight*1.5); MKE.vel.x += (mkHash(Math.floor(MKE.time*4), 51)*2 - 1)*60; MKE.vel.z += (mkHash(Math.floor(MKE.time*4), 52)*2 - 1)*60; MKE.hopCD = 0.8; }

const _eA = new THREE.Vector3(), _eB = new THREE.Vector3(), _eP = new THREE.Vector3();

function emMats(){
    if(EMS.geo) return;

    EMS.geo = { body:new THREE.IcosahedronGeometry(0.5, 0), neck:B(0.09, 0.42, 0.09), head:B(0.12, 0.11, 0.17), beak:B(0.06, 0.04, 0.1),
        thigh:B(0.1, 0.27, 0.11), shin:B(0.05, 0.27, 0.05), foot:B(0.1, 0.03, 0.14), eye:B(0.03, 0.03, 0.03), egg:new THREE.IcosahedronGeometry(0.5, 1) };
    const ph = c => new THREE.MeshPhongMaterial({ color:c, specular:0x000000, shininess:0, flatShading:true });
    EMS.mNeck = ph(0x5E6B78); EMS.mLeg = ph(0x4A4740); EMS.mDark = ph(0x2B2722); EMS.mEgg = new THREE.MeshPhongMaterial({ color:0x2F4743, specular:0x6E8A84, shininess:70, flatShading:false, emissive:0x0E1A18 });     // emu eggs really are that dark green, with the glossy shell they have

function emBuildMesh(e){

    const add = (geo, m, x, y, z, par) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); par.add(o); return o; };
    add(G.body, e.mat, 0, 0.64, -0.03, body).scale.set(0.8, 0.62, 1.08);               // the feather heap

    const head = new THREE.Group(); head.position.set(0, 0.42, 0.02); neck.add(head);
    add(G.head, EMS.mNeck, 0, 0, 0.03, head); add(G.beak, EMS.mDark, 0, -0.01, 0.15, head);
    add(G.eye, EMS.mDark, 0.065, 0.03, 0.06, head); add(G.eye, EMS.mDark, -0.065, 0.03, 0.06, head);

function emMake(type, col, tr, x, z, age){
    const e = { type, col, tr, age, pos:new THREE.Vector3(x, floorY(x, z), z), vel:new THREE.Vector3(), yaw:emRnd()*6.283, off:emRnd()*1000,
        home:{ x, z }, grounded:true, tumble:0, spin:new THREE.Vector3(), ang:new THREE.Vector3(), panic:0, fx:0, fz:1,
        annoy:0, kickCD:0, kickT:0, bonkCD:0, carry:null, gait:emRnd()*6, peck:0, near:new Map(), layT:EM.layEvery*(0.4 + 0.6*emRnd()),

function emEggMesh(){ const m = new THREE.Mesh(EMS.geo.egg, EMS.mEgg); EMS.group.add(m); return m; }

function disposeEmus(){

}
// flocks of one breed each, seeded, a short flight from your spawn and out of the boss clearing
function spawnEmus(){
    emMats(); disposeEmus();
    EMS.group.visible = !!EM.on;
    EMS.seed = 90210;
    const s = getPlayerStart(), S = WORLD.scale, n = EM.count|0, clear = (typeof WG !== 'undefined' ? WG.bossClear*0.8 : 1500)*S;
    const flocks = Math.max(1, Math.min(EM_TYPES.length, Math.ceil(n/3))), homes = [];
    for(let f = 0; f < flocks; f++){
        let hx = s[0], hz = s[2];
        for(let k = 0; k < 60; k++){
            const a = emRnd()*6.283, r = (550 + emRnd()*1700)*S;
            hx = s[0] + Math.sin(a)*r; hz = s[2] + Math.cos(a)*r;
            if(Math.hypot(hx, hz) > WORLD.half*0.88 || Math.hypot(hx, hz) < clear) continue;
            if(homes.some(h => Math.hypot(h.x - hx, h.z - hz) < 550*S)) continue;
            break;
        }
        homes.push({ x:hx, z:hz });
    }
    for(let i = 0; i < n; i++){
        const f = i % flocks, h = homes[f], type = EM_TYPES[f % EM_TYPES.length], B = EM_BREEDS[type], tr = {};
        for(const k in EM_LIM) tr[k] = THREE.MathUtils.clamp(B.tr[k]*(1 + (emRnd() - 0.5)*0.24), EM_LIM[k][0], EM_LIM[k][1]);
        const col = B.col.map(c => THREE.MathUtils.clamp(c*(1 + (emRnd() - 0.5)*0.12), 0, 1));

    }
}

// ── koi genetics, ported: 12 "genes" with 1–3 crossover points decide each parent's share,
//    traits blend in that proportion with a little drift; coat blends too (mixed breeds look mixed) ──
function emBreed(a, b){
    const n = 12, cuts = new Set(), nc = 1 + Math.floor(emRnd()*3);
    while(cuts.size < nc) cuts.add(1 + Math.floor(emRnd()*(n - 1)));
    let src = emRnd() < 0.5 ? a : b, fromA = 0;
    for(let i = 0; i < n; i++){ if(cuts.has(i)) src = src === a ? b : a; if(src === a) fromA++; }
    const share = a === b ? 1 : fromA/n, tr = {};
    for(const k in EM_LIM){
        const w = Math.max(0.15, Math.min(0.85, share + (emRnd() - 0.5)*0.3));
        const v = (a.tr[k]*w + b.tr[k]*(1 - w))*(1 + (emRnd() - 0.5)*0.12);
        tr[k] = THREE.MathUtils.clamp(v, EM_LIM[k][0], EM_LIM[k][1]);
    }
    let col = a.col.map((c, i) => c*share + b.col[i]*(1 - share));
    if(emRnd() < 0.06) col = EM_BREEDS[EM_TYPES[Math.floor(emRnd()*EM_TYPES.length)]].col.slice();    // the odd throwback
    return { type:share >= 0.5 ? a.type : b.type, col, tr };
}
// the emu this one has spent the most time around (itself if nobody)
function emMate(e){
    let best = e, bv = 1;   // koi needs ~1 s of company (its memory settles around dt/(1 - keep))
    for(const [o, v] of e.near) if(v > bv && o.age >= 1 && EMS.list.includes(o)){ best = o; bv = v; }
    return best;
}

// ── things that scare them; blasts and bonks leave a short-lived disturbance ──
function emDisturb(x, z, f, r){ EMS.dist.push({ x, z, f, r, life:0.3 }); }
function emStartle(e){
    const S = WORLD.scale, R = EM.startleR*S, B = e.tr;
    let best = 0, bx = 0, bz = 0;
    const test = (x, z, f, rr) => {
        const dx = e.pos.x - x, dz = e.pos.z - z, d = Math.hypot(dx, dz);
        if(d >= rr) return;
        const p = f*(1 - d/rr)*B.shy;
        if(p > best){ best = p; if(d > 1e-3){ bx = dx/d; bz = dz/d; } else { const a = emRnd()*6.283; bx = Math.sin(a); bz = Math.cos(a); } }
    };
    // you: fast and low is terrifying, drifting by slowly is interesting (to the curious ones)
    const ps = player.vel.length(), alt = player.pos.y - floorY(player.pos.x, player.pos.z), low = 400*S;
    if(alt < low && PR.e !== e) test(player.pos.x, player.pos.z, (ps/M.maxSpeed)*1.8*(1 - alt/low)*(1 - 0.6*B.curious), R);
    if(MKE.on && MKE.built && MKE.state !== 'MOUNT') test(MKE.pos.x, MKE.pos.z, MKE.flare > 0 ? 1.3 : 0.2*(1 - B.curious), R*0.6);
    for(const d of EMS.dist) test(d.x, d.z, d.f, d.r);
    for(const t of titans){ if(t.state === 'DEAD') continue; if(Math.hypot(t.vel.x, t.vel.z) > 25) test(t.base.x, t.base.z, 1.4, R + t.r*2); }
    // panic is catching: a bolting flockmate sends its own breed the same way
    let cx = 0, cz = 0, cp = 0;
    if(EM.spread > 0) for(const o of EMS.list){
        if(o === e || o.panic <= 0 || o.type !== e.type) continue;
        const d = Math.hypot(o.pos.x - e.pos.x, o.pos.z - e.pos.z); if(d > R) continue;
        const p = EM.spread*(o.panic/EM.panicTime)*(1 - d/R)*B.shy*1.6;
        if(p > cp){ cp = p; cx = o.fx; cz = o.fz; }
    }
    if(cp > best){ best = cp; bx = cx; bz = cz; }
    if(e.ride){                                                            // ridden: a real scare turns a steady ride wild
        if(e.ride.mode === 'STEADY' && best > EM.startleAt*1.5) emRideWild(e);
        return;
    }
    if(best > EM.startleAt && e.panic < EM.panicTime*0.4){
        e.panic = EM.panicTime*(0.7 + 0.6*B.shy); e.fx = bx; e.fz = bz;
        if(e.carry && emRnd() < 0.5){ const b = e.carry; e.carry = null; b.carrier = null; b.vel.set(bx*60, 80, bz*60); }     // drops it, maybe
    }
}

// ── bonks: blades, flying into them, blasts. Up they go, tumbling; they'll remember it ──
function emKnock(e, ix, iy, iz, grudge){
    e.vel.x += ix; e.vel.y += iy; e.vel.z += iz; e.grounded = false;
    const k = Math.min(2, Math.hypot(ix, iy, iz)/200);
    e.tumble = 0.6 + 0.9*k; e.spin.set((emRnd()*2 - 1)*9*k, 0, (emRnd()*2 - 1)*9*k);
    e.annoy = Math.min(1, e.annoy + grudge*e.tr.bold);
    e.panic = Math.max(e.panic, EM.panicTime*0.6*e.tr.shy); { const l = Math.hypot(ix, iz); if(l > 1e-3){ e.fx = ix/l; e.fz = iz/l; } }
    if(e.carry){ const b = e.carry; e.carry = null; b.carrier = null; b.vel.set(ix*0.5, 120, iz*0.5); }
    if(e.ride) emEndRide(e, 'thrown');
    EMS.bonks++;
}
function emuSlash(hist){
    if(!EM.on || !EMS.list.length) return false;
    const n = hist.length; if(n < 3) return false;
    if(Math.hypot(hist[n-1].x - hist[0].x, hist[n-1].y - hist[0].y) < C.swipePx) return false;
    camera.getWorldDirection(_eA);
    let best = null, bd = Infinity;
    for(const e of EMS.list){
        if(e === PR.e) continue;                                            // not the one you're sitting on
        const h = emH(e); _eP.set(e.pos.x, e.pos.y + h*0.6, e.pos.z);
        _eB.subVectors(_eP, player.pos); const d = _eB.length();
        if(d > C.bladeRadius + h*0.45 || d >= bd) continue;
        if(_eA.dot(_eB.normalize()) < C.facingDot) continue;
        best = e; bd = d;
    }
    if(!best) return false;
    _eB.set(best.pos.x - player.pos.x, 0, best.pos.z - player.pos.z).normalize();
    const k = 150*EM.bonk;
    emKnock(best, _eB.x*k + player.vel.x*0.4, 75*EM.bonk, _eB.z*k + player.vel.z*0.4, 0.6);
    emDisturb(best.pos.x, best.pos.z, 1.3, EM.startleR*WORLD.scale);
    emFeathers(_eP.set(best.pos.x, best.pos.y + emH(best)*0.6, best.pos.z), 16, 90);
    emToast('bonk');
    return true;
}
function emuBlast(p){
    if(!EM.on) return;
    const R = MK.blastR*1.4;
    for(const e of EMS.list){
        const dx = e.pos.x - p.x, dz = e.pos.z - p.z, d = Math.hypot(dx, dz, (e.pos.y + emH(e)*0.5) - p.y);
        if(d > R) continue;
        const k = (1 - d/R)*MK.blastKnock*EM.bonk, l = Math.hypot(dx, dz) || 1;
        emKnock(e, dx/l*k, k*0.25 + 30, dz/l*k, 0.35);
    }
    emDisturb(p.x, p.z, 1.6, MK.blastR*3);
}

// ── a ridden emu: steady (follows you, monkey up top), bolting (gone, monkey clinging), bucking (monkey is leaving) ──
function emRideWild(e){
    const R = e.ride; if(!R) return;
    R.mode = e.tr.bold >= 0.55 ? 'BUCK' : 'BOLT'; R.t = 0;
    R.dur = EM.wildRide*(R.mode === 'BUCK' ? 1.3 - 0.4*e.tr.kick : 0.7 + 0.6*e.tr.shy);
    const a = Math.atan2(e.pos.x - player.pos.x, e.pos.z - player.pos.z) + (emRnd() - 0.5)*1.6;
    e.fx = Math.sin(a); e.fz = Math.cos(a);
    if(R.mode === 'BUCK') EMS.bucks++; else EMS.bolts++;
    emToast(R.mode === 'BUCK' ? 'the emu is bucking' : 'the emu bolted');
}

function emUpdate(e, dt){
    const S = WORLD.scale, B = e.tr, h = emH(e), T = EMS.time + e.off, v = e.vel, p = e.pos;
    const adult = e.age >= 1;
    if(!adult){ e.age = Math.min(1, e.age + dt/Math.max(1, EM.grow)); if(e.mother && !EMS.list.includes(e.mother)) e.mother = null; }
    e.kickCD -= dt; e.bonkCD -= dt; e.kickT = Math.max(0, e.kickT - dt); e.hopCD -= dt;
    e.annoy = Math.max(0, e.annoy - dt*0.02);

    emStartle(e);

    // ── what it wants ──
    let tx, tz, spd = 60*S*B.speed*EM.speed, stop = 0, turn = 2.5;
    const home = e.mother ? e.mother.pos : e.home;
    tx = home.x + (Math.cos(T*0.05)*260 + Math.sin(T*0.13)*110)*S*(e.mother ? 0.25 : 1);
    tz = home.z + (Math.sin(T*0.07)*260 + Math.cos(T*0.19)*110)*S*(e.mother ? 0.25 : 1);
    const graze = 0.5 + 0.5*Math.sin(T*0.31);                                   // stop-and-go grazing

    let chasing = false;
    if(e.ride){
        const R = e.ride; R.t += dt; e.peck = 0;
        if(R.mode === 'STEADY'){ if(R.rider === 'player'){ tx = R.tx; tz = R.tz; spd = R.spd; turn = 4; } else { const g = mkBuddySpot(); tx = g.x; tz = g.z; spd = 230*S*B.speed*EM.speed; stop = 30*S; } }     // with a jockey it really runs
        else if(R.mode === 'BOLT'){ const z = Math.sin(T*3.1)*0.6; tx = p.x + (e.fx*Math.cos(z) + e.fz*Math.sin(z))*400; tz = p.z + (e.fz*Math.cos(z) - e.fx*Math.sin(z))*400; spd = 200*S*B.speed*EM.speed; turn = 6; }

    } else if(e.carry){                                                         // got a bombnana: keep-away from everyone

        for(const o of EMS.list){ if(o === e) continue; const dx = p.x - o.pos.x, dz = p.z - o.pos.z, d = Math.hypot(dx, dz); if(d < 500*S && d > 1){ ax += dx/d*(1 - d/(500*S)); az += dz/d*(1 - d/(500*S)); } }
        { const dx = p.x - MKE.pos.x, dz = p.z - MKE.pos.z, d = Math.hypot(dx, dz); if(d < 500*S && d > 1){ ax += dx/d; az += dz/d; } }

        const a = L[i], b = L[j]; if(stkHeld(a) || stkHeld(b)) continue;

// ── what is it? (duck-typed, cheap) ──

// ── what's under your finger? ──
function stkRayBox(o, d, s){                                              // ray vs a pillar's box → { t, p, n }

function stkPick(sx, sy){
    const S = WORLD.scale;

    const ro = _gRay.ray.origin, rd = _gRay.ray.direction;
    let best = null, bt = Infinity;
    const fov = (camera.fov || 70)*Math.PI/180, f = innerHeight/(2*Math.tan(fov/2));
    for(const c of stkBodies()){
        if(c === player) continue;
        bCenter(c, _sA); const s = glProject(_sA); if(!s) continue;
        const dist = _sA.distanceTo(camera.position), rad = Math.max(24, (bKind(c) === 'titan' ? c.H*0.45 : Math.max(bR(c), bH(c)*0.5))*f/Math.max(1, dist));
        if(Math.hypot(s.x - sx, s.y - sy) < rad && dist < bt){ bt = dist; best = { o:c }; }
    }
    for(let t = 40*S; t < 7000*S; t += 120*S){                            // march the ray through the pillar grid
        const x = ro.x + rd.x*t, z = ro.z + rd.z*t;

// ── breaking ──

function ftBreak(s, dx, dz, why, hitY){
    if(!ftTree(s) || !FT.on()) return false;
    ftSetup();
    const h = s.topY - s.baseY;
    let cut = hitY === undefined ? h*(0.04 + Math.random()*0.1) : hitY - s.baseY;
    cut = THREE.MathUtils.clamp(cut, Math.min(h*0.06, 30), h*0.88);
    const len = h - cut;
    for(const id in GLS.tags) if(GLS.tags[id].o === s) stkUntag(id);    // its tag goes with it
    for(const l of STK.links.slice()) if(l.mount === s) stkHopOff(l, true);
    const bi = FT.burning.indexOf(s); if(bi >= 0){ FT.burning.splice(bi, 1); ftFlamesOff(s); }
    // the stump: shrink this tree's trunk instance down to the cut; the canopy goes with the top
    const c = ftCanopy(s); for(const i of c.cones) ftInst(ftIM('cone'), i, true); for(const i of c.blobs) ftInst(ftIM('blob'), i, true);

    if(typeof emitDust === 'function') emitDust(_fA.set(s.x, s.baseY + cut, s.z), 14, 90);

function ftFallStep(dt){

function ftFireStep(dt){
    if(!FT.burning.length) return;

        // char as it goes

        if(puff && typeof emit === 'function'){ const h = s.topY - s.baseY; emit(_fA.set(s.x, s.baseY + h*0.9, s.z), _fB.set(wx*25, 70 + Math.random()*40, wz*25), 2.2, false, 0.2); }

            if(L.length){                                                 // one neighbour at a time: fire wanders in patches instead of eating everything

                if(o.flam === undefined) o.flam = 0.35 + 0.65*Math.random();

}

        if(b.life <= 0 || stkHeld(b)) continue; const d = b.p.distanceTo(p); if(d > R*1.2) continue;
        _fA.subVectors(b.p, p).normalize(); const k = (1 - d/(R*1.2))*420; b.v.addScaledVector(_fA, k); b.v.y += k*0.6; b.rest = false; b.w.set((Math.random() - 0.5)*14, (Math.random() - 0.5)*14, (Math.random() - 0.5)*14);

// ── up on a spire together ──

// ── record (30 Hz into a ring of M.recordSecs) ──
function recordFrame(dt){

    if(REC.acc < 1/REC_HZ) return;
    REC.acc = 0;
    const p = new Float32Array(10);
    p[0] = player.pos.x; p[1] = player.pos.y; p[2] = player.pos.z; p[3] = player.yaw; p[4] = player.pitch; p[5] = player.roll;
    p[6] = grapple.active ? 1 : 0; p[7] = grapple.anchor.x; p[8] = grapple.anchor.y; p[9] = grapple.anchor.z;
    let m = null;
    if(MKE.built){
        const r = MKE.root, t = MKE.tilt, P = _mkP;
        m = new Float32Array(22);
        m[0] = r.visible ? 1 : 0; m[1] = r.position.x; m[2] = r.position.y; m[3] = r.position.z; m[4] = r.rotation.y; m[5] = r.scale.x;
        m[6] = t.rotation.x; m[7] = t.rotation.y; m[8] = t.rotation.z;
        m[9] = P.hy; m[10] = P.hp; m[11] = P.aL; m[12] = P.aR; m[13] = P.lL; m[14] = P.lR;
        const L = MKE.ropeLine; m[15] = L && L.visible ? 1 : 0;
        if(L){ const a = L.geometry.attributes.position.array; for(let i = 0; i < 6; i++) m[16 + i] = a[i]; }
    }
    const er = EMS.list.slice(), e = new Float32Array(er.length*EMF);
    er.forEach((em, i) => { const k = i*EMF, q = em.mesh;
        e[k] = q.root.position.x; e[k+1] = q.root.position.y; e[k+2] = q.root.position.z; e[k+3] = q.root.rotation.y; e[k+4] = q.root.scale.x;
        e[k+5] = q.tilt.rotation.x; e[k+6] = q.tilt.rotation.z; e[k+7] = q.body.rotation.x; e[k+8] = q.neck.rotation.x; e[k+9] = q.head.rotation.x;
        e[k+10] = q.legs[0].hip.rotation.x; e[k+11] = q.legs[1].hip.rotation.x; e[k+12] = q.legs[0].knee.rotation.x; e[k+13] = q.legs[1].knee.rotation.x; });

        for(const [e, v] of s.emuVis) if(e.mesh) e.mesh.root.visible = v;
        for(const [b, v] of s.banVis) b.mesh.visible = v;
        if(GLS.sprite) GLS.sprite.visible = s.ink;
        if(MKE.ropeLine){ MKE.ropeLine.visible = s.ropeVis; if(MKE.rope.active) MKE.ropeLine.visible = true; }
    }
    camera.rotation.order = 'YXZ'; camera.rotation.set(player.pitch, player.yaw, -player.roll);
    for(const id of ['joyL', 'joyR', 'xhair', 'hud']){ const el = document.getElementById(id); if(el) el.style.display = ''; }
    document.getElementById('replay-bar').style.display = 'none';
    // the live poses come back on their own next frame (monkey + emus re-pose from their state)
    REC.touches = {}; REC.pinch = 0; REC.mid = null;
}
function updateReplay(dt){
    const F = REC.frames, t0 = F[0].t, t1 = F[F.length - 1].t;
    REC.playT += dt*REC.speed; if(REC.playT > t1) REC.playT = t0;                     // loops
    let i = 0; while(i < F.length - 2 && F[i + 1].t < REC.playT) i++;
    const a = F[i], b = F[i + 1], u = THREE.MathUtils.clamp((REC.playT - a.t)/Math.max(1e-4, b.t - a.t), 0, 1);
    const L = (A, B, k) => A[k] + (B[k] - A[k])*u, LA = (A, B, k) => A[k] + mkWrap(B[k] - A[k])*u;
    // you
    const g = REC.ghost; g.position.set(L(a.p, b.p, 0), L(a.p, b.p, 1), L(a.p, b.p, 2)); g.rotation.order = 'YXZ'; g.rotation.set(L(a.p, b.p, 4)*0.35, LA(a.p, b.p, 3), -L(a.p, b.p, 5));   // a body leans a little with your look, not all the way
    if(a.p[6] > 0.5){ const r = REC.rope.geometry.attributes.position.array; r[0] = g.position.x; r[1] = g.position.y; r[2] = g.position.z; r[3] = L(a.p, b.p, 7); r[4] = L(a.p, b.p, 8); r[5] = L(a.p, b.p, 9); REC.rope.geometry.attributes.position.needsUpdate = true; REC.rope.visible = true; }
    else REC.rope.visible = false;
    // the monkey
    if(MKE.built && a.m && b.m){
        const r = MKE.root, A = a.m, B = b.m;
        r.visible = A[0] > 0.5; r.position.set(L(A, B, 1), L(A, B, 2), L(A, B, 3)); r.rotation.y = LA(A, B, 4); r.scale.setScalar(L(A, B, 5));
        MKE.tilt.rotation.set(LA(A, B, 6), LA(A, B, 7), LA(A, B, 8));
        const P = _mkP; P.hy = L(A, B, 9); P.hp = L(A, B, 10); P.aL = L(A, B, 11); P.aR = L(A, B, 12); P.lL = L(A, B, 13); P.lR = L(A, B, 14);
        if(MKE.custom) mkRigApply(P); else { const Ar = MKE.arms; Ar.armL.rotation.x = P.aL; Ar.armR.rotation.x = P.aR; Ar.legL.rotation.x = P.lL; Ar.legR.rotation.x = P.lR; }
        const RL = MKE.ropeLine;
        if(RL){ RL.visible = A[15] > 0.5; if(RL.visible){ const arr = RL.geometry.attributes.position.array; for(let k = 0; k < 6; k++) arr[k] = L(A, B, 16 + k); RL.geometry.attributes.position.needsUpdate = true; } }
    }
    // emus (any that weren't around at this moment stay hidden)
    for(const e of EMS.list) e.mesh.root.visible = false;
    a.er.forEach((em, j) => {
        if(!em.mesh || !EMS.list.includes(em)) return;
        const jb = b.er.indexOf(em), A = a.e, B = jb >= 0 ? b.e : a.e, ka = j*EMF, kb = (jb >= 0 ? jb : j)*EMF, q = em.mesh;
        const l = o => A[ka + o] + (B[kb + o] - A[ka + o])*u, la = o => A[ka + o] + mkWrap(B[kb + o] - A[ka + o])*u;
        q.root.visible = true; q.root.position.set(l(0), l(1), l(2)); q.root.rotation.y = la(3); q.root.scale.setScalar(l(4));
        q.tilt.rotation.set(la(5), 0, la(6)); q.body.rotation.x = l(7); q.neck.rotation.x = l(8); q.head.rotation.x = l(9);
        q.legs[0].hip.rotation.x = l(10); q.legs[1].hip.rotation.x = l(11); q.legs[0].knee.rotation.x = l(12); q.legs[1].knee.rotation.x = l(13);
    });
    // bombnanas in flight
    for(const bn of MKE.bananas) bn.mesh.visible = false;
    a.br.forEach((bn, j) => { const jb = b.br.indexOf(bn); bn.mesh.visible = true;
        if(jb >= 0) bn.mesh.position.set(a.b[j*3] + (b.b[jb*3] - a.b[j*3])*u, a.b[j*3+1] + (b.b[jb*3+1] - a.b[j*3+1])*u, a.b[j*3+2] + (b.b[jb*3+2] - a.b[j*3+2])*u);
        else bn.mesh.position.set(a.b[j*3], a.b[j*3+1], a.b[j*3+2]); });
    if(REC.follow) REC.orbit.target.lerp(g.position, 0.06);
    recApplyOrbit();
    const pr = document.getElementById('replay-p'); if(pr) pr.style.width = ((REC.playT - t0)/Math.max(1e-3, t1 - t0)*100) + '%';
}
function syncReplayBar(){ const s = document.getElementById('btn-replay-slow'); if(s) s.textContent = REC.speed < 1 ? 'slow ✓' : 'slow'; const f = document.getElementById('btn-replay-follow'); if(f) f.textContent = REC.follow ? 'follow ✓' : 'follow'; }
function replayTouch(e, kind){
    if(kind === 'start'){
        for(const t of e.changedTouches) REC.touches[t.identifier] = { x:t.clientX, y:t.clientY };
        const ids = Object.keys(REC.touches);
        if(ids.length === 2){ const a = REC.touches[ids[0]], b = REC.touches[ids[1]]; REC.pinch = Math.hypot(a.x - b.x, a.y - b.y); REC.mid = { x:(a.x + b.x)/2, y:(a.y + b.y)/2 }; }
    } else if(kind === 'move'){
        const ids = Object.keys(REC.touches), o = REC.orbit;
        if(ids.length === 1){ const t = e.changedTouches[0], s = REC.touches[t.identifier]; if(!s) return; o.theta += (t.clientX - s.x)*0.008; o.phi -= (t.clientY - s.y)*0.008; s.x = t.clientX; s.y = t.clientY; }
        else if(ids.length === 2){
            for(const t of e.changedTouches) if(REC.touches[t.identifier]){ REC.touches[t.identifier].x = t.clientX; REC.touches[t.identifier].y = t.clientY; }
            const a = REC.touches[ids[0]], b = REC.touches[ids[1]], d = Math.hypot(a.x - b.x, a.y - b.y), mid = { x:(a.x + b.x)/2, y:(a.y + b.y)/2 };
            if(REC.pinch > 0) o.radius *= REC.pinch/d; REC.pinch = d;
            if(REC.mid) recPan(mid.x - REC.mid.x, mid.y - REC.mid.y); REC.mid = mid;
        }
        recApplyOrbit();
    } else { for(const t of e.changedTouches) delete REC.touches[t.identifier]; REC.pinch = 0; REC.mid = null; }
}
(function wireReplayUI(){
    const w = document.getElementById('btn-watch'); if(w) w.addEventListener('click', e => { e.stopPropagation(); if(!REC.on) enterReplay(); });
    const x = document.getElementById('btn-exit-replay'); if(x) x.addEventListener('click', () => { if(REC.on) exitReplay(); });
    const s = document.getElementById('btn-replay-slow'); if(s) s.addEventListener('click', () => { REC.speed = REC.speed < 1 ? 1 : 0.3; syncReplayBar(); });
    const f = document.getElementById('btn-replay-follow'); if(f) f.addEventListener('click', () => { REC.follow = !REC.follow; syncReplayBar(); });
    const st = document.getElementById('ui-deck'); if(st) st.addEventListener('click', e => { if(REC.on && e.target.closest('.strip-btn') && e.target.id !== 'btn-watch') exitReplay(); }, true);   // any scene button drops you back to live first
})();

(function wireYouModel(){
    const b = document.getElementById('btn-you-model'), fi = document.getElementById('you-file');
    if(!b || !fi || !b.addEventListener) return;
    b.addEventListener('click', () => {
        if(YOU_TEXT && typeof confirm === 'function' && confirm('Go back to the built-in body?')){
            YOU_TEXT = null; try{ localStorage.removeItem(YOU_KEY); }catch(err){} recSetBody(null); showToast('your body: built-in'); return;
        }
        fi.click();
    });
    fi.addEventListener('change', () => {
        const f = fi.files && fi.files[0]; if(!f) return;
        const rd = new FileReader();
        rd.onload = () => {
            const txt = String(rd.result);
            if(recSetBody(txt)){ YOU_TEXT = txt; try{ localStorage.setItem(YOU_KEY, txt); }catch(err){} showToast('your model loaded \u00b7 see it in watch'); }
            else showToast('couldn\u2019t read that model');
        };
        rd.readAsText(f); fi.value = '';
    });
})();

(function(){
    const btn = document.getElementById('deck-reset'); let armed = 0;
    btn.addEventListener('click', e => {
        e.stopPropagation();
        if(!armed){
            btn.classList.add('armed'); btn.textContent = 'tap again · wipe';
            armed = setTimeout(() => { armed = 0; btn.classList.remove('armed'); btn.textContent = 'reset saved'; }, 3000);
            return;
        }
        clearTimeout(armed); _settingsReady = false;
        try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
        location.reload();
    });
})();
const _restored = restoreSettings();
_settingsReady = true;

initSmoke();
gridFine.scale.setScalar(WORLD.scale); gridCoarse.scale.setScalar(WORLD.scale); ring.scale.setScalar(WORLD.scale);
regenForest();
rebuildWorld(0);
spawnTitan({ boss:true, x:0, z:0, yaw:0 });
spawnCritters();
applySky(); applySun();
camTarget.copy(player.pos).add(new THREE.Vector3(0, M.eyeOffset, 0));
resizeAll();
if(_restored) showToast('settings restored');

const clock = new THREE.Clock();
function animate(){
    const dt = Math.min(clock.getDelta(), 0.05)*M.timeScale;
    if(APP === 'forge'){
        mkLookStep(dt);
        updateOrbit();
        forestCull(); pickLevel(); syncFaceUniforms();
        updateSmoke(dt);
        renderer.render(scene, camera);
        return;
    }
    if(UIX.open) return;                               // the world holds still while the deck is open
    if(REC.on){ updateReplay(dt); updateSmoke(dt); forestCull(); pickLevel(); syncFaceUniforms(); renderer.render(scene, camera); return; }   // the world holds still while you watch
    playerRidePre(dt);
    physics(dt);
    playerRidePost(dt);
    stkStep(dt);                                       // flights, stacks, adjectives
    updateTitans(dt);
    stkTitans();
    ftStep(dt);                                        // trees falling, fires, sitting up high together
    updateEmus(dt);
    updateMonkey(dt);
    updateGlyphs(dt);
    forestCull(); pickLevel(); syncFaceUniforms();
    updateSmoke(dt);
    drawSlash();
    recordFrame(dt);
    renderer.render(scene, camera);
}
// ── [VR] simplest test: no controls, you stand where you were and look around; the world keeps playing ──
// The camera sits in a rig. Out of VR the rig does nothing; in VR it holds your spot, your facing, and
// your size (1.6 m of real height = your normal eye height in the world).
const XR = { rig:new THREE.Group(), on:false };
scene.add(XR.rig); XR.rig.add(camera);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
(function(){
    const b = document.getElementById('vr-btn');
    if(!navigator.xr || !navigator.xr.isSessionSupported) return;          // iPhone: the button never shows
    navigator.xr.isSessionSupported('immersive-vr').then(ok => { if(ok) b.style.display = 'block'; }).catch(() => {});
    b.addEventListener('click', async e => {
        e.stopPropagation();
        if(XR.on){ const s = renderer.xr.getSession(); if(s) s.end(); return; }
        try {
            const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures:['local-floor'] });
            s.addEventListener('end', () => { XR.on = false; XR.rig.position.set(0, 0, 0); XR.rig.rotation.set(0, 0, 0); XR.rig.scale.set(1, 1, 1); b.textContent = 'VR'; });
            uixOpen(false); releaseGrapple();
            XR.rig.position.set(player.pos.x, player.pos.y - M.height, player.pos.z);   // your feet
            XR.rig.rotation.set(0, player.yaw, 0);
            XR.rig.scale.setScalar(M.height/1.6);
            await renderer.xr.setSession(s);
            XR.on = true; b.textContent = 'exit VR';
        } catch(err){ console.warn(err); XR.rig.position.set(0, 0, 0); XR.rig.rotation.set(0, 0, 0); XR.rig.scale.set(1, 1, 1); showToast("VR didn't start"); }
    });
})();
renderer.setAnimationLoop(animate);
