    const _p = new THREE.Vector3();
    function pickLevel(){
        if(!meshSets.length) return;
        let pick = meshSets[meshSets.length-1];
        // once the blade has cut, the coarse layers are out of date — show the real, carved structure
        if(CFG.lodPx>0 && bbox && !carvedSinceBuild){
            _p.set(
                Math.min(Math.max(camera.position.x, bbox[0]), bbox[3]),
                Math.min(Math.max(camera.position.y, bbox[1]), bbox[4]),
                Math.min(Math.max(camera.position.z, bbox[2]), bbox[5]));
            const dist = Math.max(camera.position.distanceTo(_p), 1);
            const st = document.getElementById('stage');
            const pxPerUnit = (st.clientHeight * R.fullPR) / (2*dist*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
            pick = meshSets[0];
            for(const s of meshSets){
                if((SPAN/(1<<s.level)) * pxPerUnit >= CFG.lodPx * R.fullPR) pick = s;
            }
        }
        if(pick.level !== activeLevel){
            meshSets.forEach(s=>s.mesh.visible = (s===pick));
            activeLevel = pick.level; updateHUD();
        }
    }

    // ── sky + ground from the front photo ────────────────────────────
    // top band → sky top · left/right edges around the middle → horizon ·
    // left/right edges of the bottom rows → ground (edges, so the subject in
    // the centre doesn't tint them).
    // No front image → the default blue sky and olive ground.
    let skyMatRef = null, floorRef = null, skyMeshRef = null, hemiLight = null, gridRef = null;
    const PAL = { top:new THREE.Color(0x4E7FB0), bot:new THREE.Color(0xA6CBE2), ground:new THREE.Color(0x4E4C39) };
    const lumOf = c => 0.2126*c.r + 0.7152*c.g + 0.0722*c.b;
    // the photo's overall brightness sets the light level: a night photo gives a dim world
    let worldLight = 1;
    const photoLum = () => (lumOf(PAL.top) + lumOf(PAL.bot)*2 + lumOf(PAL.ground))/4;
    const _lin = c => c.clone().convertSRGBToLinear();

    // ── one look: sky, fog, ground, grid, light tints, specks — all from PAL ──
    const AMB_WARM = new THREE.Color(0xE8D5C4).convertSRGBToLinear();   // ODM's warm ambient
    // Built-in materials add fog AFTER tone mapping + sRGB encoding, so the fog colour
    // must be the colour as it finally appears on screen. This runs a linear colour
    // through the same ACES curve three r128 uses (with exposure) and encodes it.
    function screenColour(lin){
        const e = CFG.exposure/0.6;
        let r = lin.r*e, g = lin.g*e, b = lin.b*e;
        const ir = 0.59719*r + 0.35458*g + 0.04823*b;
        const ig = 0.07600*r + 0.90834*g + 0.01566*b;
        const ib = 0.02840*r + 0.13383*g + 0.83777*b;
        const fit = v => (v*(v + 0.0245786) - 0.000090537)/(v*(0.983729*v + 0.4329510) + 0.238081);
        const fr = fit(ir), fg = fit(ig), fb = fit(ib);
        const cl = v => Math.min(1, Math.max(0, v));
        const orr = cl( 1.60475*fr - 0.53108*fg - 0.07367*fb);
        const org = cl(-0.10208*fr + 1.10813*fg - 0.00605*fb);
        const orb = cl(-0.00327*fr - 0.07276*fg + 1.07602*fb);
        const enc = v => v <= 0.0031308 ? v*12.92 : 1.055*Math.pow(v, 0.41666) - 0.055;
        return new THREE.Color(enc(orr), enc(org), enc(orb));
    }
    function applyWorldLook(){

        worldLight = Math.min(1.15, Math.max(0.35, 0.35 + 1.4*photoLum()));

        floorRef.material.color.copy(gnd);

        renderer.toneMappingExposure = CFG.exposure;

        if(gridRef){ scene.remove(gridRef); gridRef.geometry.dispose(); gridRef.material.dispose(); gridRef = null; }

            gridRef.position.y = WORLD_FLOOR + 0.3;

            scene.add(gridRef);

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [FOREST] from ODM_CORE_FORGE: value-noise density field, ║
    // ║ winding open corridors framed by giants, 4 height tiers  ║
    // ║ (colossals sometimes dead, bare), cone-spire or blob     ║
    // ║ canopies. Instanced: whole forest = 3 draw calls.        ║
    // ║ Seeded from the photo + monument, so each image grows    ║
    // ║ its own forest — the same one every time. A clearing is  ║
    // ║ kept around the monument. Trunks are solid; trunks and   ║
    // ║ canopies take the rope.                                  ║
    // ╚══════════════════════════════════════════════════════════╝
    const TREE_TIERS = { sapling:[150,180], medium:[280,420], giant:[420,900], colossal:[1000,1750] };
    const CANOPY_PALETTE = [0x4F6B3A, 0x5C7A42, 0x3E5630, 0x6B8049, 0x47633A];
    const TRUNK_BASE = new THREE.Color(0xB89D7A);
    const WGF = { noiseScale:200, densityGamma:1.2, corridorHalfWidth:260, corridorFeather:760,
                  frameGiants:0.75, giantChance:0.3, colossalChance:0.1 };
    const forest = { meshes:[], data:null, trunks:[], anchors:[], tallest:0, clearR:900 };
    function mulberry32(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
    function _fhash(ix, iz){
        let h = (Math.imul(ix, 73856093) ^ Math.imul(iz, 19349663)) >>> 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }
    function _fnoise(x, z){
        const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
        const u = fx*fx*(3-2*fx), v = fz*fz*(3-2*fz);
        const a=_fhash(ix,iz), b=_fhash(ix+1,iz), c=_fhash(ix,iz+1), d=_fhash(ix+1,iz+1);
        return a*(1-u)*(1-v) + b*u*(1-v) + c*(1-u)*v + d*u*v;
    }
    function _ffbm(x, z){ let sm=0, amp=0.5, f=1; for(let i=0;i<4;i++){ sm += amp*_fnoise(x*f, z*f); f*=2; amp*=0.5; } return sm/0.9375; }
    function _fseg(px, pz, a, b){
        const dx=b.x-a.x, dz=b.z-a.z, l2=dx*dx+dz*dz;
        let t = l2 ? ((px-a.x)*dx + (pz-a.z)*dz)/l2 : 0; t = Math.max(0, Math.min(1, t));
        return Math.hypot(px-(a.x+t*dx), pz-(a.z+t*dz));
    }
    function generateForest(rng, clearR){
        const MAP = CFG.forestSize, H = MAP/2, noiseOff = rng()*500;
        const trees=[], cones=[], blobs=[], corridors=[];
        for(let i=0;i<CFG.corridors;i++){
            const side = Math.floor(rng()*4); let x, z, heading;
            if(side===0){ x=-H; z=(rng()-0.5)*MAP; heading=0; }
            else if(side===1){ x=H; z=(rng()-0.5)*MAP; heading=Math.PI; }
            else if(side===2){ x=(rng()-0.5)*MAP; z=-H; heading=Math.PI/2; }
            else { x=(rng()-0.5)*MAP; z=H; heading=-Math.PI/2; }
            const pts=[{x,z}], steps=48, stepLen=(MAP*1.35)/steps;
            for(let st=0; st<steps; st++){
                heading += (rng()-0.5)*0.55;
                x += Math.cos(heading)*stepLen; z += Math.sin(heading)*stepLen;
                pts.push({x,z});
                if(Math.abs(x)>H*1.35 || Math.abs(z)>H*1.35) break;
            }
            corridors.push(pts);
        }
        const lane = (px, pz)=>{
            let best = Infinity;
            for(const pts of corridors) for(let i=1;i<pts.length;i++){ const d=_fseg(px,pz,pts[i-1],pts[i]); if(d<best) best=d; }
            if(best < WGF.corridorHalfWidth) return 0;
            if(best < WGF.corridorHalfWidth + WGF.corridorFeather) return (best - WGF.corridorHalfWidth)/WGF.corridorFeather;
            return 1;
        };
        const pickTier = (d, ln)=>{
            if(rng() < WGF.colossalChance && d > 0.62) return 'colossal';
            if(ln > 0.02 && ln < 0.5 && rng() < WGF.frameGiants) return 'giant';
            if(rng() < WGF.giantChance) return 'giant';
            const roll = rng();
            if(d > 0.6)  return roll < 0.5 ? 'medium' : (roll < 0.8 ? 'giant' : 'sapling');
            if(d > 0.35) return roll < 0.55 ? 'medium' : 'sapling';
            return roll < 0.75 ? 'sapling' : 'medium';
        };
        let kept = 0;
        const target = Math.round(CFG.trees), attempts = target*8;
        for(let i=0;i<attempts && kept<target;i++){
            const px=(rng()-0.5)*MAP, pz=(rng()-0.5)*MAP;
            if(Math.hypot(px,pz) < clearR) continue;             // the monument's clearing
            let d = _ffbm(px/WGF.noiseScale + noiseOff, pz/WGF.noiseScale + noiseOff);
            d = Math.pow(Math.max(0, Math.min(1, d)), WGF.densityGamma);
            const ln = corridors.length ? lane(px, pz) : 1;
            if(rng() >= d*ln) continue;
            const tier = pickTier(d, ln);
            const [hmin, hmax] = TREE_TIERS[tier];
            const h = (hmin + Math.pow(rng(),1.5)*(hmax-hmin))*CFG.treeScale;
            const dia = (12 + h*0.035 + rng()*10);
            const dead = (tier==='colossal') && rng() < 0.45;
            const shade = dead ? (0.4+rng()*0.2) : (0.85+rng()*0.15);
            trees.push({ x:px, z:pz, h, dia, shade, rot:rng()*Math.PI*2 });
            kept++;
            const wantCanopy = !dead && (tier==='sapling' ? rng()<0.65 : rng()<0.95);
            if(!wantCanopy) continue;
            const color = CANOPY_PALETTE[Math.floor(rng()*CANOPY_PALETTE.length)];
            if(rng() < 0.5){
                const layers = tier==='sapling' ? 2 : 3, baseR = dia*(2.0+rng()), totalH = h*(0.6+rng()*0.4);
                for(let l=0;l<layers;l++){
                    const pct = l/layers;
                    cones.push({ x:px, z:pz, y:h*(0.7+pct*0.3) + (totalH/layers)*0.13,
                        r:baseR*(1.0-pct*0.4), h:(totalH/layers)*1.3, color, rot:rng()*Math.PI*2, tilt:(rng()-0.5)*0.1 });
                }
            } else {
                const blobCount = tier==='sapling' ? 3 : 4+Math.floor(rng()*3), cR = dia*(1.5+rng());
                for(let b=0;b<blobCount;b++){
                    blobs.push({ x:px + (rng()-0.5)*cR*1.2, y:h*0.85 + (rng()-0.5)*h*0.3, z:pz + (rng()-0.5)*cR*1.2,
                        r:cR*(0.6+rng()*0.5), sy:0.85+rng()*0.3, color, rot:rng()*Math.PI*2 });
                }
            }
        }
        return { trees, cones, blobs };
    }
    // canopy/trunk colour: ODM palette, leaned toward the photo, then the hue/sat/bright sliders
    const _fc = new THREE.Color(), _fhsl = {h:0,s:0,l:0};
    function forestColor(hexOrColor, isTrunk, shade){
        if(typeof hexOrColor === 'number') _fc.setHex(hexOrColor); else _fc.copy(hexOrColor);
        if(shade !== undefined) _fc.multiplyScalar(shade);
        if(!isTrunk) _fc.lerp(PAL.ground.clone().multiplyScalar(1.25), CFG.canopyFollow);
        else { _fc.lerp(PAL.bot, CFG.canopyFollow*0.25); _fc.multiplyScalar(Math.min(1, Math.max(0.25, photoLum()*2.2))); }
        _fc.offsetHSL(CFG.canopyHue/360, 0, 0);
        _fc.getHSL(_fhsl);
        _fc.setHSL(_fhsl.h, Math.min(1, _fhsl.s*CFG.canopySat), Math.min(1, _fhsl.l*CFG.forestBright));
        return _fc.convertSRGBToLinear();
    }
    const _fd = new THREE.Object3D();
    function buildForestMeshes(data){
        for(const m of forest.meshes){ scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
        forest.meshes = []; forest.trunks = []; forest.anchors = [];
        const mk = (geo, list, place, kind)=>{
            if(!list.length) return;
            const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color:0xffffff }), list.length);
            im.userData.kind = kind;
            list.forEach((it,i)=>{ place(it); _fd.updateMatrix(); im.setMatrixAt(i, _fd.matrix); });
            im.instanceMatrix.needsUpdate = true; im.frustumCulled = false;
            scene.add(im); forest.meshes.push(im);
        };
        mk(new THREE.CylinderGeometry(0.35, 0.5, 1, 9), data.trees, t=>{
            _fd.position.set(t.x, WORLD_FLOOR + t.h/2, t.z); _fd.rotation.set(0, t.rot, 0); _fd.scale.set(t.dia, t.h, t.dia);
            forest.trunks.push({ x:t.x, z:t.z, r:t.dia*0.45, top:WORLD_FLOOR + t.h });
        }, 'trunk');
        mk(new THREE.ConeGeometry(0.5, 1, 9), data.cones, c=>{
            _fd.position.set(c.x, WORLD_FLOOR + c.y, c.z); _fd.rotation.set(c.tilt, c.rot, 0); _fd.scale.set(c.r*2, c.h, c.r*2);
            forest.anchors.push({ x:c.x, y:WORLD_FLOOR + c.y, z:c.z, r:c.r*0.75 });
        }, 'cone');
        mk(new THREE.SphereGeometry(0.5, 7, 5), data.blobs, b=>{
            _fd.position.set(b.x, WORLD_FLOOR + b.y, b.z); _fd.rotation.set(0, b.rot, 0); _fd.scale.set(b.r*2, b.r*2*b.sy, b.r*2);
            forest.anchors.push({ x:b.x, y:WORLD_FLOOR + b.y, z:b.z, r:b.r*0.9 });
        }, 'blob');
        retintForest();
    }
    function retintForest(){
        if(!forest.data) return;
        const d = forest.data;
        for(const im of forest.meshes){
            const kind = im.userData.kind;
            if(kind === 'trunk') d.trees.forEach((t,i)=>im.setColorAt(i, forestColor(TRUNK_BASE, true, t.shade)));
            else if(kind === 'cone') d.cones.forEach((c,i)=>im.setColorAt(i, forestColor(c.color, false)));
            else d.blobs.forEach((b,i)=>im.setColorAt(i, forestColor(b.color, false)));
            if(im.instanceColor) im.instanceColor.needsUpdate = true;
        }
        requestRender();
    }
    function regenForest(){
        // clearing: the monument's footprint, scaled
        let clearR = 900;
        if(bbox) clearR = Math.hypot(Math.max(Math.abs(bbox[0]),Math.abs(bbox[3])), Math.max(Math.abs(bbox[2]),Math.abs(bbox[5])))*CFG.clearing + 60;
        // seed: the photo's palette + the monument's shape → same image, same forest
        const seed = (Math.round(PAL.top.r*255)*16777619 ^ Math.round(PAL.bot.g*255)*2654435761 ^ Math.round(PAL.ground.b*255)*40503
                     ^ Math.round(clearR*7)) | 0;
        forest.clearR = clearR;
        forest.data = generateForest(mulberry32(seed), clearR);
        forest.tallest = forest.data.trees.reduce((m,t)=>Math.max(m,t.h), 0);
        buildForestMeshes(forest.data);
        if(gridRef) applyWorldLook();                       // grid follows forest size
    }
    let _forestT = 0;
    function regenForestSoon(){ clearTimeout(_forestT); _forestT = setTimeout(regenForest, 250); }

    // ── trees in the rope / aim ray: vertical trunk cylinders + canopy spheres ──
    function treeRayHit(o, d, maxT){
        let best = maxT, hit = false;
        const dxz = d.x*d.x + d.z*d.z;
        for(const t of forest.trunks){
            if(dxz < 1e-9) continue;
            const ox = o.x - t.x, oz = o.z - t.z;
            const b = ox*d.x + oz*d.z, c = ox*ox + oz*oz - t.r*t.r, disc = b*b - dxz*c;
            if(disc < 0) continue;
            const s = (-b - Math.sqrt(disc))/dxz;
            if(s <= 0 || s >= best) continue;
            const y = o.y + d.y*s;
            if(y < WORLD_FLOOR || y > t.top) continue;
            best = s; hit = true;
        }
        for(const a of forest.anchors){
            const ox = o.x - a.x, oy = o.y - a.y, oz = o.z - a.z;
            const b = ox*d.x + oy*d.y + oz*d.z, c = ox*ox + oy*oy + oz*oz - a.r*a.r, disc = b*b - c;
            if(disc < 0) continue;
            const s = -b - Math.sqrt(disc);
            if(s <= 0 || s >= best) continue;
            best = s; hit = true;
        }
        return hit ? best : -1;
    }
    // ── trunks are solid: push out sideways, land on top (dead colossals make pillars) ──
    function collideTrees(prevY){
        const R = M.radius, px = player.pos.x, pz = player.pos.z;
        let impact = 0;
        for(const t of forest.trunks){
            const dx = player.pos.x - t.x, dz = player.pos.z - t.z;
            const rr = t.r + R;
            if(Math.abs(dx) > rr || Math.abs(dz) > rr) continue;
            const d = Math.hypot(dx, dz);
            if(d >= rr) continue;
            if(prevY - R >= t.top - 0.01 && player.pos.y - R < t.top && d < t.r){   // coming down onto the top
                player.pos.y = t.top + R; if(player.vel.y < 0) player.vel.y = 0; player.grounded = true;
                continue;
            }
            if(player.pos.y - R >= t.top) continue;
            const nx = d > 1e-6 ? dx/d : 1, nz = d > 1e-6 ? dz/d : 0;
            player.pos.x = t.x + nx*rr; player.pos.z = t.z + nz*rr;
            const into = player.vel.x*nx + player.vel.z*nz;
            if(into < 0){ impact = Math.max(impact, -into); player.vel.x -= into*nx; player.vel.z -= into*nz; }
        }
        if(impact > M.crashSpeed) player.shake = Math.min(0.32, impact/(M.crashSpeed*7));
    }
    const SKY_DEFAULT = { top:0x4E7FB0, bot:0xA6CBE2, ground:0x4E4C39 };
    function bandAvg(d, n, x0, x1, y0, y1){
        let r=0, g=0, b=0, c=0;
        for(let y=Math.floor(y0*n); y<Math.floor(y1*n); y++)
            for(let x=Math.floor(x0*n); x<Math.floor(x1*n); x++){
                const i=(y*n+x)*4; r+=d[i]; g+=d[i+1]; b+=d[i+2]; c++;
            }
        return c ? [r/c/255, g/c/255, b/c/255] : [0,0,0];
    }
    // The structure's own colour: the centre of every loaded view, averaged (the
    // sky/ground sample the edges, so the subject sits in the middle).
    // Default monument colour when nothing is loaded.
    const STRUCT = new THREE.Color(0x41688E), STRUCT_OPP = new THREE.Color(0xB88F61);
    const _hs = {h:0,s:0,l:0}, _hc = {h:0,s:0,l:0};
    function structureColour(out){
        let r=0, g=0, b=0, c=0;
        for(const key of VIEW_ORDER){
            if(!srcImgs[key]) continue;
            const n = ctxs[key].canvas.width, d = ctxs[key].getImageData(0,0,n,n).data;
            const a = bandAvg(d, n, 0.3, 0.7, 0.3, 0.7);
            r += a[0]; g += a[1]; b += a[2]; c++;
        }
        if(c) out.setRGB(r/c, g/c, b/c); else out.setHex(0x41688E);
        return out;
    }
    // Swing col's hue to the opposite side of the wheel from the structure's. It keeps
    // its own lightness (so the world's light level and the fog maths are unchanged).
    // A grey structure has no opposite hue, so it flips lightness instead.
    function opposeColour(col, S, amt){
        if(amt <= 0) return;
        S.getHSL(_hs); col.getHSL(_hc);
        const w = Math.min(1, _hs.s/0.25);                        // how chromatic the structure is
        const target = (_hs.h + 0.5) % 1;
        const dh = ((target - _hc.h + 1.5) % 1) - 0.5;            // shortest way round the wheel
        const h = (_hc.h + dh*amt*w + 1) % 1;
        const sat = _hc.s + (Math.max(_hc.s, _hs.s) - _hc.s)*amt*w;
        const lum = _hc.l + ((1 - _hs.l) - _hc.l)*amt*(1 - w)*0.6;
        col.setHSL(h, Math.min(1, sat), Math.min(0.95, Math.max(0.04, lum)));
    }
    function themeFromFront(){
        if(!skyMatRef || !floorRef) return;
        const u = skyMatRef.uniforms;
        if(!srcImgs.front){
            u.top.value.setHex(SKY_DEFAULT.top); u.bot.value.setHex(SKY_DEFAULT.bot);
            floorRef.material.color.setHex(SKY_DEFAULT.ground).convertSRGBToLinear();
        } else {
            const n = ctxs.front.canvas.width, d = ctxs.front.getImageData(0,0,n,n).data;
            const top = bandAvg(d, n, 0, 1, 0, 0.12);
            const hl = bandAvg(d, n, 0, 0.12, 0.35, 0.5), hr = bandAvg(d, n, 0.88, 1, 0.35, 0.5);
            const gl = bandAvg(d, n, 0, 0.3, 0.9, 1), gr = bandAvg(d, n, 0.7, 1, 0.9, 1);   // edges: skip the subject's base
            const ground = [(gl[0]+gr[0])/2, (gl[1]+gr[1])/2, (gl[2]+gr[2])/2];
            u.top.value.setRGB(top[0], top[1], top[2]);
            u.bot.value.setRGB((hl[0]+hr[0])/2, (hl[1]+hr[1])/2, (hl[2]+hr[2])/2);
            floorRef.material.color.setRGB(ground[0], ground[1], ground[2]).convertSRGBToLinear();
        }
        // sky + horizon swing to the structure's complement (the ground and forest stay the photo's)
        structureColour(STRUCT);
        opposeColour(u.top.value, STRUCT, CFG.horizonOpp);
        opposeColour(u.bot.value, STRUCT, CFG.horizonOpp);
        STRUCT_OPP.copy(STRUCT); opposeColour(STRUCT_OPP, STRUCT, 1);   // mimics wear the same opposite
        if(mimics.length) tintMimics();
        // the palette in sRGB (as picked); everything downstream converts to linear
        PAL.top.copy(u.top.value); PAL.bot.copy(u.bot.value); PAL.ground.copy(floorRef.material.color).convertLinearToSRGB();
        applyWorldLook();
        retintForest();
    }

    function drawView(key){
        const n = CFG.imgSize, ctx = ctxs[key];
        ctx.canvas.width = n; ctx.canvas.height = n;
        if(srcImgs[key]) ctx.drawImage(srcImgs[key], 0, 0, n, n);
        else{
            ctx.fillStyle = '#1A1C1B'; ctx.fillRect(0,0,n,n);
            ctx.fillStyle = '#41688E'; const m = n*0.25; ctx.fillRect(m,m,n-2*m,n-2*m);
        }
        worker.postMessage({type:'update_image', view:key, imgData:ctx.getImageData(0,0,n,n)});
        if(key === 'front' || srcImgs[key]) themeFromFront();     // any view changes the structure's colour
    }
    function resampleAll(){ VIEW_ORDER.forEach(drawView); }

    function processImageUpload(file, key){
        if(!file.type.match(/image\//)){ toast('not an image'); return; }
        const reader = new FileReader();
        reader.onload = ev=>{
            const img = new Image();
            img.onload = ()=>{
                srcImgs[key] = img; loaded[key] = true;
                document.getElementById(`slot-${key}`).classList.add('loaded');
                document.getElementById('drop-hint').style.display = 'none';
                drawView(key); requestBuild(); toast(`${key} loaded`);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
    function loadFilesInOrder(list){
        Array.from(list).slice(0,4).forEach((f,i)=>processImageUpload(f, VIEW_ORDER[i]));
    }

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [SETTINGS] every slider and toggle is remembered on this  ║
    // ║ device — set it once and it comes back next time. The     ║
    // ║ 'defaults' button in the deck wipes it.                   ║
    // ╚══════════════════════════════════════════════════════════╝
    const SAVE_KEY = 'waaa.settings.v1';
    const SAVE_SKIP = new Set(['span','floorY']);
    let _saveT = 0;
    function saveSettings(){
        clearTimeout(_saveT);
        _saveT = setTimeout(()=>{
            try {
                const out = { M:{}, CFG:{}, bandV:2 };
                for(const k in M) if(!SAVE_SKIP.has(k) && typeof M[k] !== 'object') out.M[k] = M[k];
                for(const k in CFG) if(!SAVE_SKIP.has(k) && typeof CFG[k] !== 'object') out.CFG[k] = CFG[k];
                localStorage.setItem(SAVE_KEY, JSON.stringify(out));
            } catch(e){}                                   // private mode / full quota: just don't save
        }, 400);
    }
    function loadSettings(){
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if(!raw) return false;
            const st = JSON.parse(raw);
            // rope was rebuilt as a pure launching band (v2): old saved band values would
            // override the new defaults, so drop them once and keep everything else
            const OLD_BAND = new Set(['bandRest','bandK','bandMaxPull','bandDamp','bandLift']);
            if(st.M) for(const k in st.M) if(k in M && !SAVE_SKIP.has(k) && (st.bandV === 2 || !OLD_BAND.has(k))) M[k] = st.M[k];
            if(st.CFG) for(const k in st.CFG) if(k in CFG && !SAVE_SKIP.has(k)) CFG[k] = st.CFG[k];
            return true;
        } catch(e){ return false; }
    }
    function clearSettings(){
        try { localStorage.removeItem(SAVE_KEY); } catch(e){}
        location.reload();
    }

    const sliderSync = [];
    function buildSliders(){
        Object.entries(SLIDERS).forEach(([gid,defs])=>{
            const g = document.getElementById(gid);
            defs.forEach(d=>{
                const row = document.createElement('div'); row.className = 'row';
                row.innerHTML = `<div class="lbl"><span>${d.lbl}</span><span class="val"></span></div>`
                    + `<input type="range" min="${d.min}" max="${d.max}" step="${d.step}">`;
                const input = row.querySelector('input'), val = row.querySelector('.val');
                const sync = ()=>{ input.value = M[d.k] !== undefined ? M[d.k] : CFG[d.k]; val.textContent = d.fmt(M[d.k] !== undefined ? M[d.k] : CFG[d.k]); };
                input.addEventListener('input', ()=>{
                    const v = parseFloat(input.value);
                    if(M[d.k] !== undefined) M[d.k] = v;
                    else CFG[d.k] = v;
                    sliderSync.forEach(f=>f());
                    saveSettings();
                    if(d.onSet){ d.onSet(); return; }
                    if(M[d.k] !== undefined) return;   // flight sliders are live
                    if(LIVE_KEYS.has(d.k)){
                        if(d.k === 'motionRes') R.motionPR = CFG.motionRes;
                        if(d.k === 'lodPx') pickLevel();
                        syncUniforms(); requestRender(); return;
                    }
                    debouncedBuild();
                });
                sliderSync.push(sync); sync();
                g.appendChild(row);
            });
        });
    }

    function setupUI(){
        buildSliders();

        });
        VIEW_ORDER.forEach(k=>document.getElementById(`load-${k}`).addEventListener('change', e=>{
            if(e.target.files[0]) processImageUpload(e.target.files[0], k);

        }));

        document.getElementById('btn-color').addEventListener('click', e=>{

        });
        const autoBtn = document.getElementById('btn-auto');
        const prevBtn = document.getElementById('btn-preview');
        function paintAuto(){ autoBtn.textContent = `auto quality: ${CFG.autoQuality?'on':'off'}`; autoBtn.classList.toggle('on', CFG.autoQuality); }
        function paintPrev(){ prevBtn.textContent = `quick preview: ${CFG.preview?'on':'off'}`; prevBtn.classList.toggle('on', CFG.preview); }
        autoBtn.addEventListener('click', ()=>{ CFG.autoQuality = !CFG.autoQuality; if(!CFG.autoQuality) R.motionPR = CFG.motionRes; paintAuto(); saveSettings(); });
        prevBtn.addEventListener('click', ()=>{ CFG.preview = !CFG.preview; paintPrev(); saveSettings(); });
        document.getElementById('btn-defaults').addEventListener('click', clearSettings);
        paintAuto(); paintPrev();

        // DRIFT deck: OPEN at startup; the ▼ tab closes it, the UI tab reopens it. It tucks itself

        document.getElementById('btn-return').addEventListener('click', ()=>{

        });
        document.getElementById('btn-keep').addEventListener('click', ()=>{
            setPR(R.fullPR); pickLevel(); renderer.render(scene, camera);
            const a = document.createElement('a');

        });
        document.getElementById('btn-view').addEventListener('click', ()=>{

        });
        const ropeBtn = document.getElementById('btn-rope');
        ropeBtn.addEventListener('click', ()=>{
            ROPE_ENABLED = !ROPE_ENABLED;

            ropeBtn.classList.toggle('on', ROPE_ENABLED);

    function resetCam(){
        camera.position.set(SPAN*0.95, SPAN*0.55, SPAN*0.95);
        controls.target.set(0, SPAN*0.3, 0);
        controls.update(); requestRender();
    }

    // Set spawn: standing on the ground just outside the monument's clearing,
    // looking at it. Nudged out if a trunk is in the way.
    function spawnPlayer(){
        // Out at the tree line, far enough back to see the whole monument, and in a
        // direction whose view of it isn't blocked by a trunk.
        const edge = bbox ? Math.max(Math.abs(bbox[0]),Math.abs(bbox[2]),Math.abs(bbox[3]),Math.abs(bbox[5])) : SPAN*0.5;
        const height = bbox ? bbox[4] - bbox[1] : SPAN;
        const dist = Math.max(edge + 320, forest.clearR*0.95, height*0.9);
        const clearOf = (px, pz) => {                       // nothing blocking the look toward the centre
            for(const t of forest.trunks){
                const l2 = px*px + pz*pz;
                let u = l2 ? -(px*(-px) + pz*(-pz))/l2 : 0;      // project trunk onto the spawn→centre line
                u = Math.max(0, Math.min(1, ((t.x - px)*(-px) + (t.z - pz)*(-pz))/Math.max(1e-6, l2)));
                const cx = px + (-px)*u, cz = pz + (-pz)*u;
                if(Math.hypot(t.x - cx, t.z - cz) < t.r + 70 && u < 0.45) return false;
                if(Math.hypot(t.x - px, t.z - pz) < t.r + M.radius + 12) return false;
            }
            return true;
        };
        let ang = 0, px = 0, pz = dist;
        for(let i=0;i<24;i++){
            const a = i*(Math.PI*2/24);
            const tx = Math.sin(a)*dist, tz = Math.cos(a)*dist;
            if(clearOf(tx, tz)){ ang = a; px = tx; pz = tz; break; }
        }
        player.pos.set(px, WORLD_FLOOR + M.radius, pz);
        player.vel.set(0,0,0);
        player.yaw = ang; player.pitch = 0.22;      // face the monument, looking up it
        player.roll = 0; player.shake = 0; player.boostIntensity = 0;
        wall.on = false; wall.t = 0; wall.cool = 0; wall.coyote = 0;
        camTarget.copy(player.pos);
        releaseGrapple(); killAllBlades(); clearDebris(); clearSmoke();
        resetMimics();
        currentHFov = M.hFov;
        BUB.ready = false; BUB.pending = false; BUB.id++;
        maintainBubble();
        requestRender();
    }


    function setViewMode(mode){
        const prev = VIEW_MODE;
        VIEW_MODE = mode;
        document.getElementById('btn-view').textContent = `view: ${mode}`;
        document.body.classList.toggle('player-mode', mode !== 'orbit');
        if(mode !== 'orbit') layoutHand();

        if(prev === 'orbit' && mode !== 'orbit'){
            const dk = document.getElementById('deck');
            deckWasOpen = dk.classList.contains('open'); dk.classList.remove('open');   // tuck away for first person
            spawnPlayer();
            controls.enabled = false;
            BUB.ready = false; BUB.pending = false; BUB.id++;
            maintainBubble();
        }
        if(prev !== 'orbit' && mode === 'orbit'){
            if(deckWasOpen) document.getElementById('deck').classList.add('open');       // back to orbit: restore the deck
            controls.enabled = true;
            releaseGrapple();
            killAllBlades(); clearDebris(); if(debrisMesh) debrisMesh.count = 0;
            if(speckLines) speckLines.visible = false;
            clearSmoke(); clearWatchers();
            stickL.on = false; stickR.on = false;
            stickL.dx = stickL.dy = stickR.dx = stickR.dy = 0;
            resetCam();
        }
        updateSelfModel();
        requestRender();
    }

    function init(){
        const restored = loadSettings();
        const st = document.getElementById('stage');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xA6CBE2);
        camera = new THREE.PerspectiveCamera(M.hFov, st.clientWidth/st.clientHeight, 0.5, CAMERA_FAR);
        camera.fov = fovFor(M.hFov); camera.updateProjectionMatrix();
        camera.rotation.order = 'YXZ';
        renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true});
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = CFG.exposure;
        st.appendChild(renderer.domElement);
        setPR(R.fullPR);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.03; controls.screenSpacePanning = true;
        controls.addEventListener('change', ()=>{
            const t = performance.now();
            if(t - R.lastMove >= R.SETTLE_MS){ R.motionStart = t; R.frames.length = 0; }
            R.need = true; R.lastMove = t;
        });
        resetCam();

        ambLight = new THREE.AmbientLight(0xEAF0F4, CFG.ambient); scene.add(ambLight);
        hemiLight = new THREE.HemisphereLight(0xA6CBE2, 0x3A3E42, 0.4); scene.add(hemiLight);
        scene.fog = new THREE.Fog(0xA6CBE2, CFG.fogNear, CFG.fogFar);
        keyLight = new THREE.DirectionalLight(0xF2F4F2, CFG.sun);
        keyLight.position.set(Math.cos(0.7)*Math.cos(0.62)*SPAN,
                              Math.sin(0.62)*SPAN,
                              Math.sin(0.7)*Math.cos(0.62)*SPAN);
        scene.add(keyLight);
        const fill = new THREE.DirectionalLight(0x4E7FB0, 0.2);
        fill.position.set(-0.3*SPAN, 0.2*SPAN, -0.35*SPAN); scene.add(fill);

        const skyMat = skyMatRef = new THREE.ShaderMaterial({
            uniforms:{ top:{value:new THREE.Color(0x4E7FB0)}, bot:{value:new THREE.Color(0xA6CBE2)}, band:{value:CFG.horizonBand} },
            vertexShader:'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
            // same pipeline as every other surface (tone map → sRGB). The sky holds the
            // pure horizon colour (= the fog colour) through a band above the horizon as
            // tall as fogged treetops reach, then runs the photo's gradient above it —
            // so distant trees dissolve completely instead of silhouetting
            fragmentShader:'uniform vec3 top; uniform vec3 bot; uniform float band; varying vec3 vP; void main(){ float t=clamp((normalize(vP).y-band)/(1.0-band),0.0,1.0); gl_FragColor=vec4(mix(bot,top,pow(t,0.65)),1.0);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}',
            side:THREE.BackSide, depthWrite:false
        });
        const sky = new THREE.Mesh(new THREE.SphereGeometry(CAMERA_FAR*0.42, 24, 16), skyMat);
        sky.frustumCulled = false; sky.renderOrder = -1; scene.add(sky);
        skyMeshRef = sky;

        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(60000, 60000),
            // unlit so its colour matches the photo exactly (the lights would brighten it)
            new THREE.MeshBasicMaterial({ color:new THREE.Color(0x4E4C39).convertSRGBToLinear() }));
        floorRef = floor;
        floor.rotation.x = -Math.PI/2; floor.position.y = WORLD_FLOOR - 0.05; scene.add(floor);
        window.ground = floor;   // rope fallback target

        faceMat = makeFaceMaterial();
        R.motionPR = CFG.motionRes; R.driftPR = R.fullPR; R.flyPR = R.fullPR;

        VIEW_ORDER.forEach(k=>ctxs[k] = document.getElementById(`canv-${k}`).getContext('2d', {willReadFrequently:true}));
        resampleAll();
        setupUI();
        if(restored) toast('settings restored');
        requestBuild();

        window.addEventListener('resize', onResize);
        // iOS reports the rotated size a beat late — measure again once it settles
        window.addEventListener('orientationchange', ()=>{ setTimeout(onResize, 120); setTimeout(onResize, 400); });
        const cv = renderer.domElement;
        cv.addEventListener('pointerdown', e=>{
            if(VIEW_MODE !== 'orbit') return;
            isIntersecting = true; lastMousePos.x = e.clientX; lastMousePos.y = e.clientY;
            mouseVelocity.x = 0; mouseVelocity.y = 0;
        });
        window.addEventListener('pointermove', e=>{
            if(!isIntersecting) return;
            mouseVelocity.x = e.clientX - lastMousePos.x;
            mouseVelocity.y = e.clientY - lastMousePos.y;
            lastMousePos.x = e.clientX; lastMousePos.y = e.clientY;
        });
        window.addEventListener('pointerup', ()=>{ isIntersecting = false; R.lastTouch = performance.now(); });
        cv.addEventListener('wheel', ()=>{ R.lastTouch = performance.now(); }, {passive:true});
        setInterval(updateHUD, 500);
    }

    function onResize(){
        const st = document.getElementById('stage');
        camera.aspect = st.clientWidth/st.clientHeight;
        camera.fov = fovFor(VIEW_MODE === 'orbit' ? M.hFov : currentHFov);
        camera.updateProjectionMatrix();
        renderer.setSize(st.clientWidth, st.clientHeight);
        if(VIEW_MODE !== 'orbit') layoutHand();
        sizeSlashCanvas();
        requestRender();
    }

    const handsOn = now => isIntersecting || now - R.lastTouch < 400;
    function tuneQuality(now){
        if(!CFG.autoQuality || now - R.lastTune < 600 || now - R.motionStart < 1000) return;
        R.lastTune = now;
        if(VIEW_MODE !== 'orbit'){
            if(R.fps < 45) R.flyPR = Math.max(0.5, R.flyPR - 0.15);
            else if(R.fps > 56) R.flyPR = Math.min(R.fullPR, R.flyPR + 0.1);
            return;
        }
        if(handsOn(now)){
            if(R.fps < 45) R.motionPR = Math.max(0.5, R.motionPR - 0.15);
            else if(R.fps > 56) R.motionPR = Math.min(CFG.motionRes, R.motionPR + 0.1);
        } else {
            if(R.fps < 45) R.driftPR = Math.max(0.5, R.driftPR - 0.15);
            else if(R.fps > 56) R.driftPR = Math.min(R.fullPR, R.driftPR + 0.1);
        }
    }


    // ╔══════════════════════════════════════════════════════════╗
    // ║ [IMPACT] anime-protagonist feel. Everything fires from   ║
    // ║ something YOU did; nothing moves on its own.             ║
    // ║  punch    cutting a stretched rope: FOV kick, speed lines║
    // ║           and a single shake — the band's payoff         ║
    // ║  hit-stop wall kick only: the world freezes a few frames, ║
    // ║           then a short slow tail. The blade never slows  ║
    // ║  reveal   first time a twin is in range and in view:     ║
    // ║           letterbox, slow-mo, FOV zoom, eyes flare       ║
    // ║  lines    faint speed streaks at the edges at top speed  ║
    // ╚══════════════════════════════════════════════════════════╝
    const fx = { punch:0, lines:0, stopT:0, tailT:0, stopCool:0, revealT:0, revealDur:1.4, revealCD:0, revealM:null,
                 linesOn:false, seed:[], bars:null, cv:null, cx:null, w:0, h:0 };
    function fxInit(){
        if(fx.cv) return;
        const st = document.createElement('style');
        st.textContent = '#fx-lines{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6}'
            + '.fx-bar{position:fixed;left:0;width:100%;height:12vh;background:#000;pointer-events:none;z-index:7;transition:transform .28s cubic-bezier(.2,.8,.2,1)}'
            + '#fx-top{top:0;transform:translateY(-101%)}#fx-bot{bottom:0;transform:translateY(101%)}'
            + '.fx-bar.on{transform:translateY(0)}';
        document.head.appendChild(st);

        const I = m.intent, p = m.pos, v = m.vel;
        let yawIn = I.yaw, pitchIn = I.pitch;
        // reflexes the brain has no way to express: steer home past the leash, stay under the ceiling
        mimicCentre(_mC);
        const cx = _mC.x - p.x, cz = _mC.z - p.z;
        if(Math.hypot(cx, cz) > M.mimicLeash){
            const want = Math.atan2(-cx, -cz);
            let dy = (want - m.yaw) % (Math.PI*2); if(dy > Math.PI) dy -= Math.PI*2; if(dy < -Math.PI) dy += Math.PI*2;
            yawIn = -mCl(dy*2, -1, 1);
        }
        if(p.y > M.mimicCeil) pitchIn = -1;
        else if(p.y < WORLD_FLOOR + M.mimicScale*3 && v.y < 0) pitchIn = 1;
        m.yaw   -= yawIn*(M.mimicTurn/M.mimicBeat)*dt;
        m.pitch = mCl(m.pitch + pitchIn*(M.mimicClimb/M.mimicBeat)*dt, -1.2, 1.2);
        mimicFwd(m, _mF);
        const boosting = I.boost;
        v.addScaledVector(_mF, M.mimicThrust*(boosting ? M.mimicBoost : 1)*dt);
        v.y += M.gravity*M.mimicGravity*dt;
        // rope: the same pure spring as yours
        const r = m.rope;
        if(r.state === 'fly'){
            r.fly += dt;
            if(r.fly >= r.flyDur){
                r.state = 'active';
                _mA.subVectors(r.anchor, p); const d0 = _mA.length(); r.len = d0*M.bandRest;
                v.addScaledVector(_mA.normalize(), 10);
            }
        }
        if(r.state === 'active'){
            _mA.subVectors(r.anchor, p); const dist = _mA.length();
            if(dist > M.maxRopeDist*1.6 || dist < 1e-3) mimicCutRope(m);
            else {
                _mA.multiplyScalar(1/dist);
                const stretch = dist - r.len;
                if(stretch > 0){
                    _mP.copy(_mA); _mP.y += M.bandLift; _mP.normalize();
                    const f = Math.min(M.bandMaxPull, M.bandK*stretch + M.bandSnap*stretch*stretch);
                    v.addScaledVector(_mP, f*dt);
                    const radial = v.dot(_mA);
                    v.addScaledVector(_mA, -radial*(1 - Math.exp(-M.bandDamp*dt)));
                }
            }
        }
        const k = Math.exp(-M.mimicDrag*dt); v.multiplyScalar(k);
        if(r.state === 'active' || r.state === 'fly') m.over = 1; else m.over = Math.max(0, m.over - dt/Math.max(0.1, M.bandOverT));
        const vmax = M.maxSpeed*(boosting ? 1.5 : 1)*(1 + (M.bandOver - 1)*m.over), sp = v.length();
        if(sp > vmax) v.multiplyScalar(vmax/sp);
        p.addScaledVector(v, dt);
        mimicCollide(m, p.y);
        if(m.wall.cool > 0) m.wall.cool -= dt;
        // stand-out: ember halo (visible through walls, never smaller than a dot on screen), pillar, eye flare
        if(m.fx){
            const dist = camera.position.distanceTo(p), t = performance.now()*0.004 + m.slot*2;
            const flare = (fx.revealM === m) ? Math.sin(Math.PI*Math.min(1, 1 - fx.revealT/fx.revealDur)) : 0;
            m.flare += (flare - m.flare)*Math.min(1, dt*14);
            const gl = M.mimicGlow;
            m.fx.halo.visible = gl > 0 && VIEW_MODE !== 'orbit';
            if(m.fx.halo.visible){
                const base = Math.max(M.mimicScale*2.6, dist*0.05)*gl*(1 + 0.12*Math.sin(t*2.1) + m.flare*1.6);
                m.fx.halo.position.copy(p); m.fx.halo.scale.set(base, base, 1);
                m.fx.halo.material.opacity = Math.min(1, 0.65 + 0.25*Math.sin(t*2.1) + m.flare*0.4);
            }
            const bh = M.mimicBeacon;
            m.fx.beam.visible = bh > 0 && VIEW_MODE !== 'orbit';
            if(m.fx.beam.visible){
                const rad = Math.max(M.mimicScale*0.05, dist*0.0035)*(1 + m.flare*2);
                m.fx.beam.scale.set(rad, bh, rad); m.fx.beam.position.set(p.x, p.y + bh/2, p.z);
                m.fx.beam.material.opacity = 0.26 + 0.1*Math.sin(t*1.7) + m.flare*0.3;
            }
            m.g.userData.visor.scale.setScalar(1 + m.flare*2.6); m.g.userData.core.scale.setScalar(1 + m.flare*2.2);
        }
        // model + rope line
        poseModel(m.g, m.yaw, m.pitch, v.length(), dt);
        if(r.line && r.line.visible){
            m.g.userData.hand.getWorldPosition(_mH);
            const a = r.line.geometry.attributes.position.array;
            a[0] = _mH.x; a[1] = _mH.y; a[2] = _mH.z;
            if(r.state === 'fly'){ const e = mCl(r.fly/Math.max(1e-3, r.flyDur), 0, 1); a[3] = _mH.x + (r.anchor.x - _mH.x)*e; a[4] = _mH.y + (r.anchor.y - _mH.y)*e; a[5] = _mH.z + (r.anchor.z - _mH.z)*e; }
            else { a[3] = r.anchor.x; a[4] = r.anchor.y; a[5] = r.anchor.z; }
            r.line.geometry.attributes.position.needsUpdate = true;
            r.line.visible = r.state !== 'none';
        }
        // smoke: same speed curve as yours, x4 on a boost beat
        const speed = v.length();
        if(M.mimicSmoke > 0 && speed > 1 && particles.length < M.smokeMax){
            let rate = M.smokeBase + Math.min(1, (speed - 1)/(M.maxSpeed - 1))*(M.smokeMaxRate - M.smokeBase);
            if(boosting) rate *= 4;
            if(r.state === 'active') rate += M.smokeMaxRate*0.3;
            m.acc += rate*M.mimicSmoke*dt;
            _mF.copy(v).normalize().multiplyScalar(-1);
            while(m.acc >= 1 && particles.length < M.smokeMax){
                m.acc -= 1;
                emitSmoke(_ePos.copy(p).addScaledVector(_mF, M.mimicScale*0.9 + Math.random()*10),
                          _eVel.copy(_mF).multiplyScalar(4 + Math.random()*8), 1, m.col);
            }
        }
    }
    function updateMimics(dt){
        if(mimics.length !== Math.round(M.mimics)) syncMimics();
        if(!mimics.length) return false;
        if(VIEW_MODE === 'orbit'){ for(const m of mimics){ m.g.visible = m.init; if(m.fx){ m.fx.halo.visible = false; m.fx.beam.visible = false; } } return false; }
        if(!mimicP) mimicP = mbParams();
        for(const m of mimics) if(!m.init) resetMimics();
        if(player.boostIntensity > 0.05) beatIn.boost = true;
        beatT += dt;
        if(beatT >= M.mimicBeat){ beatT = beatT % M.mimicBeat; runBeat(); }
        for(const m of mimics){ m.g.visible = true; stepMimic(m, dt); }
        return true;
    }

    const _up = new THREE.Vector3(0,1,0);
    const _right = new THREE.Vector3();
    const _tmp = new THREE.Vector3();
    const _off = new THREE.Vector3();
    let _lastT = 0;
    const _lastCamPos = new THREE.Vector3(), _lastCamQuat = new THREE.Quaternion();

    function animate(now){
        requestAnimationFrame(animate);
        drawSlash();
        let dt = Math.min(0.05, (now - _lastT)/1000 || 0.016);
        _lastT = now;

        if(VIEW_MODE === 'orbit'){
            updateSelfModel();
            if(isIntersecting){ mouseVelocity.x *= 0.92; mouseVelocity.y *= 0.92; }
            else if(!frictionEnabled && (Math.abs(mouseVelocity.x) > 0.5 || Math.abs(mouseVelocity.y) > 0.5)){
                _off.copy(camera.position).sub(controls.target);
                _off.applyAxisAngle(_up, -mouseVelocity.x * 0.001);
                camera.matrix.extractBasis(_right, _tmp, _tmp);
                _off.applyAxisAngle(_right, -mouseVelocity.y * 0.001);
                camera.position.copy(controls.target).add(_off);
            }
            controls.update();
        } else {
            const rdt = dt;                  // real time: look, camera, rope drawing
            fxInit();
            dt = dt*fxTimeScale(rdt);        // world time: hit-stop / slow-mo / reveal scale everything below
            physics(dt);
            updateCamera(rdt);
            updateRope(rdt);                  // after the camera — keeps the rope on your hand
            updateSpecks();
            if(grapple.active || grapple.flying) paintCrosshair();
            stepBlades(dt);
            stepDebris(dt);
            updateSmoke(dt);
            if(bodies.length || (debrisMesh && debrisMesh.count)) drawDebris();
            if(_xhTimer > 0){ _xhTimer -= dt; if(_xhTimer <= 0){ xhairEl.classList.remove('dig'); paintCrosshair(); } }
            const coresBusy = updateCores(dt, now);
            if(watchers.length !== Math.round(M.watchers)) syncWatchers();
            const watchBusy = updateWatchers(dt, now);
            const masonsBusy = updateMasons(dt, now);
            const mimicBusy = updateMimics(dt);
            fxUpdate(rdt);
            const fxBusy = coresBusy || masonsBusy || watchBusy || mimicBusy || blades.length > 0 || bodies.length > 0 || particles.length > 0;
            updateHUD();                      // live readout while flying (DOM only touched on change)
            requestAim(now);
            // redraw only if the view actually changed — standing still costs nothing
            if(fxBusy || grapple.active || grapple.flying || !_lastCamPos.equals(camera.position) || !_lastCamQuat.equals(camera.quaternion)){
                if(now - R.lastMove >= R.SETTLE_MS){ R.motionStart = now; R.frames.length = 0; }
                R.need = true; R.lastMove = now;
                _lastCamPos.copy(camera.position); _lastCamQuat.copy(camera.quaternion);
            }
        }

        const moving = now - R.lastMove < R.SETTLE_MS;
        if(R.need){
            const target = !moving ? R.fullPR
                         : (VIEW_MODE !== 'orbit') ? (CFG.autoQuality ? R.flyPR : R.fullPR)
                         : handsOn(now) ? Math.min(R.motionPR, R.fullPR)
                         : (CFG.autoQuality ? R.driftPR : R.fullPR);
            setPR(target);
            pickLevel();
            if(skyMeshRef) skyMeshRef.position.copy(camera.position);
            renderer.render(scene, camera);
            R.need = false;
            if(moving){
                R.frames.push(now);
                while(R.frames.length && now - R.frames[0] > 1000) R.frames.shift();
                R.fps = R.frames.length;
                tuneQuality(now);
            }
        } else if(!moving && R.pr !== R.fullPR){
            setPR(R.fullPR); pickLevel(); if(skyMeshRef) skyMeshRef.position.copy(camera.position); renderer.render(scene, camera);
            R.frames.length = 0;
        }
    }

    init();
    requestAnimationFrame(animate);
</script>
</body>
