    let isIntersecting=false, mouseVelocity={x:0,y:0}, lastMousePos={x:0,y:0}, frictionEnabled=false;

    // ═══════════════════════════════════════════════════════════════
    //  PLAYER  —  DRIFT // KINETIC movement, grafted
    // ═══════════════════════════════════════════════════════════════
    const player = {
        pos:  new THREE.Vector3(0, 160, 640),
        vel:  new THREE.Vector3(),
        yaw:  0,
        pitch:-0.10,
        roll: 0,
        boostIntensity: 0,
        shake: 0,
        grounded: false,
    };
    const camTarget = new THREE.Vector3().copy(player.pos);
    let VIEW_MODE = 'orbit';                // 'orbit' | 'first'
    let deckWasOpen = true;                 // deck state to restore when leaving first person
    let currentHFov = M.hFov;

    // ── sticks ──
    const stickL = { on:false, id:null, cx:0, cy:0, dx:0, dy:0 };
    const stickR = { on:false, id:null, cx:0, cy:0, dx:0, dy:0, momX:0, momY:0 };
    let ROPE_ENABLED = true;

    // ── grapple ──
    const grapple = {
        active:false, anchor:new THREE.Vector3(), line:null, length:0,
        flying:false, flyT:0, flyDur:0, pendingRay:false, mode:'hold',
        stiffness:42, phase:0,
    };
    const _ropeDir = new THREE.Vector3();
    const _ropeHitPoint = new THREE.Vector3();

    // ── collision bubble: a small grid of solid cells the worker streams in
    //    around you. The main thread never holds the whole structure.
    const BUB_H = 128;          // half-size of the bubble, world units
    const BUB_REFRESH = 0.35;   // re-centre once predicted position drifts this far (fraction of H)
    const BUB = { ready:false, n:0, c:1, ox:0, oy:0, oz:0, grid:null, center:new THREE.Vector3(), pending:false, id:0, force:false };
    const cellX = wx => Math.floor((wx - BUB.ox)/BUB.c);
    const cellY = wy => Math.floor((wy - BUB.oy)/BUB.c);
    const cellZ = wz => Math.floor((wz - BUB.oz)/BUB.c);
    const wCenterX = c => BUB.ox + (c+0.5)*BUB.c;
    const wCenterY = c => BUB.oy + (c+0.5)*BUB.c;
    const wCenterZ = c => BUB.oz + (c+0.5)*BUB.c;
    function solidAtWorld(wx, wy, wz){
        if(!BUB.ready) return 0;
        const x = cellX(wx), y = cellY(wy), z = cellZ(wz), n = BUB.n;
        if(x<0 || y<0 || z<0 || x>=n || y>=n || z>=n) return 0;
        return BUB.grid[(y*n + z)*n + x];
    }
    const _pred = new THREE.Vector3();
    function maintainBubble(){
        if(BUB.pending || !lastMsg || !lastMsg.cubes) return;
        _pred.copy(player.pos).addScaledVector(player.vel, 0.25);   // aim ahead of where you're going
        if(BUB.ready && !BUB.force && _pred.distanceTo(BUB.center) < BUB_H*BUB_REFRESH) return;
        BUB.pending = true; BUB.force = false; BUB.id++;
        worker.postMessage({ type:'bubble', id:BUB.id, cx:_pred.x, cy:_pred.y, cz:_pred.z, H:BUB_H });
    }
    function onBubble(m){
        if(m.id !== BUB.id) return;
        BUB.pending = false;
        if(!m.ok) return;
        BUB.n = m.n; BUB.c = m.c; BUB.ox = m.ox; BUB.oy = m.oy; BUB.oz = m.oz; BUB.grid = m.grid;
        BUB.center.set(m.cx, m.cy, m.cz); BUB.ready = true;
    }
    // new build: keep colliding against the old grid until the new one lands
    function refreshBubble(){ BUB.force = true; BUB.pending = false; BUB.id++; }

    // ── rope ray: traced in the worker against every real cube, so it can
    //    latch anywhere in reach — including the finest drip. Answer arrives
    //    a frame later; the ground is the fallback, as before.
    let ropeReqId = 0, aimReqId = 0, lastAimT = 0;
    const aim = { kind:'none', dist:0 };        // what the crosshair is over: 'cube' | 'floor' | 'none'
    const _treeO = new THREE.Vector3(), _treeD = new THREE.Vector3();
    let fireTreeT = -1, aimTreeT = -1;
    function fireGrapple(){
        noteBeat('grapple');
        camera.getWorldDirection(_ropeDir);
        _treeO.copy(player.pos); _treeD.copy(_ropeDir);
        fireTreeT = treeRayHit(_treeO, _treeD, M.maxRopeDist);
        ropeReqId++; grapple.pendingRay = true;
        // cast from your body along your look — the same ray the crosshair previews
        worker.postMessage({ type:'ray', tag:'fire', id:ropeReqId,
            ox:player.pos.x, oy:player.pos.y, oz:player.pos.z,
            dx:_ropeDir.x, dy:_ropeDir.y, dz:_ropeDir.z, maxDist:M.maxRopeDist });
        return true;
    }
    // floor fallback: where would the look ray hit the ground, if within reach?
    function floorHit(out){
        camera.getWorldDirection(_ropeDir);
        if(_ropeDir.y >= -1e-4) return -1;
        const t = (WORLD_FLOOR - player.pos.y)/_ropeDir.y;
        if(t < 0 || t > M.maxRopeDist) return -1;
        if(out) out.set(player.pos.x + _ropeDir.x*t, WORLD_FLOOR, player.pos.z + _ropeDir.z*t);
        return t;
    }
    // aim preview: ~10 cheap worker rays a second so the crosshair knows before you tap
    function requestAim(now){
        if(now - lastAimT < 100) return;
        lastAimT = now; aimReqId++;
        camera.getWorldDirection(_ropeDir);
        aimTreeT = treeRayHit(player.pos, _ropeDir, M.maxRopeDist);
        worker.postMessage({ type:'ray', tag:'aim', id:aimReqId,
            ox:player.pos.x, oy:player.pos.y, oz:player.pos.z,
            dx:_ropeDir.x, dy:_ropeDir.y, dz:_ropeDir.z, maxDist:M.maxRopeDist });
    }
    function onRay(m){
        if(m.tag === 'mimic'){ onMimicRay(m); return; }
        if(m.tag === 'bore'){ onBore(m); return; }
        if(m.tag === 'occl'){ onOcclRay(m); return; }
        if(m.tag === 'aim'){
            if(m.id !== aimReqId) return;
            if(m.ok){ aim.kind = 'cube'; aim.dist = m.dist; }
            else { const t = floorHit(null); aim.kind = t >= 0 ? 'floor' : 'none'; aim.dist = t; }
            if(aimTreeT > 0 && (!m.ok || aimTreeT < m.dist)){ aim.kind = 'cube'; aim.dist = aimTreeT; }   // a tree is grabbable too
            paintCrosshair();
            return;
        }
        if(m.id !== ropeReqId || VIEW_MODE === 'orbit') return;
        ropeReqId++; grapple.pendingRay = false;   // consume: a late duplicate can't re-latch
        let dist;
        if(fireTreeT > 0 && (!m.ok || fireTreeT < m.dist)){
            _ropeHitPoint.copy(_treeO).addScaledVector(_treeD, fireTreeT); dist = fireTreeT;   // a tree was nearer
        }
        else if(m.ok){ _ropeHitPoint.set(m.px, m.py, m.pz); dist = m.dist; }
        else {
            dist = floorHit(_ropeHitPoint);
            if(dist < 0){ toast('no rope anchor'); return; }
        }
        releaseGrapple();
        // hook flies out first; the rope only takes load once it lands
        grapple.flying = true; grapple.flyT = 0;
        grapple.flyDur = Math.min(0.3, Math.max(0.06, dist/M.hookSpeed));
        grapple.anchor.copy(_ropeHitPoint);
        buildRopeMesh();
    }
    const xhairEl = document.getElementById('xhair'), xlblEl = document.getElementById('xlbl');
    function paintCrosshair(){
        const locked = grapple.active || grapple.flying;
        xhairEl.classList.toggle('locked', locked && !xhairEl.classList.contains('dig'));
        xhairEl.classList.toggle('cube',  !locked && aim.kind === 'cube');
        xhairEl.classList.toggle('floor', !locked && aim.kind === 'floor');
        xlblEl.textContent = locked ? grapple.mode
                           : aim.kind === 'none' ? '' : `${Math.round(aim.dist)}`;
    }
    function tickHook(dt){
        if(!grapple.flying) return;
        grapple.flyT += dt;
        if(grapple.flyT < grapple.flyDur) return;
        grapple.flying = false; grapple.active = true; grapple.mode = 'stretch';
        grapple.length = Math.max(2.4, player.pos.distanceTo(grapple.anchor)*M.bandRest);   // band starts stretched
        // latch kick: a snap of the view and a small tug toward the anchor
        currentHFov = Math.max(30, currentHFov - 5);
        player.shake = Math.max(player.shake, 0.07);
        _toA.subVectors(grapple.anchor, player.pos).normalize();
        player.vel.addScaledVector(_toA, 10);
        // small cloud where the hook bites
        for(let i=0;i<9;i++){
            _ePos.copy(grapple.anchor).addScaledVector(_toA, -4 - Math.random()*8);
            _eVel.set((Math.random()-0.5)*26, 6 + Math.random()*16, (Math.random()-0.5)*26)
                 .addScaledVector(_toA, -10 - Math.random()*14);
            emitSmoke(_ePos, _eVel, 0.55);
        }
        toast('rope latched');
    }

    // ── rope drawing ──────────────────────────────────────────────
    // The near end is pinned to a wrist point defined in SCREEN space
    // (lower-right), rebuilt from the camera AFTER it moves each frame —
    // so camera lag, shake and FOV kicks can never pull it off you.
    // Drawn as a camera-facing ribbon with constant on-screen width.
    const ROPE_SEG = 14;
    // rope leaves the screen at the height just above the right stick (the one
    // you tap to fire); how far right is the 'rope origin' slider (M.ropeSide)
    const HAND = { x:0.55, y:-0.35 }, HAND_DEPTH = 1.4, HAND_ABOVE_PX = 38;
    function layoutHand(){
        const st = document.getElementById('stage').getBoundingClientRect();
        const r = document.getElementById('joyR').getBoundingClientRect();
        if(!r.width || !st.height) return;
        HAND.x = ((r.left + r.width/2 - st.left)/st.width)*2 - 1;
        HAND.y = 1 - ((r.top - HAND_ABOVE_PX - st.top)/st.height)*2;
    }
    const _hand = new THREE.Vector3(), _tip = new THREE.Vector3();
    const _tan = new THREE.Vector3(), _toCam = new THREE.Vector3(), _side = new THREE.Vector3();
    const _ropePts = Array.from({length:ROPE_SEG+1}, ()=>new THREE.Vector3());
    function buildRopeMesh(){
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((ROPE_SEG+1)*2*3), 3));
        const idx = [];
        for(let i=0;i<ROPE_SEG;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
        geo.setIndex(idx);
        grapple.line = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
            color:0xB8F4D8, transparent:true, opacity:0.92, side:THREE.DoubleSide }));
        grapple.line.frustumCulled = false;
        grapple.line.renderOrder = 2;
        grapple.phase = Math.random()*Math.PI*2;
        scene.add(grapple.line);
    }
    function handPoint(out){
        const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
        out.set(M.ropeSide*tv*camera.aspect*HAND_DEPTH, HAND.y*tv*HAND_DEPTH, -HAND_DEPTH);
        return camera.localToWorld(out);
    }
    function releaseGrapple(){
        grapple.active = false; grapple.flying = false; grapple.pendingRay = false;
        grapple.length = 0; grapple.mode = 'hold';
        if(typeof paintCrosshair === 'function') paintCrosshair();
        if(grapple.line){
            scene.remove(grapple.line);
            grapple.line.geometry.dispose();
            grapple.line.material.dispose();
            grapple.line = null;
        }
    }
    const _ropeSide = new THREE.Vector3();
    function updateRope(dt){
        if(!grapple.line) return;
        handPoint(_hand);
        if(grapple.flying){
            const k = Math.min(1, grapple.flyT/grapple.flyDur), e = 1 - (1-k)*(1-k);
            _tip.copy(_hand).lerp(grapple.anchor, e);
        } else _tip.copy(grapple.anchor);
        const dx = _tip.x - _hand.x, dy = _tip.y - _hand.y, dz = _tip.z - _hand.z;
        const len = Math.hypot(dx,dy,dz) || 1;
        _ropeSide.set(-dz/len, 0, dx/len);
        if(_ropeSide.lengthSq() < 1e-5) _ropeSide.set(1,0,0); else _ropeSide.normalize();
        // a held rope hangs a little; a reeling rope goes taut
        const slackK = grapple.mode === 'slack' ? 1.4 : 0.15;     // stretched band runs taut
        const sway = Math.min(20, player.vel.length()*0.018);
        for(let i=0;i<=ROPE_SEG;i++){
            const t = i/ROPE_SEG, bell = Math.sin(Math.PI*t);
            const sag = bell*Math.min(12, len*0.045)*slackK;
            const rubber = bell*(0.55 + 0.45*Math.sin(grapple.phase + t*9))*sway;
            _ropePts[i].set(_hand.x + dx*t + _ropeSide.x*rubber,
                            _hand.y + dy*t - sag + rubber*0.18,
                            _hand.z + dz*t + _ropeSide.z*rubber);
        }
        const a = grapple.line.geometry.attributes.position.array;
        for(let i=0;i<=ROPE_SEG;i++){
            const p = _ropePts[i];
            _tan.subVectors(_ropePts[Math.min(ROPE_SEG,i+1)], _ropePts[Math.max(0,i-1)]);
            _toCam.subVectors(camera.position, p);
            const camD = _toCam.length();
            _side.crossVectors(_tan, _toCam);
            if(_side.lengthSq() < 1e-10) _side.set(1,0,0); else _side.normalize();
            const w = M.ropeWidth*camD*(i === 0 ? 1.5 : 1);    // constant on-screen width
            const o = i*6;
            a[o]   = p.x + _side.x*w; a[o+1] = p.y + _side.y*w; a[o+2] = p.z + _side.z*w;
            a[o+3] = p.x - _side.x*w; a[o+4] = p.y - _side.y*w; a[o+5] = p.z - _side.z*w;
        }
        grapple.line.geometry.attributes.position.needsUpdate = true;
        grapple.phase += 7.2*dt;
    }

    // ── reusables ──
    const _UP = new THREE.Vector3(0,1,0);
    const _mv = new THREE.Vector3();
    const _fwd = new THREE.Vector3();
    const _toA = new THREE.Vector3();
    const _swingSide = new THREE.Vector3(), _pull = new THREE.Vector3();
    // wall run: n = the wall's outward normal (axis-aligned — the structure is cubes)
    const wall = { on:false, nx:0, nz:0, t:0, coyote:0, cnx:0, cnz:0, cool:0 };
    const _rgt = new THREE.Vector3(), _intent = new THREE.Vector3();
    const knobLEl = document.getElementById('knobL');
    let _lastBoost = null;

    // ── physics: pure DRIFT feel, floor + soft bounds instead of voxel grid ──
    function physics(dt){
        if(dt <= 0) return;
        maintainBubble();
        // first ground grid still in flight — hold still rather than fall through it
        // (with nothing built there is nothing to collide with, so fly on)
        if(!BUB.ready && lastMsg && lastMsg.cubes) return;
        tickHook(dt);
        const _prevY = player.pos.y;
        player.vel.y += M.gravity*dt*(wall.on ? M.wallRunGravity : 1);

        // left stick → yaw-relative horizontal acceleration
        let mx = 0, mz = 0;
        if(stickL.on){ mx = stickL.dx; mz = stickL.dy; }
        _mv.set(mx, 0, mz);
        if(_mv.lengthSq() > 1) _mv.normalize();
        _mv.applyAxisAngle(_UP, player.yaw);
        player.vel.x += _mv.x*M.accelAir*dt;
        player.vel.z += _mv.z*M.accelAir*dt;

        // banking roll from lateral velocity
        const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
        const sideSpeed = player.vel.x*fwdZ - player.vel.z*fwdX;
        let targetRoll = THREE.MathUtils.clamp(sideSpeed*M.rollScale, -M.rollMax, M.rollMax);
        if(wall.on){
            // lean away from the wall: wall on your left → tilt right, and vice versa
            const side = wall.nx*Math.cos(player.yaw) - wall.nz*Math.sin(player.yaw);
            targetRoll = -Math.sign(side)*M.wallTilt;
        }
        player.roll = THREE.MathUtils.lerp(player.roll, targetRoll, 0.12);

        // forward-push cone → boost along look vector
        player.boostIntensity = 0;
        if(stickL.on){
            const mag = Math.hypot(stickL.dx, stickL.dy);
            if(mag > 0.05 && (-stickL.dy/mag) > M.boostCone) player.boostIntensity = (-stickL.dy/mag)*mag;
        }
        if(player.boostIntensity > 0){
            const cp = Math.cos(player.pitch);
            _fwd.set(-Math.sin(player.yaw)*cp, Math.sin(player.pitch), -Math.cos(player.yaw)*cp);
            player.vel.addScaledVector(_fwd, M.boostAccel*player.boostIntensity*dt);
        }
        const boosting = player.boostIntensity > 0.05;
        if(boosting !== _lastBoost){ knobLEl.classList.toggle('boost', boosting); _lastBoost = boosting; }

        // rope constraint
        if(grapple.active){
            _toA.subVectors(grapple.anchor, player.pos);
            const dist = _toA.length();
            if(dist > M.maxRopeDist*1.35){
                releaseGrapple();
            } else {
                _toA.multiplyScalar(1/Math.max(dist, 1e-6));

                // side-to-side swing steering: perpendicular to rope, so left/right
                // pumps the swing regardless of camera yaw
                if(stickL.on && Math.abs(stickL.dx) > 0.05){
                    _swingSide.set(-_toA.z, 0, _toA.x);
                    if(_swingSide.lengthSq() > 1e-5){
                        _swingSide.normalize();
                        player.vel.addScaledVector(_swingSide, stickL.dx*M.swingAccel*dt);
                    }
                }
                // ── rubber band ─────────────────────────────────────────
                // A pure spring and nothing else: no brakes, no fade, no auto-release.
                // Pull grows with stretch (linear + quadratic), so drawing it back
                // stores a lot and letting go LAUNCHES you. No velocity is killed, so
                // sideways speed survives and the pull bends you into an arc.
                const stretch = dist - grapple.length;
                if(stretch > 0){
                    grapple.mode = 'stretch';
                    _pull.copy(_toA).addScaledVector(_UP, M.bandLift).normalize();
                    const f = Math.min(M.bandMaxPull, M.bandK*stretch + M.bandSnap*stretch*stretch);
                    player.vel.addScaledVector(_pull, f*dt);
                    // damp only the in/out motion so it doesn't yo-yo forever; the swing stays
                    const radial = player.vel.dot(_toA);
                    player.vel.addScaledVector(_toA, -radial*(1 - Math.exp(-M.bandDamp*dt)));
                } else grapple.mode = 'slack';
            }
        }

        // drag
        player.vel.x *= Math.exp(-M.airDrag*dt);
        player.vel.z *= Math.exp(-M.airDrag*dt);
        player.vel.y *= Math.exp(-M.airDrag*0.12*dt);

        // clamp
        const spd = player.vel.length();
        // sprung: top speed is raised so the launch isn't clamped, then eases back after release
        if(grapple.active) player.over = 1;
        else player.over = Math.max(0, (player.over || 0) - dt/Math.max(0.1, M.bandOverT));
        const vmax = M.maxSpeed*(1 + (M.bandOver - 1)*(player.over || 0));
        if(spd > vmax) player.vel.multiplyScalar(vmax/spd);

        // swept, sub-stepped collision against the bubble — DRIFT K·13·3's
        // resolver, with the bubble's cell size standing in for DRIFT's block
        const r = M.radius, C = BUB.c;
        let impact = 0, grounded = false;
        const travel = player.vel.length()*dt;
        const steps = Math.max(1, Math.min(12, Math.ceil(travel/(C*M.collisionStep))));
        const hdt = dt/steps;
        for(let sub=0; sub<steps; sub++){
            const ox = player.pos.x, oy = player.pos.y, oz = player.pos.z;
            const vx = player.vel.x, vy = player.vel.y, vz = player.vel.z;
            const nx = ox + vx*hdt, lx = nx + Math.sign(vx)*r;
            if(solidAtWorld(lx, oy, oz)){
                impact = Math.max(impact, Math.abs(vx));
                const c = cellX(lx);
                player.pos.x = vx>0 ? wCenterX(c) - C*0.5 - r : wCenterX(c) + C*0.5 + r;
                if(vx>0) player.vel.x = Math.min(0, player.vel.x); else if(vx<0) player.vel.x = Math.max(0, player.vel.x);
            } else player.pos.x = nx;
            const nz = oz + vz*hdt, lz = nz + Math.sign(vz)*r;
            if(solidAtWorld(player.pos.x, oy, lz)){
                impact = Math.max(impact, Math.abs(vz));
                const c = cellZ(lz);
                player.pos.z = vz>0 ? wCenterZ(c) - C*0.5 - r : wCenterZ(c) + C*0.5 + r;
                if(vz>0) player.vel.z = Math.min(0, player.vel.z); else if(vz<0) player.vel.z = Math.max(0, player.vel.z);
            } else player.pos.z = nz;
            const ny = oy + vy*hdt, ly = ny + Math.sign(vy)*r;
            if(solidAtWorld(player.pos.x, ly, player.pos.z)){
                impact = Math.max(impact, Math.abs(vy));
                const c = cellY(ly);
                if(vy>0) player.pos.y = wCenterY(c) - C*0.5 - r;
                else { player.pos.y = wCenterY(c) + C*0.5 + r; grounded = true; }
                if(vy>0) player.vel.y = Math.min(0, player.vel.y); else if(vy<0) player.vel.y = Math.max(0, player.vel.y);
            } else player.pos.y = ny;
            if(player.pos.y < r + WORLD_FLOOR){
                impact = Math.max(impact, Math.abs(player.vel.y));
                player.pos.y = r + WORLD_FLOOR;
                if(player.vel.y < 0) player.vel.y = 0;
                grounded = true;
            }
        }
        player.grounded = grounded;
        collideTrees(_prevY);

        // ── wall run ─────────────────────────────────────────────
        // Airborne, brushing a wall, moving along it fast enough → you catch it:
        // gravity eases, you hug the wall, the camera leans away. It runs out
        // after wallRunTime. Landing resets it.
        if(wall.cool > 0) wall.cool -= dt;
        if(wall.coyote > 0) wall.coyote -= dt;
        if(grounded){ wall.t = 0; }
        const px = player.pos.x, py = player.pos.y, pz = player.pos.z;
        // contact within about a cube and a half: recessed windows don't break the run
        const reach = r + Math.max(0.9, BUB.c*1.5);
        const hit = (dx,dz)=>{ for(let t=r+0.9; t<=reach+1e-6; t+=Math.max(0.5,BUB.c*0.5)) if(solidAtWorld(px+dx*t,py,pz+dz*t)) return true; return false; };
        let bx = 0, bz = 0;
        if(hit(1,0)) bx = -1; else if(hit(-1,0)) bx = 1;
        if(hit(0,1)) bz = -1; else if(hit(0,-1)) bz = 1;
        // pick the wall you're running ALONG (most speed parallel to it), not one you're flying into
        let wnx = 0, wnz = 0, along = 0;
        if(bx && Math.abs(player.vel.z) > along){ wnx = bx; wnz = 0; along = Math.abs(player.vel.z); }
        if(bz && Math.abs(player.vel.x) > along){ wnx = 0; wnz = bz; along = Math.abs(player.vel.x); }
        const canRun = !grounded && (wnx || wnz) && along > M.wallRunMinSpeed && wall.cool <= 0 && wall.t < M.wallRunTime;
        if(canRun){
            if(!wall.on){ player.vel.y = Math.max(player.vel.y*0.3, 0); }   // catching the wall kills the fall
            if(wall.nx !== wnx || wall.nz !== wnz) wall.t = 0;             // new wall, fresh run
            wall.on = true; wall.nx = wnx; wall.nz = wnz; wall.t += dt;
            // remove motion into the wall, then pull gently toward it to hug it
            const into = player.vel.x*wnx + player.vel.z*wnz;
            if(into < 0){ player.vel.x -= into*wnx; player.vel.z -= into*wnz; }
            player.vel.x -= wnx*M.wallStick*dt; player.vel.z -= wnz*M.wallStick*dt;
            // contour: a bump just ahead along the run → step out around it (up to 3 cubes)
            // instead of slamming into window frames and ledges
            const tx = wnz !== 0 ? Math.sign(player.vel.x) : 0, tz = wnx !== 0 ? Math.sign(player.vel.z) : 0;
            const ahead = r + Math.max(1, along*dt*2);
            if(solidAtWorld(px+tx*ahead, py, pz+tz*ahead)){
                for(let k=1;k<=3;k++){
                    const ox = wnx*k*BUB.c, oz = wnz*k*BUB.c;
                    if(!solidAtWorld(px+ox+tx*ahead, py, pz+oz+tz*ahead) && !solidAtWorld(px+ox, py, pz+oz)){
                        player.pos.x += ox; player.pos.z += oz; break;
                    }
                }
            }
        } else if(wall.on){
            wall.on = false; wall.coyote = 0.2; wall.cnx = wall.nx; wall.cnz = wall.nz;   // brief grace to still jump
        }

        // world limits follow the forest: its edge (plus margin) and above its tallest tree
        const BOUND = Math.max(3500, CFG.forestSize/2 + 300);
        const CEIL = Math.max(2400, forest.tallest + 600);
        if(Math.abs(player.pos.x) > BOUND){ player.pos.x = Math.sign(player.pos.x)*BOUND; player.vel.x = 0; }
        if(Math.abs(player.pos.z) > BOUND){ player.pos.z = Math.sign(player.pos.z)*BOUND; player.vel.z = 0; }
        if(player.pos.y > CEIL){ player.pos.y = CEIL; if(player.vel.y > 0) player.vel.y = 0; }

        if(impact > M.crashSpeed) player.shake = Math.min(0.32, impact/(M.crashSpeed*7));
        player.shake = Math.max(0, player.shake - dt*5.5);
        document.getElementById('impact-fx').classList.toggle('on', player.shake > 0.05);
    }

    // ── camera: lag, banking roll, FOV expansion, shake ──
    // any touch while wall running (or just after): jump straight out from the wall
    function wallJump(){
        let nx, nz;
        if(wall.on){ nx = wall.nx; nz = wall.nz; }
        else if(wall.coyote > 0){ nx = wall.cnx; nz = wall.cnz; }
        else return false;
        player.vel.x += nx*M.wallJumpOut;
        player.vel.z += nz*M.wallJumpOut;
        player.vel.y += M.wallJumpUp;
        wall.on = false; wall.coyote = 0; wall.t = 0; wall.cool = 0.25;   // no instant re-grab of the same wall
        noteBeat('wallJump'); fxHit(0.5);
        player.shake = Math.max(player.shake, 0.04);
        return true;
    }

    function updateCamera(dt){
        // right stick → look. Same frame-rate-tied feel as DRIFT.
        if(stickR.on){
            player.yaw   -= stickR.dx*M.stickSens;
            player.pitch -= stickR.dy*M.stickSens;
        } else if(Math.abs(stickR.momX) > 0.001 || Math.abs(stickR.momY) > 0.001){
            stickR.momX *= 0.9; stickR.momY *= 0.9;
            player.yaw   -= stickR.momX*M.stickSens;
            player.pitch -= stickR.momY*M.stickSens;
        }
        const lim = Math.PI/2 - 0.02;
        if(player.pitch >  lim) player.pitch =  lim;
        if(player.pitch < -lim) player.pitch = -lim;

        camTarget.lerp(player.pos, 1 - Math.exp(-dt/Math.max(0.02, M.camLag)));

        {
            camera.position.copy(camTarget);
            camera.position.y += M.eyeOffset;
            if(player.shake > 0.01){
                camera.position.x += (Math.random()-0.5)*player.shake*1.8;
                camera.position.y += (Math.random()-0.5)*player.shake*1.8;
            }
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;
            camera.rotation.z = player.roll;
        }

        // FOV expansion on boost
        // widen with speed as well as boost — the faster you go, the wider it opens
        const spdK = Math.min(1, Math.max(0, (player.vel.length() - M.speedFovStart)/Math.max(1, M.maxSpeed - M.speedFovStart)));
        const want = Math.max(player.boostIntensity > 0.05 ? M.hFovMax : M.hFov,
                              M.hFov + (M.hFovMax - M.hFov)*spdK*M.speedFov);
        const rate = want > currentHFov ? M.fovExpandRate : M.fovRecoverRate;
        currentHFov += (want - currentHFov)*Math.min(1, rate*dt*6);
        camera.fov = fovFor(Math.max(25, currentHFov + fxFovAdd()));
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld();      // the rope's hand point is read from this right after
    }

    // Same perspective in portrait and landscape: the FOV sliders are tuned as
    // the portrait vertical angle, and what's held constant is the angle across
    // the SHORT side of the screen. Rotating the phone keeps everything the same
    // size; landscape just shows more to the sides instead of zooming in.
    function fovFor(deg){
        const a = camera.aspect;
        const halfTan = Math.tan(THREE.MathUtils.degToRad(deg)/2) * Math.min(1, 1/a);
        return THREE.MathUtils.radToDeg(2*Math.atan(halfTan));
    }
    function applyFov(){
        if(M.hFovMax < M.hFov) M.hFovMax = M.hFov;
        currentHFov = M.hFov;
        camera.fov = fovFor(M.hFov);
        camera.updateProjectionMatrix();
    }

    // ═══════════════════════════════════════════════════════════════
    //  TOUCH  —  DRIFT dual-stick. Bounds-checked, not element-checked.
    // ═══════════════════════════════════════════════════════════════
    const KNOB_TRAVEL = 50;
    const TAP_MS = 220, TAP_SLOP = 12;   // a tap: shorter than this, moving less than this many px
    const INPUT_RADIUS = 68;
    function joyBounds(el){
        const r = el.getBoundingClientRect();
        return { cx:r.left + r.width/2, cy:r.top + r.height/2, r: r.width/2 + 34 };
    }
    function isUiTarget(t){
        return !!(t && t.closest && (t.closest('#deck') || t.closest('#deck-pull') || t.closest('#hud-ctl') || t.closest('.btn') || t.closest('label') || t.closest('button')));
    }
    function normStick(rawDx, rawDy, curve){
        const R = M.stickRadius;
        const d = Math.hypot(rawDx, rawDy);
        if(d === 0) return { dx:0, dy:0, vx:0, vy:0, mag:0 };
        const cap = Math.min(d, R);
        const lin = cap/R;
        const mag = curve === 1 ? lin : Math.pow(lin, curve);
        return { dx:(rawDx/d)*mag, dy:(rawDy/d)*mag, vx:rawDx/d, vy:rawDy/d, mag:lin };
    }

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [BLADE] FORCE BLADE — DRIFT K·13·3. Swipe anywhere off   ║
    // ║ the sticks → a crescent flies out along your view,       ║
    // ║ rolled to your swipe, cutting the real structure along   ║
    // ║ its path (worker carves; only touched chunks come back). ║
    // ║ A tap with no travel = a straight blade to the surface.  ║
    // ╚══════════════════════════════════════════════════════════╝
    const BLADE = { life:21.35, cooldown:0.01, swipePx:20, trailLife:12, trailWidth:6, range:6120, muzzle:9.8 };
    const blades = [];
    let slashCD = 0, bladeGeoLen = 0, bladeGeo = null, bladeMat = null, carveId = 0, carvesPending = 0, bladeCutTotal = 0;
    const _bPrev = new THREE.Vector3(), _bFwd = new THREE.Vector3();
    function bladeAssets(){
        if(!bladeGeo || bladeGeoLen !== M.bladeLen){
            if(bladeGeo) bladeGeo.dispose();
            const shape = new THREE.Shape();
            shape.moveTo(-1, 0);
            shape.quadraticCurveTo(0, 0.28, 1, 0);
            shape.quadraticCurveTo(0, 0.06, -1, 0);
            bladeGeo = new THREE.ShapeGeometry(shape, 12);
            bladeGeo.scale(M.bladeLen, M.bladeLen, 1);
            bladeGeoLen = M.bladeLen;
        }
        if(!bladeMat) bladeMat = new THREE.MeshBasicMaterial({
            color:0xFFE9D0, transparent:true, opacity:0.92,
            side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });
        return { geo:bladeGeo, mat:bladeMat.clone() };
    }
    function fireForceBlade(angle, target){
        if(slashCD > 0) return false;
        slashCD = BLADE.cooldown;
        noteBeat('carve');   // the blade never slows time
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
        const { geo, mat } = bladeAssets();
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(camera.position).addScaledVector(dir, BLADE.muzzle);
        mesh.lookAt(mesh.position.clone().add(dir));
        mesh.rotateZ(angle);
        mesh.frustumCulled = false;
        scene.add(mesh);
        blades.push({ mesh, dir:dir.clone(), pos:mesh.position.clone(), life:BLADE.life, target:target||null });
        return true;
    }
    // a tap: straight blade that stops at the surface you're looking at
    let boreReqId = 0;
    function fireBore(){
        if(slashCD > 0) return;
        camera.getWorldDirection(_bFwd);
        boreReqId++;
        worker.postMessage({ type:'ray', tag:'bore', id:boreReqId,
            ox:camera.position.x, oy:camera.position.y, oz:camera.position.z,
            dx:_bFwd.x, dy:_bFwd.y, dz:_bFwd.z, maxDist:BLADE.range });
        flashXhair('dig');
    }
    function onBore(m){
        if(m.id !== boreReqId || VIEW_MODE === 'orbit') return;
        camera.getWorldDirection(_bFwd);
        const end = camera.position.clone().addScaledVector(_bFwd, m.ok ? m.dist : BLADE.range);
        fireForceBlade(0, end);
    }
    function trySlash(hist){
        if(slashCD > 0) return;
        const n = hist.length;
        if(n < 2) return;                                   // a tap is not a blade
        const gx = hist[n-1].x - hist[0].x, gy = hist[n-1].y - hist[0].y;
        if(Math.hypot(gx,gy) < BLADE.swipePx) return;       // only a real swipe throws one
        if(fireForceBlade(Math.atan2(gy,gx))) flashXhair('dig');
    }
    // each frame's travel is one capsule sent to the worker — only if it can touch the structure
    function sendCarve(a, b){
        if(!bbox) return;
        const r = M.bladeCut;
        if(Math.max(a.x,b.x)+r < bbox[0] || Math.min(a.x,b.x)-r > bbox[3] ||
           Math.max(a.y,b.y)+r < bbox[1] || Math.min(a.y,b.y)-r > bbox[4] ||
           Math.max(a.z,b.z)+r < bbox[2] || Math.min(a.z,b.z)-r > bbox[5]) return;
        carvesPending++;
        worker.postMessage({ type:'carve', id:++carveId, gen:worldGen, r,
            ax:a.x, ay:a.y, az:a.z, bx:b.x, by:b.y, bz:b.z });
    }
    function stepBlades(dt){
        if(slashCD > 0) slashCD -= dt;
        for(let i=blades.length-1;i>=0;i--){
            const b = blades[i];
            _bPrev.copy(b.pos);
            const spd = M.bladeSpeed;
            if(b.target){
                const remain = b.target.distanceTo(b.pos);
                const step = Math.min(spd*dt, remain);
                if(remain > 1e-4) b.dir.copy(b.target).sub(b.pos).normalize();
                b.pos.addScaledVector(b.dir, step);
            } else b.pos.addScaledVector(b.dir, spd*dt);
            b.mesh.position.copy(b.pos);
            b.life -= dt;
            b.mesh.material.opacity = Math.max(0, 0.92*(b.life/BLADE.life));
            sendCarve(_bPrev, b.pos);
            bladeHitsMasons(_bPrev, b.pos);
            if(b.life <= 0 || (b.target && b.pos.distanceToSquared(b.target) < 0.01)){
                scene.remove(b.mesh); b.mesh.material.dispose(); blades.splice(i,1);
            }
        }
        // DRIFT's '. . . n cut . . .' once the blades are done and the worker has answered
        if(!blades.length && !carvesPending && bladeCutTotal){
            toast('. . . ' + bladeCutTotal.toLocaleString() + ' cut . . .');
            bladeCutTotal = 0;
        }
    }
    function killAllBlades(){
        for(const b of blades){ scene.remove(b.mesh); b.mesh.material.dispose(); }
        blades.length = 0; bladeCutTotal = 0;
    }
    // a carve came back: swap the touched chunks, throw the rubble
    const _seg = new THREE.Vector3();
    function swapChunks(list){
        const fs = meshSets[meshSets.length-1];
        if(!fs || !fs.chunks) return false;
        for(const c of list){
            const old = fs.chunks.get(c.id);
            if(old){ fs.mesh.remove(old.mesh); old.mesh.geometry.dispose(); fs.count -= old.count; fs.chunks.delete(c.id); }
            if(c.count){
                const mm = makeSetMesh(c).mesh; mm.visible = true; fs.mesh.add(mm);
                fs.chunks.set(c.id, { mesh:mm, count:c.count }); fs.count += c.count;
            }
        }
        return true;
    }
    function onCarved(m){
        carvesPending = Math.max(0, carvesPending-1);
        if(!m.ok || m.gen !== worldGen) return;
        if(!swapChunks(m.chunks)) return;
        if(!m.cut) return;
        addWounds(m.debris);
        if(!carvedSinceBuild){ carvedSinceBuild = true; pickLevel(); }
        if(lastMsg) lastMsg.cubes = m.cubes;
        bladeCutTotal += m.cut;
        BUB.force = true;                       // collision picks up the hole next frame
        // rubble: DRIFT's throw — along the swipe, out of the cut, a little up
        _seg.set(m.bx-m.ax, m.by-m.ay, m.bz-m.az);
        const ll = _seg.lengthSq(), R = m.r || 1;
        const dx0 = _seg.x, dy0 = _seg.y, dz0 = _seg.z, L = Math.sqrt(ll) || 1;
        const tx = dx0/L, ty = dy0/L, tz = dz0/L;
        const d = m.debris;
        for(let k=0;k<d.length;k+=7){
            const px = d[k], py = d[k+1], pz = d[k+2];
            let t = ll > 1e-8 ? ((px-m.ax)*dx0 + (py-m.ay)*dy0 + (pz-m.az)*dz0)/ll : 0; t = t<0?0:t>1?1:t;
            const ex = px-(m.ax+dx0*t), ey = py-(m.ay+dy0*t), ez = pz-(m.az+dz0*t);
            const fall = Math.max(0, 1 - Math.sqrt(ex*ex+ey*ey+ez*ez)/R);
            const sp = M.bladeFollow*fall;
            if((k/7 & 1) === 0){                                     // a puff every other cube cut
                _ePos.set(px,py,pz);
                _eVel.set(tx*sp*0.25 + (Math.random()-0.5)*20, 10 + Math.random()*20, tz*sp*0.25 + (Math.random()-0.5)*20);
                emitSmoke(_ePos, _eVel, 0.8, [d[k+4]/255, d[k+5]/255, d[k+6]/255]);
            }
            spawnDebris(px,py,pz, d[k+3], d[k+4],d[k+5],d[k+6],
                tx*sp + ex/R*M.bladeEject*fall + (Math.random()-0.5)*sp*M.bladeSpread,
                ty*sp + ey/R*M.bladeEject*fall + Math.random()*sp*0.35 + 7,
                tz*sp + ez/R*M.bladeEject*fall + (Math.random()-0.5)*sp*M.bladeSpread);
        }
        requestRender();
    }
    function resetWorld(){
        killAllBlades(); clearDebris();
        requestBuild();
        toast('reset');
    }

    // ── swipe trail on the 2D overlay (DRIFT) ──
    const slashTouches = {};
    let slashHistory = [];
    const sc = document.getElementById('slash-canvas');
    const sctx = sc.getContext('2d');
    function sizeSlashCanvas(){ sc.width = innerWidth; sc.height = innerHeight; }
    function drawSlash(){
        for(const p of slashHistory) p.age++;
        const had = slashHistory.length;
        slashHistory = slashHistory.filter(p=>p.age < BLADE.trailLife);
        if(!had) return;
        sctx.clearRect(0,0,sc.width,sc.height);
        if(slashHistory.length < 2) return;
        sctx.shadowBlur = 12; sctx.shadowColor = 'rgba(255,233,208,0.9)'; sctx.lineCap = 'round';
        for(let i=1;i<slashHistory.length;i++){
            const a = slashHistory[i-1], b = slashHistory[i]; if(b.id !== a.id) continue;
            const f = (BLADE.trailLife - b.age)/BLADE.trailLife;
            sctx.beginPath(); sctx.moveTo(a.x,a.y); sctx.lineTo(b.x,b.y);
            sctx.strokeStyle = `rgba(255,240,225,${f})`; sctx.lineWidth = f*BLADE.trailWidth; sctx.stroke();
        }
        sctx.shadowBlur = 0;
    }
    let _xhTimer = 0;
    function flashXhair(cls){ xhairEl.classList.add(cls); _xhTimer = 0.12; }

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [DEBRIS] DRIFT's fixed pool: grid collision, bounce,     ║
    // ║ tumble, settle. Collides with the ground and with the    ║
    // ║ structure inside your collision bubble. Rubble doesn't   ║
    // ║ re-merge into the octree yet — it settles, then shrinks  ║
    // ║ away.                                                    ║
    // ╚══════════════════════════════════════════════════════════╝
    const K = { poolMax:300, debrisG:-8, debrisDrag:0.2, bounce:0.8, friction:3.2, spin:2.6, restSpeed:6, settleTime:1.1, fadeTime:0.35 };
    const bodies = [], freeBody = [];
    let debrisMesh = null;
    const _dm4 = new THREE.Matrix4(), _dq = new THREE.Quaternion(), _dsc = new THREE.Vector3(), _dpv = new THREE.Vector3(), _deul = new THREE.Euler(), _dcol = new THREE.Color();
    function spawnDebris(x,y,z, size, r,g,b, vx,vy,vz){
        if(bodies.length >= K.poolMax){ freeBody.push(bodies[0]); bodies.splice(0,1); }   // oldest retires
        const o = freeBody.pop() || {};
        o.x=x; o.y=y; o.z=z; o.vx=vx; o.vy=vy; o.vz=vz; o.size=size;
        o.r=r/255; o.g=g/255; o.b=b/255;
        o.rx=0; o.ry=0; o.rz=0;
        o.wx=(Math.random()-0.5)*K.spin; o.wy=(Math.random()-0.5)*K.spin; o.wz=(Math.random()-0.5)*K.spin;
        o.rest=0; o.fade=0;
        bodies.push(o);
    }
    function clearDebris(){ while(bodies.length) freeBody.push(bodies.pop()); if(debrisMesh) debrisMesh.count = 0; }
    function stepDebris(dt){
        const dragF = Math.exp(-K.debrisDrag*dt), fricF = Math.exp(-K.friction*dt);
        for(let i=bodies.length-1;i>=0;i--){
            const b = bodies[i], h = b.size*0.42;
            if(b.fade > 0){                                   // settled: shrink away
                b.fade -= dt;
                if(b.fade <= 0){ freeBody.push(b); bodies.splice(i,1); }
                continue;
            }
            b.vy += K.debrisG*dt;
            b.vx *= dragF; b.vz *= dragF; b.vy *= dragF;
            let grounded = false;
            const nx = b.x + b.vx*dt;
            if(solidAtWorld(nx + Math.sign(b.vx)*h, b.y, b.z)){ b.vx = -b.vx*K.bounce; b.wy *= 0.7; } else b.x = nx;
            const nz = b.z + b.vz*dt;
            if(solidAtWorld(b.x, b.y, nz + Math.sign(b.vz)*h)){ b.vz = -b.vz*K.bounce; b.wy *= 0.7; } else b.z = nz;
            const ny = b.y + b.vy*dt;
            if(solidAtWorld(b.x, ny + Math.sign(b.vy)*h, b.z)){
                if(b.vy < 0) grounded = true;
                b.vy = -b.vy*K.bounce;
                if(Math.abs(b.vy) < K.restSpeed) b.vy = 0;
                b.vx *= fricF; b.vz *= fricF;
            } else {
                b.y = ny;
                if(b.y - h <= WORLD_FLOOR + 0.01){
                    b.y = WORLD_FLOOR + h; grounded = true;
                    b.vy = -b.vy*K.bounce;
                    if(Math.abs(b.vy) < K.restSpeed) b.vy = 0;
                    b.vx *= fricF; b.vz *= fricF;
                }
            }
            b.rx += b.wx*dt; b.ry += b.wy*dt; b.rz += b.wz*dt;
            if(grounded){ b.wx *= fricF; b.wy *= fricF; b.wz *= fricF; }
            const sp = Math.abs(b.vx)+Math.abs(b.vy)+Math.abs(b.vz);
            if(grounded && sp < K.restSpeed){ b.rest += dt; if(b.rest >= K.settleTime) b.fade = K.fadeTime; }
            else b.rest = 0;
            if(b.y < -400 || Math.abs(b.x) > 6000 || Math.abs(b.z) > 6000){ freeBody.push(b); bodies.splice(i,1); }
        }
    }
    function drawDebris(){
        if(!debrisMesh){
            debrisMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial(), K.poolMax);
            debrisMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(K.poolMax*3), 3);
            debrisMesh.frustumCulled = false; debrisMesh.count = 0; scene.add(debrisMesh);
        }
        const n = Math.min(bodies.length, K.poolMax);
        for(let i=0;i<n;i++){
            const b = bodies[i];
            const k = b.size*0.92*(b.fade > 0 ? b.fade/K.fadeTime : 1);
            _dsc.set(k,k,k); _dpv.set(b.x,b.y,b.z);
            _deul.set(b.rx,b.ry,b.rz); _dq.setFromEuler(_deul);
            _dm4.compose(_dpv,_dq,_dsc); debrisMesh.setMatrixAt(i,_dm4);
            _dcol.setRGB(b.r,b.g,b.b); debrisMesh.setColorAt(i,_dcol);   // rubble keeps its cube's colour
        }
        debrisMesh.count = n;
        debrisMesh.instanceMatrix.needsUpdate = true;
        debrisMesh.instanceColor.needsUpdate = true;
    }

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [SPECKS] air specks — speed you can see. They hang still ║
    // ║ in a box that wraps around you, so a few hundred cover   ║
    // ║ infinite air. Each is drawn as a streak along your       ║
    // ║ velocity (where it was relative to you a moment ago), so ║
    // ║ they stretch and brighten as you speed up and vanish     ║
    // ║ when you stop. Tinted from the photo, like the sky.      ║
    // ╚══════════════════════════════════════════════════════════╝
    const SPECK_MAX = 1500, SPECK_BOX = 160;
    let speckLines = null, speckPos = null;
    const speckCol = new THREE.Color(0xE8E4DC);
    function initSpecks(){
        speckPos = new Float32Array(SPECK_MAX*3);
        for(let i=0;i<SPECK_MAX;i++){                 // low-discrepancy fill, no clumps
            speckPos[i*3]   = ((i*0.7548776662466927)%1 - 0.5)*SPECK_BOX;
            speckPos[i*3+1] = ((i*0.5698402909980532)%1 - 0.5)*SPECK_BOX;
            speckPos[i*3+2] = ((Math.sin(i*127.1)*43758.5453)%1 + 1)%1*SPECK_BOX - SPECK_BOX/2;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPECK_MAX*6), 3));
        speckLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color:speckCol, transparent:true, opacity:0, depthWrite:false }));
        speckLines.frustumCulled = false; speckLines.renderOrder = 3; speckLines.visible = false;
        scene.add(speckLines);
    }
    function updateSpecks(){
        if(!speckLines) initSpecks();
        const n = Math.min(SPECK_MAX, Math.round(M.specks));
        const sp = player.vel.length();
        const vis = VIEW_MODE !== 'orbit' && n > 0 && sp > M.speckFadeIn*0.5;
        speckLines.visible = vis;
        if(!vis) return;
        const k = Math.min(1, (sp - M.speckFadeIn*0.5)/Math.max(1, M.speckFadeIn));
        speckLines.material.opacity = 0.55*k;
        const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z, H = SPECK_BOX/2;
        const T = M.speckStreak, vx = player.vel.x*T, vy = player.vel.y*T, vz = player.vel.z*T;
        const a = speckLines.geometry.attributes.position.array;
        for(let i=0;i<n;i++){
            const j = i*3;
            // wrap into the box around the camera (the air stays put; the box follows you)
            let x = speckPos[j], y = speckPos[j+1], z = speckPos[j+2];
            x -= Math.round((x-cx)/SPECK_BOX)*SPECK_BOX; y -= Math.round((y-cy)/SPECK_BOX)*SPECK_BOX; z -= Math.round((z-cz)/SPECK_BOX)*SPECK_BOX;
            speckPos[j] = x; speckPos[j+1] = y; speckPos[j+2] = z;
            const o = i*6;
            a[o] = x; a[o+1] = y; a[o+2] = z;
            a[o+3] = x + vx; a[o+4] = y + vy; a[o+5] = z + vz;   // smear: where it sat relative to you a moment ago
        }
        speckLines.geometry.setDrawRange(0, n*2);
        speckLines.geometry.attributes.position.needsUpdate = true;
    }

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [SMOKE] pooled additive puffs behind you — one draw call. ║
    // ║ Rate rises with speed, ×4 on boost, more on the rope.     ║
    // ║ Emitted PAST the camera gap (your fix: the camera lags    ║
    // ║ the body, so a fixed offset drops puffs between the two). ║
    // ║ Unfogged — additive + fog turns puffs into grey smears —  ║
    // ║ and faded by distance to the lens and by life instead.    ║
    // ╚══════════════════════════════════════════════════════════╝
    const particles = [], _pPool = [];
    let pGeo = null, pMat = null, pPoints = null, pAccum = 0;
    const smokeTint = new THREE.Color(0xD9E6F2);
    const _behind = new THREE.Vector3(), _ePos = new THREE.Vector3(), _eVel = new THREE.Vector3();
    function makeSmokeTex(){
        const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
        const cx = cv.getContext('2d');
        const g = cx.createRadialGradient(32,32,0,32,32,32);
        g.addColorStop(0,   'rgba(255,255,255,1)');
        g.addColorStop(0.5, 'rgba(200,215,235,0.4)');
        g.addColorStop(1,   'rgba(160,190,215,0)');
        cx.fillStyle = g; cx.fillRect(0,0,64,64);
        const t = new THREE.CanvasTexture(cv); t.needsUpdate = true; return t;
    }
    function initSmoke(){
        const max = 900;                                  // buffer for the slider's ceiling
        pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(max*3), 3));
        pGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(max*3), 3));
        pGeo.setDrawRange(0,0);
        pMat = new THREE.PointsMaterial({ size:M.smokeSize, map:makeSmokeTex(), vertexColors:true,
            blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity:M.smokeOpacity,
            sizeAttenuation:true, fog:false });
        pPoints = new THREE.Points(pGeo, pMat);
        pPoints.frustumCulled = false; pPoints.renderOrder = 4;
        scene.add(pPoints);
    }
    // col: [r,g,b] 0..1 — a cut puff takes the colour of the cube it came from
    function emitSmoke(pos, vel, lifeMult, col){
        if(particles.length >= M.smokeMax) return;
        const life = (M.lifeMin + Math.random()*(M.lifeMax - M.lifeMin))*(lifeMult || 1);
        const p = _pPool.pop() || { pos:new THREE.Vector3(), vel:new THREE.Vector3(), life:0, maxLife:0, r:1, g:1, b:1 };
        if(col){ p.r = col[0]; p.g = col[1]; p.b = col[2]; }
        else { p.r = smokeTint.r; p.g = smokeTint.g; p.b = smokeTint.b; }
        p.pos.copy(pos);
        p.vel.set(vel.x + (Math.random()-0.5)*M.spread*2,
                  vel.y + Math.random()*M.upDrift + (Math.random()-0.5)*M.spread,
                  vel.z + (Math.random()-0.5)*M.spread*2);
        p.life = p.maxLife = life;
        particles.push(p);
    }
    function clearSmoke(){
        while(particles.length) _pPool.push(particles.pop());
        if(pGeo) pGeo.setDrawRange(0,0);
        pAccum = 0;
    }
    function updateSmoke(dt){
        if(!pPoints) initSmoke();
        const speed = player.vel.length();
        for(let i=particles.length-1;i>=0;i--){
            const p = particles[i];
            p.life -= dt;
            if(p.life <= 0){ _pPool.push(p); particles.splice(i,1); continue; }
            p.pos.addScaledVector(p.vel, dt);
            p.vel.x *= Math.exp(-3.2*dt); p.vel.z *= Math.exp(-3.2*dt);
            p.vel.y *= Math.exp(-2.2*dt); p.vel.y += 2*dt;
        }
        let rate = 0;
        if(speed > 1) rate = M.smokeBase + Math.min(1,(speed-1)/(M.maxSpeed-1))*(M.smokeMaxRate - M.smokeBase);
        if(player.boostIntensity > 0.05) rate *= 4;
        if(grapple.active) rate += M.smokeMaxRate*0.3;
        if(rate > 0 && particles.length < M.smokeMax){
            pAccum += rate*dt;
            _behind.copy(player.vel).normalize().multiplyScalar(-1);
            if(_behind.lengthSq() < 1e-6) _behind.set(0,-1,0);
            // push the emission point past the camera gap so puffs never land in your face
            const backOff = M.smokeBack + player.pos.distanceTo(camera.position)*Math.min(1, speed/80) + speed*0.2;
            while(pAccum >= 1 && particles.length < M.smokeMax){
                pAccum -= 1;
                emitSmoke(_ePos.copy(player.pos).addScaledVector(_behind, backOff + Math.random()*10),
                          _eVel.copy(_behind).multiplyScalar(4 + Math.random()*8));
            }
        }
        const pos = pGeo.attributes.position.array, col = pGeo.attributes.color.array;
        const camP = camera.position, faceR = M.faceRadius;
        for(let i=0;i<particles.length;i++){
            const p = particles[i], i3 = i*3, f = p.life/p.maxLife;
            pos[i3] = p.pos.x; pos[i3+1] = p.pos.y; pos[i3+2] = p.pos.z;
            const fade = faceR > 0 ? Math.min(1, Math.max(0, (p.pos.distanceTo(camP) - faceR*0.4)/(faceR*0.6))) : 1;
            const b = (0.22 + 0.4*f)*fade;   // additive stacks — keep each puff faint
            col[i3] = b*p.r; col[i3+1] = b*p.g; col[i3+2] = b*p.b;
        }
        pGeo.attributes.position.needsUpdate = true;
        pGeo.attributes.color.needsUpdate = true;
        pGeo.setDrawRange(0, particles.length);
    }

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [CORES] five buried in the monument — one behind each     ║
    // ║ face, one at its heart. Invisible until you cut to them;  ║
    // ║ fly into one to claim it. The HUD counts them and points  ║
    // ║ at the nearest.                                           ║
    // ╚══════════════════════════════════════════════════════════╝
    const cores = { list:[], group:null, taken:0, reqId:0 };
    const CORE_COL = new THREE.Color(0x8FE8C8);
    let _coreGeo = null, _coreMat = null, _coreEdge = null, _coreLine = null;
    function coreAssets(){
        if(!_coreGeo){
            _coreGeo = new THREE.BoxGeometry(18,18,18);
            _coreEdge = new THREE.EdgesGeometry(_coreGeo);
            _coreMat = new THREE.MeshBasicMaterial({ color:CORE_COL.clone().convertSRGBToLinear() });
            _coreLine = new THREE.LineBasicMaterial({ color:0xFFFFFF, transparent:true, opacity:0.85 });
        }
    }
    function clearCores(){
        if(cores.group){ scene.remove(cores.group); cores.group = null; }
        cores.list = []; cores.taken = 0;
    }
    function requestCores(){
        if(!lastMsg || !lastMsg.cubes) return;
        cores.reqId++;
        worker.postMessage({ type:'cores', id:cores.reqId, depth:Math.round(M.coreDepth) });
    }
    function onCores(m){
        if(m.id !== cores.reqId || !m.ok) return;
        clearCores();
        coreAssets();
        cores.group = new THREE.Group(); scene.add(cores.group);
        m.cores.forEach((c,i)=>{
            const mesh = new THREE.Mesh(_coreGeo, _coreMat);
            mesh.add(new THREE.LineSegments(_coreEdge, _coreLine));
            mesh.position.set(c[0], c[1], c[2]);
            cores.group.add(mesh);
            cores.list.push({ mesh, pos:mesh.position, taken:false, phase:i*1.3 });
        });
        requestRender(); updateHUD();
    }
    function updateCores(dt, now){
        if(!cores.list.length) return false;
        let busy = false;
        for(const c of cores.list){
            if(c.taken) continue;
            busy = true;
            c.mesh.rotation.y += dt*0.8; c.mesh.rotation.x += dt*0.35;
            const k = 1 + 0.12*Math.sin(now*0.004 + c.phase);
            c.mesh.scale.setScalar(k);
            if(VIEW_MODE !== 'orbit' && player.pos.distanceTo(c.pos) < M.coreRadius) claimCore(c);
        }
        return busy;
    }
    function claimCore(c){
        c.taken = true; cores.group.remove(c.mesh); cores.taken++;
        player.shake = Math.max(player.shake, 0.08);
        for(let i=0;i<26;i++){                       // it bursts in its own colour
            _ePos.copy(c.pos).add(new THREE.Vector3((Math.random()-0.5)*26,(Math.random()-0.5)*26,(Math.random()-0.5)*26));
            _eVel.set((Math.random()-0.5)*70, 20+Math.random()*50, (Math.random()-0.5)*70);
            emitSmoke(_ePos, _eVel, 1.3, [CORE_COL.r, CORE_COL.g, CORE_COL.b]);
        }
        const left = cores.list.length - cores.taken;
        toast(left ? `core ${cores.taken}/${cores.list.length}` : 'all cores — the monument is hollow');
        updateHUD(); requestRender();
    }
    const nearestCore = () => {
        let d = Infinity;
        for(const c of cores.list) if(!c.taken) d = Math.min(d, player.pos.distanceTo(c.pos));
        return d;
    };

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [MASONS] they heal the monument. Every cube you cut is a  ║
    // ║ wound; masons fly from the forest edge carrying a stone   ║
    // ║ in the wound's colour, lay a batch of cubes back, and     ║
    // ║ return for more — freshest wounds first, so they converge ║
    // ║ on wherever you're digging. Your blade knocks a mason's   ║
    // ║ stone loose: it falls as rubble, those cubes go back on   ║
    // ║ the list, and the mason reels before fetching another.    ║
    // ║ They never hurt you. They pass through stone.             ║
    // ╚══════════════════════════════════════════════════════════╝
    const WOUND_MAX = 4000;
    const wounds = [];                                  // {x,y,z,r,g,b,t,taken}
    const masons = [];
    let masonGeo = null, masonMat = null, eyeMat = null, stoneGeo = null, restoreId = 0;
    function addWounds(d){
        const now = performance.now();
        for(let k=0;k<d.length;k+=7) wounds.push({ x:d[k], y:d[k+1], z:d[k+2], r:d[k+4], g:d[k+5], b:d[k+6], t:now, taken:null });
        if(wounds.length > WOUND_MAX) wounds.splice(0, wounds.length - WOUND_MAX);   // oldest scars stay
    }
    function clearWounds(){ wounds.length = 0; for(const m of masons){ m.batch = null; m.zone = null; m.state = 'home'; } }
    function masonAssets(){
        if(masonGeo) return;
        masonGeo = new THREE.BoxGeometry(11, 7, 11);
        masonMat = new THREE.MeshLambertMaterial({ color:0x2A262B });
        eyeMat = new THREE.MeshBasicMaterial({ color:new THREE.Color(0xFFB347).convertSRGBToLinear() });
        stoneGeo = new THREE.BoxGeometry(7, 7, 7);
    }
    function homePoint(i, n){
        const a = (i/Math.max(1,n))*Math.PI*2 + 0.4, r = forest.clearR*0.92;
        return new THREE.Vector3(Math.sin(a)*r, WORLD_FLOOR + 40, Math.cos(a)*r);
    }
    function makeMason(i){
        masonAssets();
        const g = new THREE.Group();
        g.add(new THREE.Mesh(masonGeo, masonMat));
        const eye = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 1.2), eyeMat); eye.position.set(0, 0.6, -5.8); g.add(eye);
        const stone = new THREE.Mesh(stoneGeo, new THREE.MeshLambertMaterial({ color:0xffffff }));
        stone.position.set(0, -8, 0); stone.visible = false; g.add(stone);
        const home = homePoint(i, Math.round(M.masons));
        g.position.copy(home);
        scene.add(g);
        return { g, stone, home, state:'home', batch:null, zone:null, site:new THREE.Vector3(), timer:0, spin:0, bob:Math.random()*6 };
    }
    function syncMasonCount(){
        const want = Math.round(M.masons);
        while(masons.length > want){ const m = masons.pop(); releaseBatch(m); scene.remove(m.g); }
        while(masons.length < want) masons.push(makeMason(masons.length));
        masons.forEach((m,i)=>m.home.copy(homePoint(i, want)));
    }
    function releaseBatch(m){ if(m.batch){ for(const w of m.batch) w.taken = null; m.batch = null; } m.stone.visible = false; }
    // A mason commits to a ZONE: it keeps fetching stones for the wounds around
    // one spot until every one is closed, then picks the freshest new zone.
    // New cuts inside a zone being worked just join that job.
    function claimBatch(m){
        const R2 = M.masonZone*M.masonZone;
        const pick = (cx, cy, cz)=>{
            const near = [];
            for(const w of wounds){
                if(w.taken) continue;
                const d = (w.x-cx)**2 + (w.y-cy)**2 + (w.z-cz)**2;
                if(d < R2) near.push([d, w]);
            }
            near.sort((a,b)=>a[0]-b[0]);
            return near.slice(0, Math.max(1, Math.round(M.masonBatch))).map(x=>x[1]);
        };
        let batch = [];
        if(m.zone){
            batch = pick(m.zone.x, m.zone.y, m.zone.z);
            // zone finished only when nothing in it is open — including stones other masons are carrying there
            if(!batch.length){
                const stillOpen = wounds.some(w => (w.x-m.zone.x)**2 + (w.y-m.zone.y)**2 + (w.z-m.zone.z)**2 < R2);
                if(stillOpen) return null;                 // others are finishing it; wait at home
                m.zone = null;
            }
        }
        if(!m.zone){
            let seed = null;
            for(let i=wounds.length-1;i>=0;i--){ if(!wounds[i].taken){ seed = wounds[i]; break; } }
            if(!seed) return null;
            m.zone = new THREE.Vector3(seed.x, seed.y, seed.z);
            batch = pick(seed.x, seed.y, seed.z);
        }
        if(!batch.length) return null;
        for(const w of batch) w.taken = m;
        return batch;
    }
    const _masV = new THREE.Vector3(), _masL = new THREE.Vector3();
    function flyTo(m, target, dt){
        _masV.subVectors(target, m.g.position);
        const d = _masV.length(), step = M.masonSpeed*dt;
        if(d > 1e-3){
            m.g.position.addScaledVector(_masV, Math.min(1, step/d));
            _masL.copy(m.g.position).addScaledVector(_masV, -1);          // face along the path
            m.g.lookAt(_masL.x, m.g.position.y, _masL.z);
        }
        return d <= step + 0.5;
    }
    function layBatch(m){
        const live = m.batch.filter(w => wounds.includes(w));
        if(live.length){
            const cells = [];
            for(const w of live) cells.push(w.x, w.y, w.z, w.r, w.g, w.b);
            worker.postMessage({ type:'restore', id:++restoreId, gen:worldGen, cells });
            for(const w of live){ const i = wounds.indexOf(w); if(i >= 0) wounds.splice(i, 1); }
            const w0 = live[0];
            for(let i=0;i<6;i++){                        // a little dust as the stone settles
                _ePos.set(w0.x + (Math.random()-0.5)*14, w0.y + (Math.random()-0.5)*14, w0.z + (Math.random()-0.5)*14);
                _eVel.set((Math.random()-0.5)*16, 6 + Math.random()*10, (Math.random()-0.5)*16);
                emitSmoke(_ePos, _eVel, 0.6, [w0.r/255, w0.g/255, w0.b/255]);
            }
        }
        m.batch = null; m.stone.visible = false;
    }
    function onRestored(m){
        if(!m.ok || m.gen !== worldGen) return;
        swapChunks(m.chunks);
        if(lastMsg) lastMsg.cubes = m.cubes;
        BUB.force = true;                                // the patch is solid again for you too
        requestRender();
    }
    // the blade clips a mason: its stone falls, the cubes go back on the list, it reels
    const _seg2 = new THREE.Vector3();
    function bladeHitsMasons(a, b){
        for(const m of masons){
            if(m.state === 'stunned') continue;
            _seg2.subVectors(b, a);
            const ll = _seg2.lengthSq();
            let t = ll > 1e-8 ? _masV.subVectors(m.g.position, a).dot(_seg2)/ll : 0; t = Math.max(0, Math.min(1, t));
            _masL.copy(a).addScaledVector(_seg2, t);
            if(_masL.distanceTo(m.g.position) > M.masonHitR) continue;
            if(m.batch){
                const w0 = m.batch[0];
                spawnDebris(m.g.position.x, m.g.position.y - 8, m.g.position.z, 7, w0.r, w0.g, w0.b,
                    (Math.random()-0.5)*60, 20 + Math.random()*20, (Math.random()-0.5)*60);
                releaseBatch(m);
            }
            for(let i=0;i<10;i++){
                _ePos.copy(m.g.position).add(_masL.set((Math.random()-0.5)*12, (Math.random()-0.5)*12, (Math.random()-0.5)*12));
                _eVel.set((Math.random()-0.5)*40, 10 + Math.random()*20, (Math.random()-0.5)*40);
                emitSmoke(_ePos, _eVel, 0.7);
            }
            m.state = 'stunned'; m.timer = M.masonStun; m.spin = 9;
        }
    }
    function updateMasons(dt, now){
        if(masons.length !== Math.round(M.masons)) syncMasonCount();
        let busy = false;
        for(const m of masons){
            m.bob += dt*2.2;
            switch(m.state){
                case 'home': {                           // idle at the forest edge until there's work
                    flyTo(m, m.home, dt);
                    if(wounds.length){
                        m.batch = claimBatch(m);
                        if(m.batch){
                            const w0 = m.batch[0];
                            m.stone.material.color.setRGB(w0.r/255, w0.g/255, w0.b/255);
                            m.stone.visible = true;
                            m.site.set(w0.x, w0.y, w0.z);
                            m.state = 'toSite';
                        }
                    }
                    break;
                }
                case 'toSite': busy = true;
                    if(!m.batch){ m.state = 'home'; break; }
                    if(flyTo(m, m.site, dt)){ m.state = 'lay'; m.timer = M.masonLay; }
                    break;
                case 'lay': busy = true;
                    m.timer -= dt;
                    if(!m.batch){ m.state = 'home'; break; }
                    if(m.timer <= 0){ layBatch(m); m.state = 'home'; }
                    break;
                case 'stunned': busy = true;
                    m.timer -= dt; m.spin *= Math.exp(-1.2*dt);
                    m.g.rotation.y += m.spin*dt; m.g.rotation.z = Math.sin(m.timer*9)*0.35;
                    m.g.position.y -= 18*dt;
                    if(m.g.position.y < WORLD_FLOOR + 8) m.g.position.y = WORLD_FLOOR + 8;
                    if(m.timer <= 0){ m.g.rotation.z = 0; m.state = 'home'; }
                    break;
            }
            if(m.state !== 'stunned') m.g.position.y += Math.sin(m.bob)*0.12;   // gentle hover
            if(m.state !== 'home' || m.g.position.distanceTo(m.home) > 2) busy = true;
        }
        return busy;
    }
    function clearMasons(){ for(const m of masons){ releaseBatch(m); scene.remove(m.g); } masons.length = 0; }

    // ╔══════════════════════════════════════════════════════════╗
    // ║ [WATCHERS] quantum, like Outer Wilds' rocks: the moment   ║
    // ║ one is unobserved — off-screen, or hidden behind a trunk  ║
    // ║ or the monument — it relocates, always to somewhere you   ║
    // ║ aren't looking, never where you last saw it. Staggered:   ║
    // ║ one far in the fog, one at middle distance, one near the  ║
    // ║ monument. Clearly seen, they're frozen; deep in the fog   ║
    // ║ you can catch them drifting. Eyes glow through the haze.  ║
    // ╚══════════════════════════════════════════════════════════╝
    const watchers = [];
    const WATCH_DARK = 0x26222A, WATCH_SHADE = 0x3A333C;
    let _wEye = null, _wPale = null;
    const wMat = hex => new THREE.MeshLambertMaterial({ color:new THREE.Color(hex).convertSRGBToLinear(), flatShading:true });
    function watcherAssets(){
        if(_wEye) return;
        // eyes ignore fog: pinpoints that stay lit however deep in the haze the body is
        _wEye  = new THREE.MeshBasicMaterial({ color:new THREE.Color(0xFFB347).convertSRGBToLinear(), fog:false });
        _wPale = new THREE.MeshBasicMaterial({ color:new THREE.Color(0xE9E2D6).convertSRGBToLinear() });
    }
    const wBox = (w,h,d,m,x,y,z,parent)=>{ const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m); b.position.set(x,y,z); parent.add(b); return b; };
    function makeStag(){
        const g = new THREE.Group(), m = wMat(WATCH_DARK), m2 = wMat(WATCH_SHADE);
        for(const [x, z] of [[-60,-40],[60,-40],[-50,50],[50,50]]){
            const l = new THREE.Mesh(new THREE.CylinderGeometry(9, 16, 1150, 7), m); l.position.set(x, 575, z); l.rotation.z = x*0.0009; g.add(l);
        }

    // slot 0 far (in the fog), 1 middle, 2 near the monument
    function watcherSpot(slot, avoidVisible){
        const fogBand = r => CFG.fogNear + r*(CFG.fogFar - CFG.fogNear);
        const BOUND = Math.max(3500, CFG.forestSize/2 + 300) - 200;
        for(let tries=0; tries<40; tries++){
            let x, z;
            if(slot === 2){
                const a = Math.random()*Math.PI*2, r = forest.clearR*M.watchNearMon*(0.95 + Math.random()*0.15);
                x = Math.sin(a)*r; z = Math.cos(a)*r;
            } else {
                const d = fogBand(slot === 0 ? M.watchFar : M.watchMid)*(0.92 + Math.random()*0.16);
                const a = Math.random()*Math.PI*2;
                x = player.pos.x + Math.sin(a)*d; z = player.pos.z + Math.cos(a)*d;
                if(Math.abs(x) > BOUND || Math.abs(z) > BOUND) continue;
            }
            if(bbox && x > bbox[0]-150 && x < bbox[3]+150 && z > bbox[2]-150 && z < bbox[5]+150) continue;   // never inside the monument
            if(avoidVisible && inView(x, 1000, z)) continue;     // never land where you're looking
            return new THREE.Vector3(x, WORLD_FLOOR, z);
        }
        if(!avoidVisible) return null;
        // every open spot is in view: go where you can't look — behind the monument
        // from where you stand (it hides them), or for the far ones, straight behind you
        const cx = camera.position.x, cz = camera.position.z;
        if(slot === 2){
            const away = new THREE.Vector3(-cx, 0, -cz).normalize();
            const r = forest.clearR*M.watchNearMon;
            return new THREE.Vector3(away.x*r, WORLD_FLOOR, away.z*r);
        }
        const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize().negate();
        const d = CFG.fogNear + (slot === 0 ? M.watchFar : M.watchMid)*(CFG.fogFar - CFG.fogNear);
        return new THREE.Vector3(cx + fwd.x*d, WORLD_FLOOR, cz + fwd.z*d);
    }
    const _wp = new THREE.Vector3(), _wd = new THREE.Vector3();
    function inView(x, y, z){
        _wp.set(x, y, z).project(camera);
        return _wp.z < 1 && Math.abs(_wp.x) < 1.15 && Math.abs(_wp.y) < 1.15;
    }
    function faceYou(w){ w.g.rotation.y = Math.atan2(player.pos.x - w.g.position.x, player.pos.z - w.g.position.z); }
    function syncWatchers(){
        watcherAssets();
        const want = Math.round(M.watchers);
        while(watchers.length > want){ const w = watchers.pop(); scene.remove(w.g); }
        const makers = [makeStag, makeStacked, makeShroud];
        while(watchers.length < want){
            const i = watchers.length;
            const g = makers[i % 3]();
            scene.add(g);
            const w = { g, slot:i, unseen:0, occluded:false, occlId:0, occlT:0, walk:new THREE.Vector3(), walkT:0 };
            const p = watcherSpot(i, false); if(p) g.position.copy(p);
            faceYou(w);
            watchers.push(w);
        }
    }
    function clearWatchers(){ for(const w of watchers) scene.remove(w.g); watchers.length = 0; }
    // occlusion: a watcher is hidden only if BOTH its head and its body are blocked —
    // trunks checked here, the monument via worker rays (a few times a second)
    let watchRayId = 0;
    const _wo = new THREE.Vector3();
    function checkOcclusion(w, now){
        if(now - w.occlT < 250) return;
        w.occlT = now;
        w.occlPending = { head:null, body:null };
        for(const part of ['head','body']){
            _wo.copy(w.g.position); _wo.y += w.g.userData.height*(part === 'head' ? 0.85 : 0.45);
            const dir = _wo.clone().sub(camera.position), dist = dir.length(); dir.normalize();
            if(treeRayHit(camera.position, dir, dist) > 0){ w.occlPending[part] = true; continue; }
            const id = ++watchRayId; (w.occlIds || (w.occlIds = {}))[id] = part;
            worker.postMessage({ type:'ray', tag:'occl', id, ox:camera.position.x, oy:camera.position.y, oz:camera.position.z,
                                 dx:dir.x, dy:dir.y, dz:dir.z, maxDist:dist });
        }
        settleOcclusion(w);
    }
    function settleOcclusion(w){
        const p = w.occlPending; if(!p || p.head === null || p.body === null) return;
        w.occluded = p.head && p.body;
    }
    function onOcclRay(m){
        for(const w of watchers){
            if(!w.occlIds || !(m.id in w.occlIds)) continue;
            w.occlPending[w.occlIds[m.id]] = !!m.ok; delete w.occlIds[m.id];
            settleOcclusion(w);
        }
    }
    function updateWatchers(dt, now){
        let busy = false;
        for(const w of watchers){
            checkOcclusion(w, now);
            const top = w.g.userData.height*0.8;
            // observed = anywhere on screen (head, middle or feet) and nothing in the way
            const seen = !w.occluded && (inView(w.g.position.x, w.g.position.y + top, w.g.position.z) ||
                                         inView(w.g.position.x, w.g.position.y + top*0.5, w.g.position.z) ||
                                         inView(w.g.position.x, w.g.position.y + 50, w.g.position.z));
            if(!seen){
                w.unseen += dt;
                if(w.unseen >= M.watchGrace){
                    const p = watcherSpot(w.slot, true);
                    if(p){ w.g.position.copy(p); faceYou(w); w.walkT = 0; }
                    w.unseen = 0;
                }
                continue;
            }
            w.unseen = 0;
            // seen, but deep in the fog: it drifts — the only time you'll catch one moving
            const d = w.g.position.distanceTo(camera.position);
            const fogDepth = (d - CFG.fogNear)/Math.max(1, CFG.fogFar - CFG.fogNear);
            if(fogDepth > M.watchDrift && M.watchWalk > 0){
                if(w.walkT <= 0){ const a = Math.random()*Math.PI*2; w.walk.set(Math.sin(a), 0, Math.cos(a)); w.walkT = 2 + Math.random()*3; }
                w.walkT -= dt;
                w.g.position.addScaledVector(w.walk, M.watchWalk*dt);
                w.g.rotation.y += (Math.atan2(w.walk.x, w.walk.z) - w.g.rotation.y)*Math.min(1, dt*1.5);
                busy = true;
            }
        }
        return busy;
    }

        if(isUiTarget(e.target)) return;
        e.preventDefault();
        for(const t of e.changedTouches){
            const lb = joyBounds(joyL);
            if(!stickL.on && Math.hypot(t.clientX - lb.cx, t.clientY - lb.cy) < lb.r){
                stickL.on = true; stickL.id = t.identifier;
                stickL.cx = lb.cx; stickL.cy = lb.cy;
                stickL.t0 = performance.now(); stickL.sx = t.clientX; stickL.sy = t.clientY; stickL.moved = false;
                if(wall.on || wall.coyote > 0) wallJump();      // any touch = wall jump
                continue;

            const rb = joyBounds(joyR);
            if(!stickR.on && Math.hypot(t.clientX - rb.cx, t.clientY - rb.cy) < rb.r){
                stickR.on = true; stickR.id = t.identifier;

    function endTouches(e){

    // DRIFT's toasts: they stack down the right side and fade on their own

    function makeFaceMaterial(){
        const sunDir = keyLight.position.clone().normalize();
        return new THREE.ShaderMaterial({
            extensions:{derivatives:true},
            uniforms:{
                uEdge:{value:CFG.edgeLines}, uLineW:{value:CFG.lineWidth}, uAO:{value:CFG.aoStrength},
                uSun:{value:CFG.sun}, uAmb:{value:CFG.ambient}, uGloss:{value:CFG.gloss},
                uHemi:{value:0.4}, uFill:{value:0.2},
                uSunDir:{value:sunDir}, uFillDir:{value:new THREE.Vector3(-0.3,0.2,-0.35).normalize()},
                uSunCol:{value:new THREE.Color(0xF2F4F2)}, uAmbCol:{value:new THREE.Color(0xEAF0F4)},
                uSky:{value:new THREE.Color(0xA6CBE2)}, uGround:{value:new THREE.Color(0x3A3E42)},
                uFillCol:{value:new THREE.Color(0x4E7FB0)},
                uFogCol:{value:new THREE.Color(0xA6CBE2)}, uFogNear:{value:CFG.fogNear}, uFogFar:{value:CFG.fogFar},
            },
            vertexShader:`
                attribute vec4 aPos; attribute vec4 aCol; attribute vec4 aAO;
                varying vec3 vCol; varying vec3 vN; varying vec2 vUV; varying float vAO; varying vec3 vW; varying float vFogD;
                void main(){
                    float dir=floor(aCol.w*255.0+0.5);
                    vec3 n; vec3 u; vec3 v;
                    if(dir<0.5){      n=vec3(1.0,0.0,0.0);  u=vec3(0.0,0.0,-1.0); v=vec3(0.0,1.0,0.0); }
                    else if(dir<1.5){ n=vec3(-1.0,0.0,0.0); u=vec3(0.0,0.0,1.0);  v=vec3(0.0,1.0,0.0); }
                    else if(dir<2.5){ n=vec3(0.0,1.0,0.0);  u=vec3(1.0,0.0,0.0);  v=vec3(0.0,0.0,-1.0); }
                    else if(dir<3.5){ n=vec3(0.0,-1.0,0.0); u=vec3(1.0,0.0,0.0);  v=vec3(0.0,0.0,1.0); }
                    else if(dir<4.5){ n=vec3(0.0,0.0,1.0);  u=vec3(1.0,0.0,0.0);  v=vec3(0.0,1.0,0.0); }
                    else {            n=vec3(0.0,0.0,-1.0); u=vec3(-1.0,0.0,0.0); v=vec3(0.0,1.0,0.0); }
                    float sz=aPos.w;
                    vec3 w=aPos.xyz+n*(0.5*sz)+(u*position.x+v*position.y)*sz;
                    float sx=step(0.0,position.x), sy=step(0.0,position.y);
                    vAO=dot(aAO,vec4((1.0-sx)*(1.0-sy),sx*(1.0-sy),(1.0-sx)*sy,sx*sy));
                    vCol=aCol.rgb; vN=n; vUV=position.xy; vW=w;
                    vec4 mv=viewMatrix*vec4(w,1.0);
                    vFogD=-mv.z;
                    gl_Position=projectionMatrix*mv;
                }`,
            fragmentShader:`
                uniform float uEdge, uLineW, uAO, uSun, uAmb, uGloss, uHemi, uFill;
                uniform vec3 uSunDir, uFillDir, uSunCol, uAmbCol, uSky, uGround, uFillCol, uFogCol;
                uniform float uFogNear, uFogFar;
                varying float vFogD;
                varying vec3 vCol; varying vec3 vN; varying vec2 vUV; varying float vAO; varying vec3 vW;
                void main(){
                    vec3 n=vN;
                    float e=0.5-max(abs(vUV.x),abs(vUV.y));
                    float fw=max(fwidth(e),1e-5);
                    float line=1.0-smoothstep(uLineW-fw,uLineW+fw,e);
                    float avg=1.0-(1.0-2.0*uLineW)*(1.0-2.0*uLineW);
                    float fade=clamp(1.5-fw/uLineW,0.0,1.0);
                    float edgeK=1.0-uEdge*mix(avg,line,fade);
                    float ao=mix(1.0,0.3+0.7*vAO,uAO);
                    float kd=max(dot(n,uSunDir),0.0), kf=max(dot(n,uFillDir),0.0);
                    vec3 hemi=mix(uGround,uSky,0.5*n.y+0.5);
                    vec3 light=uAmbCol*uAmb+hemi*uHemi+uSunCol*uSun*kd+uFillCol*uFill*kf;
                    vec3 c=vCol*light*0.8;
                    vec3 vd=normalize(cameraPosition-vW), h=normalize(uSunDir+vd);
                    c+=uSunCol*uSun*uGloss*pow(max(dot(n,h),0.0),48.0)*kd;
                    c*=edgeK*ao;
                    gl_FragColor=vec4(c,1.0);
                    #include <tonemapping_fragment>
                    #include <encodings_fragment>
                    // fog last, in screen colour — exactly where three's built-in materials apply it
                    gl_FragColor.rgb=mix(gl_FragColor.rgb,uFogCol,smoothstep(uFogNear,uFogFar,vFogD));
                }`
        });
    }
    function syncUniforms(){
        if(!faceMat) return;
        const u = faceMat.uniforms;
        u.uEdge.value = CFG.edgeLines; u.uLineW.value = CFG.lineWidth; u.uAO.value = CFG.aoStrength;
        u.uSun.value  = CFG.sun*worldLight; u.uAmb.value = CFG.ambient*worldLight; u.uGloss.value = CFG.gloss;
        u.uHemi.value = 0.4*worldLight;
        keyLight.intensity = CFG.sun*worldLight; ambLight.intensity = CFG.ambient*worldLight;
        if(hemiLight) hemiLight.intensity = 0.4*worldLight;

    const QUAD = new Float32Array([-0.5,-0.5,0, 0.5,-0.5,0, -0.5,0.5,0, 0.5,0.5,0]);
    function makeSetMesh(set){
        const g = new THREE.InstancedBufferGeometry();
        g.setIndex([0,1,3, 0,3,2]);
        g.setAttribute('position', new THREE.BufferAttribute(QUAD,3));
        g.setAttribute('aPos', new THREE.InstancedBufferAttribute(set.pos,4));
        g.setAttribute('aCol', new THREE.InstancedBufferAttribute(set.col,4,true));
        g.setAttribute('aAO',  new THREE.InstancedBufferAttribute(set.ao,4,true));
        g.instanceCount = set.count;
        const m = new THREE.Mesh(g, faceMat);
        m.frustumCulled = false; m.visible = false;
        return { level:set.level, count:set.count, mesh:m };

    // The finest layer arrives as chunks (a Group of small meshes) so a blade
    // cut only swaps the few chunks it touched.
    let worldGen = 0, carvedSinceBuild = false;
    function disposeSet(s){
        if(s.chunks) s.chunks.forEach(c=>c.mesh.geometry.dispose());
        else s.mesh.geometry.dispose();
    }
    function applySets(msg){
        meshSets.forEach(s=>{ scene.remove(s.mesh); disposeSet(s); });
        meshSets = msg.sets.filter(s=>s.count>0).map(makeSetMesh);
        if(msg.chunks && msg.chunks.length){
            const g = new THREE.Group(); g.visible = false;
            const map = new Map(); let count = 0;
            msg.chunks.forEach(c=>{
                const m = makeSetMesh(c).mesh; m.visible = true; g.add(m);
                map.set(c.id, { mesh:m, count:c.count }); count += c.count;
            });
            meshSets.push({ level:msg.chunkLevel, count, mesh:g, chunks:map });
        }
        meshSets.forEach(s=>scene.add(s.mesh));
        worldGen++; carvedSinceBuild = false;
