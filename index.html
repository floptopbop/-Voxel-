}
function monkeyMountStep(dt){
    const e = MKE.mount;
    if(!e || !e.ride || !EMS.list.includes(e) || !EM.on){ monkeyDismount('quiet'); return; }
    const h = emH(e), fx = Math.sin(e.yaw), fz = Math.cos(e.yaw);
    MKE.pos.set(e.pos.x - fx*h*0.08, e.pos.y + h*0.86 + MKE.halfH*0.55, e.pos.z - fz*h*0.08);
    MKE.vel.copy(e.vel); MKE.grounded = false; MKE.stT += dt;
    MKE.face = mkWrap(e.yaw + (e.ride.mode !== 'STEADY' ? Math.sin(MKE.time*9)*0.4 : 0));
}

// ── ground / air travel toward the goal ──
function monkeyTravel(dt, goal){
    const p = MKE.pos, v = MKE.vel, S = WORLD.scale, w = MKE.wild, intent = MKE.intent;
    let dx = goal.x - p.x, dz = goal.z - p.z; const dist = Math.hypot(dx, dz) || 1; dx /= dist; dz /= dist;
    const jit = (mkHash(Math.floor(MKE.time*3), 3)*2 - 1)*w*1.6*(1 - 0.7*THREE.MathUtils.clamp(MKE.logic, 0, 1));     // chaos jitters the heading, logic holds it
    const c = Math.cos(jit), s = Math.sin(jit), hx = dx*c - dz*s, hz = dx*s + dz*c;
    const e = 1 - 1/Math.max(1, MKE.rec), kk = Math.pow(e, dt*60);                                                      // recursion = echo of its last heading
    MKE.hx = MKE.hx*kk + hx*(1 - kk); MKE.hz = MKE.hz*kk + hz*(1 - kk);
    const hl = Math.hypot(MKE.hx, MKE.hz) || 1; MKE.hx /= hl; MKE.hz /= hl;
    const slow = intent === 'FRIEND' ? THREE.MathUtils.clamp((dist - MK.keepAway*S)/(MK.keepAway*S), 0, 1)
        : intent === 'BUDDY' ? THREE.MathUtils.clamp((dist - MK.followDist*S*0.4)/(MK.followDist*S*0.6), 0, 1) : 1;
    const tumbling = MKE.tumble > 0;

    // rope: straight at a titan / you when it's hunting them, otherwise tree to tree
    const R = MKE.rope;
    if(!tumbling && !R.active && MKE.ropeCDt <= 0 && (w >= MK.swingAt || (MK.buddy && MKE.flare <= 0))){
        const dist3 = p.distanceTo(goal), reach = monkeyReach();
        if(intent === 'HUNT' && dist3 < reach && dist3 > MK.size*3) monkeyFireRope('player', null, goal);
        else if(intent === 'TITAN' && MKE.target && dist3 < reach && dist3 > MK.size*3) monkeyFireRope('titan', MKE.target, goal);
        else if(dist > (intent === 'BUDDY' ? MK.followDist*3 : MK.swingMin)*S){ const a = monkeyPickAnchor(goal.x, goal.z); if(a) monkeyFireRope('static', null, a); }
    }

    // close to the emu he's after: pounce onto its back, leading it (instead of a normal hop)
    MKE.pounceCD = (MKE.pounceCD || 0) - dt;
    if(!tumbling && intent === 'EMU' && MKE.emuTgt && MKE.state === 'GO' && MKE.grounded && MKE.pounceCD <= 0 && !R.active){
        const e = MKE.emuTgt, h = emH(e);
        if(Math.hypot(p.x - e.pos.x, p.z - e.pos.z) < h*3 + MK.size){
            const T = 0.55, g = M.gravity*MK.gravScale;
            const tx = e.pos.x + e.vel.x*T, tz = e.pos.z + e.vel.z*T, ty = e.pos.y + h*0.9 + MKE.halfH*0.5;
            v.set((tx - p.x)/T, (ty - p.y - 0.5*g*T*T)/T, (tz - p.z)/T);
            MKE.pounceCD = 1.2; MKE.hopCD = 1.2;
            if(MK.dustScale > 0){ _mkSp.set(p.x, p.y - MKE.halfH, p.z); mkDust(_mkSp, Math.round(5*MK.dustScale), 30); }
        }
    }
    // hop (jump height from the world's gravity)
    MKE.hopCD -= dt;
    if(!tumbling && MKE.grounded && MKE.hopCD <= 0 && slow > 0.05){
        const vy = Math.sqrt(2*Math.abs(M.gravity)*MK.gravScale*MK.hopHeight*(0.5 + w));
        v.y = vy; v.x += MKE.hx*MK.hopSpeed*(0.7 + 0.8*w)*slow; v.z += MKE.hz*MK.hopSpeed*(0.7 + 0.8*w)*slow;
        MKE.hopCD = MK.hopEvery/(0.5 + w);
        if(MK.dustScale > 0){ _mkSp.set(p.x, p.y - MKE.halfH, p.z); mkDust(_mkSp, Math.round(5*MK.dustScale), 30); }
    }
    const acc = (MKE.grounded ? M.accelGround : M.accelAir)*MK.accelScale*slow*(tumbling ? 0 : 1);
    v.x += MKE.hx*acc*dt; v.z += MKE.hz*acc*dt;
    if(intent === 'EMU' && !tumbling && !R.active){                     // chasing a bird on foot: bleed off the speed he carried in from flying with you
        const want = Math.min(M.maxSpeed*MK.speedCap, dist*1.2 + 40), k = Math.min(1, dt*(MKE.grounded ? 6 : 1.5));
        v.x += (dx*want - v.x)*k; v.z += (dz*want - v.z)*k;
    }

    monkeyPhysics(dt);
    monkeyRopeStep(); monkeyRopeRelease(dt);

    // contact: latch a titan / climb you
    if(!tumbling && MKE.state === 'GO' && intent === 'TITAN' && MKE.target){
        const t = MKE.target;
        if(t.state !== 'DEAD' && p.y > t.base.y && p.y < t.base.y + t.H && Math.hypot(p.x - t.base.x, p.z - t.base.z) < t.r*0.9 + MK.size*0.3 + MK.size*0.15) monkeyStartLatch(t);
    }
    if(!tumbling && MKE.state === 'GO' && intent === 'EMU' && MKE.emuTgt){
        const e = MKE.emuTgt, h = emH(e), d2 = Math.hypot(p.x - e.pos.x, p.z - e.pos.z);
        if(d2 < h*0.5 + MK.size*0.45 && p.y > e.pos.y + h*0.1 && p.y < e.pos.y + h*2) monkeyTryMount(e);
    }
    if(MKE.state === 'GO' && intent === 'HUNT' && player.tumble <= 0 && MKE.rideCDt <= 0){
        if(p.distanceTo(player.pos) < M.radius + MK.size*MK.climbDist) monkeyStartRide();
    }
}

// ── throw bombnanas: at you while hunting, at titans otherwise ──
function monkeyMaybeThrow(dt){
    MKE.throwCDt -= dt;
    if(MKE.throwCDt > 0 || MKE.state === 'SPIRAL' || MKE.state === 'LATCH' || MKE.tumble > 0) return;
    const ally = MK.buddy && MKE.flare <= 0;
    MKE.baitT -= dt;
    if(ally && MK.playful > 0 && EM.on && MKE.baitT <= 0 && MKE.intent !== 'TITAN' && MKE.state !== 'MOUNT'){   // playful: lob a dud-fused bombnana for the emus to find
        MKE.baitT = 30/(0.15 + MK.playful);
        let be = null, bd = MK.throwRange*WORLD.scale*0.8;
        for(const e of EMS.list){ if(e.age < 1 || e.ride || e.tr.bold < 0.3) continue; const d = MKE.pos.distanceTo(e.pos); if(d < bd && d > MK.throwMin*2){ bd = d; be = e; } }
        if(be){
            _mkB.set(be.pos.x + (MKE.pos.x - be.pos.x)*0.3, floorY(be.pos.x, be.pos.z), be.pos.z + (MKE.pos.z - be.pos.z)*0.3);
            const b = throwBanana(_mkB, null); if(b){ b.bait = true; b.foe = false; b.fuse = MK.fuse*2.5; MKE.throwCDt = 2; return; }
        }
    }
    if(ally){ if(!MK.buddyThrow || MKE.intent !== 'TITAN' || !MKE.target) return; }      // allies only throw at the titan you're fighting
    else if(MKE.wild < MK.throwAt) return;
    let tp = null, tv = null;
    if(ally){ const t = MKE.target; if(t && t.state !== 'DEAD'){ tp = t.pos; tv = t.vel; } }
    else if(MKE.intent === 'HUNT' && MKE.state !== 'RIDE'){ tp = player.pos; tv = player.vel; }
    else if(MKE.intent === 'EMU' && MKE.emuTgt && MKE.state !== 'MOUNT'){ tp = MKE.emuTgt.pos; tv = MKE.emuTgt.vel; }     // mid-flare he'll bomb his own ride
    else { const t = monkeyNearestTitan(MK.throwRange*WORLD.scale); if(t){ tp = t.pos; tv = t.vel; } }
    if(!tp) return;
    const d = MKE.pos.distanceTo(tp);
    if(d < MK.throwMin || d > MK.throwRange*WORLD.scale) return;
    if(throwBanana(tp, tv)) MKE.throwCDt = ally ? MK.buddyThrowEvery : MK.throwEvery/(0.3 + 1.7*MKE.wild);
}

// ── pose: one set of joint angles drives both the box monkey and a loaded model's rig ──
const _mkP = { hy:0, hp:0, aL:0, aR:0, lL:0, lR:0 };
function monkeyPose(dt, spiral, feet){
    const size = MK.size, A = MKE.arms, root = MKE.root, sp = Math.hypot(MKE.vel.x, MKE.vel.z), P = _mkP;
    root.position.set(MKE.pos.x, feet, MKE.pos.z);
    root.scale.setScalar(size);
    root.rotation.y = MKE.face;
    MKE.gait += dt*(2 + Math.min(10, sp*0.05));
    const roped = MKE.rope.active;
    const want = (!MKE.inspect && !spiral && (MKE.state === 'GO' || MKE.state === 'MOUNT') && MKE.tumble <= 0 && (MKE.intent === 'FRIEND' || MKE.intent === 'BUDDY' || MKE.state === 'MOUNT') && MKE.hand.distanceTo(player.pos) < MK.hiReach*4) ? 1 : 0;
    MKE.raise += (want - MKE.raise)*Math.min(1, dt*8);
    MKE.glow = Math.max(0, MKE.glow - dt*2);
    MKE.throwT = Math.max(0, MKE.throwT - dt);
    P.hy = 0; P.hp = THREE.MathUtils.clamp(-MKE.vel.y*0.004, -0.35, 0.35);
    if(spiral){
        MKE.tilt.rotation.set(MKE.stT*5, 0, Math.sin(MKE.stT*7)*0.9);
        P.aL = MKE.time*12; P.aR = -MKE.time*12;
        P.lL = Math.sin(MKE.time*14)*0.9; P.lR = -Math.sin(MKE.time*14)*0.9;
        P.hy = Math.sin(MKE.time*9)*0.5;
    } else if(MKE.tumble > 0){
        const e = Math.min(1, MKE.tumble/0.25);
        MKE.tilt.rotation.set(MKE.tumAng.x*e, MKE.tumAng.y*e, MKE.tumAng.z*e);
        P.aL = Math.sin(MKE.time*16)*1.3; P.aR = -Math.sin(MKE.time*16)*1.3; P.lL = Math.sin(MKE.time*13)*0.9; P.lR = -Math.sin(MKE.time*13)*0.9;
    } else {
        MKE.tilt.rotation.set(MKE.grounded ? 0 : 0.25, 0, 0);
        if(MKE.state === 'LATCH'){ P.aL = P.aR = -1.4; P.lL = P.lR = -0.6; P.hp = 0.3*Math.sin(MKE.time*9); }
        else if(MKE.state === 'RIDE'){ P.aL = P.aR = -1.8; P.lL = P.lR = -0.9; }
        else if(MKE.state === 'MOUNT'){ const wild = MKE.mount && MKE.mount.ride && MKE.mount.ride.mode !== 'STEADY';
            P.aL = wild ? -2.4 + Math.sin(MKE.time*15)*0.8 : -1.1; P.aR = wild ? -2.4 - Math.sin(MKE.time*15)*0.8 : -1.1 - MKE.raise*1.2; P.lL = P.lR = -1.2; P.hy = wild ? Math.sin(MKE.time*11)*0.5 : 0; }
        else if(roped){ P.aL = P.aR = -Math.PI*0.88; P.lL = P.lR = 0.3; }
        else {
            P.aL = -Math.sin(MKE.gait)*0.5;
            P.aR = -MKE.raise*Math.PI*0.85 + (1 - MKE.raise)*Math.sin(MKE.gait)*0.5;
            P.lL = MKE.grounded ? 0 : 0.6 + Math.sin(MKE.gait)*0.2; P.lR = MKE.grounded ? 0 : 0.6 - Math.sin(MKE.gait)*0.2;
            P.hy = Math.sin(MKE.time*3)*0.12*MKE.wild;
        }
        if(MKE.throwT > 0) P.aR = THREE.MathUtils.lerp(-2.8, 0.7, 1 - MKE.throwT/0.35);
    }
    // rig test sliders (0 = off): raise the hand arm / run a gait cycle so the rig can be checked without playing
    if(MK.rigTest > 0) P.aR = THREE.MathUtils.lerp(P.aR, -2.6, MK.rigTest);
    if(MK.rigGait > 0){ const gs = Math.sin(MKE.gait*1.5)*MK.rigGait; P.aL = -gs*1.0; P.aR = gs*1.0; P.lL = gs*0.9; P.lR = -gs*0.9; }
    if(MKE.custom) mkRigApply(P);
    else { A.armL.rotation.x = P.aL; A.armR.rotation.x = P.aR; A.legL.rotation.x = P.lL; A.legR.rotation.x = P.lR; }
    A.tail.rotation.x = 0.5 + Math.sin(MKE.gait*0.5)*0.25*MKE.chaos;
    const gl = MKE.glow, g = MK_COL.gold;
    MKE.mHand.emissive.setRGB(g[0]*gl, g[1]*gl, g[2]*gl);
}
// inspect: park it in front of the camera, facing you, nothing moves unless a test slider is up
function monkeyInspect(dt){
    if(MKE.mount) monkeyDismount('quiet');
    camera.getWorldDirection(_mkF);
    MKE.pos.copy(player.pos).addScaledVector(_mkF, MK.size*MK.inspectDist);
    MKE.vel.set(0, 0, 0); MKE.grounded = true; MKE.state = 'GO'; MKE.intent = 'ROAM'; MKE.latch = null; MKE.ride = null;
    MKE.face = Math.atan2(-_mkF.x, -_mkF.z);
    MKE.halfH = MK.size*0.5; MKE.chaos = MK.chaosFloor; MKE.wild = 0;
    if(MK.rigGait > 0) MKE.time += dt;
    const feet = MKE.pos.y - MKE.halfH;
    monkeyPose(MK.rigGait > 0 ? dt : 0, false, feet);
    const hl = MKE.handLocal || _mkV.set(-0.24, 1.1, 0.2), cf = Math.cos(MKE.face), sf = Math.sin(MKE.face);
    MKE.hand.set(MKE.pos.x + (hl.x*cf + hl.z*sf)*MK.size, feet + hl.y*MK.size, MKE.pos.z + (-hl.x*sf + hl.z*cf)*MK.size);
}

function updateMonkey(dt){
    if(!MKE.built) return;
    MKE.root.visible = MKE.on;
    const blindEl = document.getElementById('mk-blind');
    if(!MKE.on){ if(grapple.trackTarget === MKE) releaseGrapple(); if(MKE.mount) monkeyDismount('quiet'); if(blindEl) blindEl.style.opacity = 0; return; }
    if(MKE.inspect){ if(blindEl) blindEl.style.opacity = 0; monkeyInspect(dt); return; }
    const size = MK.size, spiral = MKE.state === 'SPIRAL';
    MKE.halfH = size*0.5; MKE.hitR = size*0.75;
    MKE.time += dt;
    mkDrift();
    MKE.logicBias = Math.max(0, MKE.logicBias - MK.featherDecay*dt);
    MKE.calm = Math.max(0, MKE.calm - 0.1*dt);
    monkeyMood(dt);
    if(MKE.tumble > 0){ MKE.tumble -= dt; MKE.tumAng.addScaledVector(MKE.tum, dt); if(MKE.tumble <= 0){ MKE.tumble = 0; MKE.tumAng.set(0, 0, 0); } }
    MKE.ropeCDt -= dt; MKE.rideCDt -= dt; MKE.shyT = Math.max(0, MKE.shyT - dt); MKE.emuCD -= dt;
    if(MKE.emuT > 0 && MKE.state !== 'MOUNT'){ MKE.emuT -= dt; if(MKE.emuT <= 0){ MKE.emuTgt = null; MKE.emuCD = 8 + 12*(1 - MK.curious); } }
    MKE.cycleAcc += dt;
    while(MKE.cycleAcc >= MK.cycle){ MKE.cycleAcc -= MK.cycle; monkeyCycle(); }
    if(MKE.state === 'SPIRAL'){
        MKE.stT += dt; MKE.chaos = MK.chaosMid + MK.chaosAmp; MKE.wild = 1;
        if(MKE.stT >= MK.spiralTime) monkeyRecover(false);
    }
    MKE.thinkAcc += dt;
    if(MKE.thinkAcc >= MK.think){ MKE.thinkAcc = 0; monkeyThink(); }

    const wasG = MKE.grounded, pvy = MKE.vel.y;
    if(MKE.state === 'SPIRAL'){
        MKE.hopCD -= dt;
        if(MKE.grounded && MKE.hopCD <= 0){ MKE.vel.y = Math.sqrt(2*Math.abs(M.gravity)*MK.gravScale*MK.hopHeight*1.5); MKE.vel.x += (mkHash(Math.floor(MKE.time*4), 51)*2 - 1)*60; MKE.vel.z += (mkHash(Math.floor(MKE.time*4), 52)*2 - 1)*60; MKE.hopCD = 0.8; }
        monkeyPhysics(dt);
        MKE.face = mkWrap(MKE.face + MKE.omega*dt);
    } else if(MKE.state === 'LATCH') monkeyLatchStep(dt);
    else if(MKE.state === 'RIDE') monkeyRideStep(dt);
    else if(MKE.state === 'MOUNT') monkeyMountStep(dt);
    else {
        monkeyTravel(dt, monkeyGoal());
        const sx = MKE.vel.x, sz = MKE.vel.z;
        const faceT = (MKE.intent === 'FRIEND' || MKE.intent === 'BUDDY') && MKE.tumble <= 0 && Math.hypot(player.pos.x - MKE.pos.x, player.pos.z - MKE.pos.z) < MK.hiReach*5*WORLD.scale ? Math.atan2(player.pos.x - MKE.pos.x, player.pos.z - MKE.pos.z)
            : (sx*sx + sz*sz > 100 ? Math.atan2(sx, sz) : MKE.face);
        MKE.face = mkWrap(MKE.face + mkWrap(faceT - MKE.face)*Math.min(1, dt*6));
    }
    monkeyMaybeThrow(dt);
    monkeyTangle(dt);
    monkeySmoke(dt, wasG, pvy);
    updateBananas(dt);
    if(MKE.state !== 'RIDE' && blindEl){ MKE.blind = 0; }
    if(blindEl) blindEl.style.opacity = MKE.blind.toFixed(3);

    // hand + high five (not while it's on your back or biting a titan)
    const hl = MKE.handLocal || _mkV.set(-0.24, 1.1, 0.2), cf = Math.cos(MKE.face), sf = Math.sin(MKE.face), feet = MKE.pos.y - MKE.halfH;
    MKE.hand.set(MKE.pos.x + (hl.x*cf + hl.z*sf)*size, feet + hl.y*size, MKE.pos.z + (-hl.x*sf + hl.z*cf)*size);
    if(MKE.hiCD > 0) MKE.hiCD -= dt;
    if(MKE.hiCD <= 0 && player.tumble <= 0 && MKE.state !== 'RIDE' && MKE.state !== 'LATCH'){
        if(MKE.hand.distanceTo(player.pos) < MK.hiReach && player.vel.length() >= MK.hiMinSpeed) monkeyHighFive();
    }

    monkeyPose(dt, spiral, feet);

    if(++MKE._tick >= 6){
        MKE._tick = 0;
        const el = document.getElementById('h-mnk');
        const tag = spiral ? 'SPIRAL' : MKE.state === 'MOUNT' && MKE.mount && MKE.mount.ride ? 'EMU-' + MKE.mount.ride.mode : MKE.state === 'RIDE' ? 'RIDING' : MKE.state === 'LATCH' ? 'BITING' : MKE.tumble > 0 ? 'TUMBLE' : MKE.flare > 0 ? 'FLARE' : MKE.intent.toLowerCase();
        if(el) el.textContent = tag + ' c' + MKE.chaos.toFixed(2) + ' l' + MKE.logic.toFixed(2) + ' r' + MKE.rec.toFixed(2) + ' x' + MKE.hiStreak + ' a' + MKE.agit.toFixed(2) + ' b' + MKE.bond.toFixed(2);
    }
}

// ╔══════════════════════════════════════════════════════════╗
// ║ [EMU] flocks — koi-pond rules on legs                     ║

// ╚══════════════════════════════════════════════════════════╝
const _eA = new THREE.Vector3(), _eB = new THREE.Vector3(), _eP = new THREE.Vector3();
function emRnd(){ EMS.seed = (EMS.seed*16807) % 2147483647; return EMS.seed/2147483647; }
function emToast(m){ if(EMS.toastT <= 0){ showToast(m); EMS.toastT = 3; } }
function emH(e){ return EM.size*(e.age >= 1 ? 1 : 0.35 + 0.65*e.age); }                  // standing height (chicks grow into it)
function emHead(e, v){ const h = emH(e), dn = e.peck > 0.5 ? 0.45 : 0; return v.set(e.pos.x + Math.sin(e.yaw)*h*(0.42 + dn*0.2), e.pos.y + h*(1.1 - dn), e.pos.z + Math.cos(e.yaw)*h*(0.42 + dn*0.2)); }
function emFeathers(p, n, s){ for(let i = 0; i < n; i++) emit(p, _eB.set((Math.random()-0.5)*s, 10 + Math.random()*s*0.6, (Math.random()-0.5)*s), 0.7, false, 0.35); }

function emMats(){
    if(EMS.geo) return;
    const B = (w, h, d) => new THREE.BoxGeometry(w, h, d);
    EMS.geo = { body:new THREE.IcosahedronGeometry(0.5, 0), neck:B(0.09, 0.42, 0.09), head:B(0.12, 0.11, 0.17), beak:B(0.06, 0.04, 0.1),
        thigh:B(0.1, 0.27, 0.11), shin:B(0.05, 0.27, 0.05), foot:B(0.1, 0.03, 0.14), eye:B(0.03, 0.03, 0.03), egg:new THREE.IcosahedronGeometry(0.5, 1) };
    const ph = c => new THREE.MeshPhongMaterial({ color:c, specular:0x000000, shininess:0, flatShading:true });
    EMS.mNeck = ph(0x5E6B78); EMS.mLeg = ph(0x4A4740); EMS.mDark = ph(0x2B2722); EMS.mEgg = ph(0x2F4743);     // emu eggs really are that dark green
    EMS.group = new THREE.Group(); scene.add(EMS.group);
}
function emBuildMesh(e){
    const G = EMS.geo, root = new THREE.Group(), tilt = new THREE.Group(), body = new THREE.Group();
    root.add(tilt); tilt.add(body);
    e.mat = new THREE.MeshPhongMaterial({ color:new THREE.Color(e.col[0], e.col[1], e.col[2]), specular:0x000000, shininess:0, flatShading:true });
    const add = (geo, m, x, y, z, par) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); par.add(o); return o; };
    add(G.body, e.mat, 0, 0.64, -0.03, body).scale.set(0.8, 0.62, 1.08);               // the feather heap
    const neck = new THREE.Group(); neck.position.set(0, 0.76, 0.24); body.add(neck);
    add(G.neck, EMS.mNeck, 0, 0.2, 0, neck);
    const head = new THREE.Group(); head.position.set(0, 0.42, 0.02); neck.add(head);
    add(G.head, EMS.mNeck, 0, 0, 0.03, head); add(G.beak, EMS.mDark, 0, -0.01, 0.15, head);
    add(G.eye, EMS.mDark, 0.065, 0.03, 0.06, head); add(G.eye, EMS.mDark, -0.065, 0.03, 0.06, head);
    const legs = [];
    for(const sx of [0.11, -0.11]){
        const hip = new THREE.Group(); hip.position.set(sx, 0.52, 0); body.add(hip);
        add(G.thigh, e.mat, 0, -0.13, 0, hip);
        const knee = new THREE.Group(); knee.position.set(0, -0.26, 0); hip.add(knee);
        add(G.shin, EMS.mLeg, 0, -0.13, 0, knee); add(G.foot, EMS.mLeg, 0, -0.26, 0.04, knee);

}
function emMake(type, col, tr, x, z, age){
    const e = { type, col, tr, age, pos:new THREE.Vector3(x, floorY(x, z), z), vel:new THREE.Vector3(), yaw:emRnd()*6.283, off:emRnd()*1000,
        home:{ x, z }, grounded:true, tumble:0, spin:new THREE.Vector3(), ang:new THREE.Vector3(), panic:0, fx:0, fz:1,
        annoy:0, kickCD:0, kickT:0, bonkCD:0, carry:null, gait:emRnd()*6, peck:0, near:new Map(), layT:EM.layEvery*(0.4 + 0.6*emRnd()),
        ride:null, mother:null, hopCD:0 };

}
function emEggMesh(){ const m = new THREE.Mesh(EMS.geo.egg, EMS.mEgg); EMS.group.add(m); return m; }

function disposeEmus(){
    if(typeof MKE !== 'undefined' && MKE.mount) monkeyDismount('quiet');
    for(const e of EMS.list){ EMS.group.remove(e.mesh.root); e.mat.dispose(); }
    for(const g of EMS.eggs) EMS.group.remove(g.mesh);
    for(const b of MKE.bananas) b.carrier = null;
    EMS.list.length = 0; EMS.eggs.length = 0; EMS.dist.length = 0;
    MKE.emuNear.clear(); MKE.emuTgt = null; MKE.emuT = 0;
}
// flocks of one breed each, seeded, a short flight from your spawn and out of the boss clearing
function spawnEmus(){
    emMats(); disposeEmus();
    EMS.group.visible = !!EM.on;
    EMS.seed = 90210;
    const s = getPlayerStart(), S = WORLD.scale, n = EM.count|0, clear = (typeof WG !== 'undefined' ? WG.bossClear*0.8 : 1500)*S;
    const flocks = Math.max(1, Math.min(EM_TYPES.length, Math.ceil(n/3))), homes = [];
    for(let f = 0; f < flocks; f++){
        let hx = s[0], hz = s[2];
        for(let k = 0; k < 60; k++){
            const a = emRnd()*6.283, r = (550 + emRnd()*1700)*S;
            hx = s[0] + Math.sin(a)*r; hz = s[2] + Math.cos(a)*r;
            if(Math.hypot(hx, hz) > WORLD.half*0.88 || Math.hypot(hx, hz) < clear) continue;
            if(homes.some(h => Math.hypot(h.x - hx, h.z - hz) < 550*S)) continue;
            break;
        }
        homes.push({ x:hx, z:hz });
    }
    for(let i = 0; i < n; i++){
        const f = i % flocks, h = homes[f], type = EM_TYPES[f % EM_TYPES.length], B = EM_BREEDS[type], tr = {};
        for(const k in EM_LIM) tr[k] = THREE.MathUtils.clamp(B.tr[k]*(1 + (emRnd() - 0.5)*0.24), EM_LIM[k][0], EM_LIM[k][1]);
        const col = B.col.map(c => THREE.MathUtils.clamp(c*(1 + (emRnd() - 0.5)*0.12), 0, 1));
        const a = emRnd()*6.283, r = (40 + emRnd()*170)*S;
        emMake(type, col, tr, h.x + Math.sin(a)*r, h.z + Math.cos(a)*r, 1).home = { x:h.x, z:h.z };
    }
}

// ── koi genetics, ported: 12 "genes" with 1–3 crossover points decide each parent's share,
//    traits blend in that proportion with a little drift; coat blends too (mixed breeds look mixed) ──
function emBreed(a, b){
    const n = 12, cuts = new Set(), nc = 1 + Math.floor(emRnd()*3);
    while(cuts.size < nc) cuts.add(1 + Math.floor(emRnd()*(n - 1)));
    let src = emRnd() < 0.5 ? a : b, fromA = 0;
    for(let i = 0; i < n; i++){ if(cuts.has(i)) src = src === a ? b : a; if(src === a) fromA++; }
    const share = a === b ? 1 : fromA/n, tr = {};
    for(const k in EM_LIM){
        const w = Math.max(0.15, Math.min(0.85, share + (emRnd() - 0.5)*0.3));
        const v = (a.tr[k]*w + b.tr[k]*(1 - w))*(1 + (emRnd() - 0.5)*0.12);
        tr[k] = THREE.MathUtils.clamp(v, EM_LIM[k][0], EM_LIM[k][1]);
    }
    let col = a.col.map((c, i) => c*share + b.col[i]*(1 - share));
    if(emRnd() < 0.06) col = EM_BREEDS[EM_TYPES[Math.floor(emRnd()*EM_TYPES.length)]].col.slice();    // the odd throwback
    return { type:share >= 0.5 ? a.type : b.type, col, tr };
}
// the emu this one has spent the most time around (itself if nobody)
function emMate(e){
    let best = e, bv = 1;   // koi needs ~1 s of company (its memory settles around dt/(1 - keep))
    for(const [o, v] of e.near) if(v > bv && o.age >= 1 && EMS.list.includes(o)){ best = o; bv = v; }
    return best;
}

// ── things that scare them; blasts and bonks leave a short-lived disturbance ──
function emDisturb(x, z, f, r){ EMS.dist.push({ x, z, f, r, life:0.3 }); }
function emStartle(e){
    const S = WORLD.scale, R = EM.startleR*S, B = e.tr;
    let best = 0, bx = 0, bz = 0;
    const test = (x, z, f, rr) => {
        const dx = e.pos.x - x, dz = e.pos.z - z, d = Math.hypot(dx, dz);
        if(d >= rr) return;
        const p = f*(1 - d/rr)*B.shy;
        if(p > best){ best = p; if(d > 1e-3){ bx = dx/d; bz = dz/d; } else { const a = emRnd()*6.283; bx = Math.sin(a); bz = Math.cos(a); } }
    };
    // you: fast and low is terrifying, drifting by slowly is interesting (to the curious ones)
    const ps = player.vel.length(), alt = player.pos.y - floorY(player.pos.x, player.pos.z), low = 400*S;
    if(alt < low) test(player.pos.x, player.pos.z, (ps/M.maxSpeed)*1.8*(1 - alt/low)*(1 - 0.6*B.curious), R);
    if(MKE.on && MKE.built && MKE.state !== 'MOUNT') test(MKE.pos.x, MKE.pos.z, MKE.flare > 0 ? 1.3 : 0.2*(1 - B.curious), R*0.6);
    for(const d of EMS.dist) test(d.x, d.z, d.f, d.r);
    for(const t of titans){ if(t.state === 'DEAD') continue; if(Math.hypot(t.vel.x, t.vel.z) > 25) test(t.base.x, t.base.z, 1.4, R + t.r*2); }
    // panic is catching: a bolting flockmate sends its own breed the same way
    let cx = 0, cz = 0, cp = 0;
    if(EM.spread > 0) for(const o of EMS.list){
        if(o === e || o.panic <= 0 || o.type !== e.type) continue;
        const d = Math.hypot(o.pos.x - e.pos.x, o.pos.z - e.pos.z); if(d > R) continue;
        const p = EM.spread*(o.panic/EM.panicTime)*(1 - d/R)*B.shy*1.6;
        if(p > cp){ cp = p; cx = o.fx; cz = o.fz; }
    }
    if(cp > best){ best = cp; bx = cx; bz = cz; }
    if(e.ride){                                                            // ridden: a real scare turns a steady ride wild
        if(e.ride.mode === 'STEADY' && best > EM.startleAt*1.5) emRideWild(e);
        return;
    }
    if(best > EM.startleAt && e.panic < EM.panicTime*0.4){
        e.panic = EM.panicTime*(0.7 + 0.6*B.shy); e.fx = bx; e.fz = bz;
        if(e.carry && emRnd() < 0.5){ const b = e.carry; e.carry = null; b.carrier = null; b.vel.set(bx*60, 80, bz*60); }     // drops it, maybe
    }
}

// ── bonks: blades, flying into them, blasts. Up they go, tumbling; they'll remember it ──
function emKnock(e, ix, iy, iz, grudge){
    e.vel.x += ix; e.vel.y += iy; e.vel.z += iz; e.grounded = false;
    const k = Math.min(2, Math.hypot(ix, iy, iz)/200);
    e.tumble = 0.6 + 0.9*k; e.spin.set((emRnd()*2 - 1)*9*k, 0, (emRnd()*2 - 1)*9*k);
    e.annoy = Math.min(1, e.annoy + grudge*e.tr.bold);
    e.panic = Math.max(e.panic, EM.panicTime*0.6*e.tr.shy); { const l = Math.hypot(ix, iz); if(l > 1e-3){ e.fx = ix/l; e.fz = iz/l; } }
    if(e.carry){ const b = e.carry; e.carry = null; b.carrier = null; b.vel.set(ix*0.5, 120, iz*0.5); }
    if(e.ride && MKE.mount === e) monkeyDismount('thrown');
    EMS.bonks++;
}
function emuSlash(hist){
    if(!EM.on || !EMS.list.length) return false;
    const n = hist.length; if(n < 3) return false;
    if(Math.hypot(hist[n-1].x - hist[0].x, hist[n-1].y - hist[0].y) < C.swipePx) return false;
    camera.getWorldDirection(_eA);
    let best = null, bd = Infinity;
    for(const e of EMS.list){
        const h = emH(e); _eP.set(e.pos.x, e.pos.y + h*0.6, e.pos.z);
        _eB.subVectors(_eP, player.pos); const d = _eB.length();
        if(d > C.bladeRadius + h*0.45 || d >= bd) continue;
        if(_eA.dot(_eB.normalize()) < C.facingDot) continue;
        best = e; bd = d;
    }
    if(!best) return false;
    _eB.set(best.pos.x - player.pos.x, 0, best.pos.z - player.pos.z).normalize();
    const k = 150*EM.bonk;
    emKnock(best, _eB.x*k + player.vel.x*0.4, 75*EM.bonk, _eB.z*k + player.vel.z*0.4, 0.6);
    emDisturb(best.pos.x, best.pos.z, 1.3, EM.startleR*WORLD.scale);
    emFeathers(_eP.set(best.pos.x, best.pos.y + emH(best)*0.6, best.pos.z), 16, 90);
    emToast('bonk');
    return true;
}
function emuBlast(p){
    if(!EM.on) return;
    const R = MK.blastR*1.4;
    for(const e of EMS.list){
        const dx = e.pos.x - p.x, dz = e.pos.z - p.z, d = Math.hypot(dx, dz, (e.pos.y + emH(e)*0.5) - p.y);
        if(d > R) continue;
        const k = (1 - d/R)*MK.blastKnock*EM.bonk, l = Math.hypot(dx, dz) || 1;
        emKnock(e, dx/l*k, k*0.25 + 30, dz/l*k, 0.35);
    }
    emDisturb(p.x, p.z, 1.6, MK.blastR*3);
}

// ── a ridden emu: steady (follows you, monkey up top), bolting (gone, monkey clinging), bucking (monkey is leaving) ──
function emRideWild(e){
    const R = e.ride; if(!R) return;
    R.mode = e.tr.bold >= 0.55 ? 'BUCK' : 'BOLT'; R.t = 0;
    R.dur = EM.wildRide*(R.mode === 'BUCK' ? 1.3 - 0.4*e.tr.kick : 0.7 + 0.6*e.tr.shy);
    const a = Math.atan2(e.pos.x - player.pos.x, e.pos.z - player.pos.z) + (emRnd() - 0.5)*1.6;
    e.fx = Math.sin(a); e.fz = Math.cos(a);
    if(R.mode === 'BUCK') EMS.bucks++; else EMS.bolts++;
    emToast(R.mode === 'BUCK' ? 'the emu is bucking' : 'the emu bolted');
}

function emUpdate(e, dt){
    const S = WORLD.scale, B = e.tr, h = emH(e), T = EMS.time + e.off, v = e.vel, p = e.pos;
    const adult = e.age >= 1;
    if(!adult){ e.age = Math.min(1, e.age + dt/Math.max(1, EM.grow)); if(e.mother && !EMS.list.includes(e.mother)) e.mother = null; }
    e.kickCD -= dt; e.bonkCD -= dt; e.kickT = Math.max(0, e.kickT - dt); e.hopCD -= dt;
    e.annoy = Math.max(0, e.annoy - dt*0.02);
    if(e.panic > 0) e.panic = Math.max(0, e.panic - dt);
    emStartle(e);

    // ── what it wants ──
    let tx, tz, spd = 60*S*B.speed*EM.speed, stop = 0, turn = 2.5;
    const home = e.mother ? e.mother.pos : e.home;
    tx = home.x + (Math.cos(T*0.05)*260 + Math.sin(T*0.13)*110)*S*(e.mother ? 0.25 : 1);
    tz = home.z + (Math.sin(T*0.07)*260 + Math.cos(T*0.19)*110)*S*(e.mother ? 0.25 : 1);
    const graze = 0.5 + 0.5*Math.sin(T*0.31);                                   // stop-and-go grazing
    spd *= 0.25 + 0.75*graze; e.peck = graze < 0.22 ? 1 : 0;
    const pd = Math.hypot(player.pos.x - p.x, player.pos.z - p.z), palt = player.pos.y - floorY(player.pos.x, player.pos.z);

    let chasing = false;
    if(e.ride){
        const R = e.ride; R.t += dt; e.peck = 0;
        if(R.mode === 'STEADY'){ const g = mkBuddySpot(); tx = g.x; tz = g.z; spd = 230*S*B.speed*EM.speed; stop = 30*S; }     // with a jockey it really runs
        else if(R.mode === 'BOLT'){ const z = Math.sin(T*3.1)*0.6; tx = p.x + (e.fx*Math.cos(z) + e.fz*Math.sin(z))*400; tz = p.z + (e.fz*Math.cos(z) - e.fx*Math.sin(z))*400; spd = 200*S*B.speed*EM.speed; turn = 6; }
        else { tx = p.x; tz = p.z; spd = 0; e.yaw += Math.sin(T*5)*7*dt;
            if(e.grounded && e.hopCD <= 0){ v.y = Math.sqrt(2*Math.abs(M.gravity)*h*0.45); e.grounded = false; e.hopCD = 0.45; } }
        if(R.t >= R.dur && MKE.mount === e) monkeyDismount(R.mode === 'STEADY' ? 'hop' : R.mode === 'BUCK' ? 'buck' : 'thrown');
    } else if(e.panic > 0){
        const z = Math.sin(T*2.3)*0.5;
        tx = p.x + (e.fx*Math.cos(z) + e.fz*Math.sin(z))*400; tz = p.z + (e.fz*Math.cos(z) - e.fx*Math.sin(z))*400;
        spd = 190*S*B.speed*EM.speed*(0.55 + 0.45*e.panic/EM.panicTime); turn = 5; e.peck = 0;
    } else if(e.carry){                                                         // got a bombnana: keep-away from everyone
        let ax = 0, az = 0;
        for(const o of EMS.list){ if(o === e) continue; const dx = p.x - o.pos.x, dz = p.z - o.pos.z, d = Math.hypot(dx, dz); if(d < 500*S && d > 1){ ax += dx/d*(1 - d/(500*S)); az += dz/d*(1 - d/(500*S)); } }
        { const dx = p.x - MKE.pos.x, dz = p.z - MKE.pos.z, d = Math.hypot(dx, dz); if(d < 500*S && d > 1){ ax += dx/d; az += dz/d; } }
        const al = Math.hypot(ax, az);
        if(al > 0.01){ tx = p.x + ax/al*300; tz = p.z + az/al*300; }
        spd = 140*S*B.speed*EM.speed; turn = 4; e.peck = 0; chasing = true;
    } else {
        // bait: a bombnana on (or near) the ground draws the bold ones
        if(B.bold > 0.3 && EM.baitR > 0){
            let bb = null, bd = EM.baitR*S*B.bold;
            for(const b of MKE.bananas){
                if(!b.live || b.carrier) continue;
                if(b.pos.y - floorY(b.pos.x, b.pos.z) > h*3) continue;
                const d = Math.hypot(b.pos.x - p.x, b.pos.z - p.z); if(d < bd){ bd = d; bb = b; }
            }
            if(bb){
                chasing = true; tx = bb.pos.x; tz = bb.pos.z; spd = 150*S*B.speed*EM.speed; turn = 4; e.peck = 0;
                if(bd < h*0.5 && bb.pos.y < p.y + h*1.3 && adult){ bb.carrier = e; e.carry = bb; EMS.stolen++; emToast('an emu grabbed a bombnana'); }
            }
        }
        // a grudge: the bold ones come for you and kick
        if(!chasing && adult && EM.kickYou && e.annoy > 0.5 && B.bold > 0.45 && pd < 800*S && palt < h*3 && player.tumble <= 0){
            tx = player.pos.x; tz = player.pos.z; spd = 170*S*B.speed*EM.speed; turn = 5; chasing = true; e.peck = 0;
            if(pd < h*0.6 + M.radius && Math.abs(player.pos.y - (p.y + h*0.4)) < h && e.kickCD <= 0){
                _eA.set(player.pos.x - p.x, 0, player.pos.z - p.z).normalize();
                const k = EM.kick*B.kick;
                player.vel.addScaledVector(_eA, k); player.vel.y += k*0.25;
                if(k > M.tumbleThresh*0.8) startTumble(k, _eA.clone());
                e.annoy = Math.max(0, e.annoy - 0.6); e.kickCD = 2.5; e.kickT = 0.35; EMS.kicks++;
                emToast('emu kick');
            }
        }
        // curious: drift over to look at you (when you're slow and low) or at the monkey
        if(!chasing && B.curious > 0.45 && e.annoy < 0.3){
            const cr = 650*S*B.curious;
            if(pd < cr && player.vel.length() < 140 && palt < 200*S){ tx = player.pos.x; tz = player.pos.z; stop = 90*S; spd = 70*S*B.speed*EM.speed; e.peck = 0; }
            else if(MKE.on && MKE.state === 'GO' && MKE.flare <= 0){
                const md = Math.hypot(MKE.pos.x - p.x, MKE.pos.z - p.z);
                if(md < cr){ tx = MKE.pos.x; tz = MKE.pos.z; stop = 60*S; spd = 60*S*B.speed*EM.speed; e.peck = 0; }
            }
        }
        // flock: drift toward their own breed (chicks stick to mum)
        if(!chasing && B.social > 0){

            for(const o of EMS.list){ if(o === e || o.type !== e.type) continue; const dx = o.pos.x - p.x, dz = o.pos.z - p.z; if(dx*dx + dz*dz < R2){ sx += o.pos.x; sz += o.pos.z; nn++; } }

        }
        // kicks at a monkey that gets in its face (always, if he's mid-flare)
        if(adult && MKE.on && MKE.state === 'GO' && MKE.tumble <= 0 && e.kickCD <= 0 && B.bold > 0.4 && (e.annoy > 0.4 || MKE.flare > 0)){
            const dx = MKE.pos.x - p.x, dz = MKE.pos.z - p.z, md = Math.hypot(dx, dz);
            if(md < h*0.55 + MK.size*0.3 && Math.abs(MKE.pos.y - (p.y + h*0.5)) < h){
                const k = EM.kick*B.kick, l = md || 1;
                MKE.vel.set(dx/l*k, k*0.35, dz/l*k); MKE.grounded = false;
                mkTumble(Math.max(M.tumbleThresh, k)); MKE.shyT = 2 + 6*MK.timid; mkStress(MK.stressGain*0.5);
                e.kickCD = 3; e.kickT = 0.35; e.annoy = Math.max(0, e.annoy - 0.4); EMS.kicks++;
                emToast('emu kicked the monkey');
            }
        }
    }

    // ── steer + run (same gravity as everyone) ──
    let dx = tx - p.x, dz = tz - p.z; const dl = Math.hypot(dx, dz);
    if(stop > 0) spd *= THREE.MathUtils.clamp((dl - stop)/stop, 0, 1);
    if(dl > 1 && e.tumble <= 0){ const want = Math.atan2(dx, dz); e.yaw = mkWrap(e.yaw + THREE.MathUtils.clamp(mkWrap(want - e.yaw), -turn*dt, turn*dt)); }
    if(e.grounded && e.tumble <= 0){
        const k = Math.min(1, dt*(e.panic > 0 ? 6 : 3.5));
        v.x += (Math.sin(e.yaw)*spd - v.x)*k; v.z += (Math.cos(e.yaw)*spd - v.z)*k;
    }
    v.y += M.gravity*dt;
    if(!e.grounded){ const dr = Math.exp(-M.airDrag*dt); v.x *= dr; v.z *= dr; }
    const px = p.x, py = p.y, pz = p.z;
    p.addScaledVector(v, dt);
    // trees, pillars, walls: pushed out sideways
    const r = h*0.22;
    for(const s of staticsNear(p.x, p.z, r + 2)){
        if(p.y + h < s.baseY || p.y > s.topY) continue;
        const sx = p.x - s.x, sz = p.z - s.z, hw = s.hw + r, hd = s.hd + r;
        if(Math.abs(sx) > hw || Math.abs(sz) > hd) continue;
        if(hw - Math.abs(sx) < hd - Math.abs(sz)){ p.x = s.x + Math.sign(sx || 1)*hw; v.x = e.tumble > 0 ? -v.x*0.4 : 0; }
        else { p.z = s.z + Math.sign(sz || 1)*hd; v.z = e.tumble > 0 ? -v.z*0.4 : 0; }
    }
    // the structure is solid for them too
    if(typeof nearStructure === 'function' && nearStructure(_eP.set(p.x, p.y + h*0.5, p.z), h*2)){
        const blk = () => solidVox(p.x, p.y + h*0.5, p.z) || solidVox(p.x, p.y + h*0.1, p.z) || solidVox(p.x, p.y + h*0.95, p.z);
        if(blk()){
            const nx = p.x, nz = p.z;
            p.x = px; if(blk()){ p.x = nx; p.z = pz; if(blk()){ p.x = px; p.z = pz; if(blk()){ p.y = py + 200*dt; v.y = Math.max(v.y, 40); } } else v.z = 0; } else v.x = 0;
        }
    }
    { const hd = Math.hypot(p.x, p.z), lim = WORLD.half*0.98; if(hd > lim){ p.x *= lim/hd; p.z *= lim/hd; v.x *= -0.3; v.z *= -0.3; e.fx = -e.fx; e.fz = -e.fz; } }
    const gy = floorY(p.x, p.z);
    if(p.y <= gy){
        const vi = -v.y; p.y = gy; if(v.y < 0) v.y = 0;
        if(!e.grounded && vi > 120 && MK.dustScale > 0) mkDust(_eP.set(p.x, gy + 2, p.z), Math.round(6 + vi*0.03), 40 + vi*0.15);
        e.grounded = true;
        if(e.tumble > 0){ v.x *= Math.exp(-8*dt); v.z *= Math.exp(-8*dt); }
    } else e.grounded = p.y <= gy + 0.5;
    if(e.tumble > 0){ e.tumble -= dt; e.ang.addScaledVector(e.spin, dt); if(e.tumble <= 0 && !e.grounded) e.tumble = 0.05; }
    else { e.ang.multiplyScalar(Math.exp(-dt*8)); }

    // ── bump into you: you go through, they go flying ──
    if(e.bonkCD <= 0 && EM.bonk > 0){
        const ddx = p.x - player.pos.x, ddz = p.z - player.pos.z, dd = Math.hypot(ddx, ddz);
        if(dd < r + M.radius + 4 && player.pos.y > p.y - M.radius && player.pos.y < p.y + h + M.radius){
            const nx = ddx/(dd || 1), nz = ddz/(dd || 1), along = player.vel.x*nx + player.vel.z*nz;     // it's YOUR speed into it that counts
            if(along > 50){
                emKnock(e, nx*along*0.6*EM.bonk, along*0.15*EM.bonk + 30, nz*along*0.6*EM.bonk, 0.3);
                player.vel.x -= nx*along*0.12; player.vel.z -= nz*along*0.12;
                emDisturb(p.x, p.z, 1, EM.startleR*S*0.8); emFeathers(_eP.set(p.x, p.y + h*0.6, p.z), 10, 70);
                e.bonkCD = 0.6;
            }
        }
    }
    // bombnana in its beak
    if(e.carry){ if(!e.carry.live || e.carry.carrier !== e){ e.carry = null; } }

    // ── who it's been around (koi memory): nearby and both calm; slowly forgotten ──
    const keep = Math.pow(EM.mateMemory, dt*60), mr = 180*S;
    for(const [o, val] of e.near){ if(!EMS.list.includes(o) || val < 0.002) e.near.delete(o); else e.near.set(o, val*keep); }
    if(adult && e.panic <= 0) for(const o of EMS.list){
        if(o === e || o.age < 1 || o.panic > 0) continue;
        if(Math.abs(o.pos.x - p.x) < mr && Math.abs(o.pos.z - p.z) < mr) e.near.set(o, (e.near.get(o) || 0) + dt);
    }
    if(MKE.on && Math.hypot(MKE.pos.x - p.x, MKE.pos.z - p.z) < 260*S) MKE.emuNear.set(e, (MKE.emuNear.get(e) || 0) + dt);   // settles near ~8 s when he hangs around one
    // eggs: calm adults that have had company lay one now and then (up to the max)
    if(adult && EM.breed && !e.ride && e.panic <= 0 && e.tumble <= 0){
        e.layT -= dt;
        if(e.layT <= 0){
            e.layT = EM.layEvery*(0.7 + 0.6*emRnd());
            const mate = emMate(e);
            if(mate !== e && EMS.list.length + EMS.eggs.length < EM.max){
                EMS.eggs.push({ pos:new THREE.Vector3(p.x - Math.sin(e.yaw)*h*0.3, gy, p.z - Math.cos(e.yaw)*h*0.3), t:EM.hatch, genes:emBreed(e, mate), mother:e, mesh:emEggMesh(), wob:emRnd()*6 });
                EMS.laid++; emToast('an emu laid an egg');
            }
        }
    }
}

function emPose(e, dt){
    const m = e.mesh, h = emH(e), sp = Math.hypot(e.vel.x, e.vel.z), run = Math.min(1, sp/(h*3));
    e.gait += dt*(1.5 + Math.min(14, sp/(h*0.11)));
    const g = e.gait, bob = e.grounded ? Math.abs(Math.sin(g))*h*0.035*run : 0;
    m.root.position.set(e.pos.x, e.pos.y + bob, e.pos.z); m.root.scale.setScalar(h); m.root.rotation.y = e.yaw;
    m.tilt.rotation.set(e.ang.x, 0, e.ang.z);
    const L = m.legs, buck = e.ride && e.ride.mode === 'BUCK';
    if(!e.grounded || e.tumble > 0){
        const f = Math.sin(EMS.time*14 + e.off)*0.8;
        L[0].hip.rotation.x = f; L[1].hip.rotation.x = -f; L[0].knee.rotation.x = 0.9; L[1].knee.rotation.x = 0.9;
    } else {
        const a = Math.sin(g)*0.95*run;
        L[0].hip.rotation.x = a; L[1].hip.rotation.x = -a;
        L[0].knee.rotation.x = Math.max(0, Math.sin(g - 1.2))*1.1*run; L[1].knee.rotation.x = Math.max(0, -Math.sin(g - 1.2))*1.1*run;
    }
    if(e.kickT > 0){ const k = Math.sin(Math.PI*(1 - e.kickT/0.35)); L[0].hip.rotation.x = -1.5*k; L[0].knee.rotation.x = 0.2; }
    m.body.rotation.x = buck ? Math.sin(EMS.time*11)*0.45 : 0;
    const nx = e.peck ? 1.45 : 0.15 + 0.55*run;                                // neck forward when running, down when pecking
    m.neck.rotation.x += (nx - m.neck.rotation.x)*Math.min(1, dt*6);
    m.head.rotation.x = -m.neck.rotation.x*0.8 + (e.peck ? Math.max(0, Math.sin(EMS.time*9 + e.off))*0.5 : 0);
    m.head.rotation.y = e.panic > 0 ? Math.sin(EMS.time*13 + e.off)*0.5 : Math.sin(EMS.time*0.7 + e.off)*0.3;
}

function updateEmus(dt){
    if(!EMS.group) return;
    EMS.group.visible = !!EM.on;
    if(!EM.on){ if(MKE.mount) monkeyDismount('quiet'); return; }
    EMS.time = (EMS.time || 0) + dt; EMS.toastT -= dt;
    for(let i = EMS.dist.length - 1; i >= 0; i--) if((EMS.dist[i].life -= dt) <= 0) EMS.dist.splice(i, 1);
    const keepM = Math.pow(0.998, dt*60);
    for(const [o, val] of MKE.emuNear){ if(!EMS.list.includes(o) || val < 0.002) MKE.emuNear.delete(o); else MKE.emuNear.set(o, val*keepM); }
    for(const e of EMS.list) emUpdate(e, dt);
    // don't stack up on each other
    const L = EMS.list;
    for(let i = 0; i < L.length; i++) for(let j = i + 1; j < L.length; j++){
        const a = L[i], b = L[j], rr = (emH(a) + emH(b))*0.2, dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d2 = dx*dx + dz*dz;
        if(d2 >= rr*rr || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), push = (rr - d)*0.5, nx = dx/d, nz = dz/d;
        a.pos.x -= nx*push; a.pos.z -= nz*push; b.pos.x += nx*push; b.pos.z += nz*push;
    }
    // eggs → chicks (genes from the koi-style breed)
    for(let i = EMS.eggs.length - 1; i >= 0; i--){
        const g = EMS.eggs[i], s = EM.size*0.16;
        g.t -= dt;
        g.mesh.scale.set(s*0.8, s, s*0.8);
        g.mesh.position.set(g.pos.x, floorY(g.pos.x, g.pos.z) + s*0.5, g.pos.z);
        g.mesh.rotation.z = g.t < 3 ? Math.sin(EMS.time*20 + g.wob)*0.25 : 0;          // it rocks just before it hatches
        if(g.t <= 0){
            const c = emMake(g.genes.type, g.genes.col, g.genes.tr, g.pos.x, g.pos.z, 0);
            c.mother = EMS.list.includes(g.mother) ? g.mother : null; c.home = g.mother ? g.mother.home : { x:g.pos.x, z:g.pos.z };
            EMS.group.remove(g.mesh); EMS.eggs.splice(i, 1); EMS.hatched++;
            emToast('a chick hatched');
        }
    }
    for(const e of EMS.list) emPose(e, dt);
}
function syncEmuButton(){ const b = document.getElementById('btn-emus'); if(b) b.textContent = 'emus: ' + (EM.on ? 'on' : 'off'); }
(function wireEmuUI(){
    const b = document.getElementById('btn-emus'); if(!b) return;
    b.addEventListener('click', () => { EM.on = EM.on ? 0 : 1; syncEmuButton(); saveSettingsSoon(); if(EM.on && !EMS.list.length) spawnEmus(); });
    const n = document.getElementById('btn-emus-new'); if(n) n.addEventListener('click', () => { spawnEmus(); showToast('new emus'); });
    syncEmuButton();
})();

(function(){
    const btn = document.getElementById('deck-reset'); let armed = 0;
    btn.addEventListener('click', e => {
        e.stopPropagation();
        if(!armed){
            btn.classList.add('armed'); btn.textContent = 'tap again · wipe';
            armed = setTimeout(() => { armed = 0; btn.classList.remove('armed'); btn.textContent = 'reset saved'; }, 3000);
            return;
        }
        clearTimeout(armed); _settingsReady = false;
        try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
        location.reload();
    });
})();
const _restored = restoreSettings();
_settingsReady = true;

initSmoke();
gridFine.scale.setScalar(WORLD.scale); gridCoarse.scale.setScalar(WORLD.scale); ring.scale.setScalar(WORLD.scale);
regenForest();
rebuildWorld(0);
spawnTitan({ boss:true, x:0, z:0, yaw:0 });
spawnMinions();
applySky(); applySun();
camTarget.copy(player.pos).add(new THREE.Vector3(0, M.eyeOffset, 0));
resizeAll();
if(_restored) showToast('settings restored');

const clock = new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05)*M.timeScale;
    if(APP === 'forge'){
        updateOrbit();
        pickLevel(); syncFaceUniforms();
        updateSmoke(dt);
        renderer.render(scene, camera);
        return;
    }
    physics(dt);
    updateTitans(dt);
    updateEmus(dt);
    updateMonkey(dt);
    pickLevel(); syncFaceUniforms();
    updateSmoke(dt);
    drawSlash();
    renderer.render(scene, camera);
}
animate();
</script>
