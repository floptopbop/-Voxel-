// ║ [ODM] GRAPPLE                                             ║
// ╚══════════════════════════════════════════════════════════╝
function _rayAABB(o,d,s,maxT){
    let tmin=0,tmax=maxT;
    if(Math.abs(d.x)<1e-9){if(o.x<s.x-s.hw||o.x>s.x+s.hw)return -1;}
    else{let t1=(s.x-s.hw-o.x)/d.x,t2=(s.x+s.hw-o.x)/d.x;if(t1>t2){const t=t1;t1=t2;t2=t;}tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax)return -1;}
    if(Math.abs(d.z)<1e-9){if(o.z<s.z-s.hd||o.z>s.z+s.hd)return -1;}
    else{let t1=(s.z-s.hd-o.z)/d.z,t2=(s.z+s.hd-o.z)/d.z;if(t1>t2){const t=t1;t1=t2;t2=t;}tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax)return -1;}
    if(Math.abs(d.y)<1e-9){if(o.y<s.baseY||o.y>s.topY)return -1;}
    else{let t1=(s.baseY-o.y)/d.y,t2=(s.topY-o.y)/d.y;if(t1>t2){const t=t1;t1=t2;t2=t;}tmin=Math.max(tmin,t1);tmax=Math.min(tmax,t2);if(tmin>tmax)return -1;}
    return tmin;
}
function _raySphere(o, d, center, r, maxT){
    const lx=center.x-o.x, ly=center.y-o.y, lz=center.z-o.z;
    const tc=lx*d.x+ly*d.y+lz*d.z;
    if(tc<0||tc>maxT+r)return -1;
    const d2=lx*lx+ly*ly+lz*lz-tc*tc;
    if(d2>r*r)return -1;
    const t=tc-Math.sqrt(r*r-d2);
    return t>0&&t<maxT?t:-1;
}

let _scanHitDummy = null;
function scanHit(){
    aimRay.setFromCamera(cNDC, camera);
    const o = aimRay.ray.origin, d = aimRay.ray.direction;
    let bestT = M.maxRopeDist, hitPt = null;
    _scanHitDummy = null;

    { const t = rayGroundHit(o,d,bestT); if(t>=0 && t<bestT){ bestT = t; hitPt = _hitV.copy(o).addScaledVector(d,t); } }
    for(const st of statics){
        if(Math.abs(st.x-o.x) - st.hw > bestT || Math.abs(st.z-o.z) - st.hd > bestT) continue;
        const t = _rayAABB(o,d,st,bestT);
        if(t>=0 && t<bestT){ bestT = t; hitPt = _hitV.copy(o).addScaledVector(d,t); _scanHitDummy = null; }
    }
    requestVoxAim(performance.now());
    if(voxAim.ok && performance.now() - voxAim.t < 300 && voxAim.dist < bestT){ bestT = voxAim.dist; hitPt = _hitV.copy(voxAim.p); _scanHitDummy = null; }
    for(const tt of titans){
        if(tt.state === 'DEAD') continue;
        const sr = Math.sqrt(tt.r*tt.r + tt.half*tt.half)*0.9;
        const t = _raySphere(o, d, tt.pos, sr, bestT);
        if(t>=0){ bestT = t; hitPt = _hitV.copy(o).addScaledVector(d,t); _scanHitDummy = tt; }
    }
    if(MKE.on && MKE.built){
        const t = _raySphere(o, d, MKE.pos, MKE.hitR, bestT);
        if(t>=0){ bestT = t; hitPt = _hitV.copy(o).addScaledVector(d,t); _scanHitDummy = MKE; }
    }
    const locked = !!hitPt;
    if(locked !== _lastLocked){ EL.xhair.classList.toggle('locked', locked); _lastLocked = locked; }
    return hitPt;
}
function fireGrapple(){
    if(player.tumble > 0) return;
    _scanHitDummy = null;
    const pt = scanHit(); if(!pt) return;
    releaseGrapple();
    grapple.active = true;
    grapple.anchor.copy(pt);
    grapple.trackTarget = _scanHitDummy;
    const geo = new THREE.BufferGeometry().setFromPoints([player.pos, pt]);
    grapple.line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color:0x7D7D85 }));
    scene.add(grapple.line);
    for(let b=0;b<26 && particles.length<M.smokeMax;b++)
        emit(pt.clone(), new THREE.Vector3((Math.random()-0.5)*24, Math.random()*16+4, (Math.random()-0.5)*24), 1.1);
}
function releaseGrapple(){
    grapple.active = false; grapple.trackTarget = null;
    if(grapple.line){ scene.remove(grapple.line); grapple.line.geometry.dispose(); grapple.line.material.dispose(); grapple.line = null; }
}
function updateRope(){
    if(!grapple.line) return;
    const a = grapple.line.geometry.attributes.position.array;
    a[0]=player.pos.x; a[1]=player.pos.y-2; a[2]=player.pos.z;
    a[3]=grapple.anchor.x; a[4]=grapple.anchor.y; a[5]=grapple.anchor.z;
    grapple.line.geometry.attributes.position.needsUpdate = true;
}

const slashTouches = {};
let slashHistory = [];
const sc = document.getElementById('slash-canvas');
const sctx = sc.getContext('2d');
function sizeSlashCanvas(){ sc.width = innerWidth; sc.height = innerHeight; }
function requestVoxelSlash(hist){
    if(APP !== 'play' || !STRUCT.cubes || STRUCT.building || STRUCT.replaying || hist.length<3) return;
    const first=hist[0], last=hist[hist.length-1], dx=last.x-first.x, dy=last.y-first.y;
    const pxLen=Math.hypot(dx,dy), now=performance.now();
    if(pxLen<C.swipePx || now-_lastVoxelCut<320) return;
    _lastVoxelCut=now;
    const mx=(first.x+last.x)*0.5, my=(first.y+last.y)*0.5;
    const ndc=new THREE.Vector2(mx/Math.max(1,cc.clientWidth)*2-1, -(my/Math.max(1,cc.clientHeight))*2+1);
    const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,camera);
    const id=++_rayTaskId; carveRayRequests.set(id,{dx,dy,jobId:STRUCT.jobId,off:STRUCT.off.clone()});
    // A sword cut should require proximity; the grapple keeps its longer reach.
    const maxDist=Math.min(M.maxRopeDist, Math.max(VCFG.span*0.3*WORLD.scale,100));
    voxWorker.postMessage({type:'ray',tag:'carve',id,ox:ray.ray.origin.x-STRUCT.off.x,oy:ray.ray.origin.y-STRUCT.off.y,oz:ray.ray.origin.z-STRUCT.off.z,
        dx:ray.ray.direction.x,dy:ray.ray.direction.y,dz:ray.ray.direction.z,maxDist});
}

function trySlash(hist){
    requestVoxelSlash(hist);                         // same swipe can cut the image-made structure
    if(slashCD <= 0 && emuSlash(hist)){ slashCD = C.bladeCooldown; return; }
    if(slashCD > 0 || !titans.length) return;
    const n = hist.length; if(n < 3) return;
    const sdx = hist[n-1].x-hist[0].x, sdy = hist[n-1].y-hist[0].y;
    if(Math.sqrt(sdx*sdx+sdy*sdy) < C.swipePx) return;
    slashCD = C.bladeCooldown;
    camera.getWorldDirection(_fwd);
    // nape first: from behind, within reach, blade facing it
    let best = null, bestD = Infinity, nape = false;
    for(const t of titans){
        if(t.state === 'DEAD') continue;
        const rx = player.pos.x-t.base.x, rz = player.pos.z-t.base.z, rl = Math.hypot(rx,rz) || 1;
        if((Math.sin(t.yaw)*rx + Math.cos(t.yaw)*rz)/rl >= C.napeAngle) continue;
        t.P.nape.getWorldPosition(_np);
        _toD.subVectors(_np, player.pos);
        const dd = _toD.length();
        if(dd >= C.bladeRadius*C.napeReach || dd >= bestD) continue;
        if(_fwd.dot(_toD.normalize()) < C.facingDot) continue;
        best = t; bestD = dd; nape = true;
    }
    if(!best) for(const t of titans){
        if(t.state === 'DEAD') continue;
        _toD.subVectors(t.pos, player.pos);
        const dd = _toD.length();
        if(dd > C.bladeRadius + t.r || dd >= bestD) continue;
        if(_fwd.dot(_toD.normalize()) < C.facingDot) continue;
        best = t; bestD = dd;
    }
    if(!best) return;
    _toD.subVectors(nape ? best.P.nape.getWorldPosition(_np) : best.pos, player.pos).normalize();
    _imp.copy(player.vel).multiplyScalar(1.2); _imp.y += 80; _imp.addScaledVector(_toD, 140);
    damageTitan(best, _imp.x, _imp.y, _imp.z, nape);
}
function drawSlash(){
    for(const p of slashHistory) p.age++;
    const had = slashHistory.length;
    slashHistory = slashHistory.filter(p => p.age < 10);
    if(!had) return;
    sctx.clearRect(0,0,sc.width,sc.height);
    if(slashHistory.length < 2) return;
    sctx.shadowBlur = 10; sctx.shadowColor = 'rgba(255,10,10,0.85)';
    for(let i=1;i<slashHistory.length;i++){
        const a = slashHistory[i-1], b = slashHistory[i], f = (10-b.age)/10;
        sctx.beginPath(); sctx.moveTo(a.x,a.y); sctx.lineTo(b.x,b.y);
        sctx.strokeStyle = `rgba(255,20,20,${f})`; sctx.lineWidth = f*4; sctx.lineCap = 'round'; sctx.stroke();
    }
    sctx.shadowBlur = 0;
}

// ╔══════════════════════════════════════════════════════════╗
// ║ [STRUCT] the hidden structure — waaa_5's voxel builder    ║
// ║ (worker carried over verbatim). Silhouette-carved from    ║
// ║ the four photos, set out in the world behind you and      ║
// ║ half-buried in the terrain. Solid: you collide, wall-run  ║
// ║ and rope onto it. Worker coords are local; STRUCT.off     ║
// ║ places them in the world.                                  ║
// ╚══════════════════════════════════════════════════════════╝
const VCFG = {
    // waaa_5 build values
    edgeDepth:7, detailDepth:8, detailCut:0.06, maxCubes:400000, imgSize:256, threshold:2, sculpt:4,
    lumaCarve:0.1, gap:0, jitter:0.04, colorMode:'source', preview:false, span:1600, floorY:0,
    // waaa_5 look
    edgeLines:0.45, lineWidth:0.07, aoStrength:0.6, sun:0.7, ambient:0.85, gloss:0.25, lodPx:1.5,
    // placement
    dist:7000, angle:90, bury:0.3, cutRadius:18,
};
const STRUCT = {
    sets:[], msg:null, building:false, jobId:0, bbox:null, level:-1, off:new THREE.Vector3(), cubes:0,
    cuts:[], restoreCuts:[], replaying:false, carveId:0, carvePending:0,
};
const voxWorker = new Worker(URL.createObjectURL(new Blob([document.getElementById('voxel-worker').textContent], { type:'application/javascript' })));
let faceMat = null;
function makeFaceMaterial(){                                         // waaa_5, plus uOff to place it in the world
    const sunDir = sun.position.clone().normalize();
    return new THREE.ShaderMaterial({
        extensions:{ derivatives:true },
        uniforms:{
            uOff:{ value:STRUCT.off },
            uEdge:{value:VCFG.edgeLines}, uLineW:{value:VCFG.lineWidth}, uAO:{value:VCFG.aoStrength},
            uSun:{value:VCFG.sun}, uAmb:{value:VCFG.ambient}, uGloss:{value:VCFG.gloss},
            uHemi:{value:0.4}, uFill:{value:0.2},
            uSunDir:{value:sunDir}, uFillDir:{value:new THREE.Vector3(-0.3,0.2,-0.35).normalize()},
            uSunCol:{value:new THREE.Color(0xF2F4F2)}, uAmbCol:{value:new THREE.Color(0xEAF0F4)},
            uSky:{value:new THREE.Color(0xA6CBE2)}, uGround:{value:new THREE.Color(0x3A3E42)},
            uFillCol:{value:new THREE.Color(0x4E7FB0)},
            uFogCol:{value:new THREE.Color(0xA6CBE2)}, uFogNear:{value:ATMO.fogNear}, uFogFar:{value:ATMO.fogFar},
        },
        vertexShader:`
            uniform vec3 uOff;
            attribute vec4 aPos; attribute vec4 aCol; attribute vec4 aAO;
            varying vec3 vCol; varying vec3 vN; varying vec2 vUV; varying float vAO; varying vec3 vW; varying float vFogD;
            void main(){
                float dir=floor(aCol.w*255.0+0.5);
                vec3 n; vec3 u; vec3 v;
                if(dir<0.5){      n=vec3(1.0,0.0,0.0);  u=vec3(0.0,0.0,-1.0); v=vec3(0.0,1.0,0.0); }
                else if(dir<1.5){ n=vec3(-1.0,0.0,0.0); u=vec3(0.0,0.0,1.0);  v=vec3(0.0,1.0,0.0); }
                else if(dir<2.5){ n=vec3(0.0,1.0,0.0);  u=vec3(1.0,0.0,0.0);  v=vec3(0.0,0.0,-1.0); }
                else if(dir<3.5){ n=vec3(0.0,-1.0,0.0); u=vec3(1.0,0.0,0.0);  v=vec3(0.0,0.0,1.0); }
                else if(dir<4.5){ n=vec3(0.0,0.0,1.0);  u=vec3(1.0,0.0,0.0);  v=vec3(0.0,1.0,0.0); }
                else {            n=vec3(0.0,0.0,-1.0); u=vec3(-1.0,0.0,0.0); v=vec3(0.0,1.0,0.0); }
                float sz=aPos.w;
                vec3 w=aPos.xyz+uOff+n*(0.5*sz)+(u*position.x+v*position.y)*sz;
                float sx=step(0.0,position.x), sy=step(0.0,position.y);
                vAO=dot(aAO,vec4((1.0-sx)*(1.0-sy),sx*(1.0-sy),(1.0-sx)*sy,sx*sy));
                vCol=aCol.rgb; vN=n; vUV=position.xy; vW=w;
                vec4 mv=viewMatrix*vec4(w,1.0);
                vFogD=-mv.z;
                gl_Position=projectionMatrix*mv;
            }`,
        fragmentShader:`
            uniform float uEdge, uLineW, uAO, uSun, uAmb, uGloss, uHemi, uFill;
            uniform vec3 uSunDir, uFillDir, uSunCol, uAmbCol, uSky, uGround, uFillCol, uFogCol;
            uniform float uFogNear, uFogFar;
            varying float vFogD;
            varying vec3 vCol; varying vec3 vN; varying vec2 vUV; varying float vAO; varying vec3 vW;
            void main(){
                vec3 n=vN;
                float e=0.5-max(abs(vUV.x),abs(vUV.y));
                float fw=max(fwidth(e),1e-5);
                float line=1.0-smoothstep(uLineW-fw,uLineW+fw,e);
                float avg=1.0-(1.0-2.0*uLineW)*(1.0-2.0*uLineW);
                float fade=clamp(1.5-fw/uLineW,0.0,1.0);
                float edgeK=1.0-uEdge*mix(avg,line,fade);
                float ao=mix(1.0,0.3+0.7*vAO,uAO);
                float kd=max(dot(n,uSunDir),0.0), kf=max(dot(n,uFillDir),0.0);
                vec3 hemi=mix(uGround,uSky,0.5*n.y+0.5);
                vec3 light=uAmbCol*uAmb+hemi*uHemi+uSunCol*uSun*kd+uFillCol*uFill*kf;
                vec3 c=vCol*light*0.8;
                vec3 vd=normalize(cameraPosition-vW), h=normalize(uSunDir+vd);
                c+=uSunCol*uSun*uGloss*pow(max(dot(n,h),0.0),48.0)*kd;
                c*=edgeK*ao;
                gl_FragColor=vec4(c,1.0);
                #include <tonemapping_fragment>
                #include <encodings_fragment>
                gl_FragColor.rgb=mix(gl_FragColor.rgb,uFogCol,smoothstep(uFogNear,uFogFar,vFogD));
            }`
    });
}
function syncFaceUniforms(){
    if(!faceMat) return;
    const u = faceMat.uniforms;
    u.uEdge.value = VCFG.edgeLines; u.uLineW.value = VCFG.lineWidth; u.uAO.value = VCFG.aoStrength;
    u.uSun.value = VCFG.sun; u.uAmb.value = VCFG.ambient; u.uGloss.value = VCFG.gloss;
    u.uSunDir.value.copy(sun.position).normalize();
    u.uSky.value.copy(scene.background); u.uFogCol.value.copy(scene.fog.color);
    u.uFogNear.value = scene.fog.near; u.uFogFar.value = scene.fog.far;
    u.uGround.value.copy(TER_BASE);
}
const QUAD = new Float32Array([-0.5,-0.5,0, 0.5,-0.5,0, -0.5,0.5,0, 0.5,0.5,0]);
function makeSetMesh(set){                                          // waaa_5
    const g = new THREE.InstancedBufferGeometry();
    g.setIndex([0,1,3, 0,3,2]);
    g.setAttribute('position', new THREE.BufferAttribute(QUAD,3));
    g.setAttribute('aPos', new THREE.InstancedBufferAttribute(set.pos,4));
    g.setAttribute('aCol', new THREE.InstancedBufferAttribute(set.col,4,true));
    g.setAttribute('aAO',  new THREE.InstancedBufferAttribute(set.ao,4,true));
    g.instanceCount = set.count;
    const m = new THREE.Mesh(g, faceMat);
    m.frustumCulled = false; m.visible = false;
    return { level:set.level, count:set.count, mesh:m };
}
function disposeSet(s){ if(s.chunks) s.chunks.forEach(c=>c.mesh.geometry.dispose()); else s.mesh.geometry.dispose(); }
function clearStructure(){
    STRUCT.jobId++;                                      // invalidate any in-flight build reply
    voxWorker.postMessage({type:'cancel',jobId:STRUCT.jobId});
    STRUCT.sets.forEach(s=>{ scene.remove(s.mesh); disposeSet(s); });
    STRUCT.sets = []; STRUCT.msg = null; STRUCT.bbox = null; STRUCT.level = -1; STRUCT.cubes = 0;
    STRUCT.building = false; STRUCT.carvePending = 0; STRUCT.cuts = []; STRUCT.restoreCuts = []; STRUCT.replaying = false;
    if(typeof carveRayRequests!=='undefined') carveRayRequests.clear();
    BUB.ready = false; BUB.pending = false; BUB.id++;
    voxAim.ok = false;
}
function applySets(msg){                                            // waaa_5 applySets, world-only
    if(!faceMat) faceMat = makeFaceMaterial();
    STRUCT.sets.forEach(s=>{ scene.remove(s.mesh); disposeSet(s); });
    STRUCT.sets = msg.sets.filter(s=>s.count>0).map(makeSetMesh);
    if(msg.chunks && msg.chunks.length){
        const g = new THREE.Group(); g.visible = false;
        const map = new Map(); let count = 0;
        msg.chunks.forEach(c=>{ const m = makeSetMesh(c).mesh; m.visible = true; g.add(m); map.set(c.id, { mesh:m, count:c.count }); count += c.count; });
        STRUCT.sets.push({ level:msg.chunkLevel, count, mesh:g, chunks:map });
    }
    STRUCT.sets.forEach(s=>scene.add(s.mesh));
    STRUCT.bbox = msg.bbox || null; STRUCT.level = -1; STRUCT.cubes = msg.cubes || 0;
    placeStructure();
    pickLevel();
}
// set it out in the world: distance + bearing from the duel ring, sunk into the terrain by "bury"
function placeStructure(){
    const a = THREE.MathUtils.degToRad(VCFG.angle), sd = VCFG.dist*WORLD.scale;
    const x = Math.cos(a)*sd, z = Math.sin(a)*sd;
    const bb = STRUCT.bbox, hgt = bb ? bb[4]-bb[1] : VCFG.span*0.5;
    let fl = Infinity;
    const r = bb ? Math.max(bb[3]-bb[0], bb[5]-bb[2])*0.5 : VCFG.span*0.3;
    for(const [dx,dz] of [[0,0],[r,0],[-r,0],[0,r],[0,-r]]) fl = Math.min(fl, floorY(x+dx, z+dz));
    STRUCT.off.set(x, fl - VCFG.bury*hgt, z);
    BUB.force = true;
}
const _pl = new THREE.Vector3();
function pickLevel(){                                               // waaa_5 LOD: coarse far away, finest up close
    if(!STRUCT.sets.length) return;
    let pick = STRUCT.sets[STRUCT.sets.length-1];
    const bb = STRUCT.bbox;
    if(VCFG.lodPx > 0 && bb){
        const o = STRUCT.off, cp = camera.position;
        _pl.set(Math.min(Math.max(cp.x, bb[0]+o.x), bb[3]+o.x), Math.min(Math.max(cp.y, bb[1]+o.y), bb[4]+o.y), Math.min(Math.max(cp.z, bb[2]+o.z), bb[5]+o.z));
        const dist = Math.max(cp.distanceTo(_pl), 1), pr = renderer.getPixelRatio();
        const pxPerUnit = (cc.clientHeight*pr)/(2*dist*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
        pick = STRUCT.sets[0];
        for(const s of STRUCT.sets) if((VCFG.span/(1<<s.level))*pxPerUnit >= VCFG.lodPx*pr) pick = s;
    }
    if(pick.level !== STRUCT.level){ STRUCT.sets.forEach(s=>s.mesh.visible = (s===pick)); STRUCT.level = pick.level; }
}
function sendView(key){                                             // waaa_5 drawView: square n×n to the worker
    const n = VCFG.imgSize|0, c = document.createElement('canvas'); c.width = n; c.height = n;
    const cx = c.getContext('2d', { willReadFrequently:true });
    if(SRC[key]) cx.drawImage(SRC[key], 0, 0, n, n);
    else { cx.fillStyle = '#1A1C1B'; cx.fillRect(0,0,n,n); }
    voxWorker.postMessage({ type:'update_image', view:key, imgData:cx.getImageData(0,0,n,n) });
}
function requestStructure(preserveReplay=false){
    if(!SRC.front || !SRC.side){ clearStructure(); return; }        // the builder needs at least front + side
    VIEW_ORDER.forEach(sendView);
    STRUCT.cuts = []; STRUCT.replaying = false; STRUCT.carvePending = 0;
    if(!preserveReplay) STRUCT.restoreCuts = [];
    STRUCT.jobId++; STRUCT.building = true;
    const cfg = Object.assign({}, VCFG, { span:VCFG.span*WORLD.scale });
    voxWorker.postMessage({ type:'build', cfg, jobId:STRUCT.jobId });
}
let _rebuildT = 0;
const rebuildStructureSoon = () => { clearTimeout(_rebuildT); _rebuildT = setTimeout(requestStructure, 250); };

// ── collision bubble (waaa_5): the worker streams a small grid of solid cells around you ──
const BUB_H = 128, BUB_REFRESH = 0.35;
const BUB = { ready:false, n:0, c:1, ox:0, oy:0, oz:0, grid:null, center:new THREE.Vector3(), pending:false, id:0, force:false };
// world → bubble cell (bubble coords are the worker's local coords; STRUCT.off places them)
const cellX = wx => Math.floor((wx - STRUCT.off.x - BUB.ox)/BUB.c);
const cellY = wy => Math.floor((wy - STRUCT.off.y - BUB.oy)/BUB.c);
const cellZ = wz => Math.floor((wz - STRUCT.off.z - BUB.oz)/BUB.c);
const wCenterX = c => STRUCT.off.x + BUB.ox + (c+0.5)*BUB.c;
const wCenterY = c => STRUCT.off.y + BUB.oy + (c+0.5)*BUB.c;
const wCenterZ = c => STRUCT.off.z + BUB.oz + (c+0.5)*BUB.c;
function solidVox(wx, wy, wz){
    if(!BUB.ready) return 0;
    const x = cellX(wx), y = cellY(wy), z = cellZ(wz), n = BUB.n;
    if(x<0 || y<0 || z<0 || x>=n || y>=n || z>=n) return 0;
    return BUB.grid[(y*n + z)*n + x];
}
const _pred = new THREE.Vector3();
function nearStructure(p, pad){
    const bb = STRUCT.bbox; if(!bb) return false;
    const o = STRUCT.off;
    return p.x > bb[0]+o.x-pad && p.x < bb[3]+o.x+pad && p.y > bb[1]+o.y-pad && p.y < bb[4]+o.y+pad && p.z > bb[2]+o.z-pad && p.z < bb[5]+o.z+pad;
}
function maintainBubble(){
    if(BUB.pending || !STRUCT.msg || !STRUCT.cubes) return;
    _pred.copy(player.pos).addScaledVector(player.vel, 0.25);
    if(!nearStructure(_pred, BUB_H*2)) return;
    if(BUB.ready && !BUB.force && _pred.distanceTo(BUB.center) < BUB_H*BUB_REFRESH) return;
    BUB.pending = true; BUB.force = false; BUB.id++;
    voxWorker.postMessage({ type:'bubble', id:BUB.id, cx:_pred.x-STRUCT.off.x, cy:_pred.y-STRUCT.off.y, cz:_pred.z-STRUCT.off.z, H:BUB_H });
}
function onBubble(m){
    if(m.id !== BUB.id) return;
    BUB.pending = false;
    if(!m.ok) return;
    BUB.n = m.n; BUB.c = m.c; BUB.ox = m.ox; BUB.oy = m.oy; BUB.oz = m.oz; BUB.grid = m.grid;
    BUB.center.set(m.cx + STRUCT.off.x, m.cy + STRUCT.off.y, m.cz + STRUCT.off.z); BUB.ready = true;
}

// ── rope ray (waaa_5): DDA through every real cube, in the worker. ~10 aim rays a second
//    keep the crosshair honest; the rope fires at the latest answer.
const voxAim = { ok:false, dist:0, t:0, p:new THREE.Vector3() };
const _cutPoint = new THREE.Vector3();
const carveRayRequests = new Map();
let _rayTaskId = 0, _lastVoxelCut = 0;
let _aimId = 0, _lastAimT = 0;
const _rd = new THREE.Vector3();
function requestVoxAim(now){
    if(!STRUCT.cubes || now - _lastAimT < 100) return;
    _lastAimT = now; _aimId++;
    camera.getWorldDirection(_rd);
    const o = camera.position;
    voxWorker.postMessage({ type:'ray', tag:'aim', id:_aimId, ox:o.x-STRUCT.off.x, oy:o.y-STRUCT.off.y, oz:o.z-STRUCT.off.z,
        dx:_rd.x, dy:_rd.y, dz:_rd.z, maxDist:M.maxRopeDist });
}
function onRay(m){
    if(m.tag === 'aim'){
        if(m.id !== _aimId) return;
        voxAim.ok = !!m.ok; voxAim.t = performance.now();
        if(m.ok){ voxAim.dist = m.dist; voxAim.p.set(m.px + STRUCT.off.x, m.py + STRUCT.off.y, m.pz + STRUCT.off.z); }
        return;
    }
    if(m.tag === 'carve'){
        const req = carveRayRequests.get(m.id); if(!req) return;
        carveRayRequests.delete(m.id);
        if(req.jobId !== STRUCT.jobId || !m.ok || STRUCT.building || STRUCT.replaying || !STRUCT.cubes) return;
        const hit = new THREE.Vector3(m.px + req.off.x, m.py + req.off.y, m.pz + req.off.z);
        camera.updateMatrixWorld(true);
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).normalize();
        const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1).normalize();
        const pxWorld = 2*Math.max(1,m.dist)*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))/Math.max(1,cc.clientHeight);
        const delta = right.multiplyScalar(req.dx*pxWorld).addScaledVector(up, -req.dy*pxWorld);
        const maxLen = Math.max(30, Math.min(500*WORLD.scale, VCFG.span*0.6*WORLD.scale));
        if(delta.length() > maxLen) delta.setLength(maxLen);
        if(delta.lengthSq() < 1) return;
        const a = hit.clone().addScaledVector(delta, -0.5), b = hit.clone().addScaledVector(delta, 0.5);
        const id = ++STRUCT.carveId;
        STRUCT.carvePending++;
        voxWorker.postMessage({ type:'carve', id, gen:STRUCT.jobId,
            ax:a.x-req.off.x, ay:a.y-req.off.y, az:a.z-req.off.z,
            bx:b.x-req.off.x, by:b.y-req.off.y, bz:b.z-req.off.z,
            r:VCFG.cutRadius*WORLD.scale });
        return;
    }
}

function applyCarvedMessage(msg){
    if(msg.gen !== STRUCT.jobId) return;
    STRUCT.carvePending = Math.max(0,STRUCT.carvePending-1);
    const fine = STRUCT.sets.find(s=>s.chunks);
    if(fine && msg.chunks && msg.chunks.length){
        for(const c of msg.chunks){
            const old = fine.chunks.get(c.id);
            if(old){ fine.mesh.remove(old.mesh); old.mesh.geometry.dispose(); fine.chunks.delete(c.id); fine.count -= old.count; }
            if(c.count>0){
                const next = makeSetMesh(c); next.mesh.visible = true; fine.mesh.add(next.mesh);
                fine.chunks.set(c.id, {mesh:next.mesh, count:c.count}); fine.count += c.count;
            }
        }
    }
    STRUCT.cubes = msg.cubes || 0;
    if(msg.cut > 0){
        const cut = {ax:msg.ax,ay:msg.ay,az:msg.az,bx:msg.bx,by:msg.by,bz:msg.bz,r:msg.r};
        STRUCT.cuts.push(cut);
        const d = msg.debris;
        if(d && d.length){
            const stride = 7, samples = Math.min(80, Math.ceil(d.length/stride));
            for(let j=0;j<samples;j++){
                const i = j*stride* Math.max(1,Math.ceil(d.length/(stride*samples)));
                if(i+6>=d.length) break;
                _cutPoint.set(d[i]+STRUCT.off.x, d[i+1]+STRUCT.off.y, d[i+2]+STRUCT.off.z);
                emitDust(_cutPoint, 1, Math.min(200, 35+d[i+3]*1.5));
            }
        }
        if(!STRUCT.replaying) showToast('structure cut · '+msg.cut+' cubes');
    }
    BUB.ready = false; BUB.pending = false; BUB.force = true; BUB.id++;
    voxAim.ok = false; _lastAimT = 0;
    updateForgeStats();
}
function processRecipeCut(){
    if(!STRUCT.restoreCuts.length){
        STRUCT.replaying = false;
        if(STRUCT.cuts.length) showToast('world restored · '+STRUCT.cuts.length+' cuts');
        updateForgeStats(); return;
    }
    STRUCT.replaying = true;
    const c = STRUCT.restoreCuts.shift(), id = ++STRUCT.carveId;
    STRUCT.carvePending++;
    voxWorker.postMessage({type:'carve',id,gen:STRUCT.jobId,ax:c.ax,ay:c.ay,az:c.az,bx:c.bx,by:c.by,bz:c.bz,r:c.r});
}

voxWorker.onmessage = e => {
    const msg = e.data;
    if(msg.type === 'bubble'){ onBubble(msg); return; }
    if(msg.type === 'ray'){ onRay(msg); return; }
    if(msg.type === 'carved'){ if(msg.gen === STRUCT.jobId){ applyCarvedMessage(msg); if(STRUCT.replaying) processRecipeCut(); } return; }
    if(msg.jobId !== STRUCT.jobId) return;
    if(msg.type === 'error'){ STRUCT.building = false; showToast('structure failed: ' + msg.message); return; }
    if(msg.type !== 'done') return;
    STRUCT.msg = msg; STRUCT.building = !!msg.partial;
    applySets(msg);
    BUB.force = true; BUB.ready = false;
    if(!msg.partial){
        _builtWorldScale = WORLD.scale;
        if(STRUCT.restoreCuts.length) processRecipeCut();
        else showToast(msg.cubes ? 'something stands out there' : 'no structure in those photos');
    }
};

// ╔══════════════════════════════════════════════════════════╗
// ║ [ODM] PHYSICS — locked formulas + tumble + hitbox statics ║
// ╚══════════════════════════════════════════════════════════╝
function physics(dt){
    if(dt <= 0) return;
    maintainBubble();
    player.vel.y += M.gravity*dt*(wall.on ? M.wallRunGravity : 1);

    const tumbling = player.tumble > 0;
    const ctl = tumbling ? 0.15 : 1;

    let mx = 0, mz = 0;
    if(stickL.on){ mx = stickL.dx; mz = stickL.dy; }
    const mv = _mv.set(mx,0,mz);
    if(mv.lengthSq() > 1) mv.normalize();
    mv.applyAxisAngle(_UP, player.yaw);

    const gY = floorY(player.pos.x, player.pos.z) + M.height;
    const onGround = player.pos.y <= gY + 0.5;
    const accel = (onGround ? M.accelGround : M.accelAir)*ctl;
    player.vel.x += mv.x*accel*dt;
    player.vel.z += mv.z*accel*dt;

    const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
    const sideSpeed = player.vel.x*fwdZ - player.vel.z*fwdX;
    let targetRoll = THREE.MathUtils.clamp(sideSpeed*M.rollScale, -M.rollMax, M.rollMax);
    if(wall.on){
        // lean away from the wall (waaa_5; sign flipped because this camera rolls by -roll)
        const side = wall.nx*Math.cos(player.yaw) - wall.nz*Math.sin(player.yaw);
        targetRoll = Math.sign(side)*M.wallTilt;
    }
    player.roll = THREE.MathUtils.lerp(player.roll, targetRoll, wall.on ? 0.12 : 0.08);

    player.boostIntensity = 0;
    if(stickL.on && !tumbling){
        const mag = Math.sqrt(stickL.dx*stickL.dx + stickL.dy*stickL.dy);
        if(mag > 0.05 && (-stickL.dy/mag) > M.boostCone) player.boostIntensity = (-stickL.dy/mag)*mag;
    }
    if(player.boostIntensity > 0){ camera.getWorldDirection(_fwd); player.vel.addScaledVector(_fwd, M.boostAccel*player.boostIntensity*dt); }
    const _boost = player.boostIntensity > 0.05;
    if(_boost !== _lastBoost){ EL.knobLEl.classList.toggle('boost', _boost); _lastBoost = _boost; }

    if(grapple.active){
        if(grapple.trackTarget){
            const tgt = grapple.trackTarget;
            if(tgt === MKE){ if(!MKE.on || !MKE.built) releaseGrapple(); else grapple.anchor.copy(MKE.pos); }
            else if(!titans.includes(tgt) || tgt.state === 'DEAD') releaseGrapple();
            else grapple.anchor.copy(tgt.pos);
        }
        if(grapple.active){
            _toA.subVectors(grapple.anchor, player.pos);
            const dist = _toA.length(); _toA.normalize();
            player.vel.addScaledVector(_toA, M.hookPull*(dist/M.ropeNorm)*dt);
            updateRope();
        }
    }

    player.vel.x *= Math.exp(-M.airDrag*dt);
    player.vel.z *= Math.exp(-M.airDrag*dt);
    player.vel.y *= Math.exp(-M.airDrag*0.12*dt);

    const spd = player.vel.length();
    if(spd > M.maxSpeed) player.vel.multiplyScalar(M.maxSpeed/spd);

    // move: near the structure, swept + sub-stepped against its cells (waaa_5's resolver);
    // everywhere else a plain step
    let voxGround = false;
    if(BUB.ready && nearStructure(player.pos, 60)){
        const r = M.radius, hh = M.height, Cc = BUB.c;
        const steps = Math.max(1, Math.min(12, Math.ceil(player.vel.length()*dt/(Cc*0.38))));
        const hdt = dt/steps;
        for(let sub=0; sub<steps; sub++){
            const ox = player.pos.x, oy = player.pos.y, oz = player.pos.z;
            const vx = player.vel.x, vy = player.vel.y, vz = player.vel.z;
            const nx = ox + vx*hdt, lx = nx + Math.sign(vx)*r;
            if(solidVox(lx, oy, oz)){
                const c = cellX(lx);
                player.pos.x = vx>0 ? wCenterX(c) - Cc*0.5 - r : wCenterX(c) + Cc*0.5 + r;
                if(vx>0) player.vel.x = Math.min(0, player.vel.x); else if(vx<0) player.vel.x = Math.max(0, player.vel.x);
            } else player.pos.x = nx;
            const nz = oz + vz*hdt, lz = nz + Math.sign(vz)*r;
            if(solidVox(player.pos.x, oy, lz)){
                const c = cellZ(lz);
                player.pos.z = vz>0 ? wCenterZ(c) - Cc*0.5 - r : wCenterZ(c) + Cc*0.5 + r;
                if(vz>0) player.vel.z = Math.min(0, player.vel.z); else if(vz<0) player.vel.z = Math.max(0, player.vel.z);
            } else player.pos.z = nz;
            const ny = oy + vy*hdt, ly = ny + Math.sign(vy)*hh;
            if(solidVox(player.pos.x, ly, player.pos.z)){
                const c = cellY(ly);
                if(vy>0) player.pos.y = wCenterY(c) - Cc*0.5 - hh;
                else { player.pos.y = wCenterY(c) + Cc*0.5 + hh; voxGround = true; }
                if(vy>0) player.vel.y = Math.min(0, player.vel.y); else if(vy<0) player.vel.y = Math.max(0, player.vel.y);
            } else player.pos.y = ny;
        }
    } else player.pos.addScaledVector(player.vel, dt);

    // static AABB collisions
    let onTop = false;
    for(const s of staticsNear(player.pos.x, player.pos.z, M.radius + 2)){
        const bodyBottom = player.pos.y-M.height, bodyTop = player.pos.y+M.height;
        if(bodyTop < s.baseY || bodyBottom > s.topY) continue;
        const dx = player.pos.x-s.x, dz = player.pos.z-s.z;
        const hw = s.hw+M.radius, hd = s.hd+M.radius;
        if(Math.abs(dx) > hw || Math.abs(dz) > hd) continue;
        const ox = hw-Math.abs(dx), oz = hd-Math.abs(dz);
        const oy = s.topY-bodyBottom;
        if(player.vel.y <= 0 && oy < ox && oy < oz){
            const vImpact = -player.vel.y;
            player.pos.y = s.topY+M.height; player.vel.y = 0; onTop = true;
            if(vImpact > M.tumbleThresh) startTumble(vImpact, new THREE.Vector3(0,1,0));
        } else if(ox < oz){
            const vImpact = Math.abs(player.vel.x);
            player.pos.x += dx<0 ? -ox : ox;
            if(vImpact > M.tumbleThresh){ startTumble(vImpact, new THREE.Vector3(Math.sign(dx),0,0)); player.vel.x = -player.vel.x*0.3; }
            else player.vel.x = 0;
        } else {
            const vImpact = Math.abs(player.vel.z);
            player.pos.z += dz<0 ? -oz : oz;
            if(vImpact > M.tumbleThresh){ startTumble(vImpact, new THREE.Vector3(0,0,Math.sign(dz))); player.vel.z = -player.vel.z*0.3; }
            else player.vel.z = 0;
        }
    }

    // soft world edge, hidden in the fog
    { const hd = Math.hypot(player.pos.x, player.pos.z), lim = WORLD.half;
      if(hd > lim){ const nx = player.pos.x/hd, nz = player.pos.z/hd;
          player.pos.x = nx*lim; player.pos.z = nz*lim;
          const vo = player.vel.x*nx + player.vel.z*nz; if(vo > 0){ player.vel.x -= nx*vo; player.vel.z -= nz*vo; } } }
    const gY2 = floorY(player.pos.x, player.pos.z) + M.height;
    if(player.pos.y <= gY2){
        const vImpact = -player.vel.y;
        player.pos.y = gY2; player.vel.y = 0;
        if(vImpact > M.tumbleThresh*1.4) startTumble(vImpact, new THREE.Vector3(0,1,0));
        player.vel.x *= Math.exp(-M.groundFric*dt);
        player.vel.z *= Math.exp(-M.groundFric*dt);
    }

    // ── wall run (waaa_5) ─────────────────────────────────────
    // Airborne, brushing a pillar, moving along it fast enough → you catch it:
    // gravity eases, you hug the wall, the camera leans away. It runs out
    // after wallRunTime. Landing resets it. Pillars are axis-aligned boxes.
    const grounded = player.pos.y <= floorY(player.pos.x, player.pos.z) + M.height + 0.5 || onTop || voxGround;
    if(wall.cool > 0) wall.cool -= dt;
    if(wall.coyote > 0) wall.coyote -= dt;
    if(grounded) wall.t = 0;
    {
        const px = player.pos.x, py = player.pos.y, pz = player.pos.z, r = M.radius;
        const reach = r + 12;                       // ~1.2 m of contact slack
        const hit = (dx,dz) => { for(let k=r+0.9; k<=reach+1e-6; k+=1.5) if(solidAt(px+dx*k, py, pz+dz*k)) return true; return false; };
        let bx = 0, bz = 0;
        if(hit(1,0)) bx = -1; else if(hit(-1,0)) bx = 1;
        if(hit(0,1)) bz = -1; else if(hit(0,-1)) bz = 1;
        // pick the wall you're running ALONG (most speed parallel to it), not one you're flying into
        let wnx = 0, wnz = 0, along = 0;
        if(bx && Math.abs(player.vel.z) > along){ wnx = bx; wnz = 0; along = Math.abs(player.vel.z); }
        if(bz && Math.abs(player.vel.x) > along){ wnx = 0; wnz = bz; along = Math.abs(player.vel.x); }
        const canRun = !grounded && !tumbling && (wnx || wnz) && along > M.wallRunMinSpeed && wall.cool <= 0 && wall.t < M.wallRunTime;
        if(canRun){
            if(!wall.on) player.vel.y = Math.max(player.vel.y*0.3, 0);        // catching the wall kills the fall
            if(wall.nx !== wnx || wall.nz !== wnz) wall.t = 0;                // new wall, fresh run
            wall.on = true; wall.nx = wnx; wall.nz = wnz; wall.t += dt;
            const into = player.vel.x*wnx + player.vel.z*wnz;               // remove motion into the wall
            if(into < 0){ player.vel.x -= into*wnx; player.vel.z -= into*wnz; }
            player.vel.x -= wnx*M.wallStick*dt; player.vel.z -= wnz*M.wallStick*dt;   // hug it
        } else if(wall.on){
            wall.on = false; wall.coyote = 0.2; wall.cnx = wall.nx; wall.cnz = wall.nz;   // brief grace to still jump
        }
    }

    // camera
    _eye.copy(player.pos); _eye.y += M.eyeOffset;
    camTarget.lerp(_eye, M.camLag);
    camera.position.copy(camTarget);

    if(tumbling){
        player.tumble -= dt;
        player.pitch += player.tumbleVel.x*dt; player.yaw += player.tumbleVel.y*dt; player.roll += player.tumbleVel.z*dt;
        const dec = Math.exp(-2.2*dt); player.tumbleVel.multiplyScalar(dec);
        if(player.tumble <= 0){
            player.tumble = 0;
            player.pitch = THREE.MathUtils.clamp(((player.pitch+Math.PI)%(2*Math.PI))-Math.PI, -PI_2, PI_2);
            player.roll = player.roll%(2*Math.PI);
            document.getElementById('tumble-fx').classList.remove('on');
        }
    }
    camera.rotation.y = player.yaw; camera.rotation.x = player.pitch; camera.rotation.z = -player.roll;

    if(stickR.on && !tumbling){
        player.yaw -= stickR.dx*M.stickSens;
        player.pitch -= stickR.dy*M.stickSens;
        player.pitch = Math.max(-PI_2, Math.min(PI_2, player.pitch));
    } else if(!tumbling){
        const m = Math.abs(stickR.momX)+Math.abs(stickR.momY);
        if(m > 0.0005){
            const fd = Math.exp(-M.groundFric*dt);
            stickR.momX *= fd; stickR.momY *= fd;
            player.yaw -= stickR.momX*M.stickSens;
            player.pitch -= stickR.momY*M.stickSens;
            player.pitch = Math.max(-PI_2, Math.min(PI_2, player.pitch));
        } else { stickR.momX = 0; stickR.momY = 0; }
    }

    const targetHFov = M.hFov + Math.min(M.hFovMax-M.hFov, spd*(M.hFovMax-M.hFov)/M.maxSpeed*1.4);
    const fovRate = currentHFov < targetHFov ? M.fovExpandRate : M.fovRecoverRate;
    currentHFov += (targetHFov-currentHFov)*fovRate;
    setHFov(currentHFov);

    if(++_hudTick >= 6){
        _hudTick = 0;
        EL.spd.textContent = spd.toFixed(0);
        EL.alt.textContent = (player.pos.y-M.height).toFixed(0);
        EL.hits.textContent = hitCount;
        EL.hp.textContent = titan ? (titan.state !== 'DEAD' ? Math.max(0,Math.ceil(titan.hp))+'/'+titan.hpMax : 'down') : '-';
        EL.ts.textContent = titan && titan.state !== 'DEAD' && titan.state !== 'IDLE' && titan.state !== 'TRACK' ? titan.state.toLowerCase() : '';
        EL.taken.textContent = takenCount; EL.kills.textContent = killCount;
        const txt = tumbling ? '!! tumbling !!' : wall.on ? 'wall run' : _boost ? 'boost' : grapple.active ? (grapple.trackTarget ? 'locked on' : 'anchored') : grounded ? 'grounded' : 'air';
        if(txt !== _lastStatus){ EL.status.textContent = txt; EL.status.classList.toggle('tumbling', tumbling); _lastStatus = txt; }
    }
    scanHit();
}

// ╚══════════════════════════════════════════════════════════╝
// CORE_FORGE: curve < 1 touchy near center, > 1 soft center / snappy edge
function normStick(rawDx, rawDy, curve){
    const R = M.stickRadius, dist = Math.sqrt(rawDx*rawDx + rawDy*rawDy);
    if(dist === 0) return { dx:0, dy:0, vx:0, vy:0, mag:0 };
    const cap = Math.min(dist,R), lin = cap/R, nx = rawDx/dist, ny = rawDy/dist;
    const cm = (!curve || curve === 1) ? lin : Math.pow(lin, curve);
    return { dx:nx*cm, dy:ny*cm, vx:nx, vy:ny, mag:lin };
}
function joyBounds(el){ const r = el.getBoundingClientRect(); return { cx:r.left+r.width/2, cy:r.top+r.height/2, r:r.width/2+24 }; }

const joyL = document.getElementById('joyL'), joyR = document.getElementById('joyR');
const knobL = document.getElementById('knobL'), knobR = document.getElementById('knobR');
const isUI = e => e.target.closest('#ui-deck') || e.target.closest('#deck-pull');
const JOY = { size:80, side:50, bottom:30 };
function setJoyLayout(){
    for(const el of [joyL, joyR]){ el.style.width = JOY.size+'px'; el.style.height = JOY.size+'px'; el.style.bottom = JOY.bottom+'px'; }
    joyL.style.left = JOY.side+'px'; joyR.style.right = JOY.side+'px';
    const k = JOY.size*0.45; for(const el of [knobL, knobR]){ el.style.width = k+'px'; el.style.height = k+'px'; }
    M.stickRadius = Math.round(JOY.size*1.6);          // input travel scales with the pad
}
setJoyLayout();

document.addEventListener('touchstart', e => {
    if(APP === 'forge'){ if(e.target.closest('#forge-ui .ui-block')) return; e.preventDefault(); orbitTouch(e, 'start'); return; }
    if(isUI(e)) return;
    e.preventDefault();
    for(const t of e.changedTouches){
        const lb = joyBounds(joyL);
        if(!stickL.on && Math.hypot(t.clientX-lb.cx, t.clientY-lb.cy) < lb.r){ stickL.on = true; stickL.id = t.identifier; stickL.cx = lb.cx; stickL.cy = lb.cy; if(wall.on || wall.coyote > 0) wallJump(); continue; }
        const rb = joyBounds(joyR);
        if(!stickR.on && Math.hypot(t.clientX-rb.cx, t.clientY-rb.cy) < rb.r){ stickR.on = true; stickR.id = t.identifier; stickR.cx = rb.cx; stickR.cy = rb.cy; stickR.momX = 0; stickR.momY = 0; knobR.classList.add('active'); fireGrapple(); continue; }
        if(wall.on || wall.coyote > 0) wallJump();      // anywhere else: wall jump, and the start of a swipe
        slashTouches[t.identifier] = [{ x:t.clientX, y:t.clientY, age:0 }];
        slashHistory.push({ x:t.clientX, y:t.clientY, age:0 });
    }
}, { passive:false });

document.addEventListener('touchmove', e => {
    if(APP === 'forge'){ if(e.target.closest('#forge-ui .ui-block')) return; e.preventDefault(); orbitTouch(e, 'move'); return; }
    if(isUI(e)) return;
    e.preventDefault();
    const KT = M.stickRadius*0.6;
    for(const t of e.changedTouches){
        if(t.identifier === stickL.id){ const n = normStick(t.clientX-stickL.cx, t.clientY-stickL.cy, M.moveCurve); stickL.dx = n.dx; stickL.dy = n.dy; knobL.style.transform = `translate(calc(-50% + ${n.vx*n.mag*KT}px), calc(-50% + ${n.vy*n.mag*KT}px))`; }
        if(t.identifier === stickR.id){ const n = normStick(t.clientX-stickR.cx, t.clientY-stickR.cy, M.lookCurve); stickR.dx = n.dx; stickR.dy = n.dy; knobR.style.transform = `translate(calc(-50% + ${n.vx*n.mag*KT}px), calc(-50% + ${n.vy*n.mag*KT}px))`; }
        if(slashTouches[t.identifier]){
            slashTouches[t.identifier].push({ x:t.clientX, y:t.clientY, age:0 });
            slashHistory.push({ x:t.clientX, y:t.clientY, age:0 });
            if(slashTouches[t.identifier].length > C.swipeFrames) slashTouches[t.identifier].shift();
        }
    }
}, { passive:false });

function endTouches(e){
    if(APP === 'forge'){ orbitTouch(e, 'end'); return; }
    for(const t of e.changedTouches){
        if(t.identifier === stickL.id){ stickL.on = false; stickL.id = null; stickL.dx = 0; stickL.dy = 0; knobL.style.transform = 'translate(-50%,-50%)'; knobL.classList.remove('boost'); }
        if(t.identifier === stickR.id){ stickR.momX = stickR.dx; stickR.momY = stickR.dy; stickR.on = false; stickR.id = null; stickR.dx = 0; stickR.dy = 0; knobR.style.transform = 'translate(-50%,-50%)'; knobR.classList.remove('active'); releaseGrapple(); }
        if(slashTouches[t.identifier]){ trySlash(slashTouches[t.identifier]); delete slashTouches[t.identifier]; }
    }
}
document.addEventListener('touchend', endTouches, { passive:false });
document.addEventListener('touchcancel', endTouches, { passive:false });

// ║ [TERRAIN JSON] the composer export DEPTH_FORGE v2 and     ║
// ║ CORE_FORGE write (exportMeta + vertexDataMatrix), read    ║
// ║ exactly the way CORE_FORGE reads it: elevation as-is, so  ║
// ║ the export's Z-scale carries over (crazy stays crazy).    ║
// ║ height slider = world height per 1.0 of elevation.        ║
// ║ Any other JSON: first 2-D grid of numbers, scaled 0→1.    ║
// ╚══════════════════════════════════════════════════════════╝
function parseLooseJSON(txt){
    txt = String(txt).replace(/^\uFEFF/, '').trim();
    try{ return JSON.parse(txt); }catch(_){}
    return JSON.parse(txt.replace(/\bNaN\b|-?\bInfinity\b/g, 'null'));      // Python-style dumps
}
function findGrid(o, depth){
    if(depth > 5 || !o || typeof o !== 'object') return null;
    if(Array.isArray(o) && o.length >= 2 && Array.isArray(o[0]) && o[0].length >= 2 && typeof o[0][0] === 'number'){
        const w = o[0].length; if(o.every(r => Array.isArray(r) && r.length === w)) return o;
    }
    for(const k of Object.keys(o)){ const g = findGrid(o[k], depth+1); if(g) return g; }
    return null;
}
function terrainFromJSON(data, name){
    if(data && data.exportMeta && Array.isArray(data.vertexDataMatrix)){
        const m = data.exportMeta, pts = data.vertexDataMatrix;
        let d = +m.systemDensity || 0;
        if(!d) for(const p of pts) if(p && p.gridIndex) d = Math.max(d, p.gridIndex.x+1, p.gridIndex.y+1);
        if(d < 2) throw new Error('composer export has no grid');
        const elev = new Float32Array(d*d), col = new Float32Array(d*d*3); let hasC = false, mx = 0;
        for(const p of pts){
            const g = p && p.gridIndex; if(!g) continue;
            const x = g.x|0, y = g.y|0; if(x < 0 || y < 0 || x >= d || y >= d) continue;
            const i = y*d + x, e = +p.elevationNormalized; elev[i] = Number.isFinite(e) ? e : 0; if(elev[i] > mx) mx = elev[i];
            const c = p.colorRGB;
            if(Array.isArray(c)){ hasC = true; const k = (c[0]>1||c[1]>1||c[2]>1) ? 1/255 : 1; col[i*3] = c[0]*k; col[i*3+1] = c[1]*k; col[i*3+2] = c[2]*k; }
        }
        return { json:true, w:d, h:d, elev, max:mx, colors:hasC ? col : null, heights:null, label:`composer export ${d}×${d}` };
    }
    const g = findGrid(data, 0);
    if(!g) throw new Error(`no height grid in ${name}`);
    const h = g.length, w = g[0].length, elev = new Float32Array(w*h);
    let mn = Infinity, mx = -Infinity;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v = +g[y][x]; if(Number.isFinite(v)){ if(v<mn)mn=v; if(v>mx)mx=v; } }
    const r = mx - mn || 1;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v = +g[y][x]; elev[y*w+x] = Number.isFinite(v) ? (v-mn)/r : 0; }
    return { json:true, w, h, elev, max:1, colors:null, heights:null, label:`height grid ${w}×${h}` };
}
async function loadTerrainJSON(file){
    if(!file) return;
    setForgeStatus('reading ' + file.name);
    try{
        const txt = await file.text();
        TER.json = terrainFromJSON(parseLooseJSON(txt), file.name);
        rebuildWorld(2); updateForgeStats();
        showToast('terrain json · ' + TER.json.label);
    }catch(err){ showToast(String(err.message || err)); updateForgeStats(); }
}
function serialTerrainJSON(){
    if(!TER.json) return null;
    return {w:TER.json.w,h:TER.json.h,elev:Array.from(TER.json.elev||[]),max:Number.isFinite(TER.json.max)?TER.json.max:1,
        colors:TER.json.colors?Array.from(TER.json.colors):null,label:TER.json.label||'saved terrain'};
}
function applyKnownSettings(target, source){
    if(!target || !source || typeof source!=='object') return;
    for(const key of Object.keys(target)){
        if(!(key in source)) continue;
        const a=target[key], b=source[key];
        if(typeof a==='number' && typeof b==='number' && Number.isFinite(b)) target[key]=b;
        else if(typeof a==='string' && typeof b==='string') target[key]=b;
        else if(typeof a==='boolean' && typeof b==='boolean') target[key]=b;
        else if(a && typeof a==='object' && !Array.isArray(a) && b && typeof b==='object' && !Array.isArray(b)) applyKnownSettings(a,b);
    }
}
function exportWorldRecipe(){
    if(STRUCT.building || STRUCT.replaying || STRUCT.carvePending>0 || carveRayRequests.size){ showToast('wait for structure edits to finish'); return; }
    try{
        const photos={}; for(const k of VIEW_ORDER) photos[k]=SRC[k]?SRC[k].toDataURL('image/png'):null;
        const recipe={
            format:'ODM_WORLD_RECIPE', version:1, createdAt:new Date().toISOString(),
            settings:{worldScale:WORLD.scale, M, C, ATMO, VCFG, TCFG, WG, JOY, titanType:T.type, titanAI:T.ai, renderScale},
            photos, terrain:serialTerrainJSON(), cuts:STRUCT.cuts.map(c=>({...c})),
        };
        const blob=new Blob([JSON.stringify(recipe)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=url; a.download='ODM_WORLD_'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1500);
        showToast('world recipe exported');
    }catch(err){ showToast('save failed · '+String(err.message||err)); }
}
function canvasFromRecipeData(data){
    if(!data) return Promise.resolve(null);
    if(typeof data!=='string' || !/^data:image\/(png|jpeg|webp);base64,/i.test(data)) return Promise.reject(new Error('recipe contains an invalid photo'));
    return new Promise((resolve,reject)=>{
        const im=new Image(); im.onload=()=>{ try{resolve(shrinkImg(im));}catch(e){reject(e);} };
        im.onerror=()=>reject(new Error('could not decode a saved photo')); im.src=data;
    });
}
function restoreTerrainRecipe(data){
    if(!data) return null;
    const w=data.w|0,h=data.h|0,n=w*h;
    if(w<2||h<2||w>2048||h>2048||!Array.isArray(data.elev)||data.elev.length!==n) throw new Error('invalid terrain data in recipe');
    const elev=Float32Array.from(data.elev, v=>Number.isFinite(+v)?+v:0);
    let colors=null;
    if(Array.isArray(data.colors)){
        if(data.colors.length!==n*3) throw new Error('invalid terrain colors in recipe');
        colors=Float32Array.from(data.colors,v=>Number.isFinite(+v)?+v:0);
    }
    return {json:true,w,h,elev,max:Number.isFinite(+data.max)?+data.max:1,colors,heights:null,label:String(data.label||'saved terrain')};
}
async function loadWorldRecipe(file){
    if(!file) return;
    setForgeStatus('loading world recipe');
    try{
        const recipe=parseLooseJSON(await file.text());
        if(!recipe || recipe.format!=='ODM_WORLD_RECIPE' || recipe.version!==1) throw new Error('not an ODM WORLD recipe (version 1)');
        const st=recipe.settings||{};
        if(typeof st.worldScale==='number' && Number.isFinite(st.worldScale)) WORLD.scale=THREE.MathUtils.clamp(st.worldScale,0.4,3);
        applyKnownSettings(M,st.M); applyKnownSettings(C,st.C); applyKnownSettings(ATMO,st.ATMO);
        applyKnownSettings(VCFG,st.VCFG); applyKnownSettings(TCFG,st.TCFG); applyKnownSettings(WG,st.WG); applyKnownSettings(JOY,st.JOY);
        if(TYPES.includes(st.titanType)) T.type=st.titanType;
        if(typeof st.titanAI==='boolean') T.ai=st.titanAI;
        if(typeof st.renderScale==='number' && Number.isFinite(st.renderScale)) renderScale=THREE.MathUtils.clamp(st.renderScale,0.5,3);
        const photoData=recipe.photos||{};
        const images=await Promise.all(VIEW_ORDER.map(k=>canvasFromRecipeData(photoData[k])));
        VIEW_ORDER.forEach((k,i)=>SRC[k]=images[i]); forgeSel=-1;
        TER.json=restoreTerrainRecipe(recipe.terrain);
        const cuts=Array.isArray(recipe.cuts)?recipe.cuts.filter(c=>c && ['ax','ay','az','bx','by','bz','r'].every(k=>Number.isFinite(c[k])&&Math.abs(c[k])<1e7) && c.r>0).map(c=>({ax:c.ax,ay:c.ay,az:c.az,bx:c.bx,by:c.by,bz:c.bz,r:c.r})):[];
        releaseGrapple();
        for(const t of [...titans]) disposeTitan(t);
        titan=null;
        clearStructure(); STRUCT.restoreCuts=cuts;
        _builtWorldScale=WORLD.scale;
        gridFine.scale.setScalar(WORLD.scale); gridCoarse.scale.setScalar(WORLD.scale); ring.scale.setScalar(WORLD.scale);
        setJoyLayout(); applySky(); applySun(); ground.material.color.copy(GROUND_BASE).multiplyScalar(ATMO.groundBright);
        currentHFov=M.hFov; renderer.setPixelRatio(renderScale); resizeAll(); syncFaceUniforms();
        regenForest(); rebuildWorld(2);
        player.pos.set(...getPlayerStart()); player.vel.set(0,0,0); player.yaw=0; player.pitch=0; player.roll=0; player.tumble=0;
        wall.on=false; wall.t=0; wall.coyote=0; wall.cool=0;
        document.getElementById('tumble-fx').classList.remove('on'); camTarget.copy(player.pos);
        spawnTitan({boss:true,x:0,z:0,yaw:0}); spawnMinions();
        document.getElementById('btn-type').textContent='boss: '+T.type;
        document.getElementById('btn-ai').textContent='fights back: '+(T.ai?'on':'off');
        if(SRC.front&&SRC.side) requestStructure(cuts.length>0); else clearStructure();
        syncAllControls(); drawThumbs(); updateForgeStats();
        saveSettingsSoon();
        showToast('recipe loaded · rebuilding world');
    }catch(err){ setForgeStatus('recipe load failed'); showToast('load failed · '+String(err.message||err)); }
}
async function loadPhotos(files){
    const list = [...files].filter(f => !f.type || /^image\//.test(f.type)).slice(0, 4);
    if(!list.length){ showToast('no photos picked'); return; }
    if(files.length > 4) showToast('using the first four');
    setForgeStatus('reading photos');
    const out = [];
    for(const f of list){ try{ out.push(await decodeImage(f)); }catch(err){ showToast(String(err.message || err)); } }
    VIEW_ORDER.forEach((k,i) => SRC[k] = out[i] || null);
    forgeSel = -1; drawThumbs();
    photosChanged();
}
function photosChanged(){
    rebuildWorld(2);
    if(SRC.front && SRC.side){ STRUCT.building = true; requestStructure(); }
    else { clearStructure(); if(SRC.front) showToast('the structure needs front + side'); }
    updateForgeStats();
}
function drawThumbs(){
    const host = document.getElementById('forge-thumbs'); host.innerHTML = '';
    VIEW_ORDER.forEach((k, i) => {
        const d = document.createElement('div'); d.className = 'fthumb' + (i === forgeSel ? ' sel' : '');
        const c = document.createElement('canvas'); c.width = 64; c.height = 64;
        const cx = c.getContext('2d');
        if(SRC[k]){ const im = SRC[k], sc = Math.max(64/im.width, 64/im.height); cx.drawImage(im, (64-im.width*sc)/2, (64-im.height*sc)/2, im.width*sc, im.height*sc); }
        else { cx.fillStyle = '#16181c'; cx.fillRect(0,0,64,64); }
        const lb = document.createElement('span'); lb.textContent = k;
        d.appendChild(c); d.appendChild(lb);
        d.addEventListener('click', () => {
            if(forgeSel < 0){ forgeSel = i; drawThumbs(); return; }
            if(forgeSel !== i){                                     // swap two views
                const a = VIEW_ORDER[forgeSel], b = VIEW_ORDER[i], t = SRC[a]; SRC[a] = SRC[b]; SRC[b] = t;
                forgeSel = -1; drawThumbs(); photosChanged(); return;
            }
            forgeSel = -1; drawThumbs();
        });
        host.appendChild(d);
    });
}

// orbit camera: one finger turns, two fingers pinch to zoom and drag to pan
function updateOrbit(){
    const o = orbit, cp = Math.cos(o.pitch);
    camera.position.set(o.target.x + o.dist*cp*Math.sin(o.yaw), o.target.y + o.dist*Math.sin(o.pitch), o.target.z + o.dist*cp*Math.cos(o.yaw));
    const fl = floorY(camera.position.x, camera.position.z) + 20;
    if(camera.position.y < fl) camera.position.y = fl;
    camera.lookAt(o.target);
}
function orbitTouch(e, phase){
    const T = orbit.touches;
    if(phase === 'start') for(const t of e.changedTouches) T[t.identifier] = { x:t.clientX, y:t.clientY };
    if(phase === 'end'){ for(const t of e.changedTouches) delete T[t.identifier]; orbit.pinch = 0; orbit.mid = null; return; }
    if(phase !== 'move') return;
    const ids = Object.keys(T);
    if(ids.length === 1){
        const t = [...e.changedTouches].find(q => String(q.identifier) === ids[0]); if(!t) return;
        const p = T[ids[0]];
        orbit.yaw -= (t.clientX - p.x)*0.006;
        orbit.pitch = Math.max(0.03, Math.min(1.5, orbit.pitch + (t.clientY - p.y)*0.005));
        p.x = t.clientX; p.y = t.clientY;
    } else if(ids.length >= 2){
        for(const t of e.changedTouches) if(T[t.identifier]){ T[t.identifier].x = t.clientX; T[t.identifier].y = t.clientY; }
        const a = T[ids[0]], b = T[ids[1]];
        const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
        if(orbit.pinch) orbit.dist = Math.max(300, Math.min(60000, orbit.dist*orbit.pinch/d));
        if(orbit.mid){
            const k = orbit.dist*0.0018, sy = Math.sin(orbit.yaw), cy = Math.cos(orbit.yaw);
            const dx = (mx - orbit.mid.x)*k, dy = (my - orbit.mid.y)*k;
            orbit.target.x -= dx*cy + dy*sy; orbit.target.z -= -dx*sy + dy*cy;
            orbit.target.y = floorY(orbit.target.x, orbit.target.z);
        }
        orbit.pinch = d; orbit.mid = { x:mx, y:my };
    }
}
function focusOrbit(where){
    if(where === 'struct' && STRUCT.bbox){
        const bb = STRUCT.bbox, o = STRUCT.off;
        orbit.target.set(o.x + (bb[0]+bb[3])/2, o.y + (bb[1]+bb[4])*0.5, o.z + (bb[2]+bb[5])/2);
        orbit.dist = Math.max(1200, (bb[4]-bb[1])*2.2);
    } else { orbit.target.set(0, 0, 0); orbit.dist = 9000; }
}

function setApp(m){
    APP = m;
    const on = m === 'forge';
    document.getElementById('forge-ui').classList.toggle('on', on);
    for(const id of ['hud','xhair','joyL','joyR','slash-canvas','ui-deck','deck-pull']) document.getElementById(id).style.display = on ? 'none' : '';

        document.getElementById('ui-deck').classList.remove('open');

        stickL.dx = stickL.dy = 0; stickR.on = false; stickR.dx = stickR.dy = 0;
        orbit.touches = {}; setHFov(60);
        drawThumbs(); updateForgeStats();
        _forgeTick = setInterval(updateForgeStats, 600);
    } else {
        clearInterval(_forgeTick);
        camTarget.copy(player.pos);
    }
}

const forgeControls = [], deckControls = [];
function syncAllControls(){
    for(const c of [...forgeControls, ...deckControls]){ c.inp.value = c.def.get(); c.val.textContent = c.fmt(c.def.get()); }
}
(function buildForgeSliders(){
    const host = document.getElementById('forge-sliders');
    for(const [title, open, defs] of FORGE_GROUPS){
        const col = document.createElement('div'); col.className = 'col' + (open ? '' : ' closed');
        const lbl = document.createElement('div'); lbl.className = 'col-lbl'; lbl.textContent = title;
        lbl.addEventListener('click', () => col.classList.toggle('closed'));
        const body = document.createElement('div'); body.className = 'col-body';
        for(const def of defs){
            const row = document.createElement('div'); row.className = 'range-row';
            const l = document.createElement('div'); l.className = 'range-lbl';
            const val = document.createElement('span'); val.className = 'range-val';
            const fmt = v => def.step < 1 ? (+v).toFixed(def.step < 0.01 ? 4 : 2) : Math.round(v);
            val.textContent = fmt(def.get());
            l.textContent = def.lbl + ' '; l.appendChild(val);
            const inp = document.createElement('input');
            inp.type = 'range'; inp.min = def.min; inp.max = def.max; inp.step = def.step; inp.value = def.get();
            inp.addEventListener('input', e => { def.set(parseFloat(e.target.value)); val.textContent = fmt(def.get()); saveSettingsSoon(); });
            forgeControls.push({def, inp, val, fmt});
            row.appendChild(l); row.appendChild(inp); body.appendChild(row);
        }
        col.appendChild(lbl); col.appendChild(body); host.appendChild(col);
    }
})();
(function buildDeck(){
    const host = document.getElementById('deck-body');
    let total = 0;
    for(const [title, open, defs] of GROUPS){
        const col = document.createElement('div'); col.className = 'col' + (open ? '' : ' closed');
        const lbl = document.createElement('div'); lbl.className = 'col-lbl'; lbl.textContent = title;
        lbl.addEventListener('click', () => col.classList.toggle('closed'));
        const body = document.createElement('div'); body.className = 'col-body';
        for(const def of defs){
            const row = document.createElement('div'); row.className = 'range-row' + (CORE.has(def.lbl) ? ' core' : '');
            if(CORE.has(def.lbl)) col.classList.add('has-core');
            total++;
            const l = document.createElement('div'); l.className = 'range-lbl';
            const val = document.createElement('span'); val.className = 'range-val';
            const fmt = v => def.step < 1 ? (+v).toFixed(def.step < 0.01 ? 4 : 2) : Math.round(v);
            val.textContent = fmt(def.get());
            l.textContent = def.lbl + ' '; l.appendChild(val);
            const inp = document.createElement('input');
            inp.type = 'range'; inp.min = def.min; inp.max = def.max; inp.step = def.step; inp.value = def.get();
            inp.addEventListener('input', e => { def.set(parseFloat(e.target.value)); val.textContent = fmt(def.get()); saveSettingsSoon(); });
            deckControls.push({def, inp, val, fmt});
            row.appendChild(l); row.appendChild(inp); body.appendChild(row);
        }
        col.appendChild(lbl); col.appendChild(body); host.appendChild(col);
    }
    const btn = document.getElementById('deck-mode');
    btn.textContent = `all sliders (${total})`;
    btn.addEventListener('click', e => {
        e.stopPropagation();
        const all = host.classList.toggle('essentials') === false;
        btn.classList.toggle('on', all);
        btn.textContent = all ? 'essentials' : `all sliders (${total})`;
        saveSettingsSoon();

    });
})();

    let cols = null;

        const cc = typeof C[0] === 'number' ? (() => { const o = []; for(let i = 0; i+2 < C.length; i += 3) o.push([C[i], C[i+1], C[i+2]]); return o; })() : C;

    const up = MK.modelUp|0;

// ── rig: a loaded model is one rigid mesh, so it gets a soft zone skeleton (head, 2 arms, 2 legs)
//    linear-blend skinned on the CPU. Zones come from a few numbers (all in the deck, auto-guessed on load):
//    neck / shoulder / hip heights, how far out from the body axis the arms start, and how soft the edges are ──
function mkRigAuto(m){
    const n = m.n, p = m.pos;

}
function mkRigBuild(){
    const R = MKE.rig; if(!R) return;

// P: head yaw/pitch (hy, hp), arm swing angles (aL, aR; negative = forward/up, same as the box monkey), legs (lL, lR)
function mkRigApply(P){

function applyMonkeyModel(){
    if(!MKE.root) return;
    if(MKE.custom){ MKE.tilt.remove(MKE.custom); MKE.custom.geometry.dispose(); MKE.custom.material.dispose(); MKE.custom = null; }
    MKE.handLocal = null; MKE.rig = null;

}

    if(MKE.bgroup){ scene.remove(MKE.bgroup); MKE.bgroup.traverse(o => { if(o.geometry) o.geometry.dispose(); }); MKE.bgroup = null; }

function monkeyDropRope(silent){
    const r = MKE.rope;
    if(r.active && !silent) MKE.ropeCDt = MK.ropeCD/(0.5 + MKE.wild);
    r.active = false; r.t = null;
    if(MKE.ropeLine) MKE.ropeLine.visible = false;
}
function monkeyFireRope(type, t, anchor){
    const r = MKE.rope;
    r.active = true; r.type = type; r.t = t || null; r.time = 0;
    r.anchor.copy(anchor);
    if(MKE.ropeLine) MKE.ropeLine.visible = true;
    MKE.hopCD = Math.min(MKE.hopCD, 0.2);
    for(let i = 0, n = Math.round(8*MK.smokeScale); i < n; i++) mkPuff(anchor, _mkV.set((Math.random()-0.5)*24, 4 + Math.random()*16, (Math.random()-0.5)*24), 0.9);
}
function monkeyReach(){ return M.maxRopeDist*MK.reachScale*WORLD.scale; }
// a trunk / pillar / wall top in the direction it wants to go, above it, within reach
function monkeyPickAnchor(gx, gz){
    const p = MKE.pos, reach = monkeyReach(), size = MK.size;
    let dx = gx - p.x, dz = gz - p.z; const gl = Math.hypot(dx, dz) || 1; dx /= gl; dz /= gl;
    const near = staticsNear(p.x, p.z, reach*0.8).slice();
    let best = null, bestS = -Infinity;
    for(const s of near){
        if(s === MKE.rope.last) continue;
        if(s.topY - s.baseY < size*3 || s.topY < p.y + size*2) continue;
        const sx = s.x - p.x, sz = s.z - p.z, sd = Math.hypot(sx, sz);
        if(sd < size*3 || sd > reach*0.8) continue;
        const dot = (sx*dx + sz*dz)/sd;
        if(dot < 0.15) continue;
        const sc = dot*1000 - sd*0.2 + mkHash(Math.floor(s.x*0.1) + Math.floor(s.z*0.1), MKE.cycleN)*300;   // logic-free taste: a seeded wobble
        if(sc > bestS){ bestS = sc; best = s; }
    }
    if(!best) return null;
    MKE.rope.last = best;
    const h = mkHash(MKE.cycleN, 21);
    const y = Math.min(best.topY, Math.max(p.y + size*2, best.baseY + (best.topY - best.baseY)*(0.45 + 0.45*h)));
    return _mkB.set(best.x, y, best.z);
}
function monkeyRopeStep(){
    const r = MKE.rope; if(!r.active) return;
    if(r.type === 'titan'){ if(!r.t || r.t.state === 'DEAD' || !titans.includes(r.t)){ monkeyDropRope(); return; } r.anchor.copy(r.t.pos); }
    else if(r.type === 'player') r.anchor.copy(player.pos);
}
function monkeyRopeRelease(dt){
    const r = MKE.rope; if(!r.active) return;
    r.time += dt;
    _mkW.subVectors(r.anchor, MKE.pos); const d = _mkW.length();
    if(r.type === 'static'){
        const passed = r.time > MK.ropeMin && MKE.vel.dot(_mkW) < 0;
        if(passed || r.time > MK.ropeMax*(1.3 - 0.6*MKE.wild) || d < MK.size*1.2) monkeyDropRope();
    } else if(r.time > MK.ropeMax*2.5 || d > monkeyReach()*1.3) monkeyDropRope();
}

// ── world-physics step: gravity, rope pull, drag, max speed, statics, titans, ground ──
const _mkPrev = new THREE.Vector3();
function monkeyPhysics(dt){
    const p = MKE.pos, v = MKE.vel, r = MK.size*0.3, hh = MKE.halfH, W = MKE.wall, thr = M.tumbleThresh;
    v.y += M.gravity*MK.gravScale*dt*(W.on ? M.wallRunGravity : 1);
    const R = MKE.rope;
    if(R.active){
        _mkW.subVectors(R.anchor, p); const d = Math.max(1, _mkW.length()); _mkW.multiplyScalar(1/d);
        v.addScaledVector(_mkW, M.hookPull*MK.pullScale*(d/M.ropeNorm)*dt);
    }
    v.x *= Math.exp(-M.airDrag*dt); v.z *= Math.exp(-M.airDrag*dt); v.y *= Math.exp(-M.airDrag*0.12*dt);
    const spd = v.length(), cap = M.maxSpeed*MK.speedCap;
    if(spd > cap) v.multiplyScalar(cap/spd);
    _mkPrev.copy(p);
    p.addScaledVector(v, dt);
    let onTop = false; MKE.voxGround = false;
    for(const s of staticsNear(p.x, p.z, r + 2)){
        const bottom = p.y - hh, top = p.y + hh;
        if(top < s.baseY || bottom > s.topY) continue;
        const dx = p.x - s.x, dz = p.z - s.z, hw = s.hw + r, hd = s.hd + r;
        if(Math.abs(dx) > hw || Math.abs(dz) > hd) continue;
        const ox = hw - Math.abs(dx), oz = hd - Math.abs(dz), oy = s.topY - bottom;
        if(v.y <= 0 && oy < ox && oy < oz){ const vi = -v.y; p.y = s.topY + hh; v.y = 0; onTop = true; if(vi > thr) mkTumble(vi); }
        else if(ox < oz){ const vi = Math.abs(v.x); p.x += dx < 0 ? -ox : ox; if(vi > thr){ mkTumble(vi); v.x = -v.x*0.3; } else v.x = 0; }
        else { const vi = Math.abs(v.z); p.z += dz < 0 ? -oz : oz; if(vi > thr){ mkTumble(vi); v.z = -v.z*0.3; } else v.z = 0; }
    }
    if(MKE.state !== 'LATCH') for(const t of titans){
        if(t.state === 'DEAD') continue;
        if(p.y - hh > t.base.y + t.H || p.y + hh < t.base.y) continue;
        const dx = p.x - t.base.x, dz = p.z - t.base.z, d = Math.hypot(dx, dz) || 1, rr = t.r*0.9 + r;
        if(d < rr){ p.x = t.base.x + dx/d*rr; p.z = t.base.z + dz/d*rr; const vo = v.x*dx/d + v.z*dz/d; if(vo < 0){ v.x -= dx/d*vo; v.z -= dz/d*vo; } }
    }
    // the structure: axis-by-axis so he slides along it; if he somehow starts inside, let him out
    if(MK.structOn && nearStructure(p, MK.size*3)){
      if(mkBlocked(_mkPrev, r*0.8, hh*0.8)){ p.y = _mkPrev.y + 600*dt; v.y = Math.max(v.y, 60); }      // somehow inside it: pop out the top
      else {
        const nx = p.x, ny = p.y, nz = p.z;
        p.set(nx, _mkPrev.y, _mkPrev.z);
        if(mkBlocked(p, r, hh)){ const vi = Math.abs(v.x); p.x = _mkPrev.x; if(vi > thr){ mkTumble(vi); v.x = -v.x*0.3; } else v.x = 0; }
        p.z = nz;
        if(mkBlocked(p, r, hh)){ const vi = Math.abs(v.z); p.z = _mkPrev.z; if(vi > thr){ mkTumble(vi); v.z = -v.z*0.3; } else v.z = 0; }
        p.y = ny;
        if(mkBlocked(p, r, hh)){ const vi = Math.abs(v.y); p.y = _mkPrev.y; if(v.y < 0){ MKE.voxGround = true; if(vi > thr) mkTumble(vi); } v.y = 0; }
      }
    }
    { const hd = Math.hypot(p.x, p.z), lim = WORLD.half;
      if(hd > lim){ const nx = p.x/hd, nz = p.z/hd; p.x = nx*lim; p.z = nz*lim; const vo = v.x*nx + v.z*nz; if(vo > 0){ v.x -= nx*vo; v.z -= nz*vo; } } }
    const gY = floorY(p.x, p.z) + hh;
    if(p.y <= gY){
        const vi = -v.y; p.y = gY; if(v.y < 0) v.y = 0;
        if(vi > thr*1.4) mkTumble(vi);
        v.x *= Math.exp(-M.groundFric*dt); v.z *= Math.exp(-M.groundFric*dt);
    }
    MKE.grounded = p.y <= gY + 0.5 || onTop || MKE.voxGround;

    // wall run (waaa_5 rules, same constants as yours): airborne + brushing a wall + moving along it fast enough = he catches it,
    // gravity eases, he hugs it; when the run runs out he kicks off like a wall jump
    if(W.cool > 0) W.cool -= dt;
    if(MKE.grounded) W.t = 0;
    if(MK.wallOn && MKE.tumble <= 0){
        const px = p.x, py = p.y, pz = p.z, reach = r + 12;
        const hit = (dx, dz) => { for(let k = r + 0.9; k <= reach + 1e-6; k += 1.5) if(solidAt(px + dx*k, py, pz + dz*k)) return true; return false; };
        let bx = 0, bz = 0;
        if(hit(1, 0)) bx = -1; else if(hit(-1, 0)) bx = 1;
        if(hit(0, 1)) bz = -1; else if(hit(0, -1)) bz = 1;
        let wnx = 0, wnz = 0, along = 0;
        if(bx && Math.abs(v.z) > along){ wnx = bx; wnz = 0; along = Math.abs(v.z); }
        if(bz && Math.abs(v.x) > along){ wnx = 0; wnz = bz; along = Math.abs(v.x); }
        const canRun = !MKE.grounded && (wnx || wnz) && along > M.wallRunMinSpeed && W.cool <= 0 && W.t < M.wallRunTime;
        if(canRun){
            if(!W.on) v.y = Math.max(v.y*0.3, 0);
            if(W.nx !== wnx || W.nz !== wnz) W.t = 0;
            W.on = true; W.nx = wnx; W.nz = wnz; W.t += dt;
            const into = v.x*wnx + v.z*wnz; if(into < 0){ v.x -= into*wnx; v.z -= into*wnz; }
            v.x -= wnx*M.wallStick*dt; v.z -= wnz*M.wallStick*dt;
        } else if(W.on){
            W.on = false;
            if(W.t >= M.wallRunTime){ v.x += W.nx*M.wallJumpOut; v.z += W.nz*M.wallJumpOut; v.y += M.wallJumpUp; W.cool = 0.25; W.t = 0; MKE.wallJumps++; }
        }
    } else W.on = false;

    if(MKE.ropeLine && R.active){
        const a = MKE.ropeLine.geometry.attributes.position.array;
        a[0] = p.x; a[1] = p.y; a[2] = p.z; a[3] = R.anchor.x; a[4] = R.anchor.y; a[5] = R.anchor.z;
        MKE.ropeLine.geometry.attributes.position.needsUpdate = true;
    }
}

// ── what it wants to be doing (re-picked every MK.think seconds) ──
function monkeyNearestTitan(maxD){
    let best = null, bd = maxD;
    for(const t of titans){ if(t.state === 'DEAD') continue; const d = Math.hypot(t.base.x - MKE.pos.x, t.base.z - MKE.pos.z); if(d < bd){ bd = d; best = t; } }
    return best;
}
function monkeyThink(){
    const S = WORLD.scale, w = MKE.wild;
    const pd = Math.hypot(player.pos.x - MKE.pos.x, player.pos.z - MKE.pos.z);
    let intent = 'ROAM', target = null;
    if(!MK.buddy){                                                       // the old always-chaotic monkey
        const ti = monkeyNearestTitan(MK.titanRange*S);
        if(w >= MK.huntAt && MKE.rideCDt <= 0 && pd < MK.huntRange*S && player.tumble <= 0){ intent = 'HUNT'; }
        else if(w >= MK.titanAt && ti && MKE.logic > 0.1){ intent = 'TITAN'; target = ti; }
        else if(w < MK.titanAt && pd < MK.notice*S && MKE.logic > 0.35){ intent = 'FRIEND'; }
    } else if(MKE.flare > 0){                                            // flare: feral for a few seconds
        const ti = monkeyNearestTitan(MK.titanRange*S);
        if(MKE.state === 'MOUNT' || (MKE.flareEmu && mkEmuWant(true))){ intent = 'EMU'; target = MKE.mount || MKE.emuTgt; }
        else if(MKE.rideCDt <= 0 && pd < MK.huntRange*S && player.tumble <= 0) intent = 'HUNT';
        else if(ti && MKE.logic > 0.1){ intent = 'TITAN'; target = ti; }
        else intent = 'BUDDY';
    } else {                                                             // ally: stay beside you, flank any titan that's close to YOU
        let ti = null, bd = MK.assistRange*S*(1 + 0.5*MKE.bond);
        for(const t of titans){ if(t.state === 'DEAD') continue; const d = Math.hypot(t.base.x - player.pos.x, t.base.z - player.pos.z); if(d < bd){ bd = d; ti = t; } }
        const nerve = 1 - 0.7*MK.timid + 0.3*MK.bold;                  // timid: hangs back unless the titan is right on you
        if(ti && MKE.logic > 0.1 && (bd < 500*S || mkHash(Math.floor(MKE.time/5), 81) < nerve)){ intent = 'TITAN'; target = ti; }
        else if(mkEmuWant(false)){ intent = 'EMU'; target = MKE.mount || MKE.emuTgt; }
        else intent = 'BUDDY';
        if(MKE.state === 'MOUNT' && intent === 'TITAN') monkeyDismount('hop');      // off the bird, onto the titan
    }
    MKE.intent = intent; MKE.target = target;
}
// a spot beside you, a little ahead of where you're going (also where a steady emu ride heads)
function mkBuddySpot(){
    const S = WORLD.scale, v = player.vel, sp = Math.hypot(v.x, v.z); let fx, fz;
    if(sp > 30){ fx = v.x/sp; fz = v.z/sp; } else { camera.getWorldDirection(_mkF); const l = Math.hypot(_mkF.x, _mkF.z) || 1; fx = _mkF.x/l; fz = _mkF.z/l; }
    const side = MK.followSide*S*(1 - 0.5*MKE.bond), lead = Math.min(400*S, sp*MK.followLead);
    return _mkF.set(player.pos.x - fz*side + fx*lead, player.pos.y, player.pos.z + fx*side + fz*lead);
}
function monkeyGoal(){
    const S = WORLD.scale, ep = Math.floor(MKE.time/9);
    if(MKE.intent === 'HUNT') return _mkF.copy(player.pos);
    if(MKE.intent === 'TITAN' && MKE.target) return _mkF.copy(MKE.target.pos);
    if(MKE.intent === 'BUDDY') return mkBuddySpot();
    if(MKE.intent === 'EMU' && MKE.emuTgt) return _mkF.set(MKE.emuTgt.pos.x, MKE.emuTgt.pos.y + emH(MKE.emuTgt)*0.8, MKE.emuTgt.pos.z);
    if(MKE.intent === 'FRIEND') return _mkF.copy(player.pos);
    return _mkF.set(MKE.home.x + MK.roam*S*(mkHash(ep, 1)*2 - 1), 0, MKE.home.z + MK.roam*S*(mkHash(ep, 2)*2 - 1));
}

// ── latch on a titan and bite ──
function monkeyStartLatch(t){
    monkeyDropRope();
    MKE.state = 'LATCH'; MKE.stT = 0;
    const behind = MKE.logic > 0.5 && mkHash(MKE.cycleN, 31) < MK.napeChance;    // logic = goes for the weak spot
    MKE.latch = { t, time:0, biteT:0.4, ang:behind ? t.yaw + Math.PI : Math.atan2(MKE.pos.x - t.base.x, MKE.pos.z - t.base.z), h:0.25 + 0.6*mkHash(MKE.cycleN, 32), nape:behind };
    MKE.vel.set(0, 0, 0);
}
function monkeyEndLatch(){
    const L = MKE.latch; MKE.state = 'GO'; MKE.latch = null;
    if(L && L.t){ _mkW.set(MKE.pos.x - L.t.base.x, 0, MKE.pos.z - L.t.base.z).normalize(); MKE.vel.set(_mkW.x*MK.leap, MK.leap*0.9, _mkW.z*MK.leap); }
    MKE.ropeCDt = MK.ropeCD; MKE.hopCD = 0.6; MKE.throwCDt = Math.min(MKE.throwCDt, 0.6);
}
function monkeyLatchStep(dt){
    const L = MKE.latch, t = L && L.t;
    if(!t || t.state === 'DEAD' || !titans.includes(t)){ monkeyEndLatch(); return; }
    L.time += dt; L.ang += dt*0.5*MKE.wild;
    let tx, ty, tz;
    if(L.nape && t.P.nape){ t.P.nape.getWorldPosition(_mkW); tx = _mkW.x; ty = _mkW.y; tz = _mkW.z; }
    else { const rr = t.r*0.95 + MK.size*0.2; tx = t.base.x + Math.sin(L.ang)*rr; tz = t.base.z + Math.cos(L.ang)*rr; ty = t.base.y + t.H*L.h; }
    const k = Math.min(1, dt*10), ox = MKE.pos.x, oy = MKE.pos.y, oz = MKE.pos.z;
    MKE.pos.x += (tx - ox)*k; MKE.pos.y += (ty - oy)*k; MKE.pos.z += (tz - oz)*k;
    MKE.vel.set(0, 0, 0); MKE.grounded = false;
    L.biteT -= dt;
    if(L.biteT <= 0){
        L.biteT = MK.biteCD/(0.5 + MKE.wild);
        const nape = !!(L.nape || (t.P.nape && mkHash(MKE.bites + 7, 33) < MK.napeChance*THREE.MathUtils.clamp(MKE.logic, 0, 1)));
        _mkW.set(t.base.x - MKE.pos.x, 0, t.base.z - MKE.pos.z).normalize();
        const was = t.state;
        damageTitan(t, _mkW.x*90, 30, _mkW.z*90, nape, MKE.pos, MK.biteDmg*monkeyBiteMul());
        if(was !== 'DEAD' && t.state === 'DEAD') MKE.kills++;
        MKE.bites++; MKE.glow = 0.6; MKE.throwT = 0.2; mkStress(MK.exciteGain);
        if(MK.dustScale > 0) mkDust(MKE.pos, Math.round(6*MK.dustScale), 50);
    }
    MKE.face = mkWrap(MKE.face + mkWrap(Math.atan2(t.base.x - MKE.pos.x, t.base.z - MKE.pos.z) - MKE.face)*Math.min(1, dt*10));
    if(L.time >= MK.latchTime*(0.6 + MKE.wild)) monkeyEndLatch();
}

// ── hunt you down and ride your back ──
function monkeyStartRide(){
    monkeyDropRope();
    MKE.state = 'RIDE'; MKE.stT = 0; MKE.rides++;
    MKE.ride = { time:0, shake:0, jostle:1.2, blindCD:2 };
    MKE.blindT = 0;
    showToast('monkey on your back');
}
function monkeyEndRide(quiet){
    const R = MKE.ride; MKE.ride = null; if(MKE.state === 'RIDE') MKE.state = 'GO';
    camera.getWorldDirection(_mkF); _mkF.y = 0; _mkF.normalize();
    MKE.vel.copy(player.vel).multiplyScalar(0.3); MKE.vel.x -= _mkF.x*80; MKE.vel.z -= _mkF.z*80; MKE.vel.y += 60;
    MKE.rideCDt = MK.rideCD; MKE.ropeCDt = MK.ropeCD; MKE.hopCD = 0.8; MKE.blindT = 0;
    if(!quiet) showToast(R && R.shake >= MK.shakeTime ? 'shook it off' : 'monkey hopped off');
}
function monkeyRideStep(dt){
    const R = MKE.ride;
    R.time += dt;
    camera.getWorldDirection(_mkF); _mkF.y = 0; const fl = Math.hypot(_mkF.x, _mkF.z) || 1; _mkF.x /= fl; _mkF.z /= fl;
    const bx = -_mkF.x*(M.radius + MK.size*0.3), bz = -_mkF.z*(M.radius + MK.size*0.3);
    const k = Math.min(1, dt*14);
    MKE.pos.x += (player.pos.x + bx - MKE.pos.x)*k; MKE.pos.z += (player.pos.z + bz - MKE.pos.z)*k;
    MKE.pos.y += (player.pos.y + MK.size*0.12 - MKE.pos.y)*k;
    MKE.vel.copy(player.vel); MKE.grounded = false;
    MKE.face = mkWrap(MKE.face + mkWrap(Math.atan2(_mkF.x, _mkF.z) - MKE.face)*Math.min(1, dt*10));
    // it's heavy, it's in the way, it's grabbing at you
    player.vel.multiplyScalar(Math.exp(-MK.rideDrag*dt));
    player.vel.y += M.gravity*MK.rideWeight*dt;
    R.jostle -= dt;
    if(R.jostle <= 0 && player.tumble <= 0){ R.jostle = 1.5/(0.5 + MKE.wild); player.yaw += (mkHash(Math.floor(MKE.time*5), 41)*2 - 1)*MK.rideJostle*(0.4 + MKE.wild); }
    R.blindCD -= dt;
    if(R.blindCD <= 0){ R.blindCD = 3/(0.5 + MKE.wild); MKE.blindT = 1.2; }          // paws over your eyes
    MKE.blindT = Math.max(0, MKE.blindT - dt);
    MKE.blind = MK.rideBlind*Math.sin(Math.PI*(1 - MKE.blindT/1.2))*(MKE.blindT > 0 ? 1 : 0);
    // get it off: stay fast, or crash
    const spd = player.vel.length();
    if(spd > MK.shakeSpeed) R.shake += dt; else R.shake = Math.max(0, R.shake - dt*0.5);
    if(R.shake >= MK.shakeTime || player.tumble > 0 || R.time >= MK.rideTime*(0.6 + MKE.wild)) monkeyEndRide(false);
}

// ── emus: curiosity sends him over; whether he gets a ride (and what kind) is down to both their moods ──
function monkeyEmuPick(maxD){                                           // the emu he's spent the most time near, else the nearest
    let best = null, bv = 1;
    for(const [o, v] of MKE.emuNear){
        if(v <= bv || o.age < 1 || o.ride || !EMS.list.includes(o)) continue;
        if(Math.hypot(o.pos.x - MKE.pos.x, o.pos.z - MKE.pos.z) > maxD) continue;
        best = o; bv = v;
    }
    if(best) return best;
    let bd = maxD;
    for(const o of EMS.list){ if(o.age < 1 || o.ride) continue; const d = Math.hypot(o.pos.x - MKE.pos.x, o.pos.z - MKE.pos.z); if(d < bd){ bd = d; best = o; } }
    return best;
}
function mkEmuWant(flare){
    if(typeof EM === 'undefined' || !EM.on || !EMS.list.length) return false;
    if(MKE.state === 'MOUNT') return true;
    if(MKE.shyT > 0 || MKE.state !== 'GO') return false;
    if(MKE.emuT > 0 && MKE.emuTgt && EMS.list.includes(MKE.emuTgt) && !MKE.emuTgt.ride) return true;
    if(MKE.emuCD > 0 && !flare) return false;
    if(!flare && mkHash(++MKE.emuRolls, 83) >= MK.curious*0.12) return false;
    const S = WORLD.scale, leash = (600 + 1600*MK.curious)*S;
    const e = monkeyEmuPick(leash);
    if(!e || Math.hypot(e.pos.x - player.pos.x, e.pos.z - player.pos.z) > leash*1.6) return false;
    MKE.emuTgt = e; MKE.emuT = 8 + 12*MK.curious;
    return true;
}
function monkeyTryMount(e){
    MKE.mountTries = (MKE.mountTries || 0) + 1;
    const fam = Math.min(1, (MKE.emuNear.get(e) || 0)/6), flare = MKE.flare > 0;
    const nerve = 0.15 + MK.bold*0.6 - MK.timid*0.5 + fam*0.45 + (flare ? 0.35 : 0) + MK.playful*0.15;
    if(e.ride || e.age < 1 || e.tumble > 0 || mkHash(MKE.mounts*7 + MKE.cycleN, 71) > nerve){         // loses his nerve: a sniff and a poke, then back to you
        MKE.emuT = 0; MKE.emuTgt = null; MKE.emuCD = 6 + 10*MK.timid;
        e.annoy = Math.min(1, e.annoy + (flare ? 0.3 : 0.05)*e.tr.bold);
        MKE.vel.y = Math.max(MKE.vel.y, 60); MKE.hopCD = 0.5;
        return false;
    }
    const calmM = !flare && MKE.agit < 0.6, calmE = e.panic <= 0 && e.annoy < 0.4;
    monkeyDropRope(true);

function monkeyDismount(how){

    if(!e){ return; }
    const was = e.ride ? e.ride.mode : 'STEADY'; e.ride = null;
    const fx = Math.sin(e.yaw), fz = Math.cos(e.yaw), S = WORLD.scale;
    if(how === 'quiet'){ MKE.vel.set(0, 0, 0); return; }
    if(how === 'hop'){ MKE.vel.copy(e.vel); MKE.vel.y += 90; }
    else if(how === 'thrown'){                                          // over the neck when it bolts, stops or gets bonked
        MKE.vel.set(e.vel.x*1.1 + fx*120*S, 90, e.vel.z*1.1 + fz*120*S); MKE.grounded = false;
        mkTumble(M.tumbleThresh*1.2); mkStress(MK.stressGain*0.6); MKE.shyT = 1.5 + 4*MK.timid;
    } else {                                                            // bucked: launched up and back off its rump
        const k = EM.kick*e.tr.kick;
