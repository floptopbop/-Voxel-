<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ODM_STUDIO</title>
<!--
  ═══════════════════════════════════════════════════════════════
  ODM_FORGE — modular single-file engine
  ═══════════════════════════════════════════════════════════════
  STRUCTURE (each block is rip-out-able for other projects):

    [CORE]   shared renderer, mode switch, resize        — keep always
    [STUDIO] map creator + atmosphere viewer — portable across all engines
    [BRIDGE] TerrainData → game mesh (deploy / load JSON) — the glue
    [GAME]   ODM movement engine (physics, input, HUD)    — swappable

  To reuse for another project: keep CORE + FORGE + BRIDGE,
  delete the GAME block, and point deployTerrain() at your own
  world builder. The exported JSON (exportMeta + vertexDataMatrix)
  is the stable interchange format between projects.
  ═══════════════════════════════════════════════════════════════
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none; }
  body, html { width:100vw; height:100vh; overflow:hidden; background:#1a1a1a; font-family:monospace; }

  #c { position:absolute; inset:0; z-index:1; }
  #slash-canvas { position:absolute; inset:0; z-index:5; pointer-events:none; }

  /* anything marked .ui-block is interactive & scrollable */
  .ui-block, .ui-block * { pointer-events:auto; touch-action:manipulation; }

  /* ══ shared button language ══ */
  .btn {
    background:rgba(138,3,3,0.75); color:#fff; border:none;
    padding:8px 14px; font-family:monospace; font-size:9px; font-weight:bold;
    text-transform:uppercase; letter-spacing:1px; border-radius:2px;
    cursor:pointer;
  }
  .btn.ghost { background:rgba(255,255,255,0.12); color:#ddd; }
  .btn.active { background:#8A0303; box-shadow:0 0 10px rgba(138,3,3,0.6); }
  .btn.big { padding:12px 18px; font-size:11px; }
  .btn:disabled { opacity:0.4; }

  /* ════════════ GAME UI ════════════ */
  #game-ui { position:absolute; inset:0; z-index:10; pointer-events:none; }

  #hud {
    position:absolute; top:12px; left:12px;
    background:rgba(255,255,255,0.82); border-left:3px solid #8A0303;
    padding:6px 10px; font-size:9px; font-weight:bold;
    text-transform:uppercase; letter-spacing:1px; line-height:2;
    color:#1a1a1a;
  }
  #hud-status { color:#8A0303; }

  #kills {
    position:absolute; top:12px; right:12px;
    background:rgba(255,255,255,0.82); border-right:3px solid #8A0303;
    padding:6px 10px; font-size:9px; font-weight:bold;
    text-transform:uppercase; letter-spacing:2px; color:#1a1a1a;
  }

  #xhair {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:12px; height:12px; border-radius:50%;
    border:2px solid rgba(180,180,180,0.7);
    transition:border-color 0.1s, transform 0.1s;
  }
  #xhair.locked { border-color:#0DD824; transform:translate(-50%,-50%) scale(1.5); }

  #terrain-bar {
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; align-items:center;
  }
  #terrain-file, #forge-files { display:none; }
  #terrain-label {
    color:rgba(255,255,255,0.55); font-size:8px; font-weight:bold;
    text-transform:uppercase; letter-spacing:1px; pointer-events:none;
    max-width:110px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .joy {
    position:absolute; bottom:52px; z-index:8;
    width:84px; height:84px; border-radius:50%;
    border:3px solid #B2BBC4;
    background:radial-gradient(circle at 30% 30%, #4a4a4a, #1a1a1a);
    box-shadow:inset 0 2px 8px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.5);
    pointer-events:none;
  }
  #joyL { left:36px; }
  #joyR { right:36px; }
  .knob {
    position:absolute; width:42px; height:42px; border-radius:50%;
    top:50%; left:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 35%, #D4AF37, #8B7620);
    border:2px solid #9d8b4d;
    box-shadow:0 0 10px rgba(212,175,55,0.35), inset 0 -2px 4px rgba(0,0,0,0.5);
    pointer-events:none; will-change:transform;
  }
  #knobL.boost {
    background:radial-gradient(circle at 35% 35%, #FF6B35, #CC3D1A);
    box-shadow:0 0 28px rgba(255,107,53,0.8), inset 0 -2px 4px rgba(0,0,0,0.6);
    border-color:#FF8C42;
  }
  #knobR.active {
    background:radial-gradient(circle at 35% 35%, #00FF88, #00CC66);
    box-shadow:0 0 32px rgba(0,255,136,0.85), inset 0 -2px 4px rgba(0,0,0,0.6);
    border-color:#00FF88;
  }
  @media (orientation: landscape) {
    .joy { width:90px; height:90px; bottom:28px; }
    #joyL { left:40px; } #joyR { right:40px; }
    .knob { width:50px; height:50px; }
  }
  #slash-zone {
    position:absolute; top:0; left:0; right:0; height:60vh;
    z-index:4; pointer-events:none;
    border-bottom:1px dashed rgba(255,255,255,0.05);
  }

  /* ════════════ FORGE UI ════════════ */
  #forge-ui { position:absolute; inset:0; z-index:10; pointer-events:none; display:flex; flex-direction:column; justify-content:flex-end; }

  #forge-top {
    position:absolute; top:12px; left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none;
  }
  #forge-title {
    background:rgba(255,255,255,0.82); border-left:3px solid #8A0303;
    padding:6px 10px; font-size:9px; font-weight:bold;
    text-transform:uppercase; letter-spacing:1px; line-height:2; color:#1a1a1a;
  }
  #forge-title .sub { color:#8A0303; }

  #panel {
    max-height:46vh; overflow-y:auto; touch-action:pan-y;
    background:rgba(20,20,20,0.92); border-top:2px solid #8A0303;
    padding:12px 14px 20px; display:flex; flex-direction:column; gap:12px;
    backdrop-filter:blur(4px);
  }
  #panel.collapsed { max-height:0; padding:0 14px; overflow:hidden; border-top-width:0; }
  #panel-toggle {
    align-self:center; margin-bottom:0;
    border-radius:4px 4px 0 0;
  }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .lbl {
    color:rgba(255,255,255,0.55); font-size:8px; font-weight:bold;
    text-transform:uppercase; letter-spacing:1px; min-width:86px;
  }
  .val { color:#D4AF37; font-size:9px; font-weight:bold; min-width:36px; text-align:right; }
  input[type=range] { flex:1; accent-color:#8A0303; height:26px; }
  #statsText {
    color:rgba(255,255,255,0.65); font-size:8px; letter-spacing:1px;
    text-transform:uppercase; line-height:1.9; border-left:2px solid #8A0303;
    padding-left:8px;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<canvas id="c"></canvas>
<canvas id="slash-canvas"></canvas>

<!-- ════════════ GAME DOM ════════════ -->
<div id="game-ui">
  <div id="slash-zone"></div>
  <div id="xhair"></div>
  <div id="hud">
    <div>ODM_OS</div>
    <div id="hud-spd">SPD: 0.0</div>
    <div id="hud-alt">ALT: 0.0</div>
    <div id="hud-boost">BOOST: 0%</div>
    <div id="hud-status">IDLE</div>
  </div>
  <div id="kills">KILLS: <span id="kill-count">0</span></div>
  <div id="terrain-bar" class="ui-block">
    <button class="btn ghost" id="to-forge-btn">◀ FORGE</button>
    <button class="btn" id="terrain-btn">[ LOAD MAP ]</button>
    <input type="file" id="terrain-file" accept=".json,application/json,image/*">
    <div id="terrain-label">no map loaded</div>
  </div>
  <div class="joy" id="joyL"><div class="knob" id="knobL"></div></div>
  <div class="joy" id="joyR"><div class="knob" id="knobR"></div></div>
</div>

<!-- ════════════ FORGE DOM ════════════ -->
<div id="forge-ui">
  <div id="forge-top">
    <div id="forge-title">
      <div>ODM_FORGE</div>
      <div class="sub" id="forge-status">AWAITING SOURCE IMAGERY</div>
    </div>
    <div class="ui-block" style="display:flex; gap:8px;">
      <button class="btn big" id="deployBtn">DEPLOY ▶</button>
    </div>
  </div>

  <button class="btn ghost ui-block" id="panel-toggle">▼ CONSOLE</button>
  <div id="panel" class="ui-block">
    <div class="row">
      <button class="btn" id="loadImagesBtn">[ LOAD IMAGES ]</button>
      <input type="file" id="forge-files" accept="image/*" multiple>
      <button class="btn ghost" id="clearBtn">CLEAR</button>
      <button class="btn ghost" id="exportJsonBtn">EXPORT JSON</button>
      <button class="btn ghost" id="exportPngBtn">EXPORT PNG</button>
    </div>

    <div class="row">
      <span class="lbl">LAYOUT</span>
      <button class="btn ghost active" id="modeGrid">GRID</button>
      <button class="btn ghost" id="modeStack">STACK</button>
      <button class="btn ghost" id="modeZStack">Z-STACK</button>
    </div>

    <div class="row">
      <span class="lbl">RENDER</span>
      <button class="btn ghost active" data-mode="mesh">MESH</button>
      <button class="btn ghost" data-mode="wireframe">WIRE</button>
      <button class="btn ghost" data-mode="points">POINTS</button>
    </div>

    <div class="row">
      <span class="lbl">COLOR</span>
      <button class="btn ghost active" data-color="image">IMAGE</button>
      <button class="btn ghost" data-color="height">HEIGHT</button>
      <button class="btn ghost" data-color="grayscale">GRAY</button>
    </div>

    <div class="row">
      <span class="lbl">GRID SIZE</span>
      <input type="range" id="gridSize" min="50" max="500" step="10" value="200">
      <span class="val" id="gridSizeVal">200</span>
    </div>
    <div class="row">
      <span class="lbl">Z-SCALE</span>
      <input type="range" id="heightScale" min="0.1" max="8" step="0.1" value="2">
      <span class="val" id="heightScaleVal">2.0</span>
    </div>
    <div class="row">
      <span class="lbl">BLUR</span>
      <input type="range" id="blurScale" min="0" max="12" step="1" value="0">
      <span class="val" id="blurVal">0</span>
    </div>
    <div class="row">
      <span class="lbl">DENSITY</span>
      <input type="range" id="density" min="32" max="256" step="16" value="128">
      <span class="val" id="densityVal">128</span>
    </div>

    <div id="statsText">// Memory buffers idle. Load imagery to compile terrain.</div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════╗
// ║ [CORE] — shared renderer + mode switch                    ║
// ╚══════════════════════════════════════════════════════════╝
// ╔══════════════════════════════════════════════════════════╗
// ║ [ATMO] atmosphere + weather preview controls               ║
// ║ Live sliders update the map preview in real-time.          ║
// ╚══════════════════════════════════════════════════════════╝
const ATMO_SLIDERS = [
    { lbl:'sky hue',       min:0,   max:360, step:5,   get:()=>ATMO.skyHue,       set:v=>{ATMO.skyHue=v;applyAtmosphere();} },
    { lbl:'sky sat',       min:0,   max:1,   step:0.05,get:()=>ATMO.skySat,       set:v=>{ATMO.skySat=v;applyAtmosphere();} },
    { lbl:'sky bright',    min:0.2, max:1,   step:0.05,get:()=>ATMO.skyLight,     set:v=>{ATMO.skyLight=v;applyAtmosphere();} },
    { lbl:'fog near',      min:100, max:2000,step:50, get:()=>ATMO.fogNear,      set:v=>{ATMO.fogNear=v;applyAtmosphere();} },
    { lbl:'fog far',       min:500, max:8000,step:100,get:()=>ATMO.fogFar,       set:v=>{ATMO.fogFar=v;applyAtmosphere();} },
    { lbl:'sunlight',      min:0.3, max:2,   step:0.1, get:()=>ATMO.sunInt,       set:v=>{ATMO.sunInt=v;applyAtmosphere();} },
    { lbl:'ambient',       min:0.2, max:2,   step:0.1, get:()=>ATMO.ambInt,       set:v=>{ATMO.ambInt=v;applyAtmosphere();} },
    { lbl:'sun elevation', min:5,   max:80,  step:2,   get:()=>ATMO.sunEl,        set:v=>{ATMO.sunEl=v;applyAtmosphere();} },
    { lbl:'sun azimuth',   min:0,   max:360, step:5,   get:()=>ATMO.sunAz,        set:v=>{ATMO.sunAz=v;applyAtmosphere();} },
    { lbl:'rain',          min:0,   max:1,   step:0.05,get:()=>ATMO.weatherRain,  set:v=>{ATMO.weatherRain=v;applyAtmosphere();} },
    { lbl:'mist',          min:0,   max:1,   step:0.05,get:()=>ATMO.weatherMist,  set:v=>{ATMO.weatherMist=v;applyAtmosphere();} },
];
let MODE = 'forge';
function buildAtmoSliders(){
  const container = document.getElementById('atmo-sliders') || (() => {
    const div = document.createElement('div');
    div.id = 'atmo-sliders';
    div.style.cssText = 'max-height:220px; overflow-y:auto; padding:4px;';
    document.getElementById('ui-right').insertBefore(div, document.getElementById('ui-right').firstChild);
    return div;
  })();
  container.innerHTML = '';
  for (const def of ATMO_SLIDERS) {
    const row = document.createElement('div');
    row.style.cssText = 'margin-bottom:4px;';
    const label = document.createElement('label');
    label.textContent = def.lbl;
    label.style.cssText = 'font-size:0.7rem; display:block; margin-bottom:2px; color:#999;';
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = def.min;
    slider.max = def.max;
    slider.step = def.step;
    slider.value = def.get();
    slider.style.cssText = 'width:100%; cursor:pointer;';
    slider.oninput = e => def.set(parseFloat(e.target.value));
    row.appendChild(label);
    row.appendChild(slider);
    container.appendChild(row);
  }
}
                       // 'forge' | 'run'

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const clock = new THREE.Clock();

function setMode(m) {
  MODE = m;
  document.getElementById('forge-ui').style.display = (m==='forge') ? 'flex' : 'none';
  document.getElementById('game-ui').style.display  = (m==='run')   ? 'block' : 'none';
  document.getElementById('slash-canvas').style.display = (m==='run') ? 'block' : 'none';
  if (m==='run') { clock.getDelta(); } // swallow dt spike on entry
}

// ╔══════════════════════════════════════════════════════════╗
// ║ [FORGE] — image → heightfield compiler (preview scene)    ║
// ╚══════════════════════════════════════════════════════════╝
const forge = {
  width: 1024, height: 1024,
  heights: null, smooth: null, colors: null,
  currentMesh: null,
  mode: 'mesh',          // mesh | wireframe | points
  colorMode: 'image',    // image | height | grayscale
  stackMode: 'grid',     // grid | stack | zstack
  gridSize: 200, scale: 2.0, blur: 0, density: 128,
  cachedImages: [],
  previewMode: 'full',   // full | split
  splitRatio: 0.5,       // left pane width when split
};

// atmosphere/weather for the map studio preview
const ATMO = {
  skyHue: 210, skySat: 0.4, skyLight: 0.65,
  fogNear: 500, fogFar: 3000,
  sunInt: 1.2, ambInt: 0.8,
  sunEl: 35, sunAz: 120,
  weatherRain: 0,        // 0-1: rain intensity
  weatherMist: 0.1,      // 0-1: fog densification
};

const forgeScene = new THREE.Scene();
const forgeCam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 5000);
const forgeSun = new THREE.DirectionalLight(0xffffff, 1.2);
forgeSun.position.set(200, 400, 200);
forgeScene.add(forgeSun);
const forgeAmb = new THREE.AmbientLight(0x808080, 0.8);
forgeScene.add(forgeAmb);
forgeScene.fog = new THREE.Fog(0xB0D0FF, 500, 3000);
forgeScene.background = new THREE.Color(0xB0D0FF);

// weather particles (rain)
let rainParticles = [];
const rainGeo = new THREE.BufferGeometry();
const rainPositions = new Float32Array(300*3);
for(let i=0;i<300;i++){rainPositions[i*3]=Math.random()*2000-1000;rainPositions[i*3+1]=Math.random()*1000;rainPositions[i*3+2]=Math.random()*2000-1000;}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPositions,3));
const rainMat = new THREE.PointsMaterial({color:0xCCDDEE,size:2,sizeAttenuation:true,transparent:true,opacity:0.6});
const rainMesh = new THREE.Points(rainGeo,rainMat);
forgeScene.add(rainMesh);

function applyAtmosphere(){
  // sky/fog
  const hsl={h:ATMO.skyHue/360,s:ATMO.skySat,l:ATMO.skyLight};
  const col = new THREE.Color().setHSL(hsl.h,hsl.s,hsl.l);
  forgeScene.background.copy(col);
  forgeScene.fog.color.copy(col);
  forgeScene.fog.near = ATMO.fogNear * (1 + ATMO.weatherMist*0.5);
  forgeScene.fog.far = ATMO.fogFar * (0.7 + ATMO.weatherMist*0.3);
  // sun/lighting
  forgeSun.intensity = ATMO.sunInt;
  forgeAmb.intensity = ATMO.ambInt;
  const az = ATMO.sunAz*Math.PI/180, el = ATMO.sunEl*Math.PI/180, r = 2000;
  forgeSun.position.set(r*Math.cos(el)*Math.cos(az), r*Math.sin(el), r*Math.cos(el)*Math.sin(az));
  // rain
  rainMesh.visible = ATMO.weatherRain > 0;
  if(ATMO.weatherRain>0){
    rainMat.opacity = 0.4*ATMO.weatherRain;
    const pos = rainGeo.attributes.position.array;
    for(let i=0;i<300;i++){
      pos[i*3+1]-=ATMO.weatherRain*800*0.016;
      if(pos[i*3+1]<0)pos[i*3+1]+=1200;
    }
    rainGeo.attributes.position.needsUpdate=true;
  }
}
applyAtmosphere();

// ── minimal touch orbit (replaces OrbitControls, r128-safe) ──
const orbit = {
  target: new THREE.Vector3(0,0,0),
  theta: Math.PI/4, phi: Math.PI/3.2, radius: 310,
  vTheta: 0, vPhi: 0,
  touches: {}, pinchDist: 0, panMid: null,
  apply() {
    this.phi = Math.max(0.08, Math.min(Math.PI-0.08, this.phi));
    this.radius = Math.max(20, Math.min(2500, this.radius));
    forgeCam.position.set(
      this.target.x + this.radius * Math.sin(this.phi) * Math.cos(this.theta),
      this.target.y + this.radius * Math.cos(this.phi),
      this.target.z + this.radius * Math.sin(this.phi) * Math.sin(this.theta)
    );
    forgeCam.lookAt(this.target);
  },
  // screen-space drag → move the look-at target in the camera plane
  pan(dxScreen, dyScreen) {
    const k = this.radius * 0.0022;
    const right = new THREE.Vector3().setFromMatrixColumn(forgeCam.matrix, 0);
    const up    = new THREE.Vector3().setFromMatrixColumn(forgeCam.matrix, 1);
    this.target.addScaledVector(right, -dxScreen * k);
    this.target.addScaledVector(up,     dyScreen * k);
    this.apply();
  },
  update(dt) { // damping drift
    this.theta += this.vTheta; this.phi += this.vPhi;
    const f = Math.exp(-6*dt);
    this.vTheta *= f; this.vPhi *= f;
    this.apply();
  }
};
orbit.apply();

function forgeTouchStart(e) {
  if (MODE !== 'forge') return;
  if (e.target.closest('.ui-block')) return;
  e.preventDefault();
  for (const t of e.changedTouches) orbit.touches[t.identifier] = { x:t.clientX, y:t.clientY };
  const ids = Object.keys(orbit.touches);
  if (ids.length === 2) {
    const a = orbit.touches[ids[0]], b = orbit.touches[ids[1]];
    orbit.pinchDist = Math.hypot(a.x-b.x, a.y-b.y);
    orbit.panMid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
  }
}
function forgeTouchMove(e) {
  if (MODE !== 'forge') return;
  if (e.target.closest('.ui-block')) return;
  e.preventDefault();
  const ids = Object.keys(orbit.touches);
  if (ids.length === 1) {
    const t = e.changedTouches[0];
    const o = orbit.touches[t.identifier];
    if (!o) return;
    const dx = t.clientX - o.x, dy = t.clientY - o.y;
    orbit.theta += dx * 0.008; orbit.phi -= dy * 0.008;
    orbit.vTheta = dx * 0.0016; orbit.vPhi = -dy * 0.0016;
    o.x = t.clientX; o.y = t.clientY;
  } else if (ids.length === 2) {
    for (const t of e.changedTouches) {
      if (orbit.touches[t.identifier]) { orbit.touches[t.identifier].x = t.clientX; orbit.touches[t.identifier].y = t.clientY; }
    }
    const a = orbit.touches[ids[0]], b = orbit.touches[ids[1]];
    const d   = Math.hypot(a.x-b.x, a.y-b.y);
    const mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
    // pinch → zoom
    if (orbit.pinchDist > 0) orbit.radius *= orbit.pinchDist / d;
    orbit.pinchDist = d;
    // two-finger drag (midpoint travel) → pan
    if (orbit.panMid) orbit.pan(mid.x - orbit.panMid.x, mid.y - orbit.panMid.y);
    orbit.panMid = mid;
  }
  orbit.apply();
}
function forgeTouchEnd(e) {
  for (const t of e.changedTouches) delete orbit.touches[t.identifier];
  orbit.pinchDist = 0;
  orbit.panMid = null;
}
document.addEventListener('touchstart', forgeTouchStart, { passive:false });
document.addEventListener('touchmove',  forgeTouchMove,  { passive:false });
document.addEventListener('touchend',   forgeTouchEnd);
document.addEventListener('touchcancel',forgeTouchEnd);
// touch-only build: one finger = orbit, two fingers = pan + pinch zoom

// ── image compilation pipeline (ported intact from compiler) ──
async function processImageFiles(files) {
  if (files.length === 0) return;
  const loadPromises = Array.from(files).map(file => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }));
  forge.cachedImages = await Promise.all(loadPromises);
  executeCompilation();
}

function executeCompilation() {
  if (forge.cachedImages.length === 0) return;
  const compCanvas = document.createElement('canvas');
  compCanvas.width = forge.width; compCanvas.height = forge.height;
  const ctx = compCanvas.getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, forge.width, forge.height);

  const rawCount = forge.cachedImages.length;

  if (forge.stackMode === 'grid') {
    const axisCount = Math.ceil(Math.sqrt(rawCount));
    const totalCellsNeeded = axisCount * axisCount;
    const cellW = forge.width / axisCount;
    const cellH = forge.height / axisCount;
    for (let i = 0; i < totalCellsNeeded; i++) {
      const col = i % axisCount;
      const row = Math.floor(i / axisCount);
      ctx.drawImage(forge.cachedImages[i % rawCount], col*cellW, row*cellH, cellW, cellH);
    }
  } else if (forge.stackMode === 'stack') {
    const cellH = forge.height / rawCount;
    for (let i = 0; i < rawCount; i++)
      ctx.drawImage(forge.cachedImages[i], 0, i*cellH, forge.width, cellH);
  } else if (forge.stackMode === 'zstack') {
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < rawCount; i++) {
      ctx.globalAlpha = 1.0 / (i + 1);
      ctx.drawImage(forge.cachedImages[i], 0, 0, forge.width, forge.height);
    }
    ctx.globalAlpha = 1.0;
  }

  const pixels = ctx.getImageData(0, 0, forge.width, forge.height).data;
  const len = forge.width * forge.height;
  forge.heights = new Float32Array(len);
  forge.colors  = new Float32Array(len * 3);
  for (let i = 0; i < len; i++) {
    const idx = i * 4;
    const r = pixels[idx]/255, g = pixels[idx+1]/255, b = pixels[idx+2]/255;
    forge.heights[i] = r*0.299 + g*0.587 + b*0.114;
    forge.colors[i*3] = r; forge.colors[i*3+1] = g; forge.colors[i*3+2] = b;
  }
  applyBlurPipeline();
  rebuildVisuals();
}

function applyBlurPipeline() {
  if (!forge.heights) return;
  let current = new Float32Array(forge.heights);
  const w = forge.width, h = forge.height;
  for (let step = 0; step < forge.blur; step++) {
    const next = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let sum = 0, count = 0;
        for (let ky = -1; ky <= 1; ky++) for (let kx = -1; kx <= 1; kx++) {
          const nx = x+kx, ny = y+ky;
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) { sum += current[ny*w+nx]; count++; }
        }
        next[y*w+x] = sum / count;
      }
    }
    current = next;
  }
  forge.smooth = current;
}

// resolve vertex color per forge.colorMode (shared by preview + deploy + export)
function forgeColorAt(pixelIndex, hVal) {
  if (forge.colorMode === 'image')
    return [forge.colors[pixelIndex*3], forge.colors[pixelIndex*3+1], forge.colors[pixelIndex*3+2]];
  if (forge.colorMode === 'height')
    return [hVal, hVal*0.2, 1.0 - hVal*0.5];
  return [hVal, hVal, hVal];
}

function rebuildVisuals() {
  if (!forge.heights) return;
  if (forge.currentMesh) {
    forgeScene.remove(forge.currentMesh);
    forge.currentMesh.geometry.dispose();
    forge.currentMesh.material.dispose();
  }
  const d = forge.density;
  const geo = new THREE.PlaneGeometry(forge.gridSize, forge.gridSize, d-1, d-1);
  geo.rotateX(-Math.PI/2);
  const posAttr = geo.attributes.position;
  const colorAttr = new THREE.BufferAttribute(new Float32Array(d*d*3), 3);
  const w = forge.width, h = forge.height;

  for (let y = 0; y < d; y++) {
    for (let x = 0; x < d; x++) {
      const index = y*d + x;
      const px = Math.min(Math.floor((x/(d-1))*w), w-1);
      const py = Math.min(Math.floor((y/(d-1))*h), h-1);
      const pixelIndex = py*w + px;
      const hVal = forge.smooth[pixelIndex];
      posAttr.setY(index, hVal * forge.scale * (forge.gridSize * 0.2));
      const [r,g,b] = forgeColorAt(pixelIndex, hVal);
      colorAttr.setXYZ(index, r, g, b);
    }
  }
  geo.setAttribute('color', colorAttr);
  geo.computeVertexNormals();

  if (forge.mode === 'mesh' || forge.mode === 'wireframe') {
    forge.currentMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      vertexColors:true, roughness:0.5, metalness:0.0,
      wireframe:(forge.mode==='wireframe'), side:THREE.DoubleSide
    }));
  } else {
    forge.currentMesh = new THREE.Points(geo, new THREE.PointsMaterial({
      size:(forge.gridSize/160), vertexColors:true, sizeAttenuation:true
    }));
  }
  forgeScene.add(forge.currentMesh);

  document.getElementById('forge-status').textContent = 'TERRAIN COMPILED — READY TO DEPLOY';
  document.getElementById('statsText').innerHTML =
    `STATUS: COMPILED<br>` +
    `LAYOUT&nbsp;&nbsp;: ${forge.stackMode.toUpperCase()}<br>` +
    `BOUNDS&nbsp;&nbsp;: ${forge.gridSize} x ${forge.gridSize} units<br>` +
    `DENSITY : ${d}x${d} (${d*d} vertices)`;
}

// ── exports (independent JSON / PNG buttons) — cross-project format ──
async function withBusyButton(btnId, fn) {
  const btn = document.getElementById(btnId);
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ PROCESSING...'; btn.disabled = true;
  try { await fn(); }
  catch (err) { alert('Export failed: ' + err.message); console.error(err); }
  finally { btn.innerHTML = originalText; btn.disabled = false; }
}

async function exportJSON() {
  if (!forge.smooth) { alert('CRITICAL ERROR: No telemetry buffer allocated in memory.'); return; }
  await withBusyButton('exportJsonBtn', async () => {
    const d = forge.density, w = forge.width, h = forge.height;
    const timestamp = Date.now();
    const pointTelemetryArray = [];
    for (let y = 0; y < d; y++) {
      for (let x = 0; x < d; x++) {
        const px = Math.min(Math.floor((x/(d-1))*w), w-1);
        const py = Math.min(Math.floor((y/(d-1))*h), h-1);
        const pixelIndex = py*w + px;
        const rawH = forge.heights[pixelIndex];
        const smoothH = forge.smooth[pixelIndex];
        const scaledH = smoothH * forge.scale;   // bake live Z-scale into saved value
        const col = forgeColorAt(pixelIndex, smoothH);
        pointTelemetryArray.push({
          gridIndex: { x, y },
          pixelCoordinate: { x: px, y: py },
          elevationNormalized: parseFloat(scaledH.toFixed(5)),
          elevationRaw: parseFloat(rawH.toFixed(5)),
          colorRGB: [
            parseFloat(col[0].toFixed(4)),
            parseFloat(col[1].toFixed(4)),
            parseFloat(col[2].toFixed(4))
          ]
        });
      }
      if (y % 16 === 0) await new Promise(r => setTimeout(r, 0));
    }

    const jsonString = JSON.stringify({
      exportMeta: {
        timestamp, systemDensity: d, totalPointCount: d*d,
        layoutConfiguration: forge.stackMode,
        physicalGridSize: forge.gridSize,
        appliedHeightScale: forge.scale
      },
      vertexDataMatrix: pointTelemetryArray
    }, null, 2);

    const jsonBlob = new Blob([jsonString], { type:'application/json' });
    const jsonLink = document.createElement('a');
    jsonLink.download = `spatial_telemetry_${timestamp}.json`;
    jsonLink.href = URL.createObjectURL(jsonBlob);
    jsonLink.click();

    document.getElementById('statsText').innerHTML =
      `STATUS: EXPORTED<br>JSON : ${d*d} vertices`;
  });
}

async function exportPNG() {
  if (!forge.smooth) { alert('CRITICAL ERROR: No telemetry buffer allocated in memory.'); return; }
  await withBusyButton('exportPngBtn', async () => {
    const w = forge.width, h = forge.height;
    const timestamp = Date.now();
    const outputCanvas = document.createElement('canvas');
    outputCanvas.width = w; outputCanvas.height = h;
    const outCtx = outputCanvas.getContext('2d');
    const outImgData = outCtx.createImageData(w, h);
    const outputPixels = outImgData.data;
    for (let i = 0; i < w*h; i++) {
      const idx = i*4;
      const val = Math.floor(forge.smooth[i]*255);
      outputPixels[idx] = val; outputPixels[idx+1] = val; outputPixels[idx+2] = val;
      outputPixels[idx+3] = 255;
    }
    outCtx.putImageData(outImgData, 0, 0);
    const pngLink = document.createElement('a');
    pngLink.download = `compiled_heightfield_${timestamp}.png`;
    pngLink.href = outputCanvas.toDataURL('image/png');
    pngLink.click();

    document.getElementById('statsText').innerHTML =
      `STATUS: EXPORTED<br>PNG&nbsp; : ${w}×${h}`;
  });
}

// ── world build ──
function buildWorld() {
  scene.add(new THREE.AmbientLight(0xE8D5C4, 1.2));
  const sun = new THREE.DirectionalLight(0xB2BBC4, 1.1);
  sun.position.set(80, 280, 120); scene.add(sun);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80000, 80000),
    new THREE.MeshBasicMaterial({ color: CFG.groundColor })
  );
  floor.rotation.x = -Math.PI/2; floor.position.y = -0.001;
  floor.userData.floor = true; scene.add(floor);

  const trunkMat = new THREE.MeshLambertMaterial({ color: CFG.pillarColor });
  const canopyPalette = [0x4F6B3A, 0x5C7A42, 0x3E5630, 0x6B8049, 0x47633A];
  const MAP = WORLD.size;

  function plantTree(px, pz) {
    const h = 60 + Math.pow(Math.random(), 2.2) * 1040;
    const diaBase = 10 + h * 0.04 + Math.random() * 10;
    const diaTop  = diaBase * (0.5 + Math.random() * 0.25);

    const trunkGeo = new THREE.CylinderGeometry(diaTop/2, diaBase/.96, h, 9);
    const tMat = trunkMat.clone();
    tMat.color.multiplyScalar(0.9 + Math.random() * 0.2);
    const trunk = new THREE.Mesh(trunkGeo, tMat);
    trunk.position.set(px, h/2, pz);
    trunk.rotation.y = Math.random() * Math.PI * 2;
    trunk.userData.collidable = true;
    trunk.userData.pillarH = h;
    trunk.userData.width = diaBase;
    trunk.userData.depth = diaBase;
    trunk.geometry.parameters = trunk.geometry.parameters || {};
    trunk.geometry.parameters.width = diaBase;
    trunk.geometry.parameters.depth = diaBase;
    scene.add(trunk); pillars.push(trunk);

    if (h > 1 && Math.random() < 0.8) {
      const canopyColor = canopyPalette[Math.floor(Math.random() * canopyPalette.length)];
      const canopyMat = new THREE.MeshLambertMaterial({ color: canopyColor });
      if (Math.random() < 0.9) {
        const canopyH = h * (0.7 + Math.random() * 0.9);
        const canopyR = diaBase * (1.8 + Math.random() * 1.2);
        const cone = new THREE.Mesh(new THREE.ConeGeometry(canopyR, canopyH, 9), canopyMat);
        cone.position.set(px, h + canopyH * 0.35, pz);
        cone.rotation.y = Math.random() * Math.PI * 2;
        scene.add(cone);
      } else {
        const blobCount = 2 + Math.floor(Math.random() * 2);
        const canopyR = diaBase * (1.5 + Math.random() * 1.0);
        for (let bI = 0; bI < blobCount; bI++) {
          const blob = new THREE.Mesh(
            new THREE.SphereGeometry(canopyR * (0.7 + Math.random() * 0.5), 6, 5),
            canopyMat
          );
          blob.position.set(
            px + (Math.random() - 0.2) * canopyR * 0.4,
            h + canopyR * 0.4 + (Math.random() - 0.5) * canopyR * 0.5,
            pz + (Math.random() - 0.5) * canopyR * 0.8
          );
          scene.add(blob);
        }
      }
    }
  }

  const centers = [
    { x: -MAP * 0.4,  z: -MAP * 0.22 },
    { x:  MAP * 0.30, z:  MAP * 0.08 },
    { x: -MAP * 0.05, z:  MAP * 0.32 },
  ];

  const coreTreesPerCluster = 90;
  for (const c of centers) {
    const maxR = 1700 + Math.random() * 1800;
    for (let i = 0; i < coreTreesPerCluster; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist  = Math.pow(Math.random(), 24) * maxR;
      const px = c.x + Math.cos(angle) * dist;
      const pz = c.z + Math.sin(angle) * dist;
      if (Math.abs(px) > MAP/2 || Math.abs(pz) > MAP/2) continue;
      plantTree(px, pz);
    }
  }

  const connectiveTrees = 800;
  for (let i = 0; i < connectiveTrees; i++) {
    const px = (Math.random() - 0.5) * MAP;
    const pz = (Math.random() - 0.5) * MAP;
    let tooClose = false;
    for (const c of centers) {
      if (Math.hypot(px - c.x, pz - c.z) < 400) { tooClose = true; break; }
    }
    if (tooClose) continue;
    plantTree(px, pz);
  }
}

function sampleFloorY(wx, wz) {
  if (!terrainMesh) return 0;
  downRay.ray.origin.set(wx, 99999, wz);
  const hits = downRay.intersectObject(terrainMesh, false);
  return hits.length ? hits[0].point.y : 0;
}

function resampleEntitiesToTerrain() {
  for (const p of pillars) {
    const baseY = sampleFloorY(p.position.x, p.position.z);
    p.position.y = baseY + p.userData.pillarH / 2;
    p.userData.baseY = baseY;
  }
  for (const d of dummies) {
    if (d.state === 'RAGDOLL') continue;
    const baseY = sampleFloorY(d.pos.x, d.pos.z);
    d.pos.y = baseY + CFG.dummyHeight/2;
    d.floorY = d.pos.y;
    d.mesh.position.copy(d.pos);
    if (d.hbMesh) d.hbMesh.position.copy(d.pos);
  }
  const playerBase = sampleFloorY(player.pos.x, player.pos.z);
  if (player.pos.y < playerBase + player.height) {
    player.pos.y = playerBase + player.height;
    player.vel.set(0,0,0);
  }
}

// core mesh builder shared by JSON-load and direct-deploy paths.
// heights: elevationNormalized values (scale already baked), colors: RGB triplets
function buildGameTerrainMesh(d, size, getHeight, getColor) {
  const geo = new THREE.BufferGeometry();
  const verts   = new Float32Array(d * d * 3);
  const colors  = new Float32Array(d * d * 3);
  const indices = [];
  const half = size / 2;
  const step = size / (d - 1);

  for (let iy = 0; iy < d; iy++) {
    for (let ix = 0; ix < d; ix++) {
      const vi = iy * d + ix;
      verts[vi*3]   = -half + ix * step;
      verts[vi*3+1] = getHeight(ix, iy) * 50;
      verts[vi*3+2] = -half + iy * step;
      const col = getColor(ix, iy);
      colors[vi*3] = col[0]; colors[vi*3+1] = col[1]; colors[vi*3+2] = col[2];
    }
  }
  for (let row = 0; row < d-1; row++) {
    for (let col = 0; col < d-1; col++) {
      const a = row*d + col, b = a+1, c = (row+1)*d + col, e = c+1;
      indices.push(a, c, b,  b, c, e);
    }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide }));
  mesh.userData.collidable = true;
  const worldScale = WORLD.size / size;
  mesh.scale.set(worldScale, 1, worldScale);
  mesh.updateMatrixWorld();
  return mesh;
}

function setGameTerrain(mesh, label) {
  if (terrainMesh) {
    scene.remove(terrainMesh);
    terrainMesh.geometry.dispose();
    terrainMesh.material.dispose();
  }
  terrainMesh = mesh;
  if (mesh) scene.add(mesh);
  document.getElementById('terrain-label').textContent = label;
  resampleEntitiesToTerrain();
}

// path A: deploy directly from forge memory (no file round-trip)
function deployForgeTerrain() {
  if (forge.smooth) {
    const d = forge.density, w = forge.width, h = forge.height;
    const pix = (ix, iy) => {
      const px = Math.min(Math.floor((ix/(d-1))*w), w-1);
      const py = Math.min(Math.floor((iy/(d-1))*h), h-1);
      return py*w + px;
    };
    const mesh = buildGameTerrainMesh(
      d, forge.gridSize,
      (ix, iy) => forge.smooth[pix(ix,iy)] * forge.scale,
      (ix, iy) => { const p = pix(ix,iy); return forgeColorAt(p, forge.smooth[p]); }
    );
    setGameTerrain(mesh, 'FORGE//LIVE');
  }
  setMode('run');
}

// path B: load exported JSON (from this or any other project)
function buildTerrainFromJSON(data) {
  const meta   = data.exportMeta;
  const points = data.vertexDataMatrix;
  const d      = meta.systemDensity;
  const lookup = new Array(d * d);
  for (const pt of points) lookup[pt.gridIndex.y * d + pt.gridIndex.x] = pt;
  return buildGameTerrainMesh(
    d, meta.physicalGridSize,
    (ix, iy) => lookup[iy*d+ix].elevationNormalized,
    (ix, iy) => lookup[iy*d+ix].colorRGB
  );
}

// path C: raw heightmap image → terrain (legacy fallback, preserved)
function buildTerrainFromImage(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const G = 144;
      const cv = document.createElement('canvas');
      cv.width = G; cv.height = G;
      const cx = cv.getContext('2d');
      cx.drawImage(img, 0, 0, G, G);
      const px = cx.getImageData(0,0,G,G).data;
      const heights = new Float32Array(G*G);
      for (let i = 0; i < G*G; i++)
        heights[i] = (0.299*px[i*4] + 0.587*px[i*4+1] + 0.114*px[i*4+2]) / 255;

      let mn = 1, mx = 0;
      for (let i = 0; i < G*G; i++) { if(heights[i]<mn) mn=heights[i]; if(heights[i]>mx) mx=heights[i]; }
      const hr = Math.max(mx-mn, 0.0001);

      // legacy path scaled heights by 500 directly at world size (h*500 = (h*10)*50)
      const mesh = buildGameTerrainMesh(
        G, WORLD.size,
        (ix, iy) => heights[iy*G+ix] * 10,
        (ix, iy) => {
          const t = (heights[iy*G+ix]-mn)/hr;
          return [0.36+t*0.42, 0.48+t*0.29, 0.44+t*0.25];
        }
      );
      setGameTerrain(mesh, file.name);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function loadTerrainFile(file) {
  if (file.type === 'application/json' || file.name.endsWith('.json')) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data.exportMeta || !data.vertexDataMatrix) {
          alert('Invalid JSON: missing exportMeta or vertexDataMatrix.'); return;
        }
        setGameTerrain(buildTerrainFromJSON(data), file.name);
      } catch(err) { alert('JSON parse failed: ' + err.message); }
    };
    reader.readAsText(file);
  } else {
    buildTerrainFromImage(file);
  }
}

// ── particles ──
function makeSmokeTex() {
  const cv = document.createElement('canvas'); cv.width=128; cv.height=128;
  const cx = cv.getContext('2d');
  const g  = cx.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.2,'rgba(230,242,255,0.85)');
  g.addColorStop(0.5,'rgba(190,215,240,0.4)');
  g.addColorStop(1,'rgba(150,190,220,0)');
  cx.fillStyle=g; cx.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(cv); t.needsUpdate=true; return t;
}

function initParticles() {
  const max = CFG.smokeMax;
  pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(max*3),3));
  pGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(max*3),3));
  pGeo.setDrawRange(0,0);
  pMat = new THREE.PointsMaterial({
    size:CFG.smokeSize, map:makeSmokeTex(), vertexColors:true,
    blending:THREE.AdditiveBlending, depthWrite:false, transparent:true,
    opacity:0.78, sizeAttenuation:true,
  });
  pPoints = new THREE.Points(pGeo, pMat);
  pPoints.frustumCulled = false;
  scene.add(pPoints);
}

function emit(pos, vel, isBlood, lifeMult) {
  if (particles.length >= CFG.smokeMax) return;
  const base = isBlood ? CFG.bloodLife : CFG.lifeMin + Math.random()*(CFG.lifeMax-CFG.lifeMin);
  const life = base * (lifeMult||1);
  const sp   = isBlood ? CFG.spread*1.4 : CFG.spread;
  particles.push({
    pos: pos.clone(),
    vel: new THREE.Vector3(
      vel.x + (Math.random()-0.5)*sp*2,
      vel.y + Math.random()*CFG.upDrift + (Math.random()-0.5)*sp,
      vel.z + (Math.random()-0.5)*sp*2
    ),
    life, maxLife:life, blood:isBlood,
  });
}

function emitBlood(pos, vel) {
  for (let i = 0; i < CFG.bloodBurst && particles.length < CFG.smokeMax; i++) {
    const splat = vel.clone().multiplyScalar(0.3+Math.random()*0.6)
      .add(new THREE.Vector3((Math.random()-0.5)*12, Math.random()*8, (Math.random()-0.5)*12));
    emit(pos.clone().add(new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2)), splat, true);
  }
}

function updateParticles(dt) {
  const speed = player.vel.length();

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i,1); continue; }
    p.pos.x += p.vel.x*dt; p.pos.y += p.vel.y*dt; p.pos.z += p.vel.z*dt;
    p.vel.x *= Math.exp(-3.2*dt); p.vel.z *= Math.exp(-3.2*dt);
    p.vel.y *= Math.exp(-2.2*dt); p.vel.y += 1.1*dt;
  }

  let rate = 0;
  if (speed > 1) {
    const t = Math.min(1, (speed-1)/(CFG.maxSpeed-1));
    rate = CFG.smokeBase + t*(CFG.smokeMaxRate-CFG.smokeBase);
  }
  if (player.boostIntensity > 20) rate *= 35;
  if (grapple.active) rate += CFG.smokeBase*0.6;

  if (rate > 0 && particles.length < CFG.smokeMax) {
    pAccum += rate*dt;
    const behind = player.vel.clone().normalize().multiplyScalar(-1);
    if (behind.length() < 0.001) behind.set(0,-5,0);
    while (pAccum >= 1 && particles.length < CFG.smokeMax) {
      pAccum -= 1;
      emit(
        player.pos.clone().addScaledVector(behind, 1+Math.random()*2.5),
        behind.clone().multiplyScalar(3+Math.random()*6),
        false
      );
    }
  }

  const pos = pGeo.attributes.position.array;
  const col = pGeo.attributes.color.array;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i], i3=i*3, f=p.life/p.maxLife;
    pos[i3]=p.pos.x; pos[i3+1]=p.pos.y; pos[i3+2]=p.pos.z;
    if (p.blood) { col[i3]=0.9*f+0.1; col[i3+1]=0.02*f; col[i3+2]=0.02*f; }
    else { const b=0.55+0.45*f; col[i3]=b*0.82; col[i3+1]=b*0.9; col[i3+2]=b; }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate    = true;
  pGeo.setDrawRange(0, particles.length);
}

// ── dummies ──
function spawnDummies() {
  const geo = new THREE.CylinderGeometry(CFG.dummyRadius, CFG.dummyRadius, CFG.dummyHeight, 9);
  const mat = new THREE.MeshLambertMaterial({ color: CFG.dummyColor });
  for (let i = 0; i < CFG.dummyCount; i++) {
    const mesh = new THREE.Mesh(geo, mat.clone());
    const onGround = Math.random() < 0.3;
    let px, pz, floorY;
    if (onGround || !pillars.length) {
      px = (Math.random()-0.5)*WORLD.size; pz = (Math.random()-0.5)*WORLD.size;
      floorY = sampleFloorY(px,pz);
    } else {
      const pillar = pillars[Math.floor(Math.random()*pillars.length)];
      px = pillar.position.x + (Math.random()-0.5)*35;
      pz = pillar.position.z + (Math.random()-0.5)*35;
      floorY = pillar.userData.pillarH;
    }
    const py = floorY + CFG.dummyHeight/2;
    mesh.position.set(px, py, pz);
    mesh.userData.collidable = true;
    scene.add(mesh);

    const hbMesh = new THREE.Mesh(
      new THREE.BoxGeometry(CFG.dummyRadius*2, CFG.dummyHeight, CFG.dummyRadius*2),
      new THREE.MeshBasicMaterial({ color:0xFF4444, wireframe:true, transparent:true, opacity:0.55, depthTest:true, depthWrite:false })
    );
    hbMesh.position.set(px, py, pz);
    scene.add(hbMesh);

    dummies.push({
      mesh, hbMesh,
      pos: new THREE.Vector3(px, py, pz),
      vel: new THREE.Vector3(),
      floorY: floorY + CFG.dummyHeight/2,
      state: 'IDLE', timer: 0,
    });
  }
}

function ragdoll(d, impulse) {
  if (d.state !== 'IDLE') return;
  d.state = 'RAGDOLL';
  d.vel.copy(impulse);
  emitBlood(d.pos, impulse);
}

function updateDummies(dt) {
  for (let i = dummies.length-1; i >= 0; i--) {
    const d = dummies[i];

    if (d.state === 'IDLE') {
      if (player.pos.distanceTo(d.pos) < CFG.dummyProxKill) {
        ragdoll(d, player.vel.clone().multiplyScalar(0.7));
        killCount++;
        document.getElementById('kill-count').textContent = killCount;
      }
      continue;
    }

    if (d.state === 'RAGDOLL') {
      d.vel.y += CFG.gravity * dt;
      const dr = Math.exp(-CFG.ragdollDrag*dt);
      d.vel.x *= dr; d.vel.z *= dr;
      d.pos.addScaledVector(d.vel, dt);
      d.mesh.position.copy(d.pos);
      d.hbMesh.position.copy(d.pos);
      if (d.vel.length() > 0.5) {
        d.mesh.rotation.z =  d.vel.x*0.04;
        d.mesh.rotation.x = -d.vel.z*0.04;
        d.hbMesh.rotation.copy(d.mesh.rotation);
      }

      const terrFloor = sampleFloorY(d.pos.x, d.pos.z) + CFG.dummyHeight/2;
      let floor = terrFloor;
      for (const p of pillars) {
        const hw = p.geometry.parameters.width/2 + 70;
        if (Math.abs(d.pos.x-p.position.x)<hw && Math.abs(d.pos.z-p.position.z)<hw) {
          const pillarTop = p.position.y + p.userData.pillarH/2;
          floor = Math.max(floor, pillarTop + CFG.dummyHeight/2);
        }
      }

      if (d.pos.y <= floor) {
        d.pos.y = floor; d.vel.y = -d.vel.y*0.15;
        d.vel.x *= 0.55; d.vel.z *= 0.55;
        if (Math.abs(d.vel.y) < 6) d.vel.y = 0;
      }

      if (Math.random() < 0.35 && particles.length < CFG.smokeMax)
        emit(d.pos.clone(), new THREE.Vector3((Math.random()-0.5)*1.2, 0.4+Math.random()*1.8, (Math.random()-0.5)*1.2), true, 0.5);

      if (d.vel.length() < CFG.settleSpeed) { d.state='SETTLED'; d.timer=0; }
      continue;
    }

    if (d.state === 'SETTLED') {
      d.timer += dt;
      if (d.timer > CFG.despawnTime) d.state='DEAD';
      continue;
    }

    if (d.state === 'DEAD') {
      emitBlood(d.pos, new THREE.Vector3(0,3,0));
      scene.remove(d.mesh); d.mesh.geometry.dispose();
      scene.remove(d.hbMesh); d.hbMesh.geometry.dispose(); d.hbMesh.material.dispose();
      dummies.splice(i,1);
    }
  }
}

// ── slash ──
function drawSlash() {
  sctx.clearRect(0, 0, sc.width, sc.height);
  for (const p of slashHistory) p.age++;
  slashHistory = slashHistory.filter(p => p.age < 10);
  if (slashHistory.length < 2) return;
  sctx.shadowBlur = 10; sctx.shadowColor = 'rgba(255,10,10,0.85)';
  for (let i = 1; i < slashHistory.length; i++) {
    const a=slashHistory[i-1], b=slashHistory[i], f=(10-b.age)/10;
    sctx.beginPath(); sctx.moveTo(a.x,a.y); sctx.lineTo(b.x,b.y);
    sctx.strokeStyle=`rgba(255,20,20,${f})`; sctx.lineWidth=f*4;
    sctx.lineCap='round'; sctx.stroke();
  }
  sctx.shadowBlur = 0;
}

function trySlash(hist) {
  if (player.slashCD > 0) return;
  const recent = hist.filter(p => p.age < CFG.swipeFrames);
  if (recent.length < 3) return;
  const dx = recent[recent.length-1].x - recent[0].x;
  const dy = recent[recent.length-1].y - recent[0].y;
  if (Math.sqrt(dx*dx+dy*dy) < CFG.swipePx) return;

  player.slashCD = CFG.bladeCooldown;
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);

  for (const d of dummies) {
    if (d.state !== 'IDLE') continue;
    const toD = new THREE.Vector3().subVectors(d.pos, player.pos);
    if (toD.length() > CFG.bladeRadius) continue;
    toD.normalize();
    if (fwd.dot(toD) < CFG.facingDot) continue;
    const imp = player.vel.clone().multiplyScalar(CFG.bladeImpulse); imp.y += 6;
    ragdoll(d, imp);
    killCount++;
    document.getElementById('kill-count').textContent = killCount;
  }
}

// ── grapple ──
function scanHit() {
  aimRay.setFromCamera(cNDC, camera);
  const hits = aimRay.intersectObjects(scene.children, true);
  const hit  = hits.find(h => h.distance < CFG.maxRopeDist && (h.object.userData.collidable || h.object.userData.floor));
  document.getElementById('xhair').classList.toggle('locked', !!hit);
  return hit ? hit.point : null;
}

function fireGrapple() {
  const pt = scanHit(); if (!pt) return;
  releaseGrapple();
  grapple.active = true; grapple.anchor.copy(pt);
  const geo = new THREE.BufferGeometry().setFromPoints([player.pos, pt]);
  grapple.line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: CFG.ropeColor }));
  scene.add(grapple.line);

  const burstCount = 70;
  for (let b = 0; b < burstCount && particles.length < CFG.smokeMax; b++) {
    const spreadVel = new THREE.Vector3(
      (Math.random()-0.5) * 14,
      Math.random() * 10 + 2,
      (Math.random()-0.5) * 14
    );
    emit(
      pt.clone().add(new THREE.Vector3((Math.random()-0.5)*2, Math.random()*2, (Math.random()-0.5)*2)),
      spreadVel, false, 1.1
    );
  }
}

function releaseGrapple() {
  grapple.active = false;
  if (grapple.line) {
    scene.remove(grapple.line);
    grapple.line.geometry.dispose();
    grapple.line.material.dispose();
    grapple.line = null;
  }
}

function updateRope() {
  if (!grapple.line) return;
  const arr = grapple.line.geometry.attributes.position.array;
  arr[0]=player.pos.x; arr[1]=player.pos.y-0.5; arr[2]=player.pos.z;
  grapple.line.geometry.attributes.position.needsUpdate = true;
}

// ── physics (preserved exactly — this is the "feel") ──
function physics(dt) {
  if (dt <= 0) return;

  player.vel.y += CFG.gravity * dt;

  let mx = 0, mz = 0;
  if (stickL.on) { mx = stickL.dx; mz = stickL.dy; }
  const mv = new THREE.Vector3(mx, 0, mz);
  if (mv.lengthSq() > 1) mv.normalize();
  mv.applyAxisAngle(new THREE.Vector3(0,1,0), player.yaw);

  const terrY  = sampleFloorY(player.pos.x, player.pos.z);
  const ground = player.pos.y <= terrY + player.height + 0.05;
  const accel  = ground ? CFG.accelGround : CFG.accelAir;

  player.vel.x += mv.x * accel * dt;
  player.vel.z += mv.z * accel * dt;

  const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(forward.z, 0, -forward.x);
  const horizontalVel = new THREE.Vector3(player.vel.x, 0, player.vel.z);
  const sideSpeed = horizontalVel.dot(right);
  const targetRoll = THREE.MathUtils.clamp(sideSpeed * 0.0009, -0.22, 0.22);
  player.roll = THREE.MathUtils.lerp(player.roll, targetRoll, 0.08);

  player.boostIntensity = 0;
  if (stickL.on) {
    const mag = Math.sqrt(stickL.dx*stickL.dx + stickL.dy*stickL.dy);
    if (mag > 0.05 && (-stickL.dy/mag) > CFG.boostCone)
      player.boostIntensity = (-stickL.dy/mag) * mag;
  }
  if (player.boostIntensity > 0) {
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    player.vel.addScaledVector(fwd, CFG.boostAccel * player.boostIntensity * dt);
  }

  if (grapple.active) {
    const toA = new THREE.Vector3().subVectors(grapple.anchor, player.pos);
    const dist = toA.length(); toA.normalize();
    player.vel.addScaledVector(toA, CFG.hookPull * (dist/80) * dt);
    updateRope();
  }

  player.vel.x *= Math.exp(-CFG.airDrag * dt);
  player.vel.z *= Math.exp(-CFG.airDrag * dt);
  player.vel.y *= Math.exp(-CFG.airDrag * 0.12 * dt);

  const spd = player.vel.length();
  if (spd > CFG.maxSpeed) player.vel.multiplyScalar(CFG.maxSpeed/spd);

  player.pos.addScaledVector(player.vel, dt);

  const PLAYER_R = player.capsuleRadius;
  for (const p of pillars) {
    const hw = p.geometry.parameters.width  / 2 + PLAYER_R;
    const hd = p.geometry.parameters.depth  / 2 + PLAYER_R;
    const dx = player.pos.x - p.position.x;
    const dz = player.pos.z - p.position.z;
    if (Math.abs(dx) > hw + 50 || Math.abs(dz) > hd + 50) continue;

    const pillarBaseY = p.position.y - p.userData.pillarH/2;
    const pillarTopY  = p.position.y + p.userData.pillarH/2;
    const playerBottom = player.pos.y - player.capsuleHalfHeight;
    const playerTop    = player.pos.y + player.capsuleHalfHeight;
    if (playerTop < pillarBaseY || playerBottom > pillarTopY) continue;

    if (Math.abs(dx) < hw && Math.abs(dz) < hd) {
      const ox = hw - Math.abs(dx);
      const oz = hd - Math.abs(dz);
      if (ox < oz) {
        player.pos.x += dx < 0 ? -ox : ox;
        player.vel.x  = 0;
      } else {
        player.pos.z += dz < 0 ? -oz : oz;
        player.vel.z  = 0;
      }
    }
  }

  for (const d of dummies) {
    if (d.state !== 'IDLE') continue;
    const ddx = player.pos.x - d.pos.x;
    const ddz = player.pos.z - d.pos.z;
    const distXZ = Math.sqrt(ddx*ddx + ddz*ddz);
    const minDist = player.capsuleRadius + CFG.dummyRadius;
    if (distXZ < minDist && distXZ > 0.001) {
      const push = (minDist - distXZ) / distXZ;
      player.pos.x += ddx * push;
      player.pos.z += ddz * push;
    }
  }

  const floorY = sampleFloorY(player.pos.x, player.pos.z) + player.height;
  if (player.pos.y <= floorY) {
    player.pos.y = floorY;
    player.vel.y = 0;
    player.vel.x *= Math.exp(-CFG.groundFric * dt);
    player.vel.z *= Math.exp(-CFG.groundFric * dt);
  }

  const eyePos = player.pos.clone().add(new THREE.Vector3(0, CFG.camEyeOffset, 0));
  camTarget.lerp(eyePos, CFG.camLag);
  camera.position.copy(camTarget);
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
  camera.rotation.z = -player.roll;

  if (stickR.on) {
    player.yaw   -= stickR.dx * CFG.stickSens;
    player.pitch -= stickR.dy * CFG.stickSens;
    player.pitch  = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
  } else {
    const m = Math.abs(stickR.momX) + Math.abs(stickR.momY);
    if (m > 0.0005) {
      const fd = Math.exp(-CFG.groundFric * dt);
      stickR.momX *= fd; stickR.momY *= fd;
      player.yaw   -= stickR.momX * CFG.stickSens;
      player.pitch -= stickR.momY * CFG.stickSens;
      player.pitch  = Math.max(-Math.PI/2, Math.min(Math.PI/2, player.pitch));
    } else { stickR.momX=0; stickR.momY=0; }
  }

  if (player.slashCD > 0) player.slashCD -= dt;

  const targetHFov = CFG.hFov + Math.min(CFG.hFovMax - CFG.hFov, spd * 0.035);
  const fovRate = currentHFov < targetHFov ? CFG.fovExpandRate : CFG.fovRecoverRate;
  currentHFov += (targetHFov - currentHFov) * fovRate;
  setHFov(currentHFov);

  const alt = player.pos.y - (sampleFloorY(player.pos.x, player.pos.z) + player.height);
  document.getElementById('hud-spd').textContent   = `SPD: ${spd.toFixed(1)}`;
  document.getElementById('hud-alt').textContent   = `ALT: ${alt.toFixed(1)}`;
  document.getElementById('hud-boost').textContent = `BOOST: ${Math.round(player.boostIntensity*100)}%`;
  document.getElementById('hud-status').textContent =
    player.boostIntensity > 0.05 ? 'BOOST' : grapple.active ? 'ANCHORED' : ground ? 'GROUNDED' : 'AIR';

  player.prevSpeed = spd;
  scanHit();
}

// ── stick helper ──
function normStick(rawDx, rawDy) {
  const R = CFG.stickRadius;
  const dist = Math.sqrt(rawDx*rawDx + rawDy*rawDy);
  if (dist === 0) return { dx:0, dy:0, vx:0, vy:0 };
  const cap = Math.min(dist, R);
  const nx = rawDx/dist, ny = rawDy/dist;
  return { dx: nx*(cap/R), dy: ny*(cap/R), vx:nx, vy:ny, mag:cap/R };
}

// ── game input (gated to RUN mode) ──
function bindInput() {
  const knobL  = document.getElementById('knobL');
  const knobR  = document.getElementById('knobR');
  const joyLEl = document.getElementById('joyL');
  const joyREl = document.getElementById('joyR');
  const SLASH_Y = () => innerHeight * 0.65;
  const KNOB_TRAVEL = CFG.stickRadius * 0.68;

  function bounds(el) {
    const r = el.getBoundingClientRect();
    return { cx: r.left+r.width/2, cy: r.top+r.height/2, r: r.width/2+20 };
  }

  document.addEventListener('touchstart', e => {
    if (MODE !== 'run') return;
    if (e.target.closest('.ui-block')) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.clientY < SLASH_Y()) {
        slashTouches[t.identifier] = [{x:t.clientX, y:t.clientY, age:0}];
        slashHistory.push({x:t.clientX, y:t.clientY, age:0});
        continue;
      }
      const lb = bounds(joyLEl);
      if (!stickL.on && Math.hypot(t.clientX-lb.cx, t.clientY-lb.cy) < lb.r) {
        stickL.on=true; stickL.id=t.identifier; stickL.cx=lb.cx; stickL.cy=lb.cy;
        continue;
      }
      const rb = bounds(joyREl);
      if (!stickR.on && Math.hypot(t.clientX-rb.cx, t.clientY-rb.cy) < rb.r) {
        stickR.on=true; stickR.id=t.identifier; stickR.cx=rb.cx; stickR.cy=rb.cy;
        stickR.momX=0; stickR.momY=0;
        knobR.classList.add('active');
        fireGrapple();
        continue;
      }
    }
  }, { passive:false });

  document.addEventListener('touchmove', e => {
    if (MODE !== 'run') return;
    if (e.target.closest('.ui-block')) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (slashTouches[t.identifier]) {
        slashTouches[t.identifier].push({x:t.clientX, y:t.clientY, age:0});
        slashHistory.push({x:t.clientX, y:t.clientY, age:0});
        continue;
      }
      if (t.identifier === stickL.id) {
        const n = normStick(t.clientX-stickL.cx, t.clientY-stickL.cy);
        stickL.dx=n.dx; stickL.dy=n.dy;
        knobL.style.transform = `translate(calc(-50% + ${n.vx*n.mag*KNOB_TRAVEL}px), calc(-50% + ${n.vy*n.mag*KNOB_TRAVEL}px))`;
        if (player.boostIntensity > 0.05) knobL.classList.add('boost');
        else knobL.classList.remove('boost');
      }
      if (t.identifier === stickR.id) {
        const n = normStick(t.clientX-stickR.cx, t.clientY-stickR.cy);
        stickR.dx=n.dx; stickR.dy=n.dy;
        knobR.style.transform = `translate(calc(-50% + ${n.vx*n.mag*KNOB_TRAVEL}px), calc(-50% + ${n.vy*n.mag*KNOB_TRAVEL}px))`;
      }
    }
  }, { passive:false });

  document.addEventListener('touchend', e => {
    if (MODE !== 'run') return;
    for (const t of e.changedTouches) {
      if (slashTouches[t.identifier]) {
        trySlash(slashTouches[t.identifier]);
        delete slashTouches[t.identifier];
        continue;
      }
      if (t.identifier === stickL.id) {
        stickL.on=false; stickL.id=null; stickL.dx=0; stickL.dy=0;
        knobL.style.transform='translate(-50%,-50%)';
        knobL.classList.remove('boost');
      }
      if (t.identifier === stickR.id) {
        stickR.momX=stickR.dx; stickR.momY=stickR.dy;
        stickR.on=false; stickR.id=null; stickR.dx=0; stickR.dy=0;
        knobR.style.transform='translate(-50%,-50%)';
        knobR.classList.remove('active');
        releaseGrapple();
      }
    }
  });

  document.addEventListener('touchcancel', () => {
    if (MODE !== 'run') return;
    stickL.on=false; stickL.dx=0; stickL.dy=0;
    knobL.style.transform='translate(-50%,-50%)'; knobL.classList.remove('boost');
    stickR.momX=stickR.dx; stickR.momY=stickR.dy;
    stickR.on=false; stickR.dx=0; stickR.dy=0;
    knobR.style.transform='translate(-50%,-50%)'; knobR.classList.remove('active');
    releaseGrapple();
    for (const k of Object.keys(slashTouches)) delete slashTouches[k];
  });
}

// ╔══════════════════════════════════════════════════════════╗
// ║ [CORE] — unified loop + resize + boot                     ║
// ╚══════════════════════════════════════════════════════════╝
window.addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  setHFov(currentHFov);
  forgeCam.aspect = innerWidth / innerHeight;
  forgeCam.updateProjectionMatrix();
  sc.width = innerWidth; sc.height = innerHeight;
});

function loop() {
  requestAnimationFrame(loop);
  let dt = clock.getDelta();
  if (dt > 0.1) dt = 0.1;

  if (MODE === 'forge') {
    orbit.update(dt);
    applyAtmosphere();          // live atmosphere updates
    renderer.render(forgeScene, forgeCam);
    return;
  }

  physics(dt);
  camera.position.copy(player.pos);
  camera.rotation.z = -player.roll;
  updateDummies(dt);
  updateParticles(dt);
  drawSlash();
  renderer.render(scene, camera);
}

// boot
camTarget.copy(player.pos);
buildWorld();
initParticles();
spawnDummies();
bindInput();
setMode('forge');
loop();
</script>
</body>
</html>
