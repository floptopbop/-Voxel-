// ║ [STRUCT] the hidden structure — waaa_5's voxel builder    ║
// ║ (worker carried over verbatim). Silhouette-carved from    ║
// ║ the four photos, set out in the world behind you and      ║
// ║ half-buried in the terrain. Solid: you collide, wall-run  ║
// ║ and rope onto it. Worker coords are local; STRUCT.off     ║
// ║ places them in the world.                                  ║
// ╚══════════════════════════════════════════════════════════╝
const VCFG = {
    // waaa_5 build values
    edgeDepth:7, detailDepth:8, detailCut:0.06, maxCubes:400000, imgSize:256, threshold:2, sculpt:4,
    lumaCarve:0.1, gap:0, jitter:0.04, colorMode:'source', preview:false, span:1600, floorY:0,
    // waaa_5 look
    edgeLines:0.45, lineWidth:0.07, aoStrength:0.6, sun:0.7, ambient:0.85, gloss:0.25, lodPx:1.5,
    // placement
    dist:7000, angle:90, bury:0.3, cutRadius:18,
};
const STRUCT = {
    sets:[], msg:null, building:false, jobId:0, bbox:null, level:-1, off:new THREE.Vector3(), cubes:0,
    cuts:[], restoreCuts:[], replaying:false, carveId:0, carvePending:0,
};
const voxWorker = new Worker(URL.createObjectURL(new Blob([document.getElementById('voxel-worker').textContent], { type:'application/javascript' })));
let faceMat = null;
function makeFaceMaterial(){                                         // waaa_5, plus uOff to place it in the world
    const sunDir = sun.position.clone().normalize();
    return new THREE.ShaderMaterial({
        extensions:{ derivatives:true },
        uniforms:{
            uOff:{ value:STRUCT.off },
            uEdge:{value:VCFG.edgeLines}, uLineW:{value:VCFG.lineWidth}, uAO:{value:VCFG.aoStrength},
            uSun:{value:VCFG.sun}, uAmb:{value:VCFG.ambient}, uGloss:{value:VCFG.gloss},
            uHemi:{value:0.4}, uFill:{value:0.2},
            uSunDir:{value:sunDir}, uFillDir:{value:new THREE.Vector3(-0.3,0.2,-0.35).normalize()},
            uSunCol:{value:new THREE.Color(0xF2F4F2)}, uAmbCol:{value:new THREE.Color(0xEAF0F4)},
            uSky:{value:new THREE.Color(0xA6CBE2)}, uGround:{value:new THREE.Color(0x3A3E42)},
            uFillCol:{value:new THREE.Color(0x4E7FB0)},
            uFogCol:{value:new THREE.Color(0xA6CBE2)}, uFogNear:{value:ATMO.fogNear}, uFogFar:{value:ATMO.fogFar},
        },
        vertexShader:`
            uniform vec3 uOff;
            attribute vec4 aPos; attribute vec4 aCol; attribute vec4 aAO;
            varying vec3 vCol; varying vec3 vN; varying vec2 vUV; varying float vAO; varying vec3 vW; varying float vFogD;
            void main(){
                float dir=floor(aCol.w*255.0+0.5);
                vec3 n; vec3 u; vec3 v;
                if(dir<0.5){      n=vec3(1.0,0.0,0.0);  u=vec3(0.0,0.0,-1.0); v=vec3(0.0,1.0,0.0); }
                else if(dir<1.5){ n=vec3(-1.0,0.0,0.0); u=vec3(0.0,0.0,1.0);  v=vec3(0.0,1.0,0.0); }
                else if(dir<2.5){ n=vec3(0.0,1.0,0.0);  u=vec3(1.0,0.0,0.0);  v=vec3(0.0,0.0,-1.0); }
                else if(dir<3.5){ n=vec3(0.0,-1.0,0.0); u=vec3(1.0,0.0,0.0);  v=vec3(0.0,0.0,1.0); }
                else if(dir<4.5){ n=vec3(0.0,0.0,1.0);  u=vec3(1.0,0.0,0.0);  v=vec3(0.0,1.0,0.0); }
                else {            n=vec3(0.0,0.0,-1.0); u=vec3(-1.0,0.0,0.0); v=vec3(0.0,1.0,0.0); }
                float sz=aPos.w;
                vec3 w=aPos.xyz+uOff+n*(0.5*sz)+(u*position.x+v*position.y)*sz;
                float sx=step(0.0,position.x), sy=step(0.0,position.y);
                vAO=dot(aAO,vec4((1.0-sx)*(1.0-sy),sx*(1.0-sy),(1.0-sx)*sy,sx*sy));
                vCol=aCol.rgb; vN=n; vUV=position.xy; vW=w;
                vec4 mv=viewMatrix*vec4(w,1.0);
                vFogD=-mv.z;
                gl_Position=projectionMatrix*mv;
            }`,
        fragmentShader:`
            uniform float uEdge, uLineW, uAO, uSun, uAmb, uGloss, uHemi, uFill;
            uniform vec3 uSunDir, uFillDir, uSunCol, uAmbCol, uSky, uGround, uFillCol, uFogCol;
            uniform float uFogNear, uFogFar;
            varying float vFogD;
            varying vec3 vCol; varying vec3 vN; varying vec2 vUV; varying float vAO; varying vec3 vW;
            void main(){
                vec3 n=vN;
                float e=0.5-max(abs(vUV.x),abs(vUV.y));
                float fw=max(fwidth(e),1e-5);
                float line=1.0-smoothstep(uLineW-fw,uLineW+fw,e);
                float avg=1.0-(1.0-2.0*uLineW)*(1.0-2.0*uLineW);
                float fade=clamp(1.5-fw/uLineW,0.0,1.0);
                float edgeK=1.0-uEdge*mix(avg,line,fade);
                float ao=mix(1.0,0.3+0.7*vAO,uAO);
                float kd=max(dot(n,uSunDir),0.0), kf=max(dot(n,uFillDir),0.0);
                vec3 hemi=mix(uGround,uSky,0.5*n.y+0.5);
                vec3 light=uAmbCol*uAmb+hemi*uHemi+uSunCol*uSun*kd+uFillCol*uFill*kf;
                vec3 c=vCol*light*0.8;
                vec3 vd=normalize(cameraPosition-vW), h=normalize(uSunDir+vd);
                c+=uSunCol*uSun*uGloss*pow(max(dot(n,h),0.0),48.0)*kd;
                c*=edgeK*ao;
                gl_FragColor=vec4(c,1.0);
                #include <tonemapping_fragment>
                #include <encodings_fragment>
                gl_FragColor.rgb=mix(gl_FragColor.rgb,uFogCol,smoothstep(uFogNear,uFogFar,vFogD));
            }`

const QUAD = new Float32Array([-0.5,-0.5,0, 0.5,-0.5,0, -0.5,0.5,0, 0.5,0.5,0]);
function makeSetMesh(set){                                          // waaa_5

    g.setAttribute('position', new THREE.BufferAttribute(QUAD,3));
    g.setAttribute('aPos', new THREE.InstancedBufferAttribute(set.pos,4));
    g.setAttribute('aCol', new THREE.InstancedBufferAttribute(set.col,4,true));

function disposeSet(s){ if(s.chunks) s.chunks.forEach(c=>c.mesh.geometry.dispose()); else s.mesh.geometry.dispose(); }
function clearStructure(){

    STRUCT.sets.forEach(s=>{ scene.remove(s.mesh); disposeSet(s); });
    STRUCT.sets = []; STRUCT.msg = null; STRUCT.bbox = null; STRUCT.level = -1; STRUCT.cubes = 0;
    STRUCT.building = false; STRUCT.carvePending = 0; STRUCT.cuts = []; STRUCT.restoreCuts = []; STRUCT.replaying = false;

function applySets(msg){                                            // waaa_5 applySets, world-only

// set it out in the world: distance + bearing from the duel ring, sunk into the terrain by "bury"
function placeStructure(){
    const a = THREE.MathUtils.degToRad(VCFG.angle), sd = VCFG.dist*WORLD.scale;
    const x = Math.cos(a)*sd, z = Math.sin(a)*sd;
    const bb = STRUCT.bbox, hgt = bb ? bb[4]-bb[1] : VCFG.span*0.5;
    let fl = Infinity;
    const r = bb ? Math.max(bb[3]-bb[0], bb[5]-bb[2])*0.5 : VCFG.span*0.3;
    for(const [dx,dz] of [[0,0],[r,0],[-r,0],[0,r],[0,-r]]) fl = Math.min(fl, floorY(x+dx, z+dz));
    STRUCT.off.set(x, fl - VCFG.bury*hgt, z);

}
const _pl = new THREE.Vector3();
function pickLevel(){                                               // waaa_5 LOD: coarse far away, finest up close
    if(!STRUCT.sets.length) return;
    let pick = STRUCT.sets[STRUCT.sets.length-1];
    const bb = STRUCT.bbox;
    if(VCFG.lodPx > 0 && bb){
        const o = STRUCT.off, cp = camera.position;
        _pl.set(Math.min(Math.max(cp.x, bb[0]+o.x), bb[3]+o.x), Math.min(Math.max(cp.y, bb[1]+o.y), bb[4]+o.y), Math.min(Math.max(cp.z, bb[2]+o.z), bb[5]+o.z));
        const dist = Math.max(cp.distanceTo(_pl), 1), pr = renderer.getPixelRatio();
        const pxPerUnit = (cc.clientHeight*pr)/(2*dist*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
        pick = STRUCT.sets[0];
        for(const s of STRUCT.sets) if((VCFG.span/(1<<s.level))*pxPerUnit >= VCFG.lodPx*pr) pick = s;
    }
    if(pick.level !== STRUCT.level){ STRUCT.sets.forEach(s=>s.mesh.visible = (s===pick)); STRUCT.level = pick.level; }
}
function sendView(key){                                             // waaa_5 drawView: square n×n to the worker

function requestStructure(preserveReplay=false){

// ── collision bubble (waaa_5): the worker streams a small grid of solid cells around you ──
const BUB_H = 128, BUB_REFRESH = 0.35;
const BUB = { ready:false, n:0, c:1, ox:0, oy:0, oz:0, grid:null, center:new THREE.Vector3(), pending:false, id:0, force:false };
// world → bubble cell (bubble coords are the worker's local coords; STRUCT.off places them)
const cellX = wx => Math.floor((wx - STRUCT.off.x - BUB.ox)/BUB.c);
const cellY = wy => Math.floor((wy - STRUCT.off.y - BUB.oy)/BUB.c);
const cellZ = wz => Math.floor((wz - STRUCT.off.z - BUB.oz)/BUB.c);
const wCenterX = c => STRUCT.off.x + BUB.ox + (c+0.5)*BUB.c;
const wCenterY = c => STRUCT.off.y + BUB.oy + (c+0.5)*BUB.c;
const wCenterZ = c => STRUCT.off.z + BUB.oz + (c+0.5)*BUB.c;
function solidVox(wx, wy, wz){
    if(!BUB.ready) return 0;
    const x = cellX(wx), y = cellY(wy), z = cellZ(wz), n = BUB.n;
    if(x<0 || y<0 || z<0 || x>=n || y>=n || z>=n) return 0;
    return BUB.grid[(y*n + z)*n + x];
}
const _pred = new THREE.Vector3();
function nearStructure(p, pad){
    const bb = STRUCT.bbox; if(!bb) return false;
    const o = STRUCT.off;
    return p.x > bb[0]+o.x-pad && p.x < bb[3]+o.x+pad && p.y > bb[1]+o.y-pad && p.y < bb[4]+o.y+pad && p.z > bb[2]+o.z-pad && p.z < bb[5]+o.z+pad;
}
function maintainBubble(){
    if(BUB.pending || !STRUCT.msg || !STRUCT.cubes) return;
    _pred.copy(player.pos).addScaledVector(player.vel, 0.25);
    if(!nearStructure(_pred, BUB_H*2)) return;
    if(BUB.ready && !BUB.force && _pred.distanceTo(BUB.center) < BUB_H*BUB_REFRESH) return;
    BUB.pending = true; BUB.force = false; BUB.id++;
    voxWorker.postMessage({ type:'bubble', id:BUB.id, cx:_pred.x-STRUCT.off.x, cy:_pred.y-STRUCT.off.y, cz:_pred.z-STRUCT.off.z, H:BUB_H });
}
function onBubble(m){

const voxAim = { ok:false, dist:0, t:0, p:new THREE.Vector3() };
const _cutPoint = new THREE.Vector3();
const carveRayRequests = new Map();
let _rayTaskId = 0, _lastVoxelCut = 0;
let _aimId = 0, _lastAimT = 0;
const _rd = new THREE.Vector3();

function onRay(m){

        const hit = new THREE.Vector3(m.px + req.off.x, m.py + req.off.y, m.pz + req.off.z);

            ax:a.x-req.off.x, ay:a.y-req.off.y, az:a.z-req.off.z,
            bx:b.x-req.off.x, by:b.y-req.off.y, bz:b.z-req.off.z,

}

function applyCarvedMessage(msg){
    if(msg.gen !== STRUCT.jobId) return;

// ╔══════════════════════════════════════════════════════════╗
// ║ [ODM] PHYSICS — locked formulas + tumble + hitbox statics ║
// ╚══════════════════════════════════════════════════════════╝
function physics(dt){
    if(dt <= 0) return;
    maintainBubble();
    player.vel.y += M.gravity*dt*(wall.on ? M.wallRunGravity : 1);

    const tumbling = player.tumble > 0;
    const ctl = tumbling ? 0.15 : 1;

    let mx = 0, mz = 0;
    if(stickL.on){ mx = stickL.dx; mz = stickL.dy; }
    const mv = _mv.set(mx,0,mz);
    if(mv.lengthSq() > 1) mv.normalize();
    mv.applyAxisAngle(_UP, player.yaw);

    const gY = floorY(player.pos.x, player.pos.z) + M.height;
    const onGround = player.pos.y <= gY + 0.5;
    const accel = (onGround ? M.accelGround : M.accelAir)*ctl;
    player.vel.x += mv.x*accel*dt;
    player.vel.z += mv.z*accel*dt;

    const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
    const sideSpeed = player.vel.x*fwdZ - player.vel.z*fwdX;
    let targetRoll = THREE.MathUtils.clamp(sideSpeed*M.rollScale, -M.rollMax, M.rollMax);
    if(wall.on){
        // lean away from the wall (waaa_5; sign flipped because this camera rolls by -roll)
        const side = wall.nx*Math.cos(player.yaw) - wall.nz*Math.sin(player.yaw);
        targetRoll = Math.sign(side)*M.wallTilt;
    }
    player.roll = THREE.MathUtils.lerp(player.roll, targetRoll, wall.on ? 0.12 : 0.08);

    player.boostIntensity = 0;
    if(stickL.on && !tumbling){
        const mag = Math.sqrt(stickL.dx*stickL.dx + stickL.dy*stickL.dy);
        if(mag > 0.05 && (-stickL.dy/mag) > M.boostCone) player.boostIntensity = (-stickL.dy/mag)*mag;
    }
    if(player.boostIntensity > 0){ camera.getWorldDirection(_fwd); player.vel.addScaledVector(_fwd, M.boostAccel*player.boostIntensity*dt); }
    const _boost = player.boostIntensity > 0.05;
    if(_boost !== _lastBoost){ EL.knobLEl.classList.toggle('boost', _boost); _lastBoost = _boost; }

    if(grapple.active){
        if(grapple.trackTarget){
            const tgt = grapple.trackTarget;
            if(!titans.includes(tgt) || tgt.state === 'DEAD') releaseGrapple();
            else grapple.anchor.copy(tgt.pos);
        }
        if(grapple.active){
            _toA.subVectors(grapple.anchor, player.pos);
            const dist = _toA.length(); _toA.normalize();
            player.vel.addScaledVector(_toA, M.hookPull*(dist/M.ropeNorm)*dt);
            updateRope();
        }
    }

    player.vel.x *= Math.exp(-M.airDrag*dt);
    player.vel.z *= Math.exp(-M.airDrag*dt);
    player.vel.y *= Math.exp(-M.airDrag*0.12*dt);

    const spd = player.vel.length();
    if(spd > M.maxSpeed) player.vel.multiplyScalar(M.maxSpeed/spd);

    // move: near the structure, swept + sub-stepped against its cells (waaa_5's resolver);
    // everywhere else a plain step
    let voxGround = false;
    if(BUB.ready && nearStructure(player.pos, 60)){
        const r = M.radius, hh = M.height, Cc = BUB.c;
        const steps = Math.max(1, Math.min(12, Math.ceil(player.vel.length()*dt/(Cc*0.38))));
        const hdt = dt/steps;
        for(let sub=0; sub<steps; sub++){
            const ox = player.pos.x, oy = player.pos.y, oz = player.pos.z;
            const vx = player.vel.x, vy = player.vel.y, vz = player.vel.z;
            const nx = ox + vx*hdt, lx = nx + Math.sign(vx)*r;
            if(solidVox(lx, oy, oz)){
                const c = cellX(lx);
                player.pos.x = vx>0 ? wCenterX(c) - Cc*0.5 - r : wCenterX(c) + Cc*0.5 + r;
                if(vx>0) player.vel.x = Math.min(0, player.vel.x); else if(vx<0) player.vel.x = Math.max(0, player.vel.x);
            } else player.pos.x = nx;
            const nz = oz + vz*hdt, lz = nz + Math.sign(vz)*r;
            if(solidVox(player.pos.x, oy, lz)){
                const c = cellZ(lz);
                player.pos.z = vz>0 ? wCenterZ(c) - Cc*0.5 - r : wCenterZ(c) + Cc*0.5 + r;
                if(vz>0) player.vel.z = Math.min(0, player.vel.z); else if(vz<0) player.vel.z = Math.max(0, player.vel.z);
            } else player.pos.z = nz;
            const ny = oy + vy*hdt, ly = ny + Math.sign(vy)*hh;
            if(solidVox(player.pos.x, ly, player.pos.z)){
                const c = cellY(ly);
                if(vy>0) player.pos.y = wCenterY(c) - Cc*0.5 - hh;
                else { player.pos.y = wCenterY(c) + Cc*0.5 + hh; voxGround = true; }
                if(vy>0) player.vel.y = Math.min(0, player.vel.y); else if(vy<0) player.vel.y = Math.max(0, player.vel.y);
            } else player.pos.y = ny;
        }
    } else player.pos.addScaledVector(player.vel, dt);

    // static AABB collisions
    let onTop = false;
    for(const s of staticsNear(player.pos.x, player.pos.z, M.radius + 2)){
        const bodyBottom = player.pos.y-M.height, bodyTop = player.pos.y+M.height;
        if(bodyTop < s.baseY || bodyBottom > s.topY) continue;
        const dx = player.pos.x-s.x, dz = player.pos.z-s.z;
        const hw = s.hw+M.radius, hd = s.hd+M.radius;
        if(Math.abs(dx) > hw || Math.abs(dz) > hd) continue;
        const ox = hw-Math.abs(dx), oz = hd-Math.abs(dz);
        const oy = s.topY-bodyBottom;
        if(player.vel.y <= 0 && oy < ox && oy < oz){
            const vImpact = -player.vel.y;
            player.pos.y = s.topY+M.height; player.vel.y = 0; onTop = true;
            if(vImpact > M.tumbleThresh) startTumble(vImpact, new THREE.Vector3(0,1,0));
        } else if(ox < oz){
            const vImpact = Math.abs(player.vel.x);
            player.pos.x += dx<0 ? -ox : ox;
            if(vImpact > M.tumbleThresh){ startTumble(vImpact, new THREE.Vector3(Math.sign(dx),0,0)); player.vel.x = -player.vel.x*0.3; }
            else player.vel.x = 0;
        } else {
            const vImpact = Math.abs(player.vel.z);
            player.pos.z += dz<0 ? -oz : oz;
            if(vImpact > M.tumbleThresh){ startTumble(vImpact, new THREE.Vector3(0,0,Math.sign(dz))); player.vel.z = -player.vel.z*0.3; }
            else player.vel.z = 0;
        }
    }

    // soft world edge, hidden in the fog
    { const hd = Math.hypot(player.pos.x, player.pos.z), lim = WORLD.half;
      if(hd > lim){ const nx = player.pos.x/hd, nz = player.pos.z/hd;
          player.pos.x = nx*lim; player.pos.z = nz*lim;
          const vo = player.vel.x*nx + player.vel.z*nz; if(vo > 0){ player.vel.x -= nx*vo; player.vel.z -= nz*vo; } } }
    const gY2 = floorY(player.pos.x, player.pos.z) + M.height;
    if(player.pos.y <= gY2){
        const vImpact = -player.vel.y;
        player.pos.y = gY2; player.vel.y = 0;
        if(vImpact > M.tumbleThresh*1.4) startTumble(vImpact, new THREE.Vector3(0,1,0));
        player.vel.x *= Math.exp(-M.groundFric*dt);
        player.vel.z *= Math.exp(-M.groundFric*dt);
    }

    // ── wall run (waaa_5) ─────────────────────────────────────
    // Airborne, brushing a pillar, moving along it fast enough → you catch it:
    // gravity eases, you hug the wall, the camera leans away. It runs out
    // after wallRunTime. Landing resets it. Pillars are axis-aligned boxes.
    const grounded = player.pos.y <= floorY(player.pos.x, player.pos.z) + M.height + 0.5 || onTop || voxGround;
    if(wall.cool > 0) wall.cool -= dt;
    if(wall.coyote > 0) wall.coyote -= dt;
    if(grounded) wall.t = 0;
    {
        const px = player.pos.x, py = player.pos.y, pz = player.pos.z, r = M.radius;
        const reach = r + 12;                       // ~1.2 m of contact slack

        if(canRun){
            if(!wall.on) player.vel.y = Math.max(player.vel.y*0.3, 0);        // catching the wall kills the fall
            if(wall.nx !== wnx || wall.nz !== wnz) wall.t = 0;                // new wall, fresh run

            const into = player.vel.x*wnx + player.vel.z*wnz;               // remove motion into the wall
            if(into < 0){ player.vel.x -= into*wnx; player.vel.z -= into*wnz; }

    const fovRate = currentHFov < targetHFov ? M.fovExpandRate : M.fovRecoverRate;
    currentHFov += (targetHFov-currentHFov)*fovRate;
    setHFov(currentHFov);

    if(++_hudTick >= 6){
        _hudTick = 0;
        EL.spd.textContent = spd.toFixed(0);
        EL.alt.textContent = (player.pos.y-M.height).toFixed(0);
        EL.hits.textContent = hitCount;
        EL.hp.textContent = titan ? (titan.state !== 'DEAD' ? Math.max(0,Math.ceil(titan.hp))+'/'+titan.hpMax : 'down') : '-';
        EL.ts.textContent = titan && titan.state !== 'DEAD' && titan.state !== 'IDLE' && titan.state !== 'TRACK' ? titan.state.toLowerCase() : '';

        const txt = tumbling ? '!! tumbling !!' : wall.on ? 'wall run' : _boost ? 'boost' : grapple.active ? (grapple.trackTarget ? 'locked on' : 'anchored') : grounded ? 'grounded' : 'air';
        if(txt !== _lastStatus){ EL.status.textContent = txt; EL.status.classList.toggle('tumbling', tumbling); _lastStatus = txt; }
    }
    scanHit();
}

    const R = M.stickRadius, dist = Math.sqrt(rawDx*rawDx + rawDy*rawDy);

    const cap = Math.min(dist,R), lin = cap/R, nx = rawDx/dist, ny = rawDy/dist;

// ║ height slider = world height per 1.0 of elevation.        ║

function parseLooseJSON(txt){
    txt = String(txt).replace(/^\uFEFF/, '').trim();

    return JSON.parse(txt.replace(/\bNaN\b|-?\bInfinity\b/g, 'null'));      // Python-style dumps
}
function findGrid(o, depth){
    if(depth > 5 || !o || typeof o !== 'object') return null;
    if(Array.isArray(o) && o.length >= 2 && Array.isArray(o[0]) && o[0].length >= 2 && typeof o[0][0] === 'number'){
        const w = o[0].length; if(o.every(r => Array.isArray(r) && r.length === w)) return o;
    }
    for(const k of Object.keys(o)){ const g = findGrid(o[k], depth+1); if(g) return g; }
    return null;
}
function terrainFromJSON(data, name){
    if(data && data.exportMeta && Array.isArray(data.vertexDataMatrix)){
        const m = data.exportMeta, pts = data.vertexDataMatrix;
        let d = +m.systemDensity || 0;
        if(!d) for(const p of pts) if(p && p.gridIndex) d = Math.max(d, p.gridIndex.x+1, p.gridIndex.y+1);
        if(d < 2) throw new Error('composer export has no grid');
        const elev = new Float32Array(d*d), col = new Float32Array(d*d*3); let hasC = false, mx = 0;
        for(const p of pts){
            const g = p && p.gridIndex; if(!g) continue;
            const x = g.x|0, y = g.y|0; if(x < 0 || y < 0 || x >= d || y >= d) continue;
            const i = y*d + x, e = +p.elevationNormalized; elev[i] = Number.isFinite(e) ? e : 0; if(elev[i] > mx) mx = elev[i];
            const c = p.colorRGB;
            if(Array.isArray(c)){ hasC = true; const k = (c[0]>1||c[1]>1||c[2]>1) ? 1/255 : 1; col[i*3] = c[0]*k; col[i*3+1] = c[1]*k; col[i*3+2] = c[2]*k; }
        }
        return { json:true, w:d, h:d, elev, max:mx, colors:hasC ? col : null, heights:null, label:`composer export ${d}×${d}` };
    }
    const g = findGrid(data, 0);
    if(!g) throw new Error(`no height grid in ${name}`);
    const h = g.length, w = g[0].length, elev = new Float32Array(w*h);

    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v = +g[y][x]; if(Number.isFinite(v)){ if(v<mn)mn=v; if(v>mx)mx=v; } }

    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v = +g[y][x]; elev[y*w+x] = Number.isFinite(v) ? (v-mn)/r : 0; }
    return { json:true, w, h, elev, max:1, colors:null, heights:null, label:`height grid ${w}×${h}` };
}

// orbit camera: one finger turns, two fingers pinch to zoom and drag to pan
function updateOrbit(){
    const o = orbit, cp = Math.cos(o.pitch);
    camera.position.set(o.target.x + o.dist*cp*Math.sin(o.yaw), o.target.y + o.dist*Math.sin(o.pitch), o.target.z + o.dist*cp*Math.cos(o.yaw));
    const fl = floorY(camera.position.x, camera.position.z) + 20;
    if(camera.position.y < fl) camera.position.y = fl;
    camera.lookAt(o.target);
}
function orbitTouch(e, phase){
    const T = orbit.touches;
    if(phase === 'start') for(const t of e.changedTouches) T[t.identifier] = { x:t.clientX, y:t.clientY };
    if(phase === 'end'){ for(const t of e.changedTouches) delete T[t.identifier]; orbit.pinch = 0; orbit.mid = null; return; }
    if(phase !== 'move') return;
    const ids = Object.keys(T);
    if(ids.length === 1){
        const t = [...e.changedTouches].find(q => String(q.identifier) === ids[0]); if(!t) return;
        const p = T[ids[0]];
        orbit.yaw -= (t.clientX - p.x)*0.006;
        orbit.pitch = Math.max(0.03, Math.min(1.5, orbit.pitch + (t.clientY - p.y)*0.005));
        p.x = t.clientX; p.y = t.clientY;
    } else if(ids.length >= 2){
        for(const t of e.changedTouches) if(T[t.identifier]){ T[t.identifier].x = t.clientX; T[t.identifier].y = t.clientY; }
        const a = T[ids[0]], b = T[ids[1]];
        const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
        if(orbit.pinch) orbit.dist = Math.max(300, Math.min(60000, orbit.dist*orbit.pinch/d));
        if(orbit.mid){
            const k = orbit.dist*0.0018, sy = Math.sin(orbit.yaw), cy = Math.cos(orbit.yaw);
            const dx = (mx - orbit.mid.x)*k, dy = (my - orbit.mid.y)*k;
            orbit.target.x -= dx*cy + dy*sy; orbit.target.z -= -dx*sy + dy*cy;
            orbit.target.y = floorY(orbit.target.x, orbit.target.z);
        }
        orbit.pinch = d; orbit.mid = { x:mx, y:my };
    }
}
function focusOrbit(where){
    if(where === 'struct' && STRUCT.bbox){
        const bb = STRUCT.bbox, o = STRUCT.off;
        orbit.target.set(o.x + (bb[0]+bb[3])/2, o.y + (bb[1]+bb[4])*0.5, o.z + (bb[2]+bb[5])/2);
        orbit.dist = Math.max(1200, (bb[4]-bb[1])*2.2);
    } else { orbit.target.set(0, 0, 0); orbit.dist = 9000; }
}

        lbl.addEventListener('click', () => col.classList.toggle('closed'));
        const body = document.createElement('div'); body.className = 'col-body';
        for(const def of defs){
            const row = document.createElement('div'); row.className = 'range-row' + (CORE.has(def.lbl) ? ' core' : '');
            if(CORE.has(def.lbl)) col.classList.add('has-core');
            total++;
            const l = document.createElement('div'); l.className = 'range-lbl';
            const val = document.createElement('span'); val.className = 'range-val';
            const fmt = v => def.step < 1 ? (+v).toFixed(def.step < 0.01 ? 4 : 2) : Math.round(v);
            val.textContent = fmt(def.get());
            l.textContent = def.lbl + ' '; l.appendChild(val);
            const inp = document.createElement('input');
            inp.type = 'range'; inp.min = def.min; inp.max = def.max; inp.step = def.step; inp.value = def.get();
            inp.addEventListener('input', e => { def.set(parseFloat(e.target.value)); val.textContent = fmt(def.get()); saveSettingsSoon(); });
            deckControls.push({def, inp, val, fmt});
            row.appendChild(l); row.appendChild(inp); body.appendChild(row);
        }
        col.appendChild(lbl); col.appendChild(body); host.appendChild(col);
    }
    const btn = document.getElementById('deck-mode');
    btn.textContent = `all sliders (${total})`;
    btn.addEventListener('click', e => {
        e.stopPropagation();
        const all = host.classList.toggle('essentials') === false;
        btn.classList.toggle('on', all);
        btn.textContent = all ? 'essentials' : `all sliders (${total})`;
        saveSettingsSoon();

    });
})();

document.getElementById('deck-tab').addEventListener('click', e => {
    if(e.target.closest('button')) return;
    document.getElementById('ui-deck').classList.remove('open');
});
document.getElementById('deck-pull').addEventListener('click', () => document.getElementById('ui-deck').classList.add('open'));
document.getElementById('btn-reset').addEventListener('click', () => {
    player.pos.set(...getPlayerStart()); player.vel.set(0,0,0);
    player.yaw = 0; player.pitch = 0; player.roll = 0; player.tumble = 0;
    document.getElementById('tumble-fx').classList.remove('on');
    camTarget.copy(player.pos); releaseGrapple();
    showToast('reset');
});
document.getElementById('btn-dummy').addEventListener('click', () => { releaseGrapple(); spawnTitan({ boss:true }); showToast('new boss'); });
document.getElementById('btn-type').addEventListener('click', e => {
    T.type = TYPES[(TYPES.indexOf(T.type)+1) % TYPES.length];
    e.currentTarget.textContent = 'boss: ' + T.type;
    saveSettingsSoon();
    releaseGrapple(); spawnTitan({ boss:true });
});
document.getElementById('btn-ai').addEventListener('click', e => {
    T.ai = !T.ai;
    e.currentTarget.textContent = 'fights back: ' + (T.ai ? 'on' : 'off');
    saveSettingsSoon();
    if(!T.ai) for(const t of titans) if(t.state !== 'DEAD') setState(t, 'IDLE');
});
document.getElementById('btn-clear').addEventListener('click', () => {
    for(const p of particles) _pPool.push(p);
    particles.length = 0;
    for(const t of titans) t.wounds.length = 0;
});

// ╔══════════════════════════════════════════════════════════╗
// ║ [CORE] resize + loop + boot                               ║
// ╚══════════════════════════════════════════════════════════╝
function resizeAll(){
    const w = cc.clientWidth || innerWidth, h = cc.clientHeight || innerHeight;
    renderer.setSize(w, h);
    pMat.uniforms.uScale.value = h*0.5*renderer.getPixelRatio();
    setHFov(currentHFov);
    sizeSlashCanvas();
}
window.addEventListener('resize', resizeAll);
if(window.ResizeObserver) new ResizeObserver(resizeAll).observe(cc);

// ╔══════════════════════════════════════════════════════════╗
// ║ [PERSIST] settings auto-save / restore (localStorage)     ║
// ╚══════════════════════════════════════════════════════════╝
const SAVE_KEY = 'ODM_WORLD_settings_v1';
let _settingsReady = false, _saveT = 0;
function collectSettings(){
    return { v:1, worldScale:WORLD.scale, M, C, ATMO, VCFG, TCFG, WG, JOY,
        titanType:T.type, titanAI:T.ai, renderScale,
        deckAll: !document.getElementById('deck-body').classList.contains('essentials') };
}
function saveSettingsNow(){
    clearTimeout(_saveT);
    if(!_settingsReady) return;                       // never overwrite the save before it was restored
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(collectSettings())); }catch(err){}
}
function saveSettingsSoon(){ clearTimeout(_saveT); _saveT = setTimeout(saveSettingsNow, 400); }
addEventListener('pagehide', saveSettingsNow);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveSettingsNow(); });
function restoreSettings(){
    let st = null;
    try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) st = JSON.parse(raw); }catch(err){ st = null; }
    if(!st || typeof st !== 'object') return false;
    if(typeof st.worldScale === 'number' && Number.isFinite(st.worldScale)) WORLD.scale = THREE.MathUtils.clamp(st.worldScale, 0.4, 3);
    applyKnownSettings(M, st.M); applyKnownSettings(C, st.C); applyKnownSettings(ATMO, st.ATMO);
    applyKnownSettings(VCFG, st.VCFG); applyKnownSettings(TCFG, st.TCFG); applyKnownSettings(WG, st.WG); applyKnownSettings(JOY, st.JOY);
    if(TYPES.includes(st.titanType)) T.type = st.titanType;
    if(typeof st.titanAI === 'boolean') T.ai = st.titanAI;
    if(typeof st.renderScale === 'number' && Number.isFinite(st.renderScale)) renderScale = THREE.MathUtils.clamp(st.renderScale, 0.5, 3);
    // re-sync everything that was derived from the defaults at definition time
    _builtWorldScale = WORLD.scale;
    setJoyLayout();
    currentHFov = M.hFov;
    renderer.setPixelRatio(renderScale);
    ground.material.color.copy(GROUND_BASE).multiplyScalar(ATMO.groundBright);
    document.getElementById('btn-type').textContent = 'boss: ' + T.type;
    document.getElementById('btn-ai').textContent = 'fights back: ' + (T.ai ? 'on' : 'off');
    syncAllControls();
    if(st.deckAll) document.getElementById('deck-mode').click();
    return true;
}
(function(){
    const btn = document.getElementById('deck-reset'); let armed = 0;
    btn.addEventListener('click', e => {
        e.stopPropagation();
        if(!armed){
            btn.classList.add('armed'); btn.textContent = 'tap again · wipe';
            armed = setTimeout(() => { armed = 0; btn.classList.remove('armed'); btn.textContent = 'reset saved'; }, 3000);
            return;
        }
        clearTimeout(armed); _settingsReady = false;
        try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
        location.reload();
    });
})();
const _restored = restoreSettings();
_settingsReady = true;

initSmoke();
gridFine.scale.setScalar(WORLD.scale); gridCoarse.scale.setScalar(WORLD.scale); ring.scale.setScalar(WORLD.scale);
regenForest();
rebuildWorld(0);
spawnTitan({ boss:true, x:0, z:0, yaw:0 });
spawnMinions();
applySky(); applySun();
camTarget.copy(player.pos).add(new THREE.Vector3(0, M.eyeOffset, 0));
resizeAll();
if(_restored) showToast('settings restored');

const clock = new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05)*M.timeScale;
    if(APP === 'forge'){
        updateOrbit();
        pickLevel(); syncFaceUniforms();
        updateSmoke(dt);
        renderer.render(scene, camera);
        return;
    }
    physics(dt);
    updateTitans(dt);
    pickLevel(); syncFaceUniforms();
    updateSmoke(dt);
    drawSlash();
    renderer.render(scene, camera);
}
animate();
</script>
