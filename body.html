<script>
/* ODM shared · offline cache (GitHub Pages / https only, never in Koder) + one handoff store all tools on this site share */
if('serviceWorker' in navigator && location.protocol==='https:') addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
window.ODM_HANDOFF=window.ODM_HANDOFF||(function(){
  const DB='ODM_SHARED_HANDOFF_V1';
  const open=()=>new Promise((res,rej)=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
  const put=async(k,v)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>{db.close();res();};t.onerror=()=>{db.close();rej(t.error);};});};
  const get=async k=>{const db=await open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>{db.close();res(q.result);};q.onerror=()=>{db.close();rej(q.error);};});};
  return{put,get};
})();
/* the hub tab: same spot in every tool (left edge). A tool can take it over by defining window.odmHubTab (the game opens its in-world hub). */
addEventListener('DOMContentLoaded',()=>{
  if(document.getElementById('odm-hub-tab'))return;
  const a=document.createElement('a');a.id='odm-hub-tab';a.href='./';a.title='hub';a.textContent='⌂';
  a.addEventListener('click',e=>{if(typeof window.odmHubTab==='function'){e.preventDefault();e.stopPropagation();window.odmHubTab();}});
  document.body.appendChild(a);
});
</script>

        if (!A) return;
        const axes = A.axes || [X, Y, Z];
        const scale = Math.max(.05, Math.min(4, Number(item.scale) || 1));
        const offset = [Number(item.x)||0, Number(item.y)||0, Number(item.z)||0];
        const origin = add(A.p, add(add(mul(axes[0], offset[0]), mul(axes[1], offset[1])), mul(axes[2], offset[2])));

// RIG + ANIMATION — skin the generated body to a real skeleton, play clips, export them
// Rotations are degrees, local to each bone, applied about the bone's rest-pose pivot as Ry·Rz·Rx.
// For a limb that hangs down, +rx swings it BACK, −rx swings it FORWARD; +rz on the right side lifts it out and up.
// ═══════════════════════════════════════════════════════════════
const BONE_NAMES = ['hips','chest','head','armR1','armR2','armL1','armL2','legR1','legR2','legL1','legL2','tail1','tail2','tail3'];

            // trousers bend at knees, and the torso shell follows the hips/chest chain.
            const kind = part.slice(6);

            else if (kind === 'collar') zone = ['neck'];                 // blends chest → head

        return;
    }
    resetArm = 0; clearTimeout(resetTimer); el('bReset').textContent = 'Reset'; el('bReset').classList.remove('on');
    resetAll();
});
el('bFace').addEventListener('click', () => { LOOK.mode = LOOK_MODES[(LOOK_MODES.indexOf(LOOK.mode) + 1) % LOOK_MODES.length]; lookSync(); ask(); });
lookSync();
// scene strip
el('bSnap').addEventListener('click', () => { placeCamera(); renderer.render(scene, camera); el('snapImg').src = canvas.toDataURL('image/png'); el('snapSheet').classList.add('on'); });
el('snapSheet').addEventListener('click', e => { if (e.target !== el('snapImg')) el('snapSheet').classList.remove('on'); });
el('bWire').addEventListener('click', () => { wire.visible = !wire.visible; el('bWire').classList.toggle('on', wire.visible); ask(); });
el('bBones').addEventListener('click', () => { bones.visible = !bones.visible; el('bBones').classList.toggle('on', bones.visible); ask(); });
el('bFront').addEventListener('click', () => { cam.yaw = 0; cam.pitch = 0.05; ask(); });
el('bSide').addEventListener('click', () => { cam.yaw = Math.abs(cam.yaw - Math.PI / 2) < 0.05 ? -Math.PI / 2 : Math.PI / 2; cam.pitch = 0.05; ask(); });
el('bView').addEventListener('click', () => { cam.yaw = 0.65; cam.pitch = 0.18; frameModel(); ask(); });
el('deckToggle').addEventListener('click', () => { el('deck').classList.toggle('collapsed'); el('deckToggle').classList.toggle('collapsed'); });

// start
(function start() {
    try {
        const d = JSON.parse(localStorage.getItem('body_forge_session') || 'null');
        if (d && d.S) { defaults(); for (const k in d.S) if (k in S) S[k] = d.S[k]; presetName = d.preset || 'humanoid'; }
    } catch (_) {}
    restoreDepth();
    listSets(); syncUI(); rebuild(); frameModel(); resize(); drawThumb(); drawReferencePicker(); skinUI(); loop();
    try {
        const active = localStorage.getItem('body_forge_image');
        const source = localStorage.getItem('body_forge_image_source') || active;
        let savedCrop = null; try { savedCrop = JSON.parse(localStorage.getItem('body_forge_crop_rect') || 'null'); } catch (_) {}
        if (source) loadImageURL(source, () => {
            const original = IMG_SOURCE;
            REF_SELECT = savedCrop || fullReferenceSelection();
            if (active && active !== source) loadImageURL(active, () => {
                IMG_SOURCE = original; REF_SELECT = savedCrop || fullReferenceSelection(); CROP_R = savedCrop || null; DEPC = null;
                drawThumb(); drawReferencePicker(); rebuild(); syncReferenceUI();
            }, false);
            else { drawThumb(); drawReferencePicker(); rebuild(); syncReferenceUI(); }
            skinUI();
        });
    } catch (_) {}
})();
</script>
</body>
</html>
